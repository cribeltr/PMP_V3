<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --paper:        #faf9f5;
  --paper-2:      #f6f5f1;
  --paper-3:      #efeee9;
  --ink:          #1f1d18;
  --ink-2:        #45413a;
  --ink-3:        #7a766c;
  --ink-4:        #aaa498;
  --line:         rgba(0,0,0,.08);
  --line-2:       rgba(0,0,0,.14);
  --line-strong:  rgba(0,0,0,.22);

  --info:         #2563eb;
  --info-bg:      #e8efff;
  --success:      #157f3d;
  --success-bg:   #e3f3e8;
  --warning:      #a16207;
  --warning-bg:   #fbf1d5;
  --danger:       #b91c1c;
  --danger-bg:    #fbe4e4;
  --purple:       #6d28d9;
  --purple-bg:    #ede4fb;

  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  --r-xl: 14px;

  --shadow-1: 0 1px 0 rgba(0,0,0,.05);
  --shadow-2: 0 4px 16px rgba(0,0,0,.06);
  --shadow-3: 0 20px 60px rgba(0,0,0,.18);

  --backdrop: rgba(31,29,24,.28);
  --backdrop-stacked: rgba(31,29,24,.14);
  --select-arrow: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237a766c' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>";

  --sb-w: 232px;

  --z-popover: 100;
  --z-drawer:  200;
  --z-modal:   300;
  --z-toast:   400;
  --z-cmdk:    500;
}

:root[data-theme="dark"] {
  --paper:        #0e141b;
  --paper-2:      #161d26;
  --paper-3:      #1f2832;
  --ink:          #e6ecf2;
  --ink-2:        #b3bcc6;
  --ink-3:        #7c8590;
  --ink-4:        #525a64;
  --line:         rgba(255,255,255,.07);
  --line-2:       rgba(255,255,255,.13);
  --line-strong:  rgba(255,255,255,.22);

  --info:         #5ea8e8;
  --info-bg:      rgba(37,99,235,.20);
  --success:      #56c98b;
  --success-bg:   rgba(34,197,94,.18);
  --warning:      #e4b561;
  --warning-bg:   rgba(217,119,6,.22);
  --danger:       #f0726f;
  --danger-bg:    rgba(220,38,38,.26);
  --purple:       #b29bf5;
  --purple-bg:    rgba(139,92,246,.22);

  --shadow-1: 0 1px 0 rgba(0,0,0,.45);
  --shadow-2: 0 4px 16px rgba(0,0,0,.5);
  --shadow-3: 0 24px 70px rgba(0,0,0,.65);

  --backdrop: rgba(0,0,0,.55);
  --backdrop-stacked: rgba(0,0,0,.3);
  --select-arrow: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237c8590' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>";

  color-scheme: dark;
}

:root[data-theme="dark"] .brand-mark { background: #0a6ec7; color: #ffffff; }
:root[data-theme="dark"] body {
  background:
    radial-gradient(1200px 600px at 0% 0%, rgba(10,110,199,.06), transparent 60%),
    var(--paper);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, h5, p { margin: 0; font-weight: 500; }
ul, ol { margin: 0; padding: 0; list-style: none; }
table { border-collapse: collapse; width: 100%; }
hr { border: 0; border-top: .5px solid var(--line); margin: 0; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--sb-w) 1fr;
  min-height: 100vh;
}
.sidebar {
  background: var(--paper-2);
  border-right: .5px solid var(--line);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--ink);
  color: var(--paper);
  display: grid; place-items: center;
  font-size: 14px;
  font-weight: 500;
}
.brand-text { line-height: 1.15; }
.brand-text strong { display: block; font-weight: 500; font-size: 13px; }
.brand-text span { font-size: 11px; color: var(--ink-3); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--ink-4);
  padding: 8px 8px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: var(--r-md);
  color: var(--ink-2);
  cursor: pointer;
  font-size: 13px;
  position: relative;
}
.nav-item i { font-size: 16px; color: var(--ink-3); }
.nav-item:hover { background: var(--paper-3); color: var(--ink); }
.nav-item.active { background: var(--ink); color: var(--paper); }
.nav-item.active i { color: var(--paper); }
.nav-item .badge {
  margin-left: auto;
  font-size: 10.5px;
  background: var(--paper-3);
  color: var(--ink-2);
  padding: 1px 6px;
  border-radius: 8px;
}
.nav-item.active .badge { background: rgba(255,255,255,.15); color: var(--paper); }

.sidebar-footer {
  margin-top: auto;
  display: flex; flex-direction: column; gap: 4px;
  padding-top: 12px;
  border-top: .5px solid var(--line);
}
.session-chip {
  font-size: 11px;
  color: var(--ink-3);
  padding: 4px 6px;
}

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  height: 52px;
  border-bottom: .5px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 14px;
  background: var(--paper);
  position: sticky; top: 0; z-index: 50;
}
.topbar h1 { font-size: 14px; font-weight: 500; }
.topbar .sep { color: var(--ink-4); }
.topbar .breadcrumb { color: var(--ink-3); font-size: 13px; }
.topbar .grow { flex: 1; }
.topbar .cmdk-hint {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-3);
  padding: 5px 10px;
  border: .5px solid var(--line);
  border-radius: var(--r-md);
  background: var(--paper-2);
  cursor: pointer;
}
.topbar .cmdk-hint kbd {
  font-family: inherit;
  font-size: 10.5px;
  background: var(--paper-3);
  border: .5px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink-2);
}

.view {
  padding: 24px 28px 80px;
  max-width: 1400px;
  width: 100%;
}
.view-header {
  display: flex;
  align-items: end;
  gap: 14px;
  margin-bottom: 20px;
}
.view-header h2 {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -.01em;
}
.view-header p { color: var(--ink-3); font-size: 13px; }
.view-header .actions { margin-left: auto; display: flex; gap: 8px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: .5px solid var(--line-2);
  background: var(--paper);
  color: var(--ink);
  border-radius: var(--r-md);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 80ms ease, border-color 80ms ease;
  white-space: nowrap;
}
.btn:hover { background: var(--paper-2); }
.btn:active { background: var(--paper-3); }
.btn i { font-size: 15px; color: var(--ink-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary i { color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--paper-2); border-color: var(--line); }
.btn.danger { color: var(--danger); border-color: var(--line-2); }
.btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.icon { padding: 6px; }
.btn.icon i { font-size: 16px; }
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; border-right-width: 0; }
.btn-group .btn:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
.btn-group .btn:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; border-right-width: .5px; }

/* ============================================================
   FORMS
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 11.5px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: .01em;
}
.field .hint { font-size: 11px; color: var(--ink-3); }
.field .err  { font-size: 11px; color: var(--danger); }

.input, .select, .textarea {
  padding: 6px 10px;
  border: .5px solid var(--line-2);
  border-radius: var(--r-md);
  background: var(--paper);
  font-size: 13px;
  outline: none;
  transition: border-color 80ms ease, box-shadow 80ms ease;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--ink-3);
  box-shadow: 0 0 0 3px rgba(31,29,24,.06);
}
.textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
.select { appearance: none; padding-right: 28px;
  background-image: url(var(--select-arrow));
  background-repeat: no-repeat;
  background-position: right 10px center;
}
:root .select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237a766c' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>"); }
:root[data-theme="dark"] .select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237c8590' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>"); }
.search {
  display: flex;
  align-items: center;
  border: .5px solid var(--line-2);
  border-radius: var(--r-md);
  background: var(--paper);
  padding: 0 10px;
  gap: 6px;
}
.search i { color: var(--ink-3); font-size: 16px; }
.search input {
  border: 0; outline: none; background: transparent;
  padding: 6px 0; flex: 1; min-width: 0;
}

/* ============================================================
   PILLS / BADGES
   ============================================================ */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--paper-3);
  color: var(--ink-2);
  border: .5px solid var(--line);
  font-weight: 500;
  white-space: nowrap;
}
.pill.info     { background: var(--info-bg);    color: var(--info);    border-color: transparent; }
.pill.success  { background: var(--success-bg); color: var(--success); border-color: transparent; }
.pill.warning  { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.pill.danger   { background: var(--danger-bg);  color: var(--danger);  border-color: transparent; }
.pill.purple   { background: var(--purple-bg);  color: var(--purple);  border-color: transparent; }
.pill.muted    { color: var(--ink-3); }
.pill .dot     {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--paper);
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
}
.card-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.card-h h3 { font-size: 13px; font-weight: 500; }
.card-h .sub { color: var(--ink-3); font-size: 11.5px; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.kpi {
  padding: 14px 16px;
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper);
  display: flex; flex-direction: column; gap: 4px;
  cursor: pointer;
  transition: background 80ms ease, border-color 80ms ease;
}
.kpi:hover { background: var(--paper-2); border-color: var(--line-2); }
.kpi .label { font-size: 11px; color: var(--ink-3); letter-spacing: .02em; text-transform: uppercase; }
.kpi .value { font-size: 24px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.kpi .trend { font-size: 11px; color: var(--ink-3); }
.kpi.danger .value { color: var(--danger); }
.kpi.warning .value { color: var(--warning); }
.kpi.success .value { color: var(--success); }
.kpi.info .value    { color: var(--info); }
.kpi.purple .value  { color: var(--purple); }

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap {
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper);
  overflow: hidden;
}
.table-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: .5px solid var(--line);
  flex-wrap: wrap;
}
.table-toolbar .search { flex: 1; min-width: 200px; }
.table-toolbar .right { display: flex; gap: 6px; align-items: center; }
.table-meta {
  font-size: 11.5px;
  color: var(--ink-3);
  padding: 8px 12px;
  border-bottom: .5px solid var(--line);
  background: var(--paper-2);
}
.dt {
  font-size: 12.5px;
}
.dt thead th {
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--ink-3);
  padding: 8px 12px;
  border-bottom: .5px solid var(--line);
  background: var(--paper-2);
  position: sticky; top: 0;
  white-space: nowrap;
}
.dt tbody td {
  padding: 8px 12px;
  border-bottom: .5px solid var(--line);
  vertical-align: middle;
}
.dt tbody tr { cursor: pointer; }
.dt tbody tr:hover { background: var(--paper-2); }
.dt tbody tr.is-slot td { color: var(--ink-4); font-style: italic; }
.dt .truncate {
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dt .col-narrow { width: 60px; }
.dt .col-mono { font-variant-numeric: tabular-nums; color: var(--ink-2); }

.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--ink-3);
}
.empty i { font-size: 36px; color: var(--ink-4); margin-bottom: 8px; }
.empty h4 { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-bottom: 4px; }
.empty p { font-size: 12.5px; }
.empty .actions { margin-top: 14px; display: inline-flex; gap: 8px; }

/* ============================================================
   MODAL / DRAWER / DIALOG / TOAST / POPOVER
   ============================================================ */
.backdrop {
  position: fixed; inset: 0;
  background: var(--backdrop);
  z-index: var(--z-modal);
  display: grid;
  place-items: center;
  padding: 24px;
  animation: fade-in 140ms ease-out;
}
.backdrop.is-stacked { background: var(--backdrop-stacked); }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-right { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.modal {
  background: var(--paper);
  border: .5px solid var(--line-2);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-3);
  width: 100%;
  max-width: 940px;
  max-height: 94vh;
  display: flex;
  flex-direction: column;
  animation: slide-up 160ms ease-out;
  overflow: hidden;
}
.modal.lg { max-width: 1080px; }
.modal.md { max-width: 720px; }
.modal.sm { max-width: 480px; }
.modal-h {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: .5px solid var(--line);
}
.modal-h h3 { font-size: 14px; font-weight: 500; }
.modal-h .sub { color: var(--ink-3); font-size: 12px; }
.modal-h .close { margin-left: auto; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.modal-f {
  padding: 12px 18px;
  border-top: .5px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--paper-2);
}

.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 100%;
  max-width: 480px;
  background: var(--paper);
  border-left: .5px solid var(--line-2);
  box-shadow: var(--shadow-3);
  z-index: var(--z-drawer);
  display: flex; flex-direction: column;
  animation: slide-right 180ms ease-out;
}

.toast-wrap {
  position: fixed;
  bottom: 18px; right: 18px;
  z-index: var(--z-toast);
  display: flex; flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--ink);
  color: var(--paper);
  padding: 10px 14px;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  display: flex; align-items: center; gap: 10px;
  font-size: 12.5px;
  max-width: 380px;
  pointer-events: auto;
  animation: slide-up 160ms ease-out;
}
.toast i { font-size: 16px; }
.toast.success { background: var(--success); }
.toast.warning { background: var(--warning); }
.toast.danger  { background: var(--danger); }
.toast.info    { background: var(--info); }

/* Command palette */
.cmdk-backdrop {
  position: fixed; inset: 0;
  background: var(--backdrop);
  z-index: var(--z-cmdk);
  display: flex;
  justify-content: center;
  padding-top: 12vh;
  animation: fade-in 120ms ease-out;
}
.cmdk {
  width: 640px; max-width: 95vw;
  background: var(--paper);
  border: .5px solid var(--line-2);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-3);
  overflow: hidden;
  height: fit-content;
  max-height: 76vh;
  display: flex; flex-direction: column;
  animation: slide-up 160ms ease-out;
}
.cmdk-input {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: .5px solid var(--line);
}
.cmdk-input i { color: var(--ink-3); font-size: 18px; }
.cmdk-input input {
  border: 0; outline: none; background: transparent;
  flex: 1; font-size: 14px;
}
.cmdk-list { overflow-y: auto; padding: 6px; }
.cmdk-group-label {
  font-size: 10.5px; color: var(--ink-4);
  text-transform: uppercase; letter-spacing: .04em;
  padding: 8px 10px 4px;
}
.cmdk-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-md);
  cursor: pointer;
  font-size: 13px;
}
.cmdk-item:hover, .cmdk-item.is-active { background: var(--paper-2); }
.cmdk-item i { color: var(--ink-3); font-size: 16px; }
.cmdk-item .meta { margin-left: auto; color: var(--ink-3); font-size: 11.5px; }

/* Stepper (ciclo) */
.stepper {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px;
  margin-bottom: 16px;
  padding: 10px 12px;
  background: var(--paper-2);
  border: .5px solid var(--line);
  border-radius: var(--r-md);
}
.step {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px;
  border-radius: var(--r-md);
  font-size: 12px;
  color: var(--ink-3);
  cursor: pointer;
  white-space: nowrap;
}
.step .num {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  display: grid; place-items: center;
  font-size: 10px;
  background: var(--paper);
  flex-shrink: 0;
}
.step.done .num { background: var(--success); color: var(--paper); border-color: var(--success); }
.step.done .num::after { content: '✓'; }
.step.active { background: var(--paper-3); color: var(--ink); }
.step.active .num { border-color: var(--info); color: var(--info); background: var(--paper); }
