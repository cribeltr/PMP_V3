        onclick: () => { UI_PEND.modo = modoVal; Router.go('tareas'); },
      }, [ h('i.ti', { class: 'ti ' + icono }), label ]);
    }
    root.appendChild(h('div', { style:{display:'flex', gap:'4px', marginBottom:'12px'} }, [
      modoBtn('lista','Lista','ti-list'),
      modoBtn('calendario','Calendario','ti-calendar-event'),
    ]));

    // === Filtros (estado · responsable · rango de fechas de compromiso) ===
    const filtBar = h('div', { style:{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap', marginBottom:'12px'} });
    const selEstado = selectCtl(
      [{ value:'', label:'Todos los estados' }, ...ESTADOS_PENDIENTE.map(e => ({ value:e, label: ESTADO_PENDIENTE_LABEL[e] }))],
      UI_PEND.filtros.estado,
      { onchange: (e) => { UI_PEND.filtros.estado = e.target.value; refresh(); } },
    );
    // Responsable: "Todos" + "(sin asignar)" + TECNICOS_OFICIALES
    const selAsig = selectCtl(
      [
        { value:'', label:'Todos los responsables' },
        { value:'__SIN_ASIGNAR__', label:'(sin asignar)' },
        ...TECNICOS_OFICIALES.map(t => ({ value:t, label:t })),
      ],
      UI_PEND.filtros.asignado,
      { onchange: (e) => { UI_PEND.filtros.asignado = e.target.value; refresh(); } },
    );
    // Rango de fechas de compromiso
    const inpDesde = h('input.input', { type:'date', value: UI_PEND.filtros.desde, style:{maxWidth:'150px'},
      onchange:(e) => { UI_PEND.filtros.desde = e.target.value; refresh(); } });
    const inpHasta = h('input.input', { type:'date', value: UI_PEND.filtros.hasta, style:{maxWidth:'150px'},
      onchange:(e) => { UI_PEND.filtros.hasta = e.target.value; refresh(); } });
    const btnLimpiarFechas = h('button.btn.icon.ghost', {
      title:'Limpiar rango de fechas',
      style:{display: (UI_PEND.filtros.desde || UI_PEND.filtros.hasta) ? '' : 'none'},
      onclick: () => {
        UI_PEND.filtros.desde = '';
        UI_PEND.filtros.hasta = '';
        inpDesde.value = ''; inpHasta.value = '';
        refresh();
      },
    }, [ h('i.ti.ti-x', { style:{fontSize:'13px'} }) ]);
    const fechasGroup = h('div', { style:{display:'flex', alignItems:'center', gap:'4px'} }, [
      h('span', { style:{fontSize:'11px', color:'var(--ink-3)'} }, 'Compromiso:'),
      h('span', { style:{fontSize:'11px', color:'var(--ink-3)'} }, 'desde'),
      inpDesde,
      h('span', { style:{fontSize:'11px', color:'var(--ink-3)'} }, 'hasta'),
      inpHasta,
      btnLimpiarFechas,
    ]);

    const btnLimpiarTodo = h('button.btn.ghost.sm', {
      style:{display: pendFiltrosActivos() ? '' : 'none'},
      onclick: () => {
        UI_PEND.filtros = { estado:'', asignado:'', desde:'', hasta:'' };
        selEstado.value = ''; selAsig.value = '';
        inpDesde.value = ''; inpHasta.value = '';
        refresh();
      },
    }, [ h('i.ti.ti-x'), 'Limpiar filtros' ]);

    filtBar.appendChild(h('span', { style:{fontSize:'12px', color:'var(--ink-3)'} }, 'Filtrar:'));
    filtBar.appendChild(selEstado);
    filtBar.appendChild(selAsig);
    filtBar.appendChild(fechasGroup);
    filtBar.appendChild(btnLimpiarTodo);
    root.appendChild(filtBar);

    const listaWrap = h('div');
    root.appendChild(listaWrap);

    function aplicarFiltros(arr) {
      const f = UI_PEND.filtros;
      // Rango fechas: parsear con noon local para evitar desfases UTC.
      const desdeMs = f.desde ? new Date(f.desde + 'T00:00:00').getTime() : null;
      const hastaMs = f.hasta ? new Date(f.hasta + 'T23:59:59').getTime() : null;
      return arr.filter(p => {
        if (f.estado && p.estado !== f.estado) return false;
        if (f.asignado) {
          if (f.asignado === '__SIN_ASIGNAR__') {
            if (p.asignado) return false;
          } else if (p.asignado !== f.asignado) return false;
        }
        if (desdeMs != null || hastaMs != null) {
          if (!p.vence) return false;
          const vMs = new Date(p.vence).getTime();
          if (isNaN(vMs)) return false;
          if (desdeMs != null && vMs < desdeMs) return false;
          if (hastaMs != null && vMs > hastaMs) return false;
        }
        return true;
      });
    }

    function refresh() {
      // R7: en modo calendario, el rango de fechas no aplica — se oculta.
      const modoCal = UI_PEND.modo === 'calendario';
      fechasGroup.style.display = modoCal ? 'none' : '';
      btnLimpiarFechas.style.display = (!modoCal && (UI_PEND.filtros.desde || UI_PEND.filtros.hasta)) ? '' : 'none';
      btnLimpiarTodo.style.display = pendFiltrosActivos() ? '' : 'none';

      listaWrap.innerHTML = '';

      if (modoCal) {
        listaWrap.appendChild(renderCalendarioPendientes(refresh));
        return;
      }

      const filtrados = aplicarFiltros(STATE.pendientes);
      if (!filtrados.length) {
        listaWrap.appendChild(emptyState({
          icon:'ti-filter-off', title:'Sin pendientes con el filtro actual',
          desc:'Probá quitar los filtros para ver todos los pendientes.',
          actions:[{ label:'Limpiar filtros', icon:'ti-x', onclick: () => {
            UI_PEND.filtros = { estado:'', asignado:'', desde:'', hasta:'' };
            selEstado.value = ''; selAsig.value = '';
            inpDesde.value = ''; inpHasta.value = '';
            refresh();
          } }],
        }));
        return;
      }

      // === Agrupación por urgencia ===
      const ahora = Date.now();
      const dia = 86400000;
      const grupos = {
        vencidos: [], porVencer: [], abiertos: [], enCurso: [], esperando: [], cerrados: [],
      };
      filtrados.forEach(p => {
        if (p.estado === 'Cerrado') { grupos.cerrados.push(p); return; }
        const tVence = p.vence ? new Date(p.vence).getTime() : null;
        if (tVence != null && tVence < ahora) { grupos.vencidos.push(p); return; }
        if (tVence != null && tVence - ahora <= 3 * dia) { grupos.porVencer.push(p); return; }
        if (p.estado === 'EnCurso')   { grupos.enCurso.push(p); return; }
        if (p.estado === 'Esperando') { grupos.esperando.push(p); return; }
        grupos.abiertos.push(p);
      });
      // Cerrados recientes: solo los últimos 20.
      grupos.cerrados = grupos.cerrados
        .sort((a,b) => new Date(b.cerradoEn || b.cerrado || b.creado || 0) - new Date(a.cerradoEn || a.cerrado || a.creado || 0))
        .slice(0, 20);

      const seccionesDef = [
        { id:'vencidos',  label:'Vencidos',          items: grupos.vencidos,  kind:'danger' },
        { id:'porVencer', label:'Por vencer (≤3d)',  items: grupos.porVencer, kind:'warning' },
        { id:'abiertos',  label:'Abiertos',          items: grupos.abiertos,  kind:'info' },
        { id:'enCurso',   label:'En curso',          items: grupos.enCurso,   kind:'info' },
        { id:'esperando', label:'Esperando',         items: grupos.esperando, kind:'muted' },
        { id:'cerrados',  label:'Cerrados recientes',items: grupos.cerrados,  kind:'success' },
      ];
      seccionesDef.forEach(sec => {
        if (!sec.items.length) return;
        const secWrap = h('div.section');
        secWrap.appendChild(h('div', { style:{display:'flex', alignItems:'center', gap:'8px', marginBottom:'8px'} }, [
          h('h3', { style:{margin:0} }, sec.label),
          h(`span.pill.${sec.kind}`, String(sec.items.length)),
        ]));
        sec.items.forEach(p => secWrap.appendChild(renderPendienteCard(p, refresh)));
        listaWrap.appendChild(secWrap);
      });
    }

    refresh();

    // Manejo del foco al venir desde otra vista (ficha del equipo, etc.):
    // limpia filtros para garantizar que la card aparezca, expande y resalta.
    if (UI_PEND.focusId) {
      const targetId = UI_PEND.focusId;
      UI_PEND.focusId = null;
      UI_PEND.expanded.add(targetId);
      UI_PEND.filtros = { estado:'', asignado:'', desde:'', hasta:'' };
      selEstado.value = ''; selAsig.value = '';
      inpDesde.value = ''; inpHasta.value = '';
      refresh();
      setTimeout(() => {
        const card = document.querySelector(`#view [data-pendiente-id="${targetId}"]`);
        if (card) {
          card.classList.add('pendiente-highlight');
          try { card.scrollIntoView?.({ behavior:'smooth', block:'center' }); } catch {}
          setTimeout(() => card.classList.remove('pendiente-highlight'), 2500);
        }
      }, 50);
    }
  },
};

/** Card de pendiente — colapsada por default, expandible con todas las acciones inline. */
function renderPendienteCard(p, refresh) {
  const e = p.equipoUuid ? EQ.byUuid(p.equipoUuid) : null;
  const vencidoDias = (p.vence && p.estado !== 'Cerrado') ? fmt.daysSince(p.vence) : null;
  const vencido = vencidoDias != null && vencidoDias > 0;
  const esDiff = p.tipo === 'diferencias-maestro' && p.meta?.diff;
  const subN = (p.subtareas || []).length;
  const subDone = (p.subtareas || []).filter(s => s.completada).length;
  const isExpanded = UI_PEND.expanded.has(p.id);

  const card = h('div.card', { style:{marginBottom:'8px'}, dataset:{ pendienteId: p.id } });

  // === Cabecera (colapsada) ===
  const head = h('div', { style:{display:'flex', flexDirection:'column', gap:'4px'} });

  // Línea 1: descripción + pills
  const linea1 = h('div', { style:{display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap'} }, [
    h('div', { style:{flex:1, fontWeight:500, fontSize:'13px'} }, p.descripcion || '(sin descripción)'),
    p.tipo ? h('span.pill' + (esDiff?'.info':''), p.tipo) : null,
    h(`span.pill.${ESTADO_PENDIENTE_PILL[p.estado] || 'muted'}`, ESTADO_PENDIENTE_LABEL[p.estado] || p.estado),
    vencido ? h('span.pill.danger', `vencido hace ${vencidoDias}d`) : null,
    subN ? h(`span.pill.${subDone===subN ? 'success' : subDone > 0 ? 'info' : 'muted'}`, `${subDone}/${subN} subtareas`) : null,
  ]);
  head.appendChild(linea1);

  // Línea 2: contexto
  const linea2 = h('div', { style:{fontSize:'12px', color:'var(--ink-3)', display:'flex', gap:'10px', flexWrap:'wrap'} });
  if (e) {
    linea2.appendChild(h('span', {
      style:{cursor:'pointer', textDecoration:'underline dotted'},
      onclick: () => openFicha(e.uuid),
      title: 'Abrir ficha del equipo',
    }, e.nombre));
  }
  if (p.asignado) linea2.appendChild(h('span', `Asignado: ${p.asignado}`));
  if (p.vence) {
    const dias = fmt.daysSince(p.vence);
    const txt = dias > 0
      ? `Vence ${fmt.date(p.vence)} (hace ${dias}d)`
      : dias < 0
        ? `Vence ${fmt.date(p.vence)} (en ${Math.abs(dias)}d)`
        : `Vence ${fmt.date(p.vence)} (hoy)`;
    linea2.appendChild(h('span', txt));
  }
  if (p.creado) linea2.appendChild(h('span', `Creado ${fmt.rel(p.creado)}`));
  head.appendChild(linea2);

  // Línea 3: botón Gestionar / acción especial diff
  const acciones = h('div', { style:{display:'flex', gap:'6px', marginTop:'6px', flexWrap:'wrap'} });
  acciones.appendChild(h('button.btn.sm.ghost', { onclick: () => {
    if (UI_PEND.expanded.has(p.id)) UI_PEND.expanded.delete(p.id);
    else UI_PEND.expanded.add(p.id);
    refresh();
  } }, [
    h('i.ti', { class:'ti ' + (isExpanded ? 'ti-chevron-up' : 'ti-chevron-down') }),
    isExpanded ? 'Cerrar gestión' : 'Gestionar',
  ]));
  if (esDiff) {
    acciones.appendChild(h('button.btn.sm', { onclick: () => abrirModalDiferenciasMaestro(p.meta.diff, { review:true, pendienteId: p.id }) }, [
      h('i.ti.ti-eye'), 'Revisar diferencias',
    ]));
  }
  head.appendChild(acciones);
  card.appendChild(head);

  // === Cuerpo expandible ===
  if (isExpanded) {
    card.appendChild(h('hr', { style:{margin:'10px 0', border:0, borderTop:'.5px solid var(--line)'} }));
    card.appendChild(renderPendienteExpandido(p, refresh));
  }

  return card;
}

function renderPendienteExpandido(p, refresh) {
  const wrap = h('div', { style:{display:'flex', flexDirection:'column', gap:'14px'} });

  // Encabezado de gestión: estado + editar + reabrir
  const headRow = h('div', { style:{display:'flex', alignItems:'center', gap:'10px', flexWrap:'wrap'} });
  headRow.appendChild(h('label', { style:{fontSize:'12px', color:'var(--ink-3)'} }, 'Estado:'));
  const selEstado = selectCtl(
    ESTADOS_PENDIENTE.map(e => ({ value:e, label: ESTADO_PENDIENTE_LABEL[e] })),
    p.estado,
    { onchange: async (ev) => {
      const nuevo = ev.target.value;
      if (nuevo === 'Cerrado') {
        const ok = await UI.dialog({ title:'Cerrar pendiente', message:'¿Marcar este pendiente como cerrado? Vas a poder reabrirlo después.', confirmText:'Cerrar' });
        if (!ok) { selEstado.value = p.estado; return; }
      }
      try {
        PENDIENTE.cambiarEstado(p.id, nuevo);
        UI.toast(`Pendiente: ${ESTADO_PENDIENTE_LABEL[nuevo]}`, 'success');
        refresh();
      } catch (e) { bus.emit('error', e); selEstado.value = p.estado; }
    } },
  );
  headRow.appendChild(selEstado);
  headRow.appendChild(h('div', { style:{flex:1} }));
  headRow.appendChild(h('button.btn.sm.ghost', { onclick: () => abrirModalEditarPendiente(p, refresh) }, [
    h('i.ti.ti-edit'), 'Editar',
  ]));
  if (p.estado === 'Cerrado') {
    headRow.appendChild(h('button.btn.sm', { onclick: async () => {
      const ok = await UI.dialog({ title:'Reabrir pendiente', message:'¿Reabrir este pendiente?', confirmText:'Reabrir' });
      if (!ok) return;
      PENDIENTE.reabrir(p.id);
      UI.toast('Pendiente reabierto.', 'info');
      refresh();
    } }, [ h('i.ti.ti-refresh'), 'Reabrir' ]));
  }
  wrap.appendChild(headRow);

  // === Subtareas ===
  const subSec = h('div');
  subSec.appendChild(h('div', { style:{fontSize:'12px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.04em', marginBottom:'6px', fontWeight:500} }, `Subtareas (${(p.subtareas||[]).length})`));
  const subList = h('div', { style:{display:'flex', flexDirection:'column', gap:'4px', marginBottom:'8px'} });
  (p.subtareas || []).forEach(s => {
    const item = h('div', { style:{display:'flex', alignItems:'center', gap:'8px', fontSize:'12.5px'} }, [
      h('input', { type:'checkbox', checked: !!s.completada, onchange: () => {
        PENDIENTE.toggleSubtarea(p.id, s.id);
        refresh();
      } }),
      h('span', { style:{flex:1, textDecoration: s.completada ? 'line-through' : 'none', color: s.completada ? 'var(--ink-3)' : 'var(--ink)'} }, s.texto),
      h('button.btn.icon.ghost', { title:'Eliminar subtarea', onclick: () => {
        PENDIENTE.eliminarSubtarea(p.id, s.id);
        refresh();
      } }, [ h('i.ti.ti-x', { style:{fontSize:'14px'} }) ]),
    ]);
    subList.appendChild(item);
  });
  if (!(p.subtareas || []).length) {
    subList.appendChild(h('div', { style:{color:'var(--ink-4)', fontSize:'11.5px', fontStyle:'italic'} }, 'Sin subtareas.'));
  }
  subSec.appendChild(subList);
  // Input nueva subtarea
  const newSubInput = inputCtl({ placeholder:'Agregar subtarea (Enter para guardar)…', style:{flex:1} });
  const newSubBtn = h('button.btn.sm', {
    onclick: () => {
      const t = newSubInput.value.trim();
      if (!t) return;
      PENDIENTE.agregarSubtarea(p.id, t);
      newSubInput.value = '';
      refresh();
    },
  }, [ h('i.ti.ti-plus'), 'Agregar' ]);
  newSubInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); newSubBtn.click(); }
  });
  subSec.appendChild(h('div', { style:{display:'flex', gap:'6px'} }, [ newSubInput, newSubBtn ]));
  wrap.appendChild(subSec);

  // === Log / notas ===
  const logSec = h('div');
  logSec.appendChild(h('div', { style:{fontSize:'12px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.04em', marginBottom:'6px', fontWeight:500} }, `Notas y log (${(p.log||[]).length})`));
  // Form para agregar nota
  const notaInput = textareaCtl({ rows:2, placeholder:'Agregar nota al log (Ctrl+Enter para guardar)…' });
  const notaBtn = h('button.btn.sm', {
    onclick: () => {
      const t = notaInput.value.trim();
      if (!t) return;
      PENDIENTE.agregarNota(p.id, t);
      notaInput.value = '';
      refresh();
    },
  }, [ h('i.ti.ti-message-plus'), 'Agregar nota' ]);
  notaInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); notaBtn.click(); }
  });
  logSec.appendChild(h('div', { style:{display:'flex', gap:'6px', alignItems:'flex-start', marginBottom:'10px'} }, [
    h('div', { style:{flex:1} }, notaInput),
    notaBtn,
  ]));
  // Log cronológico descendente
  const logList = h('div', { style:{display:'flex', flexDirection:'column', gap:'6px'} });
  const logSorted = (p.log || []).slice().sort((a,b) => new Date(b.ts || 0) - new Date(a.ts || 0));
  logSorted.forEach(entry => {
    logList.appendChild(h('div', { style:{display:'flex', gap:'10px', fontSize:'11.5px', paddingBottom:'4px', borderBottom:'.5px solid var(--line)'} }, [
      h('span', { style:{color:'var(--ink-3)', fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap', minWidth:'120px'} }, fmt.datetime(entry.ts)),
      h('span', { style:{color:'var(--ink-2)', flex:1} }, entry.nota),
    ]));
  });
  if (!logSorted.length) logList.appendChild(h('div', { style:{color:'var(--ink-4)', fontSize:'11.5px', fontStyle:'italic'} }, 'Sin entradas en el log.'));
  logSec.appendChild(logList);
  wrap.appendChild(logSec);

  return wrap;
}

function abrirModalNuevoPendiente() {
  let snap = { descripcion:'', asignado: usuarioActual() || '', equipoUuid:'', vence: dateInputValue(addBusinessDays(new Date(), 3)) };
  UI.modal({
    title: 'Nuevo pendiente',
    size: 'sm',
    content: (body) => {
      body.appendChild(field('Descripción *', textareaCtl({ rows:3, oninput:(e)=> snap.descripcion = e.target.value })));
      body.appendChild(row('1fr 1fr', [
        field('Asignado a', selectTecnico(snap.asignado, { onchange:(e)=> snap.asignado = e.target.value })),
        field('Fecha de compromiso', dateCtl(snap.vence, { onchange:(e)=> snap.vence = e.target.value })),
      ]));
      const opts = [{ value:'', label:'(sin equipo)' }, ...STATE.equipos.slice(0,500).map(e => ({ value: e.uuid, label: `${e.nombre} · ${e.serie || e.inventario || ''}` }))];
      body.appendChild(field('Equipo (opcional)', selectCtl(opts, '', { onchange:(e)=> snap.equipoUuid = e.target.value })));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        if (!snap.descripcion.trim()) { bus.emit('error', new Error('Falta descripción.')); return; }
        PENDIENTE.crear({
          descripcion: snap.descripcion.trim(),
          asignado: snap.asignado.trim(),
          equipoUuid: snap.equipoUuid || null,
          vence: snap.vence ? isoFromDateInput(snap.vence) : null,
        });
        UI.toast('Pendiente creado.', 'success');
        close('save');
        Router.go('tareas');
      }}, 'Crear pendiente'));
    },
  });
}

function abrirModalEditarPendiente(p, refresh) {

    size: 'sm',

      body.appendChild(row('1fr 1fr', [
        field('Asignado a', selectTecnico(snap.asignado, { onchange:(e)=> snap.asignado = e.target.value })),
        field('Fecha de compromiso', dateCtl(snap.vence, { onchange:(e)=> snap.vence = e.target.value })),
      ]));
      const opts = [{ value:'', label:'(sin equipo)' }, ...STATE.equipos.slice(0,500).map(e => ({ value: e.uuid, label: `${e.nombre} · ${e.serie || e.inventario || ''}` }))];
      body.appendChild(field('Equipo', selectCtl(opts, snap.equipoUuid, { onchange:(e)=> snap.equipoUuid = e.target.value })));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        if (!snap.descripcion.trim()) { bus.emit('error', new Error('Falta descripción.')); return; }
        PENDIENTE.editar(p.id, {
          descripcion: snap.descripcion.trim(),
          asignado: snap.asignado,
          equipoUuid: snap.equipoUuid || null,
          vence: snap.vence ? isoFromDateInput(snap.vence) : null,
        });
        UI.toast('Pendiente actualizado.', 'success');
        close('save');
        refresh();
      }}, 'Guardar cambios'));
    },
  });
}

      reporteCard('MP pendientes (mes actual)', 'Listado de equipos con MP programada y sin ejecutar este mes.', 'ti-clipboard-list', async () => {

      }),
      reporteCard('Historial completo', 'Todas las MP registradas — todos los años.', 'ti-history', async () => {
        try { await exportHistorialCompleto(); UI.toast('Historial descargado.', 'success'); } catch(e) { bus.emit('error', e); }
      }),
    ]));
    root.appendChild(sec1);

    // ===== Informe mensual por servicio =====
    const sec2 = h('div.section');
    sec2.appendChild(h('h3','Informe mensual por servicio'));
    sec2.appendChild(renderInformeServicioBlock(params));

    const sec3 = h('div.section');
    sec3.appendChild(h('h3','Anexos imprimibles'));
    sec3.appendChild(renderAnexosBlock());

  },
};

function renderInformeServicioBlock(params) {
  const card = h('div.card');
  const servicios = EQ.servicios();
  if (!servicios.length) {
    card.appendChild(h('div', { style:{color:'var(--ink-3)', fontSize:'12.5px'} }, 'No hay servicios cargados.'));
    return card;
  }
  let snap = {
    servicio: params.servicio || servicios[0],
    mes:      params.mes      || new Date().getMonth()+1,
    anio:     params.anio     || new Date().getFullYear(),
  };
  const previewArea = h('div');

  function refresh() {
    const info = calcularInformeServicio(snap.servicio, snap.mes, snap.anio);
    previewArea.innerHTML = '';
    const totales = info.totales;
    previewArea.appendChild(h('div.kpi-grid', { style:{marginBottom:'10px'} }, [
      kpiCard({ label:'Equipos',      value: fmt.number(totales.equipos) }),
      kpiCard({ label:'Programadas',  value: fmt.number(totales.programadas) }),
      kpiCard({ label:'Ejecutadas',   value: fmt.number(totales.ejecutadas), kind:'success' }),
      kpiCard({ label:'Causalizadas', value: fmt.number(totales.causalizadas), kind:'warning' }),
      kpiCard({ label:'Pendientes',   value: fmt.number(totales.pendientes), kind: totales.pendientes ? 'danger' : 'muted' }),
    ]));
    const acts = h('div', { style:{display:'flex', gap:'8px', marginTop:'4px'} }, [
      h('button.btn', { onclick: () => exportInformeServicio(info).then(()=>UI.toast('Excel descargado.','success')).catch(e=>bus.emit('error',e)) }, [ h('i.ti.ti-file-spreadsheet'), 'Excel' ]),
      h('button.btn', { onclick: () => imprimirInformeServicio(info) }, [ h('i.ti.ti-printer'), 'Imprimir' ]),
    ]);
    previewArea.appendChild(acts);
  }

  const ctrl = h('div', { style:{display:'grid', gridTemplateColumns:'2fr 1fr 1fr', gap:'10px', marginBottom:'12px'} }, [
    field('Servicio', selectCtl(servicios, snap.servicio, { onchange:(e)=> { snap.servicio = e.target.value; refresh(); } })),
    field('Mes',      selectCtl(MESES.map((n,i)=>({value:String(i+1),label:n})), String(snap.mes), { onchange:(e)=> { snap.mes = Number(e.target.value); refresh(); } })),
    field('Año',      inputCtl({ type:'number', min:2020, max:2100, value: snap.anio, oninput:(e)=> { snap.anio = Number(e.target.value)||snap.anio; refresh(); } })),
  ]);
  card.appendChild(ctrl);
  card.appendChild(previewArea);
  refresh();
  return card;
}

function renderAnexosBlock() {
  const card = h('div.card');
  let eqUuid = '';
  const search = h('div.search', { style:{marginBottom:'12px'} }, [
    h('i.ti.ti-search'),
    h('input', { type:'text', placeholder:'Buscar equipo por nombre, serie o inventario…' }),
  ]);
  const results = h('div', { style:{maxHeight:'140px', overflowY:'auto', marginBottom:'12px', border:'.5px solid var(--line)', borderRadius:'6px'} });
  const actions = h('div', { style:{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'10px'} });

  function renderResults() {
    const q = search.querySelector('input').value;
    results.innerHTML = '';
    if (!q.trim()) {
      results.appendChild(h('div', { style:{padding:'12px', color:'var(--ink-3)', fontSize:'12px'} }, 'Escribí para buscar un equipo…'));
      return;
    }
    EQ.search(q).slice(0, 12).forEach(e => {
      const item = h('div', {
        style:{padding:'8px 12px', borderBottom:'.5px solid var(--line)', cursor:'pointer', background: eqUuid===e.uuid?'var(--paper-2)':'transparent'},
        onclick: () => { eqUuid = e.uuid; renderResults(); renderActions(); }
      }, [
        h('div', { style:{fontWeight:500, fontSize:'12.5px'} }, e.nombre || '—'),
        h('div', { style:{color:'var(--ink-3)', fontSize:'11px'} }, `${e.servicio || ''} · ${e.serie || ''} · ${e.inventario || ''}`),
      ]);
      results.appendChild(item);
    });
  }
  function renderActions() {
    actions.innerHTML = '';
    const e = eqUuid ? EQ.byUuid(eqUuid) : null;
    if (!e) {
      actions.appendChild(h('div', { style:{color:'var(--ink-3)', fontSize:'12.5px'} }, 'Elegí un equipo para habilitar los anexos.'));
      return;
    }
    // Anexo 1 always
    actions.appendChild(anexoCard('Anexo 1', 'Ficha técnica del equipo', 'ti-file-text', () => imprimirAnexo1(e)));
    // Anexo 3, 4 — requieren causal
    const causales = (e.historial||[]).filter(h => CAUSALES[h.resultado]).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
    actions.appendChild(anexoCard('Anexo 3', 'Reprogramación de MP (elige causal)', 'ti-calendar-x',
      causales.length ? () => elegirCausalParaAnexo(e, causales, imprimirAnexo3) : null,
      causales.length ? null : 'Sin causales registradas',
    ));
    const grupoA30 = causales.find(h => CAUSALES[h.resultado].grupo === 'A' && (fmt.daysSince(h.fechaEvento||h.fecha)||0) > CAUSAL_GRUPO_A_DIAS);
    actions.appendChild(anexoCard('Anexo 4', 'Retiro por seguridad (Grupo A >30d)', 'ti-shield-x',
      grupoA30 ? () => imprimirAnexo4(e, grupoA30) : null,
      grupoA30 ? null : 'No corresponde — sin causal Grupo A >30d',
    ));
    const pms = (e.historial||[]).filter(h => h.resultado === 'SI' && (h.estadoFinal === 'Operativo')).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
    actions.appendChild(anexoCard('Anexo 5', 'Puesta en marcha del equipo', 'ti-rocket',
      pms.length ? () => elegirCausalParaAnexo(e, pms, imprimirAnexo5, 'Elegí la puesta en marcha:') : null,
      pms.length ? null : 'Sin registros SI · Operativo',
    ));
  }

  search.querySelector('input').addEventListener('input', renderResults);
  renderResults();
  renderActions();
  card.appendChild(search);
  card.appendChild(results);
  card.appendChild(actions);
  return card;
}

async function exportMPPendientes() {
  await ensureXLSX();
  const now = new Date();
  const mes = now.getMonth()+1;
  const anio = now.getFullYear();
  const periodo = `${anio}-${String(mes).padStart(2,'0')}`;
  const respHdr = `Responsable ${MESES[mes-1]} ${anio}`;
  const data = [['Servicio','Equipo','Serie','Frecuencia','Programado','Estado equipo', respHdr, 'Días en estado']];
  STATE.equipos.forEach(e => {
    const prog = e.grilla?.[mes];
    if (prog !== 'X' && prog !== 'R') return;
    if ((e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI')) return;
    data.push([e.servicio||'', e.nombre||'', e.serie||'', e.frecuencia||'', prog, ESTADO_LABEL[e.estado]||e.estado, responsableDelPeriodo(e, periodo), fmt.daysSince(e.estadoDesde) ?? '']);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), `Pendientes ${MESES[mes-1]}`);
  XLSX.writeFile(wb, `MP_pendientes_${anio}_${String(mes).padStart(2,'0')}.xlsx`);
}

async function exportHistorialCompleto() {
  await ensureXLSX();
  const rows = [['Fecha','Mes','Año','Servicio','Equipo','Serie','Inventario','Resultado','Estado final','Ejecutor','Observación','Motivo cambio ejecutor']];
  STATE.equipos.forEach(e => (e.historial||[]).forEach(h => {
    const d = new Date(h.fechaEvento || h.fecha || 0);
    rows.push([
      fmt.date(h.fechaEvento || h.fecha),
      MESES[(h.mes||1)-1],
      isNaN(d) ? '' : d.getFullYear(),
      e.servicio||'', e.nombre||'', e.serie||'', e.inventario||'',
      h.resultado||'', h.estadoFinal ? (ESTADO_LABEL[h.estadoFinal]||h.estadoFinal) : '',
      h.ejecutor||'', h.obs||'', h.motivoCambioEjecutor||'',
    ]);
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Historial');
  XLSX.writeFile(wb, `historial_completo_${new Date().toISOString().slice(0,10)}.xlsx`);
}
VIEWS.agenda = {
  title: 'Agenda',
  render(root, params={}) {
    const servicios = EQ.servicios();
    if (!servicios.length) {
      root.appendChild(viewHeader({ title: 'Agenda · contactos por servicio', desc: 'Sin servicios cargados.' }));
      root.appendChild(emptyState({ icon:'ti-address-book', title:'Sin servicios', desc:'Cargá el inventario maestro primero.' }));
      return;
    }

    // Estadísticas
    function filledCount(sv) {
      const c = getContacto(sv);
      return CONTACTO_TIPOS.filter(t => {
        const p = c[t.key] || {};
        return p.nombreCompleto || p.correo || p.celular || p.anexo;
      }).length;
    }
    const conCompletos = servicios.filter(sv => filledCount(sv) === CONTACTO_TIPOS.length).length;
    const conAlgo      = servicios.filter(sv => filledCount(sv) > 0).length;
    const sinContactos = servicios.length - conAlgo;
    const totalPersonas = servicios.reduce((s, sv) => s + filledCount(sv), 0);

    root.appendChild(viewHeader({
      title: 'Agenda · contactos por servicio',
      desc: `${servicios.length} servicios · ${conCompletos} con contactos completos · ${sinContactos} sin contactos · ${totalPersonas} personas registradas`,
    }));

    // Controles
    const search = h('div.search', { style:{flex:1} }, [
      h('i.ti.ti-search'),
      h('input', { type:'text', placeholder:'Buscar servicio o persona (nombre completo o correo)…', value: params.q || '' }),
    ]);
    let filtro = params.filtro || 'todos';   // 'todos' | 'con' | 'sin'
    let orden  = params.orden  || 'sin-primero';

    function chip(label, value, state) {
      return h(`button.btn.sm ${filtro===value ? 'primary' : 'ghost'}`.trim(), {
        onclick: () => { filtro = value; render(); },
      }, label);
    }
    const filtros = h('div', { style:{display:'flex', gap:'4px'} }, [
      chip('Todos','todos'),
      chip('Sin contactos','sin'),
      chip('Con contactos','con'),
    ]);
    const ordenSel = selectCtl([
      { value:'sin-primero', label:'Sin contactos primero' },
      { value:'az',          label:'A–Z' },
      { value:'equipos',     label:'Más equipos primero' },
    ], orden, { onchange: (e) => { orden = e.target.value; render(); } });

    const controls = h('div', { style:{display:'flex', gap:'10px', alignItems:'center', marginBottom:'14px', flexWrap:'wrap'} }, [
      search, filtros, ordenSel,
    ]);
    root.appendChild(controls);

    const meta = h('div.table-meta', { style:{borderRadius:'6px', border:'.5px solid var(--line)', marginBottom:'10px'} });
    root.appendChild(meta);
    const grid = h('div', { style:{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(340px,1fr))', gap:'10px'} });
    root.appendChild(grid);

    function evaluaServicio(sv) {
      const c = getContacto(sv);
      const filled = CONTACTO_TIPOS.filter(t => {
        const p = c[t.key] || {};
        return p.nombreCompleto || p.correo || p.celular || p.anexo;
      }).length;
      return { c, filled };
    }

    function matchSearch(sv, q) {
      if (!q) return true;
      const n = normalize(q);
      if (normalize(sv).includes(n)) return true;
      const c = getContacto(sv);
      return CONTACTO_TIPOS.some(t => {
        const p = c[t.key] || {};
        return [p.nombreCompleto, p.correo].some(v => v && normalize(v).includes(n));
      });
    }

    function render() {
      const q = search.querySelector('input').value;
      let list = servicios.filter(sv => matchSearch(sv, q));
      list = list.filter(sv => {
        const { filled } = evaluaServicio(sv);
        if (filtro === 'con') return filled > 0;
        if (filtro === 'sin') return filled === 0;
        return true;
      });
      const eqCount = sv => STATE.equipos.filter(e => e.servicio === sv).length;
      list.sort((a,b) => {
        if (orden === 'az')      return a.localeCompare(b,'es');
        if (orden === 'equipos') return eqCount(b) - eqCount(a);
        const fa = evaluaServicio(a).filled, fb = evaluaServicio(b).filled;
        if (fa !== fb) return fa - fb;          // sin contactos primero
        return a.localeCompare(b,'es');
      });

      meta.textContent = `${list.length} servicios coinciden con los filtros`;
      grid.innerHTML = '';
      if (!list.length) {
        grid.appendChild(h('div', { style:{padding:'20px', color:'var(--ink-3)', fontSize:'12.5px', textAlign:'center'} }, 'Sin coincidencias.'));
        return;
      }
      list.forEach(sv => grid.appendChild(renderContactoCard(sv)));
    }

    // Actualiza al tipear / cambiar orden / re-renders por estado
    search.querySelector('input').addEventListener('input', render);
    ordenSel.addEventListener('change', () => { orden = ordenSel.value; render(); });

    render();
  },
};

function renderContactoCard(servicio) {
  const c = getContacto(servicio);

  const card = h('div.card');

  // Header

          h('div', { style:{color:'var(--ink)', fontWeight:500} }, nombre),

            p.celular ? h('a', { href:`tel:${p.celular}`,    style:{color:'var(--info)', textDecoration:'none'} }, [ h('i.ti.ti-phone',{ style:{fontSize:'12px', marginRight:'3px'} }), p.celular ]) : null,

          ].filter(Boolean)),

      }, [
        h('span', { style:{color:'var(--ink-3)', width:'80px', flexShrink:0} }, t.label),

        }, [ h('i.ti.ti-plus'), `Agregar ${t.label.toLowerCase()}` ]),
      ]));
    }
  });

  return card;
}

function abrirQuickContacto(servicio, tipoKey) {
  const c = getContacto(servicio);
  const tipo = CONTACTO_TIPOS.find(t => t.key === tipoKey);
  const draft = Object.assign(emptyPersona(), c[tipoKey] || {});
  const yaCargado = !!(draft.nombreCompleto || draft.correo || draft.celular || draft.anexo);

  UI.modal({
    title: `${yaCargado?'Editar':'Agregar'} ${tipo.label.toLowerCase()}`,
    sub: servicio,
    size: 'sm',
    content: (body) => {
      body.appendChild(field('Nombre completo *', inputCtl({
        value: draft.nombreCompleto, autofocus: true,
        placeholder: 'ej. DANIELA CAROLINA GUERRA MOURGUET',
        oninput:(e)=> draft.nombreCompleto = e.target.value,
      })));
      body.appendChild(field('Correo', inputCtl({ type:'email', value: draft.correo, oninput:(e)=> draft.correo = e.target.value })));
      body.appendChild(row('1fr 1fr', [
        field('Celular', inputCtl({ value: draft.celular, oninput:(e)=> draft.celular = e.target.value })),
        field('Anexo',   inputCtl({ value: draft.anexo,   oninput:(e)=> draft.anexo = e.target.value })),
      ]));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      if (yaCargado) {
        f.appendChild(h('button.btn.danger', { onclick: async () => {
          const ok = await UI.dialog({ title:`Borrar ${tipo.label.toLowerCase()}`, message: `¿Borrar este contacto de ${servicio}?`, confirmText:'Borrar', variant:'danger' });
          if (!ok) return;
          const updated = Object.assign({}, c);
          updated[tipoKey] = emptyPersona();
          setContacto(servicio, updated);
          UI.toast('Contacto borrado.', 'warning');
          close(); Router.go('agenda');
        } }, [ h('i.ti.ti-trash'), 'Borrar' ]));
      }
      f.appendChild(h('button.btn.primary', { onclick: () => {
        const updated = Object.assign({}, c);
        updated[tipoKey] = draft;
        setContacto(servicio, updated);
        UI.toast(`${tipo.label} guardado.`, 'success');
        close(); Router.go('agenda');
      }}, [ h('i.ti.ti-device-floppy'), 'Guardar' ]));
    },
  });
}

async function handleImportMaestro() {
  try {
    const file = await pickFile('.xlsx,.xlsm');
    if (!file) return;
    UI.toast(`Procesando ${file.name}…`, 'info', { duration: 2500 });

      abrirModalDiferenciasMaestro(result.diff);
    }
  } catch (e) { bus.emit('error', e); }
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
const CMDK = (() => {
  let openEl = null;

  function open() {
    if (openEl) return;
    const root = $('#cmdkRoot');
    const bd = h('div.cmdk-backdrop');
    const box = h('div.cmdk');
    const inp = h('input', { type:'text', placeholder:'Buscar equipo, ir a vista, ejecutar acción…' });
    const list = h('div.cmdk-list');
    box.appendChild(h('div.cmdk-input', [ h('i.ti.ti-search'), inp, h('span.pill.muted','Esc') ]));
    box.appendChild(list);
    bd.appendChild(box);
    root.appendChild(bd);
    openEl = bd;

    function close() {
      if (!openEl) return;
      openEl.remove();
      openEl = null;
      document.removeEventListener('keydown', keyHandler);
    }

    const actions = [
      { group:'Acciones', label:'Importar maestro',         icon:'ti-file-spreadsheet', run: handleImportMaestro },
      { group:'Acciones', label:'Importar asignación mensual', icon:'ti-clipboard-text', run: () => handleImportAsignacion() },
      { group:'Acciones', label:'Descargar backup',         icon:'ti-database-export', run: exportBackup },
      { group:'Acciones', label:'Restaurar backup',         icon:'ti-database-import', run: importBackup },
      { group:'Acciones', label:'Alternar tema claro/oscuro', icon:'ti-contrast-2', run: () => Theme.toggle() },
      { group:'Acciones', label: REC.isActive() ? 'Detener grabación de sesión' : 'Iniciar grabación de sesión', icon:'ti-record-mail', run: () => REC.toggle() },
    ];
    const navs = NAV_ITEMS.map(it => ({
      group:'Ir a', label: it.label, icon: it.icon, run: () => Router.go(it.id), meta: it.soon ? 'pronto' : '',
    }));

    let cursor = 0;

    function render() {
      const q = inp.value.trim();
      const results = [];
      // Navs + actions
      [...navs, ...actions].forEach(item => {
        const sc = fuzzyScore(q, item.label);
        if (q && sc < 0) return;
        results.push({ ...item, score: sc });
      });
      // Equipos
      const eqMatches = !q ? [] : EQ.search(q).slice(0, 30).map(e => ({
        group:'Equipos',
        label: e.nombre || '(sin nombre)',
        meta: `${e.servicio || ''}${e.serie ? ' · S/N '+e.serie : ''}`,
        icon: e.estado === 'NoOperativo' ? 'ti-alert-triangle' : e.estado === 'ServicioTecnico' ? 'ti-tool' : 'ti-stethoscope',
        run: () => { close(); openFicha(e.uuid); },
      }));
      results.push(...eqMatches);

      list.innerHTML = '';
      if (!results.length) {
        list.appendChild(h('div', { style:{ padding:'24px', color:'var(--ink-3)', fontSize:'12.5px', textAlign:'center' } }, q ? 'Sin coincidencias' : 'Escribí para buscar…'));
        return;
      }
      cursor = Math.min(cursor, results.length-1);
      const groups = {};
      results.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
      let i = 0;
      for (const g of Object.keys(groups)) {
        list.appendChild(h('div.cmdk-group-label', g));
        groups[g].forEach(r => {
          const myIndex = i;
          const item = h('div.cmdk-item', { dataset:{ idx: i } }, [
            h('i.ti', { class: 'ti ' + (r.icon||'ti-circle') }),
            h('span', r.label),
            r.meta ? h('span.meta', r.meta) : null,
          ]);
          if (i === cursor) item.classList.add('is-active');
          item.addEventListener('click', () => { close(); try { r.run(); } catch(e){ bus.emit('error', e);} });
          item.addEventListener('mouseenter', () => { cursor = myIndex; renderHighlight(); });
          list.appendChild(item);
          i++;
        });
      }
      renderHighlight();
    }
    function renderHighlight() {
      $$('.cmdk-item', list).forEach((el, idx) => el.classList.toggle('is-active', idx === cursor));
      const active = $('.cmdk-item.is-active', list);
      try { active?.scrollIntoView?.({ block:'nearest' }); } catch {}
    }
    function runActive() {
      const active = $('.cmdk-item.is-active', list);
      if (active) active.click();
    }

    function keyHandler(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); cursor = Math.min(cursor+1, $$('.cmdk-item', list).length-1); renderHighlight(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); cursor = Math.max(cursor-1, 0); renderHighlight(); return; }
      if (e.key === 'Enter')     { e.preventDefault(); runActive(); return; }
    }

    inp.addEventListener('input', () => { cursor = 0; render(); });
    bd.addEventListener('mousedown', (e) => { if (e.target === bd) close(); });
    document.addEventListener('keydown', keyHandler);
    setTimeout(() => inp.focus(), 10);
    render();
  }

  return { open };
})();

/* AJUSTE R8 H.1: estado y persistencia del modo colapsado de la sidebar. */
function sidebarColapsada() {
  try { return localStorage.getItem('pmp.v3.ui.sidebar.collapsed') === '1'; } catch { return false; }
}
function setSidebarColapsada(v) {
  const app = document.getElementById('app');
  if (!app) return;
  if (v) app.classList.add('sidebar-collapsed');
  else   app.classList.remove('sidebar-collapsed');
  try { localStorage.setItem('pmp.v3.ui.sidebar.collapsed', v ? '1' : '0'); } catch {}
  // Actualizar ícono y label del botón
  const btn = document.getElementById('sidebarToggle');
  if (btn) {
    const icon = btn.querySelector('i');
    const lbl  = document.getElementById('sidebarToggleLabel');
    if (v) {
      if (icon) icon.className = 'ti ti-layout-sidebar-left-expand';
      if (lbl)  lbl.textContent = 'Expandir';
      btn.title = 'Expandir barra lateral';
    } else {
      if (icon) icon.className = 'ti ti-layout-sidebar-left-collapse';
      if (lbl)  lbl.textContent = 'Compactar';
      btn.title = 'Compactar barra lateral';
      // AJUSTE R8 H.6: al expandir, restaurar scrollTop para que el brand quede visible.
      const sb = document.querySelector('.sidebar');
      if (sb) sb.scrollTop = 0;
    }
  }
}
function aplicarSidebarColapsadaInicial() {
  setSidebarColapsada(sidebarColapsada());
}

const Theme = {
  current() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  },
  set(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('pmp.v3.ui.theme', t); } catch {}
    this.syncToggle();
  },
  toggle() { this.set(this.current() === 'dark' ? 'light' : 'dark'); },
  syncToggle() {
    const btn = $('#themeToggle');
    if (!btn) return;
    const isDark = this.current() === 'dark';
    const icon = btn.querySelector('i');
    const label = $('#themeToggleLabel');
    if (icon)  icon.className = 'ti ' + (isDark ? 'ti-moon-stars' : 'ti-sun');
    if (label) label.textContent = isDark ? 'Tema oscuro' : 'Tema claro';
  },
};

   ============================================================ */
function boot() {
  try {
    const mig = migrateFromLegacy();
    loadState();
    const migPend = migrarPendientesV33(STATE.pendientes);
    if (migPend) { persist('pendientes'); console.info('[boot] migrarPendientesV33: ' + migPend + ' campos normalizados'); }
    const migC = migrarCiclosV34(STATE.equipos);
    if (migC.descartadosAbiertos || migC.convertidos || migC.mpsLimpiados) {
      persist('equipos');
      const msg = [];
      if (migC.descartadosAbiertos) msg.push(`${migC.descartadosAbiertos} ciclo${migC.descartadosAbiertos>1?'s':''} abierto${migC.descartadosAbiertos>1?'s':''} descartado${migC.descartadosAbiertos>1?'s':''} del modelo viejo`);
      if (migC.convertidos) msg.push(`${migC.convertidos} ciclo${migC.convertidos>1?'s':''} cerrado${migC.convertidos>1?'s':''} convertido${migC.convertidos>1?'s':''}`);
      if (migC.mpsLimpiados) msg.push(`${migC.mpsLimpiados} registro${migC.mpsLimpiados>1?'s':''} MP con referencia huérfana limpiada${migC.mpsLimpiados>1?'s':''}`);
      console.info('[boot] migrarCiclosV34:', migC);
      setTimeout(() => UI.toast('Migración v34 del ciclo correctivo: ' + msg.join(' · '), 'info', { duration: 9000 }), 800);
    }
    renderNav();
    renderSessionChip();
    Theme.syncToggle();
    REC.updateChip();
    $('#themeToggle').addEventListener('click', () => Theme.toggle());
    /* AJUSTE R8 H: aplicar estado colapsado de sidebar antes del primer render
       y conectar el botón. */
    aplicarSidebarColapsadaInicial();
    $('#sidebarToggle').addEventListener('click', () => setSidebarColapsada(!sidebarColapsada()));
    $('#openCmdk').addEventListener('click', () => CMDK.open());
    bus.on('state:change', (slice) => {
      renderSessionChip();
      if (!slice || slice === 'pendientes') {
        try { actualizarBadgesPendientes(); } catch {}
      }
    });

    // Periodic chip update for REC events counter
    setInterval(() => { if (REC.isActive()) REC.updateChip(); }, 1500);

    $('#bootScreen').remove();
    $('#app').hidden = false;

    Router.go(STATE.equipos.length ? 'dash' : 'dash');

    if (mig.migrated && mig.counts && (mig.counts.equipos || mig.counts.pendientes)) {
      UI.toast(`Migrados ${mig.counts.equipos} equipos · ${mig.counts.pendientes} pendientes desde el sistema anterior.`, 'success', { duration: 6500 });
    }

    // ===== R6 boot UX =====
    // 1) Identificación del usuario (primera carga ever)
    setTimeout(() => {
      if (!usuarioActual()) abrirModalIdentificarUsuario();
      else {
        // 2) Welcome modal del día (si todavía no se mostró hoy)
        const hoy = new Date().toISOString().slice(0,10);
        const ult = (() => { try { return localStorage.getItem('pmp.v3.ultimaApertura'); } catch { return null; } })();
        if (ult !== hoy) abrirModalBienvenida();
      }
      // 3) Pendientes automáticos 30d
      try { revisarEquiposVencidos(); } catch (e) { console.error(e); }
      // 4) Refrescar badges del sidebar
      try { actualizarBadgesPendientes(); } catch (e) { console.error(e); }
    }, 600);
  } catch (e) {
    console.error(e);
    document.body.innerHTML = `<pre style="padding:24px;color:#b91c1c;font-family:monospace">Error de arranque:\n${(e&&e.stack)||e}</pre>`;
  }
}
