      if (!id || id === 'todos') { chipVista.style.display = 'none'; return; }
      chipVista.style.display = '';
      const preset = invGetPresets().find(p => p.id === id);
      const label = preset ? preset.label : 'Vista personalizada';
      chipVista.appendChild(h('span', label));
      chipVista.appendChild(h('button.btn.icon.ghost', { style:{padding:'0 2px'}, title:'Volver a Todos activos', onclick: () => aplicarPreset(invGetPresets()[0]) }, [ h('i.ti.ti-x', { style:{fontSize:'13px'} }) ]));
    }
    const vistaBar = h('div', { style:{display:'flex', gap:'8px', alignItems:'center', marginBottom:'10px'} }, [
      vistasBtn, colsBtn, chipVista,
    ]);
    root.appendChild(vistaBar);

    const tableWrap = h('div.table-wrap');

    // === Filtros ===
    const search = h('div.search', [
      h('i.ti.ti-search'),
      h('input', { type:'text', placeholder:'Buscar por nombre, serie, inventario, marca…', value: filters.q }),
    ]);
    const respPeriodo = EQ.responsablesPeriodo(periodoFiltro);
    const respOpts = [...respPeriodo, '(sin asignar)'];
    const empresas = empresasSTUsadas();

    const selServicio = selectField('Servicio', '', EQ.servicios(), filters.servicio);
    const selFamilia  = selectField('Familia',  '', EQ.familias(),  filters.familia);
    const selEstado   = selectField('Estado', '', [
      ...ESTADOS.map(s => ({ value: s, label: ESTADO_LABEL[s] })),
      { value:'no_operativos_todos', label:'No operativos (todos)' },
    ], filters.estado);
    const selEmpresaST= selectField('Empresa ST', '', empresas, filters.empresaST);
    const selResp     = selectField(`Resp. ${periodoLabel(periodoFiltro)}`, '', respOpts, filters.responsable);
    const selGar      = selectField('Garantía', '', [{value:'si',label:'En garantía'},{value:'no',label:'Sin garantía'}], filters.garantia);
    const selTiempo   = selectField('Tiempo en estado', '', [
      { value:'7',  label:'>7 días' },
      { value:'15', label:'>15 días' },
      { value:'30', label:'>30 días' },
    ], filters.tiempoEstado || '');
    const selPend     = selectField('Pendientes', '', [
      { value:'con', label:'Con pendientes abiertos' },
      { value:'sin', label:'Sin pendientes abiertos' },
    ], filters.pendientes || '');

    // Rangos de fecha (MP, gestión) — pares + botón ✕ por rango
    const inpMPDesde   = h('input.input', { type:'date', value: filters.mpDesde,    style:{maxWidth:'130px'}, onchange:(e) => applyFilters() });
    const inpMPHasta   = h('input.input', { type:'date', value: filters.mpHasta,    style:{maxWidth:'130px'}, onchange:(e) => applyFilters() });
    const inpGestDesde = h('input.input', { type:'date', value: filters.gestionDesde, style:{maxWidth:'130px'}, onchange:(e) => applyFilters() });
    const inpGestHasta = h('input.input', { type:'date', value: filters.gestionHasta, style:{maxWidth:'130px'}, onchange:(e) => applyFilters() });
    const btnLimpMP   = h('button.btn.icon.ghost', { title:'Limpiar rango de MP',     onclick: () => { inpMPDesde.value = ''; inpMPHasta.value = ''; applyFilters(); } }, [ h('i.ti.ti-x', { style:{fontSize:'13px'} }) ]);
    const btnLimpGest = h('button.btn.icon.ghost', { title:'Limpiar rango de gestión', onclick: () => { inpGestDesde.value = ''; inpGestHasta.value = ''; applyFilters(); } }, [ h('i.ti.ti-x', { style:{fontSize:'13px'} }) ]);
    const fechasMP   = h('div', { style:{display:'flex', alignItems:'center', gap:'4px'} }, [
      h('span', { style:{fontSize:'11px', color:'var(--ink-3)'} }, 'MP desde'), inpMPDesde,
      h('span', { style:{fontSize:'11px', color:'var(--ink-3)'} }, 'hasta'), inpMPHasta, btnLimpMP,
    ]);
    const fechasGest = h('div', { style:{display:'flex', alignItems:'center', gap:'4px'} }, [
      h('span', { style:{fontSize:'11px', color:'var(--ink-3)'} }, 'Gestión desde'), inpGestDesde,
      h('span', { style:{fontSize:'11px', color:'var(--ink-3)'} }, 'hasta'), inpGestHasta, btnLimpGest,
    ]);

    // Toggle slots
    const slotToggle = h('label', {
      style:{ display:'flex', alignItems:'center', gap:'6px', padding:'6px 10px', border:'.5px solid var(--line-2)', borderRadius:'var(--r-md)', cursor:'pointer', fontSize:'12px', whiteSpace:'nowrap' },
      title: 'Slots disponibles son posiciones sin equipo asignado',
    }, [
      h('input', { type:'checkbox', checked: showSlots, style:{margin:0}, onchange: (e) => {
        const v = e.target.checked;
        try { localStorage.setItem('pmp.v3.ui.inventario.showSlots', v ? '1' : '0'); } catch {}
        Router.go('inv', Object.assign({}, currentParams(), { showSlots: v }));
      }}),
      h('span', 'Mostrar slots'),
    ]);

    function currentParams() {
      return {
        q: search.querySelector('input').value,
        servicio: selServicio.querySelector('select').value,
        familia:  selFamilia.querySelector('select').value,
        estado:   selEstado.querySelector('select').value,
        empresaST: selEmpresaST.querySelector('select').value,
        responsable: selResp.querySelector('select').value,
        garantia: selGar.querySelector('select').value,
        tiempoEstado: selTiempo.querySelector('select').value,
        pendientes: selPend.querySelector('select').value,
        mpDesde:    inpMPDesde.value,
        mpHasta:    inpMPHasta.value,
        gestionDesde: inpGestDesde.value,
        gestionHasta: inpGestHasta.value,
        periodo: periodoFiltro,
      };
    }

    const toolbar = h('div.table-toolbar', [
      search,
      h('div.right', { style:{gap:'6px', flexWrap:'wrap'} }, [
        selServicio, selFamilia, selEstado, selEmpresaST, selResp, selGar, selTiempo, selPend,
        fechasMP, fechasGest, slotToggle,
        h('button.btn.ghost.sm', { onclick: () => { UI_INV.vistaActiva = null; Router.go('inv', {}); } }, [ h('i.ti.ti-x'), 'Limpiar' ]),
      ]),
    ]);

    const meta = h('div.table-meta', '');
    const tbl = h('table.dt');
    const thead = h('thead');
    const tb = h('tbody');
    tbl.appendChild(thead);
    tbl.appendChild(tb);

    tableWrap.appendChild(toolbar);
    tableWrap.appendChild(meta);
    tableWrap.appendChild(tbl);
    root.appendChild(tableWrap);

    function renderHeader() {
      thead.innerHTML = '';
      const tr = h('tr');
      invColumnasVisibles().forEach(key => {
        const col = INV_COLUMNAS.find(c => c.key === key);
        if (col) tr.appendChild(h('th', col.label));
      });
      thead.appendChild(tr);
    }
    renderHeader();

    function rowEquipoDinamico(e) {
      const tr = h('tr', { onclick: () => openFicha(e.uuid) });
      if (e.esSlot) tr.classList.add('is-slot');
      invColumnasVisibles().forEach(key => {
        const col = INV_COLUMNAS.find(c => c.key === key);
        if (!col) return;
        const node = invCellRender(col, e);
        const td = h(col.tipo === 'numero' || col.tipo === 'fecha' ? 'td.col-mono' : 'td');
        if (node instanceof Node) td.appendChild(node);
        else td.appendChild(document.createTextNode(node == null ? '—' : String(node)));
        tr.appendChild(td);
      });
      return tr;
    }

    // === Estado dinámico (paginación) ===
    let rendered = 0;
    const PAGE = 80;
    let current = [];

    function applyFilters() {
      const f = Object.assign({}, currentParams(), { slot: showSlots ? '' : 'no' });
      const q = f.q;

      // Caso especial: estado = 'no_operativos_todos' aplica OR sobre los 3 estados no-op.
      let baseList;
      if (f.estado === 'no_operativos_todos') {
        // pasamos estado:'' a EQ.search y luego filtramos manualmente
        baseList = EQ.search(q, Object.assign({}, f, { estado: '' }));
        baseList = baseList.filter(e => ESTADOS_NO_OPERATIVOS.includes(e.estado));
      } else {
        baseList = EQ.search(q, f);
      }

      // Filtros R7
      if (f.empresaST) {
        baseList = baseList.filter(e => (e.correctivos || []).some(c => (c.envios || []).some(en => en.empresaST === f.empresaST)));
      }
      if (f.pendientes === 'con') baseList = baseList.filter(e => cantidadPendientesAbiertos(e) > 0);
      else if (f.pendientes === 'sin') baseList = baseList.filter(e => cantidadPendientesAbiertos(e) === 0);

      if (f.mpDesde || f.mpHasta) {
        const dDesde = f.mpDesde ? new Date(f.mpDesde + 'T00:00:00').getTime() : null;
        const dHasta = f.mpHasta ? new Date(f.mpHasta + 'T23:59:59').getTime() : null;
        baseList = baseList.filter(e => {
          const u = ultimaMP(e); if (!u) return false;
          const t = u.getTime();
          if (dDesde != null && t < dDesde) return false;
          if (dHasta != null && t > dHasta) return false;
          return true;
        });
      }
      if (f.gestionDesde || f.gestionHasta) {
        const dDesde = f.gestionDesde ? new Date(f.gestionDesde + 'T00:00:00').getTime() : null;
        const dHasta = f.gestionHasta ? new Date(f.gestionHasta + 'T23:59:59').getTime() : null;
        baseList = baseList.filter(e => {
          const u = ultimaGestion(e); if (!u) return false;
          const t = u.getTime();
          if (dDesde != null && t < dDesde) return false;
          if (dHasta != null && t > dHasta) return false;
          return true;
        });
      }

      // Filtro tiempo en estado
      if (f.tiempoEstado) {
        const umbral = Number(f.tiempoEstado);
        baseList = baseList.filter(e => {
          if (!ESTADOS_NO_OPERATIVOS.includes(e.estado)) return false;
          const d = diasEnEstadoActual(e);
          return d != null && d > umbral;
        });
      }

      current = baseList.sort((a,b) => (a.servicio||'').localeCompare(b.servicio||'','es') || (a.nombre||'').localeCompare(b.nombre||'','es'));
      tb.innerHTML = ''; rendered = 0;
      const extra = showSlots ? '' : ` · ${fmt.number(STATE.equipos.filter(e => e.esSlot).length)} slots ocultos`;
      meta.textContent = `${fmt.number(current.length)} equipos coinciden con los filtros${extra}`;
      INV_LAST_FILTERED = current;
      INV_LAST_FILTROS = f;
      // Si filtros activos != preset actual, marcar como personalizada (pero solo si había un preset distinto a 'todos').
      if (UI_INV.vistaActiva && UI_INV.vistaActiva !== 'personalizada' && UI_INV.vistaActiva !== 'todos') {
        // Hash rápido para comparar contra el preset
        UI_INV.vistaActiva = 'personalizada';
        refreshChipVista();
      }
      // Mostrar/ocultar botones limpiar de rangos
      btnLimpMP.style.display = (f.mpDesde || f.mpHasta) ? '' : 'none';
      btnLimpGest.style.display = (f.gestionDesde || f.gestionHasta) ? '' : 'none';
      renderMore();
    }

    function renderMore() {
      const slice = current.slice(rendered, rendered + PAGE);
      slice.forEach(e => tb.appendChild(rowEquipoDinamico(e)));
      rendered += slice.length;
      if (rendered >= current.length) sentinel.style.display = 'none';
      else sentinel.style.display = '';
    }

    const sentinel = h('tr', { style:{} }, [ h('td', { colspan: 99, style:{textAlign:'center', color:'var(--ink-3)', padding:'10px', fontSize:'11.5px'} }, 'Cargando más…') ]);
    tb.parentNode.appendChild(sentinel);
    const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting && rendered < current.length) renderMore(); }), { rootMargin: '120px' });

    function recargar() {
      // re-render solo del header + body (no de los filtros)
      renderHeader();
      applyFilters();
    }
    function aplicarPreset(preset) {
      // Construir params combinando defaults + preset.params
      const defaultParams = { q:'', servicio:'', familia:'', estado:'', responsable:'', garantia:'', tiempoEstado:'', empresaST:'', pendientes:'', mpDesde:'', mpHasta:'', gestionDesde:'', gestionHasta:'' };
      const p = Object.assign({}, defaultParams, preset.params || {});
      // Setear valores en controles
      search.querySelector('input').value = p.q || '';
      selServicio.querySelector('select').value = p.servicio || '';
      selFamilia.querySelector('select').value = p.familia || '';
      selEstado.querySelector('select').value = p.estado || '';
      selEmpresaST.querySelector('select').value = p.empresaST || '';
      selResp.querySelector('select').value = p.responsable || '';
      selGar.querySelector('select').value = p.garantia || '';
      selTiempo.querySelector('select').value = p.tiempoEstado || '';
      selPend.querySelector('select').value = p.pendientes || '';
      inpMPDesde.value = p.mpDesde || ''; inpMPHasta.value = p.mpHasta || '';
      inpGestDesde.value = p.gestionDesde || ''; inpGestHasta.value = p.gestionHasta || '';
      // Aplicar columnas si vienen en el preset
      if (Array.isArray(preset.columnas) && preset.columnas.length) invSetColumnasVisibles(preset.columnas);
      // Marcar vista activa, re-render, toast
      UI_INV.vistaActiva = preset.id;
      refreshChipVista();
      renderHeader();
      // Cuando applyFilters se ejecute, no debe cambiar vistaActiva. Marcamos un flag temporal.
      const prev = UI_INV.vistaActiva;
      applyFilters();
      UI_INV.vistaActiva = prev;
      refreshChipVista();
      UI.toast(`Vista aplicada: ${preset.label}`, 'success');
    }

    search.querySelector('input').addEventListener('input', applyFilters);
    [selServicio, selFamilia, selEstado, selEmpresaST, selResp, selGar, selTiempo, selPend].forEach(s => s.querySelector('select').addEventListener('change', applyFilters));

    refreshChipVista();
    applyFilters();
    io.observe(sentinel);
  },
};

/* ============================================================
   R7 — Popovers de columnas y vistas rápidas del Inventario
   ============================================================ */

function abrirPopoverColumnas(anchor, onChange) {
  UI.popover(anchor, { width: 280, render: (body, { close }) => {
    body.appendChild(h('div', { style:{fontSize:'12px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.04em', marginBottom:'8px', fontWeight:500} }, 'Mostrar columnas'));
    const visibles = new Set(invColumnasVisibles());
    INV_COLUMNAS.forEach(col => {
      const lbl = h('label', { style:{display:'flex', alignItems:'center', gap:'8px', padding:'4px 0', cursor:'pointer', fontSize:'13px'} }, [
        h('input', { type:'checkbox', checked: visibles.has(col.key), onchange:(e)=> {
          if (e.target.checked) visibles.add(col.key);
          else visibles.delete(col.key);
          // Mantener el orden del catálogo
          const ordenado = INV_COLUMNAS.filter(c => visibles.has(c.key)).map(c => c.key);
          invSetColumnasVisibles(ordenado);
          // Aplicar el cambio in-place
          UI_INV.vistaActiva = UI_INV.vistaActiva && UI_INV.vistaActiva !== 'todos' ? 'personalizada' : UI_INV.vistaActiva;
          onChange?.();
        } }),
        h('span', col.label),
      ]);
      body.appendChild(lbl);
    });
    body.appendChild(h('hr', { style:{margin:'8px 0', border:0, borderTop:'.5px solid var(--line)'} }));
    body.appendChild(h('button.btn.sm.ghost', { style:{width:'100%', justifyContent:'center'}, onclick: () => {
      invResetColumnas();
      onChange?.();
      close();
    } }, [ h('i.ti.ti-restore'), 'Restaurar default' ]));
  } });
}

function abrirPopoverVistas(anchor, onPick) {
  UI.popover(anchor, { width: 320, render: (body, { close }) => {
    body.appendChild(h('div', { style:{fontSize:'12px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.04em', marginBottom:'8px', fontWeight:500} }, 'Vistas rápidas'));
    invGetPresets().forEach(preset => {
      const desactivado = preset.requiereUsuario && !usuarioActual();
      const item = h('div', {
        style: Object.assign(
          { padding:'8px 10px', borderRadius:'6px', cursor: desactivado ? 'not-allowed' : 'pointer', display:'flex', flexDirection:'column', gap:'2px' },
          desactivado ? { opacity:'.45' } : null,
        ),
        title: desactivado ? 'Identificate primero (Configuración → Mi usuario).' : '',
        onclick: () => {
          if (desactivado) return;
          onPick(preset);
          close();
        },
      }, [
        h('div', { style:{fontSize:'13px', fontWeight:500} }, preset.label),
        h('div', { style:{fontSize:'11px', color:'var(--ink-3)'} }, preset.desc),
      ]);
      item.addEventListener('mouseenter', () => { if (!desactivado) item.style.background = 'var(--paper-2)'; });
      item.addEventListener('mouseleave', () => { item.style.background = ''; });
      body.appendChild(item);
    });
  } });
}

function selectField(label, placeholder, items, value='') {
  const wrap = h('div');
  const sel = h('select.select');
  sel.appendChild(h('option', { value: '' }, label));
  items.forEach(it => {
    if (typeof it === 'string') sel.appendChild(h('option', { value: it }, it));
    else sel.appendChild(h('option', { value: it.value }, it.label));
  });
  if (value) sel.value = value;
  wrap.appendChild(sel);
  return wrap;
}

function rowForEquipo(e) {
  const tr = h('tr', { onclick: () => openFicha(e.uuid) });
  if (e.esSlot) tr.classList.add('is-slot');
  const pill = e.esSlot
    ? h('span.pill.muted', 'Slot')
    : h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), [ h('span.dot'), ESTADO_LABEL[e.estado] || e.estado ]);
  tr.appendChild(h('td.col-mono', { title: e.id != null && e.id !== '' ? String(e.id) : '' }, e.id != null && e.id !== '' ? String(e.id) : '—'));
  tr.appendChild(h('td.truncate', { title: e.servicio }, e.servicio || '—'));
  tr.appendChild(h('td', [
    h('div', e.nombre || '—'),
    h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, e.fam || ''),
  ]));
  tr.appendChild(h('td.col-mono', e.carpeta != null && e.carpeta !== '' ? String(e.carpeta) : '—'));
  tr.appendChild(h('td.col-mono', e.inventario || '—'));
  tr.appendChild(h('td.col-mono', e.serie || '—'));
  tr.appendChild(h('td.truncate', { title:`${e.marca} ${e.modelo}` }, `${e.marca || ''} ${e.modelo ? '· ' + e.modelo : ''}`.trim() || '—'));
  tr.appendChild(h('td', e.frecuencia ? h('span.pill', e.frecuencia) : '—'));
  tr.appendChild(h('td', pill));
  // Días en estado actual: visual con color
  const d = diasEnEstadoActual(e);
  const dPill = d == null ? '—' : h(`span.pill.${d > 30 ? 'danger' : d > 7 ? 'warning' : 'success'}`, `${Math.floor(d)}d`);
  tr.appendChild(h('td', dPill));
  return tr;
}

/* ============================================================
   UI · ficha 360 (modal)
   ============================================================ */
function openFicha(uuid) {
  const e = EQ.byUuid(uuid);
  if (!e) { bus.emit('error', new Error('Equipo no encontrado.')); return; }

  const TABS = [
    { id: 'datos',     label: 'Datos',     icon: 'ti-id-badge-2' },
    { id: 'garantia',  label: 'Garantía',  icon: 'ti-shield-check' },
    { id: 'grilla',    label: 'Grilla anual', icon: 'ti-calendar-month' },
    { id: 'historial', label: 'Historial MP', icon: 'ti-history', count: (e.historial||[]).length },
    { id: 'eventos',   label: 'Eventos',   icon: 'ti-timeline', count: (e.eventos||[]).length },
    { id: 'ciclos',    label: 'Ciclos',    icon: 'ti-tools',    count: (e.correctivos||[]).length },
    { id: 'pendientes',label: 'Pendientes',icon: 'ti-checklist',count: (e.pendientesIds||[]).length },
  ];

  UI.modal({
    title: e.nombre || '(sin nombre)',
    sub: [
      e.fam, e.servicio, e.serie ? `S/N ${e.serie}` : null, e.inventario ? `Inv ${e.inventario}` : null,
    ].filter(Boolean).join(' · '),
    size: 'lg',
    content: (body) => {
      // Banners de alerta (Grupo A > 30d, sigem pendiente, causales sin vincular)
      const alertas = alertasDeEquipo(e);
      if (alertas.length) {
        alertas.forEach(a => {
          const banner = h(`div.banner.${a.kind}`, { style:{ marginBottom:'8px' } }, [
            h('i.ti', { class: 'ti ' + (a.icon || 'ti-alert-circle') }),
            h('div.grow', a.text),
            a.action ? h('button.btn.sm', { onclick: a.action.handler }, a.action.label) : null,
          ]);
          body.appendChild(banner);
        });
      }

      // Header strip with status & warranty
      const strip = h('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'10px' } });
      const pill = e.esSlot
        ? h('span.pill.muted', 'Slot disponible')
        : h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), [ h('span.dot'), ESTADO_LABEL[e.estado] || e.estado ]);
      strip.appendChild(pill);
      if (e.enGarantia) strip.appendChild(h('span.pill.purple', [ h('i.ti.ti-shield-check', {style:{fontSize:'12px'}}), 'En garantía' ]));
      if (e.frecuencia) strip.appendChild(h('span.pill', `MP ${e.frecuencia.toLowerCase()}`));
      if (e.estadoDesde) strip.appendChild(h('span.pill.muted', `Desde ${fmt.rel(e.estadoDesde)}`));
      const ciclosAb = (e.correctivos||[]).filter(c => c.abierto);
      if (ciclosAb.length) strip.appendChild(h('span.pill.warning', [h('i.ti.ti-tools',{style:{fontSize:'12px'}}), `${ciclosAb.length} ciclo${ciclosAb.length>1?'s':''} abierto${ciclosAb.length>1?'s':''}`]));
      body.appendChild(strip);

      // Tabs
      const tabs = h('div.tabs', { style:{padding:0, marginBottom:'14px'} });
      const panel = h('div');
      TABS.forEach((t,i) => {
        const tab = h('div.tab', { dataset:{ tab: t.id } }, [ t.label, t.count != null ? h('span.count', t.count) : null ]);
        if (i === 0) tab.classList.add('active');
        tab.addEventListener('click', () => {
          $$('.tab', tabs).forEach(x => x.classList.remove('active'));
          tab.classList.add('active');
          panel.innerHTML = '';
          panel.appendChild(renderFichaTab(t.id, e));
        });
        tabs.appendChild(tab);
      });
      body.appendChild(tabs);
      body.appendChild(panel);
      panel.appendChild(renderFichaTab('datos', e));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cerrar'));
      f.appendChild(h('button.btn', { onclick: () => { close(); abrirModalRegistrarMP(e); } }, [ h('i.ti.ti-calendar-plus'), 'Registrar MP' ]));
      const disabledByEstado = (e.esSlot || e.estado === 'DeBaja');
      const tip = disabledByEstado ? 'No disponible para slots o equipos de baja' : '';
      f.appendChild(h('button.btn', { disabled: disabledByEstado, title: tip, onclick: () => { close(); abrirModalSolicitudTrabajo(e); } }, [ h('i.ti.ti-file-text'), '+ Solicitud' ]));
      f.appendChild(h('button.btn', { disabled: disabledByEstado, title: tip, onclick: () => { close(); abrirModalEnvioST(e); } }, [ h('i.ti.ti-truck-delivery'), '+ Envío ST' ]));

function renderFichaTab(id, e) {
  const wrap = h('div');
  switch (id) {
    case 'datos': {
      const dl = h('dl.dl');
      [
        ['Nombre', e.nombre || '—'],
        ['Familia', e.fam || '—'],
        ['Servicio', e.servicio || '—'],
        ['Unidad', e.unidad || '—'],
        ['Ubicación', e.ubicacion || '—'],
        ['Procedencia', e.procedencia || '—'],
        ['Marca', e.marca || '—'],
        ['Modelo', e.modelo || '—'],
        ['Serie', e.serie || '—'],
        ['Inventario', e.inventario || '—'],
        ['Carpeta', e.carpeta ?? '—'],
        ['Año instalación', e.anio || '—'],
        ['Vida útil residual', e.vidaUtil || '—'],
        ['Clasificación', e.clasificacion || '—'],
        ['Frecuencia MP', e.frecuencia || '—'],
        ['Responsable del período', responsableDelPeriodo(e) || '—'],
        ['Responsable (maestro, referencial)', e.responsableMaster || '—'],
        ['ENU / baja', e.enu || '—'],
        ['Estado actual', ESTADO_LABEL[e.estado] || e.estado || '—'],
        ['Estado desde', e.estadoDesde ? `${fmt.date(e.estadoDesde)} (${fmt.rel(e.estadoDesde)})` : '—'],
        ['Observación', e.observacion || '—'],
      ].forEach(([k,v]) => { dl.appendChild(h('dt', k)); dl.appendChild(h('dd', v)); });
      wrap.appendChild(dl);
      break;
    }
    case 'garantia': {
      if (!e.enGarantia) {
        wrap.appendChild(h('div.empty', [
          h('i.ti.ti-shield-off'),
          h('h4', 'Sin garantía activa'),
          h('p', 'Podrás declarar garantía y proveedor desde la edición del equipo (It.3).'),
        ]));
      } else {
        const dl = h('dl.dl', [
          h('dt', 'Estado'), h('dd', h('span.pill.purple','En garantía')),
          h('dt', 'Proveedor'), h('dd', e.garantiaProveedor || '—'),
          h('dt', 'Vigente hasta'), h('dd', e.garantiaHasta ? fmt.date(e.garantiaHasta) : '—'),
        ]);
        wrap.appendChild(dl);
      }
      break;
    }
    case 'grilla': {
      const grilla = h('div.grilla');
      for (let m = 1; m <= 12; m++) {
        const v = e.grilla?.[m] || null;
        const ejecutada = (e.historial||[]).some(h => h.mes === m && h.resultado === 'SI');
        const cell = h(`div.cell ${v?'v-'+v:''}`.trim(), {
          style:{ cursor:'pointer' },
          title: 'Click para editar marcador o registrar MP',
          onclick: () => abrirModalGrillaCelda(e, m),
        }, [
          h('span.m', MESES[m-1]),
          h('span.v', ejecutada ? '✓' : (v || '')),
        ]);
        grilla.appendChild(cell);
      }
      wrap.appendChild(grilla);
      wrap.appendChild(h('p', { style:{ color:'var(--ink-3)', fontSize:'11.5px', marginTop:'10px' } }, 'X = programada · R = reprogramada · RA = legado · PM = puesta en marcha · ✓ = MP ejecutada.'));
      break;
    }
    case 'historial': {
      const hs = (e.historial || []).slice().sort((a,b) => new Date(b.fecha||0) - new Date(a.fecha||0));
      if (!hs.length) { wrap.appendChild(emptyTabHint('Sin registros de MP todavía.')); break; }
      const tbl = h('table.dt');
      tbl.innerHTML = `<thead><tr><th>Fecha</th><th>Mes</th><th>Resultado</th><th>Estado final</th><th>Ejecutor</th><th>Observación</th></tr></thead>`;
      const tb = h('tbody');
      hs.forEach(row => {
        const tr = h('tr', { style:{cursor: row.id ? 'pointer' : 'default'}, onclick: () => { if (row.id) abrirModalRegistrarMP(e, { edit: row }); } }, [
          h('td.col-mono', fmt.date(row.fechaEvento || row.fecha)),
          h('td', MESES[(row.mes||1)-1]),
          h('td', resultadoPill(row.resultado)),
          h('td', row.estadoFinal ? ESTADO_LABEL[row.estadoFinal] || row.estadoFinal : '—'),
          h('td', row.ejecutor || '—'),
          /* AJUSTE R9 A.1: observación con wrap explícito (max-width:280px) para que
             diagnósticos largos no fuercen scroll horizontal del historial. */
          h('td.wrap-2', { title: row.obs||'' }, row.obs || ''),
        ]);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      wrap.appendChild(h('div.table-wrap', [ tbl ]));
      break;
    }
    case 'eventos': {
      const evs = (e.eventos || []).slice().sort((a,b) => new Date(b.ts||0) - new Date(a.ts||0));
      if (!evs.length) { wrap.appendChild(emptyTabHint('Aún no hay eventos en el timeline.')); break; }
      const tl = h('div.timeline');
      evs.forEach(ev => {
        const meta = describeEvento(ev);
        tl.appendChild(h('div.tl-item', [
          h('div.tl-date', [ fmt.date(ev.ts), h('div',{style:{color:'var(--ink-4)',fontSize:'10.5px'}}, fmt.rel(ev.ts)) ]),
          h('div.tl-body', [
            h('div.title', { style:{display:'flex', alignItems:'center', gap:'6px'} }, [
              h('i.ti', { class:'ti ' + meta.icon, style:{ color: 'var(--' + meta.color + ')', fontSize:'14px' } }),
              meta.title,
            ]),
            meta.desc ? h('div.desc', meta.desc) : null,
          ]),
        ]));
      });
      wrap.appendChild(tl);
      break;
    }
    case 'ciclos': {
      const cs = (e.correctivos || []).slice().reverse();
      if (!cs.length) { wrap.appendChild(emptyTabHint('No hay ciclos correctivos para este equipo. Usá los botones del footer para crear una solicitud, envío, recepción o reparación.')); break; }
      cs.forEach(c => {
        const card = h('div.card', { style:{ marginBottom: '12px' } });
        card.appendChild(renderCicloEventos(e, c));
        wrap.appendChild(card);
      });
      break;
    }
    case 'pendientes': {
      // Resolver pendientes del equipo: tanto por pendientesIds como por equipoUuid directo (defensivo).
      const idsSet = new Set(e.pendientesIds || []);
      const ps = STATE.pendientes.filter(p => idsSet.has(p.id) || p.equipoUuid === e.uuid);
      if (!ps.length) { wrap.appendChild(emptyTabHint('Sin pendientes administrativos vinculados.')); break; }
      // Ordenar: abiertos primero por vencimiento ascendente, luego cerrados
      ps.sort((a,b) => {
        const ca = a.estado === 'Cerrado' ? 1 : 0;
        const cb = b.estado === 'Cerrado' ? 1 : 0;
        if (ca !== cb) return ca - cb;
        return new Date(a.vence || '9999') - new Date(b.vence || '9999');
      });
      ps.forEach(p => {
        const subN = (p.subtareas || []).length;
        const subDone = (p.subtareas || []).filter(s => s.completada).length;
        const vencidoDias = (p.vence && p.estado !== 'Cerrado') ? fmt.daysSince(p.vence) : null;
        const card = h('div.card', {
          style:{ marginBottom:'8px', cursor:'pointer' },
          title:'Abrir en Pendientes',
          onclick: () => {
            UI_PEND.focusId = p.id;
            UI_PEND.filtros = { estado:'', asignado:'', desde:'', hasta:'' };   // limpiar filtros para asegurar que aparezca
            // Cerrar el modal de ficha si está abierto.
            const modals = document.querySelectorAll('#modals .backdrop');
            modals.forEach(m => { try { m.querySelector('.modal .close')?.click(); } catch {} });
            Router.go('tareas');
          },
        }, [
          h('div.card-h', [
            h('h3', p.descripcion || '(sin descripción)'),
            p.tipo ? h('span.pill', p.tipo) : null,
            h(`span.pill.${ESTADO_PENDIENTE_PILL[p.estado] || 'muted'}`, ESTADO_PENDIENTE_LABEL[p.estado] || p.estado),
            vencidoDias > 0 ? h('span.pill.danger', `vencido hace ${vencidoDias}d`) : null,
            subN ? h(`span.pill.${subDone===subN ? 'success' : subDone > 0 ? 'info' : 'muted'}`, `${subDone}/${subN} subtareas`) : null,
          ]),
          h('div', { style:{ fontSize:'12.5px', color:'var(--ink-2)' } }, [
            p.asignado ? `Asignado a ${p.asignado}. ` : '',
            p.vence ? `Vence ${fmt.date(p.vence)}. ` : '',
            p.creado ? `Creado ${fmt.rel(p.creado)}.` : '',
          ]),
        ]);
        wrap.appendChild(card);
      });
      break;
    }
  }
  return wrap;
}

function renderCumplimientoSidecar() {
  const now = new Date();
  const mes = now.getMonth()+1;
  const programadas = STATE.equipos.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R');
  const ejecutadas  = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI'));
  const causalizadas = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && CAUSALES[h.resultado]));
  const pendientes   = programadas.length - ejecutadas.length - causalizadas.length;
  const pct = programadas.length ? Math.round(ejecutadas.length / programadas.length * 100) : 0;

  return h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'10px', marginTop:'14px' } }, [
    kpiCard({ label: `${MESES[mes-1]} · programadas`, value: fmt.number(programadas.length) }),
    kpiCard({ label: 'Ejecutadas (SI)', value: `${fmt.number(ejecutadas.length)} (${pct}%)`, kind: pct >= 80 ? 'success' : pct >= 50 ? 'warning' : 'danger' }),
    kpiCard({ label: 'Causalizadas', value: fmt.number(causalizadas.length), kind: 'warning' }),
    kpiCard({ label: 'Pendientes', value: fmt.number(Math.max(pendientes,0)), kind: pendientes > 0 ? 'danger' : 'success' }),
  ]);
}

function filterEquiposForPMP(f) {
  const list = STATE.equipos.filter(e => !e.esSlot && e.estado !== 'DeBaja');
  const n = normalize(f.q);
  return list.filter(e => {
    if (f.servicio && e.servicio !== f.servicio) return false;
    if (f.familia  && e.fam !== f.familia) return false;
    if (f.frecuencia && e.frecuencia !== f.frecuencia) return false;
    if (!n) return true;
    return normalize(`${e.nombre} ${e.serie} ${e.inventario} ${e.marca} ${e.modelo}`).includes(n);
  });
}

function renderMes(container, meta, f) {
  const m = f.mes;
  const equipos = filterEquiposForPMP(f);
  const filas = equipos
    .map(e => {
      const programado = e.grilla?.[m] || null;
      const hist = (e.historial || []).filter(h => h.mes === m).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
      const ultimo = hist[0] || null;
      return { e, programado, ultimo };
    })
    .filter(r => r.programado || r.ultimo);

  filas.sort((a,b) => {
    const orden = (r) => {
      if (r.ultimo?.resultado === 'SI') return 4;
      if (r.ultimo && CAUSALES[r.ultimo.resultado]) return 2;
      if (r.programado) return 1;
      return 5;
    };
    return orden(a) - orden(b) || (a.e.servicio||'').localeCompare(b.e.servicio||'','es');
  });

  meta.textContent = `${MESES[m-1]} · ${filas.length} equipos con actividad`;

  if (!filas.length) {
    container.appendChild(h('div.empty', { style:{padding:'40px 12px'} }, [
      h('i.ti.ti-calendar-off'), h('h4','Sin actividad programada para este mes'),
    ]));
    return;
  }

  const tbl = h('table.dt');
  tbl.innerHTML = `<thead><tr>
    <th>Servicio</th><th>Equipo</th><th>Frec.</th><th>Programado</th><th>Resultado</th><th>Fecha</th><th>Ejecutor</th><th></th>
  </tr></thead>`;
  const tb = h('tbody');
  filas.forEach(({ e, programado, ultimo }) => {
    const tr = h('tr');
    tr.appendChild(h('td.truncate', { title: e.servicio }, e.servicio || '—'));
    tr.appendChild(h('td', [
      h('div', e.nombre),
      h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, `${e.serie || ''} · ${e.inventario || ''}`),
    ]));
    tr.appendChild(h('td', e.frecuencia ? h('span.pill', e.frecuencia) : '—'));
    tr.appendChild(h('td', programado ? h(`span.pill.${programado==='X'?'info':programado==='R'?'warning':programado==='PM'?'purple':'muted'}`, programado) : '—'));
    tr.appendChild(h('td', ultimo ? resultadoPill(ultimo.resultado) : '—'));
    tr.appendChild(h('td.col-mono', ultimo ? fmt.date(ultimo.fechaEvento || ultimo.fecha) : '—'));
    tr.appendChild(h('td', ultimo ? ultimo.ejecutor || '—' : '—'));
    const acciones = h('td', [
      h('button.btn.sm', { onclick: (ev) => { ev.stopPropagation(); abrirModalRegistrarMP(e, { mes: m }); } }, [ h('i.ti.ti-edit'), 'Registrar' ]),
    ]);
    tr.appendChild(acciones);
    tr.addEventListener('click', () => openFicha(e.uuid));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  container.appendChild(tbl);
}

VIEWS.ciclos = {
  title: 'Ciclos correctivos',
  render(root, params={}) {
    root.appendChild(viewHeader({
      title: 'Ciclos correctivos',
      desc: 'Vista global de ciclos abiertos y cerrados (últimos 60 días).',
    }));

    // Reunir ciclos
    const ahora = Date.now();
    const limite60 = ahora - 60 * 86400000;
    const todos = [];
    STATE.equipos.forEach(e => (e.correctivos || []).forEach(c => {
      const cerrado = c.cerrado ? new Date(c.cerrado).getTime() : null;
      if (c.abierto || (cerrado != null && cerrado >= limite60)) {
        todos.push({ equipo: e, ciclo: c });
      }
    }));

    if (!todos.length) {
      root.appendChild(emptyState({
        icon:'ti-tools', title:'Sin ciclos activos',
        desc:'Los ciclos se crean desde la ficha del equipo con los botones + Solicitud / + Envío / + Recepción / + Reparación.',
      }));
      return;
    }

    // Filtros
    const empresas = Array.from(new Set(STATE.equipos.flatMap(e => (e.correctivos||[]).flatMap(c => (c.envios||[]).map(en => en.empresaST))).filter(Boolean))).sort();
    const responsables = Array.from(new Set(todos.flatMap(({ciclo}) => [
      ciclo.solicitud?.responsable,
      ...(ciclo.envios||[]).map(e => e.responsable),
      ...(ciclo.recepciones||[]).map(r => r.responsable),
      ciclo.reparacion?.responsable,
    ]).filter(Boolean))).sort();

    let filtros = Object.assign({ estado:'', empresa:'', responsable:'' }, params.filtros || {});
    const filtBar = h('div', { style:{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap', marginBottom:'12px'} }, [
      h('span', { style:{fontSize:'12px', color:'var(--ink-3)'} }, 'Filtrar:'),
      selectCtl([{ value:'', label:'Todos los estados' },
        { value:'abiertos', label:'Solo abiertos' },
        { value:'cerrados', label:'Solo cerrados' },
      ], filtros.estado, { onchange:(e)=> { filtros.estado = e.target.value; render(); } }),

    ]);
    root.appendChild(filtBar);

    const wrap = h('div.table-wrap');

    function render() {
      wrap.innerHTML = '';

      if (filtros.empresa) lista = lista.filter(x => (x.ciclo.envios||[]).some(en => en.empresaST === filtros.empresa));
      if (filtros.responsable) lista = lista.filter(x => {
        const all = [x.ciclo.solicitud?.responsable, ...(x.ciclo.envios||[]).map(e => e.responsable), ...(x.ciclo.recepciones||[]).map(r => r.responsable), x.ciclo.reparacion?.responsable].filter(Boolean);
        return all.includes(filtros.responsable);
      });

      const tbl = h('table.dt');
      tbl.innerHTML = `<thead><tr>
        <th>Equipo</th><th>Estado</th><th>Solicitud</th><th>Último envío</th><th>Recepción</th><th>Reparación</th><th>Pendientes</th>
      </tr></thead>`;
      const tb = h('tbody');
      lista.sort((a,b) => {
        const fA = primerEventoCiclo(a.ciclo);
        const fB = primerEventoCiclo(b.ciclo);
        return new Date(fB) - new Date(fA);
      });
      lista.forEach(({ equipo, ciclo }) => {
        const ultEnv = (ciclo.envios||[]).slice(-1)[0];
        const ultRec = (ciclo.recepciones||[]).slice(-1)[0];
        const diasEnST = ultEnv ? Math.floor((Date.now() - new Date(ultEnv.fechaEvento).getTime()) / 86400000) : null;
        const diasRecep = ultRec ? Math.floor((Date.now() - new Date(ultRec.fechaEvento).getTime()) / 86400000) : null;
        const fSol = ciclo.solicitud?.fechaEvento;
        const pendsAbiertos = STATE.pendientes.filter(p => p.meta?.cicloUuid === ciclo.uuid && p.estado !== 'Cerrado').length;
        const primer = primerEventoCiclo(ciclo);
        const diasCiclo = primer ? Math.floor((Date.now() - new Date(primer).getTime()) / 86400000) : null;
        tb.appendChild(h('tr', { onclick: () => openFicha(equipo.uuid) }, [
          h('td', [
            h('div', equipo.nombre || '—'),
            h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, `${equipo.inventario || ''} · ${ESTADO_LABEL[equipo.estado] || equipo.estado}`),
          ]),
          h('td', ciclo.abierto
            ? h(`span.pill.${diasCiclo > 30 ? 'danger' : diasCiclo > 14 ? 'warning' : 'info'}`, `abierto · ${diasCiclo}d`)
            : (ciclo.cancelado ? h('span.pill.danger','cancelado') : h('span.pill.success', 'cerrado'))),
          h('td', fSol
            ? h('div', [ h('div', { style:{fontSize:'12px'} }, ciclo.solicitud.folioSigem || '(sin folio)'), h('div', { style:{fontSize:'11px', color:'var(--ink-3)'} }, fmt.date(fSol)) ])
            : '—'),
          h('td', ultEnv
            ? h('div', [ h('div', { style:{fontSize:'12px'} }, ultEnv.empresaST), h('div', { style:{fontSize:'11px', color:'var(--ink-3)'} }, `${fmt.date(ultEnv.fechaEvento)} · ${diasEnST}d`) ])
            : '—'),
          h('td', ultRec
            ? h('div', [ h('div', { style:{fontSize:'12px'} }, fmt.date(ultRec.fechaEvento)), h('div', { style:{fontSize:'11px', color:'var(--ink-3)'} }, `${diasRecep}d`) ])
            : '—'),
          h('td', ciclo.reparacion
            ? h('span.pill.success', fmt.date(ciclo.reparacion.fechaEvento))
            : (ciclo.abierto ? h('span.pill.warning', `abierto hace ${diasCiclo}d`) : '—')),
          h('td', pendsAbiertos ? h('span.pill.info', String(pendsAbiertos)) : '—'),
        ]));
      });
      tbl.appendChild(tb);
      wrap.appendChild(h('div.table-meta', `${lista.length} ciclos`));
      wrap.appendChild(tbl);
    }
    render();
  },
};

function primerEventoCiclo(c) {
  const stamps = [
    c.solicitud?.fechaEvento,
    ...(c.envios||[]).map(x => x.fechaEvento),
    ...(c.recepciones||[]).map(x => x.fechaEvento),
    c.reparacion?.fechaEvento,
  ].filter(Boolean);
  if (!stamps.length) return null;
  return stamps.sort()[0];
}

function renderCardTecnico(responsable, equipos, mes, periodo, expandedDefault=false) {
  const programadas = equipos.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R');
  const ejecutadas  = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI'));
  const causalizadas = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && CAUSALES[h.resultado]));
  const pendientes  = programadas.length - ejecutadas.length - causalizadas.length;
  const pct = programadas.length ? Math.round(ejecutadas.length / programadas.length * 100) : null;

  const card = h('div.card');
  const head = h('div', { style:{display:'flex', alignItems:'center', gap:'10px', cursor:'pointer'} });
  let expanded = expandedDefault;
  const chev = h('i.ti', { class:'ti ti-chevron-' + (expanded?'down':'right'), style:{color:'var(--ink-3)'} });
  head.appendChild(chev);
  head.appendChild(h('div', { style:{flex:1} }, [
    h('div', { style:{fontWeight:500, fontSize:'14px'} }, responsable),
    h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px', marginTop:'2px'} }, [
      `${equipos.length} equipos`,
      programadas.length ? ` · ${programadas.length} programados ${MESES[mes-1]}` : '',
      pct != null ? ` · cumplimiento ${pct}%` : '',
    ].join('')),
  ]));
  // KPI pills
  const pills = h('div', { style:{display:'flex', gap:'4px', flexWrap:'wrap'} });
  if (programadas.length) pills.appendChild(h('span.pill', `${programadas.length} programadas`));
  if (ejecutadas.length)  pills.appendChild(h('span.pill.success', `${ejecutadas.length} ejecutadas`));
  if (causalizadas.length) pills.appendChild(h('span.pill.warning', `${causalizadas.length} causalizadas`));
  if (pendientes > 0)     pills.appendChild(h('span.pill.danger', `${pendientes} pendientes`));
  head.appendChild(pills);
  card.appendChild(head);

  const list = h('div', { style:{display: expanded?'block':'none', marginTop:'12px', borderTop:'.5px solid var(--line)', paddingTop:'12px'} });
  card.appendChild(list);

  function renderEquipos() {
    list.innerHTML = '';
    const tbl = h('table.dt');
    tbl.innerHTML = `<thead><tr>
      <th>Equipo</th><th>Servicio</th><th>Grilla ${MESES[mes-1]}</th><th>Estado MP ${MESES[mes-1]}</th><th>Estado equipo</th><th></th>
    </tr></thead>`;
    const tb = h('tbody');
    equipos.slice().sort((a,b) => {
      // Pendientes primero
      const score = (e) => {
        const prog = e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R';
        const ejec = (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI');
        const causal = (e.historial||[]).some(h => h.mes === mes && CAUSALES[h.resultado]);
        if (prog && !ejec && !causal) return 0; // pendientes
        if (prog && causal) return 1;
        if (prog && ejec) return 2;
        return 3;
      };
      return score(a) - score(b);
    }).forEach(e => {
      const prog = e.grilla?.[mes];
      const lastMP = (e.historial||[]).filter(h => h.mes === mes).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0))[0];
      const tr = h('tr', { onclick: () => openFicha(e.uuid) }, [
        h('td', [ h('div', e.nombre), h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, `${e.serie||''} · ${e.inventario||''}`) ]),
        h('td.truncate', e.servicio || '—'),
        h('td', prog ? h(`span.pill.${prog==='X'?'info':prog==='R'?'warning':'muted'}`, prog) : '—'),
        h('td', lastMP ? resultadoPill(lastMP.resultado) : (prog ? h('span.pill.danger','pendiente') : '—')),
        h('td', h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), ESTADO_LABEL[e.estado] || e.estado)),
        h('td', h('button.btn.sm', { onclick: (ev)=> { ev.stopPropagation(); abrirModalRegistrarMP(e, { mes }); } }, [ h('i.ti.ti-edit'), 'MP' ])),
      ]);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    list.appendChild(tbl);
  }
  if (expanded) renderEquipos();

  head.addEventListener('click', () => {
    expanded = !expanded;
    list.style.display = expanded ? 'block' : 'none';
    chev.className = 'ti ti-chevron-' + (expanded ? 'down' : 'right');
    if (expanded && list.children.length === 0) renderEquipos();
  });

  return card;
}

function mostrarSinMatch(meta) {

      tbl.innerHTML = `<thead><tr><th>Serie</th><th>Inventario</th><th>Responsable</th></tr></thead>`;

async function handleImportAsignacion(periodoSugerido) {
  try {
    const file = await pickFile('.xlsx');
    if (!file) return;
    // If filename has month, use it; else ask
    const detected = detectarPeriodoArchivo(file.name);
    let mes, anio;
    if (detected) {
      [anio, mes] = detected.split('-').map(Number);
    } else {
      const askResult = await askPeriodoModal(periodoSugerido);
      if (!askResult) return;
      mes = askResult.mes; anio = askResult.anio;
    }
    UI.toast(`Procesando ${file.name}…`, 'info', { duration: 2500 });
    const result = await importAsignacionMensual(file, { mes, anio });
    UI.toast(`Período ${periodoLabel(result.periodo)}: ${result.matcheados}/${result.total} matcheados${result.sinMatch?.length ? ' · '+result.sinMatch.length+' sin match' : ''}.`, 'success', { duration: 6500 });
    Router.go('entregas', { periodo: result.periodo });
  } catch (e) { bus.emit('error', e); }
}

function askPeriodoModal(periodoSugerido) {
  return new Promise((resolve) => {
    const [yDef, mDef] = (periodoSugerido || periodoActual()).split('-');
    let mes = Number(mDef), anio = Number(yDef);
    UI.modal({
      title: 'Confirmar período',
      sub: 'No detecté mes/año en el nombre del archivo.',
      size: 'sm',
      content: (body) => {
        body.appendChild(row('1fr 1fr', [
          field('Mes', selectCtl(MESES.map((n,i)=>({value:String(i+1),label:n})), String(mes), { onchange:(e)=> mes = Number(e.target.value) })),
          field('Año', inputCtl({ type:'number', min:2020, max:2100, value: anio, oninput:(e)=> anio = Number(e.target.value)||anio })),
        ]));
      },
      footer: (f, { close }) => {
        f.appendChild(h('button.btn.ghost', { onclick: () => { close(); resolve(null); } }, 'Cancelar'));
        f.appendChild(h('button.btn.primary', { onclick: () => { close(); resolve({ mes, anio }); } }, 'Confirmar'));
      },
    });
  });
}

function invColumnasVisibles() {
  if (!UI_INV.columnas) {
    try {
      const raw = localStorage.getItem('pmp.v3.ui.inventario.columnas');
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) UI_INV.columnas = arr;
      }
    } catch {}
    if (!UI_INV.columnas) UI_INV.columnas = INV_COLUMNAS_DEFAULT.slice();
  }
  const validas = new Set(INV_COLUMNAS.map(c => c.key));
  return UI_INV.columnas.filter(k => validas.has(k));
}
function invSetColumnasVisibles(keys) {
  UI_INV.columnas = keys.slice();
  try { localStorage.setItem('pmp.v3.ui.inventario.columnas', JSON.stringify(UI_INV.columnas)); } catch {}
}
function invResetColumnas() {
  UI_INV.columnas = INV_COLUMNAS_DEFAULT.slice();
  try { localStorage.setItem('pmp.v3.ui.inventario.columnas', JSON.stringify(UI_INV.columnas)); } catch {}
}

/** Render del valor de una celda según su tipo. Devuelve un Node o string. */
function invCellRender(col, e) {
  const v = col.valor(e);
  switch (col.tipo) {
    case 'pill': {
      if (e.esSlot) return h('span.pill.muted', 'Slot');
      return h(`span.pill.${ESTADO_PILL[v]||''}`.trim(), [ h('span.dot'), ESTADO_LABEL[v] || v ]);
    }
    case 'numero': {
      if (col.key === 'diasEnEstado') {
        const d = diasEnEstadoActual(e);
        if (d == null) return '—';
        return h(`span.pill.${d > 30 ? 'danger' : d > 7 ? 'warning' : 'success'}`, `${Math.floor(d)}d`);
      }
      if (col.key === 'pendientes') {
        const n = v;
        return n ? h('span.pill.info', String(n)) : '—';
      }
      return v == null || v === '' ? '—' : String(v);
    }
    case 'fecha': {
      if (!v) return '—';
      return h('span.col-mono', fmt.date(v));
    }
    case 'bool': {
      return v ? h('span.pill.purple', 'Sí') : '—';
    }
    default:
      return v || '—';
  }
}

/** Valor textual para exportar a Excel (formateo más conservador). */
function invCellExport(col, e) {
  const v = col.valor(e);
  switch (col.tipo) {
    case 'pill':  return ESTADO_LABEL[v] || v || '';
    case 'fecha': return v ? fmt.date(v) : '';
    case 'bool':  return v ? 'Sí' : '';
    case 'numero':
      if (col.key === 'diasEnEstado') { const d = diasEnEstadoActual(e); return d == null ? '' : Math.floor(d); }
      if (v == null || v === '') return '';
      return Number(v) === v ? v : String(v);
    default:      return v == null ? '' : String(v);
  }
}

/**
 * Exporta a Excel los equipos actualmente filtrados en Inventario.
 * Hojas: Equipos (filas filtradas) · Resumen (conteos) · Filtros aplicados.
 */
async function exportarInventarioFiltrado() {
  try {
    await ensureXLSX();
    const lista = INV_LAST_FILTERED || STATE.equipos.slice();
    if (lista.length > 500) {
      const ok = await UI.dialog({ title:'Exportar Inventario', message:`Vas a exportar ${lista.length} equipos. ¿Continuamos?`, confirmText:'Exportar' });
      if (!ok) return;
    }
    // R7: usar columnas visibles del catálogo, en orden.
    const colsKeys = invColumnasVisibles();
    const cols = colsKeys.map(k => INV_COLUMNAS.find(c => c.key === k)).filter(Boolean);
    const headers = cols.map(c => c.label);
    const data = [headers];
    lista.forEach(e => {
      data.push(cols.map(c => invCellExport(c, e)));
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = headers.map(h => ({ wch: Math.max(12, h.length + 6) }));
    XLSX.utils.book_append_sheet(wb, ws, 'Equipos');

    // Hoja Resumen
    const byEst = {};
    const byServ = {};
    const byFam = {};
    lista.forEach(e => {
      byEst[e.estado] = (byEst[e.estado]||0) + 1;
      byServ[e.servicio || '(sin servicio)'] = (byServ[e.servicio || '(sin servicio)']||0) + 1;
      byFam[e.fam || '(sin familia)'] = (byFam[e.fam || '(sin familia)']||0) + 1;
    });
    const resumen = [['Métrica','Valor'], ['Total exportado', lista.length]];
    resumen.push(['','']);
    resumen.push(['Por estado','']);
    Object.entries(byEst).sort((a,b) => b[1]-a[1]).forEach(([k,v]) => resumen.push([ESTADO_LABEL[k]||k, v]));
    resumen.push(['','']);
    resumen.push(['Por servicio (top 20)','']);
    Object.entries(byServ).sort((a,b) => b[1]-a[1]).slice(0,20).forEach(([k,v]) => resumen.push([k, v]));
    resumen.push(['','']);
    resumen.push(['Por familia (top 20)','']);
    Object.entries(byFam).sort((a,b) => b[1]-a[1]).slice(0,20).forEach(([k,v]) => resumen.push([k, v]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), 'Resumen');

    // Hoja Filtros aplicados
    const f = INV_LAST_FILTROS || {};
    const filtros = [['Filtro','Valor']];
    Object.entries(f).forEach(([k,v]) => {
      if (v) filtros.push([k, String(v)]);
    });
    filtros.push(['exportadoEn', new Date().toISOString()]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filtros), 'Filtros aplicados');

    const filtroPrincipal = f.estado || f.servicio || f.familia || 'todos';
    const fecha = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `Inventario_${filtroPrincipal}_${fecha}.xlsx`);
    UI.toast(`Exportados ${lista.length} equipos.`, 'success');
  } catch (e) { bus.emit('error', e); }
}

  UI.modal({

      }
      const wrap = h('div.table-wrap');
      const tbl = h('table.dt');
      tbl.innerHTML = `<thead><tr><th>Inventario</th><th>Equipo</th><th>Servicio</th><th>Familia</th><th>Estado</th></tr></thead>`;

          h('td.col-mono', e.inventario || '—'),
          h('td', e.nombre || '—'),
          h('td.truncate', e.servicio || '—'),
          h('td.truncate', e.fam || '—'),
          h('td', h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), ESTADO_LABEL[e.estado] || e.estado)),
        ]));
      });
      tbl.appendChild(tb);
      wrap.appendChild(tbl);
      body.appendChild(wrap);
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cerrar'));
      if (opciones.exportar && equipos.length) {
        f.appendChild(h('button.btn', { onclick: async () => {
          try {
            await ensureXLSX();
            const headers = ['Inventario','Equipo','Servicio','Familia','Marca','Modelo','Serie','Estado'];
            const data = [headers];
            equipos.forEach(e => data.push([
              e.inventario||'', e.nombre||'', e.servicio||'', e.fam||'',
              e.marca||'', e.modelo||'', e.serie||'', ESTADO_LABEL[e.estado] || e.estado || '',
            ]));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Equipos');

          } catch (e) { bus.emit('error', e); }
        } }, [ h('i.ti.ti-file-export'), 'Exportar a Excel' ]));
      }

  });

/**
 * R7 — Vista calendario de Pendientes.
 * Renderiza un grid mensual con los pendientes que vencen cada día.
 * Hasta 3 por celda + "+ N más" para ver el resto.
 * Click en pendiente: abre la card expandida en un modal.
 * Aplica filtros de estado y responsable (no de rango de fechas).
 */
function renderCalendarioPendientes(refresh) {
  const wrap = h('div', { style:{} });

  // Mes visible
  const now = new Date();
  if (!UI_PEND.calendarioMes) UI_PEND.calendarioMes = { year: now.getFullYear(), month0: now.getMonth() };
  const { year, month0 } = UI_PEND.calendarioMes;
  const fechaMes = new Date(year, month0, 1);
  const labelMes = fechaMes.toLocaleDateString('es-CL', { month:'long', year:'numeric' });

  // Header del calendario
  const header = h('div', { style:{display:'flex', alignItems:'center', gap:'8px', marginBottom:'10px'} }, [
    h('button.btn.icon.ghost', { onclick: () => { const m = new Date(year, month0 - 1, 1); UI_PEND.calendarioMes = { year:m.getFullYear(), month0:m.getMonth() }; refresh(); } }, [ h('i.ti.ti-chevron-left') ]),
    h('div', { style:{flex:1, textAlign:'center', fontSize:'15px', fontWeight:500, textTransform:'capitalize'} }, labelMes),
    h('button.btn.icon.ghost', { onclick: () => { const m = new Date(year, month0 + 1, 1); UI_PEND.calendarioMes = { year:m.getFullYear(), month0:m.getMonth() }; refresh(); } }, [ h('i.ti.ti-chevron-right') ]),
    h('button.btn.sm.ghost', { onclick: () => { UI_PEND.calendarioMes = { year: now.getFullYear(), month0: now.getMonth() }; refresh(); } }, [ h('i.ti.ti-calendar-time'), 'Hoy' ]),
  ]);
  wrap.appendChild(header);

  // Filtrar pendientes (sin rango fechas, sí estado y asignado)
  const f = UI_PEND.filtros;
  const todosPend = STATE.pendientes.filter(p => {
    if (f.estado && p.estado !== f.estado) return false;
    if (f.asignado) {
      if (f.asignado === '__SIN_ASIGNAR__') { if (p.asignado) return false; }
      else if (p.asignado !== f.asignado) return false;
    }
    return true;
  });
  const conVence = todosPend.filter(p => !!p.vence);
  const sinVence = todosPend.length - conVence.length;

  // Indexar por día del mes visible
  const porDia = new Map();
  conVence.forEach(p => {
    const d = new Date(p.vence);
    if (isNaN(d)) return;
    const key = d.toISOString().slice(0,10);
    if (!porDia.has(key)) porDia.set(key, []);
    porDia.get(key).push(p);
  });
  // Ordenar pendientes de cada día por estado (abiertos primero, cerrado al final)
  function ordenEstado(p) {
    if (p.estado === 'Cerrado') return 3;
    if (p.estado === 'Esperando') return 2;
    if (p.estado === 'EnCurso') return 1;
    return 0;
  }
  porDia.forEach(arr => arr.sort((a,b) => ordenEstado(a) - ordenEstado(b)));

  // Helpers de color
  function pillKind(p, esVencido, esPorVencer) {
    if (p.estado === 'Cerrado') return 'success';
    if (esVencido) return 'danger';
    if (esPorVencer) return 'warning';
    return 'info';
  }

  // Construir grid: filas 7 cols (Lun..Dom). En es-CL semana empieza lunes.
  // Día de la semana del primer día del mes (0=domingo en JS).
  const primerDia = fechaMes.getDay(); // 0..6
  // En grid Lun..Dom: domingo=6, lunes=0
  const offset = (primerDia + 6) % 7;
  const ultimoDia = new Date(year, month0 + 1, 0).getDate();
  const hoyISO = new Date().toISOString().slice(0,10);

  const grid = h('div', { style:{
    display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:'2px',
    background:'var(--line)', border:'.5px solid var(--line-2)', borderRadius:'8px', overflow:'hidden',
  } });
  ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => {
    grid.appendChild(h('div', { style:{padding:'6px 8px', fontSize:'11px', textTransform:'uppercase', letterSpacing:'.04em', color:'var(--ink-3)', fontWeight:500, background:'var(--paper-2)'} }, d));
  });

  // Celdas previas (mes anterior)
  for (let i = 0; i < offset; i++) {
    const fechaPrev = new Date(year, month0, -offset + i + 1);
    grid.appendChild(renderCelda(fechaPrev, true));
  }
  for (let d = 1; d <= ultimoDia; d++) {
    grid.appendChild(renderCelda(new Date(year, month0, d), false));
  }
  // Rellenar fila final hasta múltiplo de 7
  const totalCeldas = offset + ultimoDia;
  const rellenar = (7 - (totalCeldas % 7)) % 7;
  for (let i = 1; i <= rellenar; i++) {
    grid.appendChild(renderCelda(new Date(year, month0 + 1, i), true));
  }

  wrap.appendChild(grid);

  // Footer para sin vence
  if (sinVence) {
    const foot = h('div', {
      style:{marginTop:'10px', padding:'8px 12px', background:'var(--paper-2)', borderRadius:'6px', fontSize:'12px', color:'var(--ink-2)', cursor:'pointer', display:'flex', alignItems:'center', gap:'6px'},
      onclick: () => { UI_PEND.modo = 'lista'; Router.go('tareas'); },
    }, [
      h('i.ti.ti-alert-triangle', { style:{color:'var(--warning)'} }),
      `${sinVence} pendiente${sinVence>1?'s':''} sin fecha de compromiso — solo visibles en modo Lista`,
    ]);
    wrap.appendChild(foot);
  }

  function renderCelda(fechaCelda, esFueraDeMes) {
    const iso = fechaCelda.toISOString().slice(0,10);
    const esHoy = iso === hoyISO;
    const arr = porDia.get(iso) || [];
    const celda = h('div', { style:{
      background:'var(--paper)', minHeight:'92px', padding:'4px 6px', display:'flex', flexDirection:'column', gap:'2px',
      opacity: esFueraDeMes ? '0.4' : '1', cursor: arr.length ? 'pointer' : 'default',
    } });
    const numero = h('div', { style:{display:'flex', alignItems:'center', gap:'4px'} }, [
      h('span', {
        style: Object.assign({fontSize:'11.5px', fontWeight: esHoy ? 600 : 500},
          esHoy ? { color:'var(--paper)', background:'var(--info)', borderRadius:'50%', padding:'2px 6px' } : { color:'var(--ink-3)' }),
      }, String(fechaCelda.getDate())),
    ]);
    celda.appendChild(numero);

    // Pendientes del día (hasta 3)
    const fechaCeldaMs = new Date(year, fechaCelda.getMonth(), fechaCelda.getDate()).getTime();
    const hoyMs = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    arr.slice(0, 3).forEach(p => {
      const esVencido = fechaCeldaMs < hoyMs && p.estado !== 'Cerrado';
      const esPorVencer = !esVencido && p.estado !== 'Cerrado' && (fechaCeldaMs - hoyMs) <= 3 * 86400000 && (fechaCeldaMs - hoyMs) >= 0;
      const k = pillKind(p, esVencido, esPorVencer);
      const txt = (p.descripcion || '').slice(0, 25) + ((p.descripcion || '').length > 25 ? '…' : '');
      celda.appendChild(h(`div.pill.${k}`, {
        style:{fontSize:'10.5px', padding:'2px 5px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', cursor:'pointer', display:'block'},
        title: p.descripcion,
        onclick: (ev) => { ev.stopPropagation(); abrirModalPendienteDetalle(p, refresh); },
      }, txt));
    });
    if (arr.length > 3) {
      celda.appendChild(h('div', {
        style:{fontSize:'10.5px', color:'var(--ink-3)', cursor:'pointer', padding:'1px 4px'},
        onclick: (ev) => { ev.stopPropagation(); abrirModalPendientesDelDia(iso, arr, refresh); },
      }, `+ ${arr.length - 3} más`));
    } else if (arr.length) {
      // Click en cualquier parte de la celda → abrir lista del día
      celda.addEventListener('click', () => abrirModalPendientesDelDia(iso, arr, refresh));
    }
    return celda;
  }

  return wrap;
}

/** Modal con la card expandida de un pendiente (reúsa renderPendienteCard del modo lista). */
function abrirModalPendienteDetalle(p, refresh) {
  UI.modal({
    title: 'Pendiente',
    sub: p.descripcion ? p.descripcion.slice(0, 80) + (p.descripcion.length > 80 ? '…' : '') : '',
    size: 'md',
    content: (body, { close }) => {
      UI_PEND.expanded.add(p.id);
      body.appendChild(renderPendienteCard(p, () => {
        // Re-render del card dentro del modal
        body.innerHTML = '';
        body.appendChild(renderPendienteCard(p, () => {
          if (refresh) refresh();
        }));
      }));
    },
    onClose: () => {
      UI_PEND.expanded.delete(p.id);
      if (refresh) refresh();
    },
  });
}

/** Modal con la lista de pendientes que vencen un día. */
function abrirModalPendientesDelDia(iso, arr, refresh) {
  const fecha = new Date(iso + 'T12:00:00');
  UI.modal({
    title: `Pendientes del ${fmt.date(fecha)}`,
    sub: `${arr.length} pendiente${arr.length>1?'s':''}`,
    size: 'lg',
    content: (body) => {
      arr.forEach(p => {
        UI_PEND.expanded.add(p.id);
        body.appendChild(renderPendienteCard(p, () => {
          // Re-render todo
          body.innerHTML = '';
          arr.forEach(pp => body.appendChild(renderPendienteCard(pp, () => {})));
        }));
      });
    },
    onClose: () => {
      arr.forEach(p => UI_PEND.expanded.delete(p.id));
      if (refresh) refresh();
    },
  });
}

      const isActivo = UI_PEND.modo === modoVal;
