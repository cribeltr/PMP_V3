/* ============================================================
   IMPORT · asignación mensual (.xlsx)
   ============================================================ */
async function importAsignacionMensual(file, opts={}) {
  await ensureXLSX();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });

  // Detect header row
  let hr = -1;
  for (let i = 0; i < Math.min(aoa.length, 20); i++) {
    const row = aoa[i].map(c => normalize(c));
    const hasResp = row.some(c => c.includes('responsable'));
    const hasSerieOrInv = row.some(c => c.includes('serie') || c.includes('inventario'));
    if (hasResp && hasSerieOrInv) { hr = i; break; }
  }
  if (hr < 0) throw new Error('No se detectó fila de encabezados (Responsable + Serie/Inventario).');

  // Index columns
  const idx = {};
  aoa[hr].forEach((raw, i) => {
    const c = normalize(raw);
    if (c.includes('responsable')) idx.responsable = i;
    else if (c.includes('serie')) idx.serie = i;
    else if (c.includes('inventario')) idx.inventario = i;
    else if (c.includes('carpeta')) idx.carpeta = i;
  });

  // Detect period from filename or use opts
  const periodo = opts.mes && opts.anio
    ? `${opts.anio}-${String(opts.mes).padStart(2,'0')}`
    : detectarPeriodoArchivo(file.name) || `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;

  const [anio, mesStr] = periodo.split('-');
  const mes = Number(mesStr);

  // Build lookups
  const bySerie = new Map();
  const byInv   = new Map();
  STATE.equipos.forEach(e => {
    const s = normalize(e.serie);
    const i = normalize(e.inventario);
    if (s && s !== 'n/a') bySerie.set(s, e);
    if (i && i !== 'n/a') byInv.set(i, e);
  });

  const rows = aoa.slice(hr + 1).filter(r => r.some(c => String(c).trim()));
  const asign = { __meta: {
    archivo: file.name,
    fechaCarga: new Date().toISOString(),
    mes, anio: Number(anio),
    total: rows.length,
    matcheados: 0,
    sinMatch: [],
    tecnicos: {},
  }};

  for (const r of rows) {
    const resp = idx.responsable != null ? String(r[idx.responsable] || '').trim() : '';
    if (!resp) continue;
    const serie = idx.serie != null ? normalize(r[idx.serie]) : '';
    const inv   = idx.inventario != null ? normalize(r[idx.inventario]) : '';
    let eq = (serie && bySerie.get(serie)) || (inv && byInv.get(inv)) || null;
    if (!eq) {
      asign.__meta.sinMatch.push({ serie: r[idx.serie] || '', inventario: r[idx.inventario] || '', responsable: resp });
      continue;
    }
    asign[eq.uuid] = resp;
    asign.__meta.matcheados++;
    asign.__meta.tecnicos[resp] = (asign.__meta.tecnicos[resp] || 0) + 1;
  }

  STATE.asignaciones[periodo] = asign;
  persist('asignaciones');
  return { periodo, ...asign.__meta };
}

function detectarPeriodoArchivo(name) {
  const meses = {
    enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12,
    ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12,
  };
  const norm = normalize(name);
  const yearM = norm.match(/20\d{2}/);
  const year = yearM ? Number(yearM[0]) : new Date().getFullYear();
  for (const [w, m] of Object.entries(meses)) {
    if (norm.includes(w)) return `${year}-${String(m).padStart(2,'0')}`;
  }
  return null;
}

/* ============================================================
   EXPORT · plantilla mensual (XLSX con validación de lista)
   ============================================================ */
async function exportPlantillaAsignacion(periodo) {
  await ensureXLSX();
  await ensureJSZip();
  const equipos = STATE.equipos.filter(e => !e.esSlot && e.estado !== 'DeBaja');
  const tecnicos = sugerirTecnicos();
  // Pre-llenado: asignación del período actual; si no hay, busca la última asignación del equipo en cualquier período previo.
  const periodos = listaPeriodos();
  function ultimoResponsable(equipoUuid) {
    if ((STATE.asignaciones[periodo] || {})[equipoUuid]) return STATE.asignaciones[periodo][equipoUuid];
    for (const p of periodos) {
      const v = (STATE.asignaciones[p] || {})[equipoUuid];
      if (v) return v;
    }
    return '';
  }

  const headers = ['Carpeta','N° Inventario','N° Serie','Equipo','Servicio','Familia','Frecuencia MP','Responsable'];
  const data = [headers];
  equipos.forEach(e => {
    data.push([
      e.carpeta ?? '',
      e.inventario || '',
      e.serie || '',
      e.nombre || '',
      e.servicio || '',
      e.fam || '',
      e.frecuencia || '',
      ultimoResponsable(e.uuid),
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:10},{wch:14},{wch:14},{wch:32},{wch:22},{wch:18},{wch:14},{wch:26}];
  XLSX.utils.book_append_sheet(wb, ws, 'Asignacion');

  const tecData = [['Tecnicos'], ...tecnicos.map(t => [t])];
  const wsT = XLSX.utils.aoa_to_sheet(tecData);
  XLSX.utils.book_append_sheet(wb, wsT, 'Tecnicos');

  // Marcar la hoja "Tecnicos" como oculta via Workbook.Sheets (SheetJS escribe state="hidden" correctamente).
  wb.Workbook = wb.Workbook || {};
  wb.Workbook.Sheets = wb.Workbook.Sheets || [];
  const idxAsign = wb.SheetNames.indexOf('Asignacion');
  const idxTec   = wb.SheetNames.indexOf('Tecnicos');
  wb.Workbook.Sheets[idxAsign] = Object.assign(wb.Workbook.Sheets[idxAsign] || {}, { Hidden: 0 });
  wb.Workbook.Sheets[idxTec]   = Object.assign(wb.Workbook.Sheets[idxTec]   || {}, { Hidden: 1 });

  // Build initial xlsx
  const ab = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

  // Inyectar dataValidation: debe ir DESPUÉS de <sheetData> y ANTES de <pageMargins> según ECMA-376.
  // Si lo insertamos justo antes de </worksheet> Excel marca el archivo como dañado.
  const zip = await JSZip.loadAsync(ab);
  const sheetPath = 'xl/worksheets/sheet1.xml';
  let xml = await zip.file(sheetPath).async('string');
  const lastRow = equipos.length + 1;
  const tecLast = tecnicos.length + 1;
  const validation =
    `<dataValidations count="1">` +
    `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" ` +
    `errorTitle="Responsable inválido" error="Elegí un técnico de la lista." ` +
    `sqref="H2:H${lastRow}">` +
    `<formula1>Tecnicos!$A$2:$A$${tecLast}</formula1>` +
    `</dataValidation></dataValidations>`;
  // Anclas válidas para insertar (en orden de preferencia, todas posteriores a dataValidations en el schema).
  const anchors = ['<pageMargins', '<pageSetup', '<headerFooter', '<rowBreaks', '<colBreaks', '<drawing', '<legacyDrawing', '<tableParts', '</worksheet>'];
  let inserted = false;
  for (const a of anchors) {
    const idx = xml.indexOf(a);
    if (idx >= 0) { xml = xml.slice(0, idx) + validation + xml.slice(idx); inserted = true; break; }
  }
  if (!inserted) throw new Error('No se pudo insertar la validación de datos en el XLSX.');
  zip.file(sheetPath, xml);

  const out = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = `plantilla_asignacion_${periodo}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
}

/**
 * Universo de técnicos para sugerir en plantillas y formularios.
 * Fuentes (en este orden): técnicos oficiales SEC + asignaciones mensuales
 * + responsables de aperturas de ciclo + ejecutores históricos.
 * IGNORA `responsableMaster` del Excel (es referencial, no fuente de verdad).
 */
function sugerirTecnicos() {
  const set = new Set();
  (STATE.tecnicosOficiales || []).forEach(n => { if (n) set.add(n); });
  Object.values(STATE.asignaciones || {}).forEach(per => {
    if (!per || typeof per !== 'object') return;
    Object.entries(per).forEach(([k,v]) => { if (k !== '__meta' && v && typeof v === 'string') set.add(v); });
  });
  STATE.equipos.forEach(e => (e.correctivos||[]).forEach(c => {
    if (c.apertura?.responsable) set.add(c.apertura.responsable);
  }));
  EQ.ejecutores().forEach(n => set.add(n));
  return Array.from(set).sort((a,b) => a.localeCompare(b,'es'));
}

/* ============================================================
   EXPORT · reporte multi-hoja
   ============================================================ */
async function exportReporteGeneral() {
  await ensureXLSX();
  const wb = XLSX.utils.book_new();
  const now = new Date();
  const anio = now.getFullYear();
  const mes  = now.getMonth() + 1;

  // === Resumen ===
  const byEst = EQ.countByEstado();
  const garan = EQ.garantiasActivas().length;
  const programadas = STATE.equipos.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R').length;
  const ejecutadas  = STATE.equipos.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI')).length;
  const ciclosAb    = EQ.ciclosAbiertos().length;
  const pendientes  = STATE.pendientes.filter(p => p.estado !== 'Cerrado').length;

  const resumen = [
    ['PMP — Reporte general'],
    ['Fecha de emisión', fmt.datetime(now)],
    ['Equipos totales', STATE.equipos.length],
    [''],
    ['Por estado'],
    ['Operativos',         byEst.Operativo],
    ['No operativos',      byEst.NoOperativo],
    ['En servicio técnico',byEst.ServicioTecnico],
    ['Fuera de servicio',  byEst.FueraDeServicio],
    ['De baja',            byEst.DeBaja],
    ['Slots',              byEst.Slot],
    [''],
    ['Garantías activas',  garan],
    ['Ciclos correctivos abiertos', ciclosAb],
    ['Pendientes abiertos', pendientes],
    [''],
    [`MP ${MESES[mes-1]} ${anio} programadas`, programadas],
    [`MP ${MESES[mes-1]} ${anio} ejecutadas`,  ejecutadas],
    [`% cumplimiento ${MESES[mes-1]}`, programadas ? Math.round(ejecutadas/programadas*100) + '%' : '—'],
  ];
  const wsR = XLSX.utils.aoa_to_sheet(resumen);
  wsR['!cols'] = [{wch:36},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumen');

  // === Inventario ===
  const periodoRep = `${anio}-${String(mes).padStart(2,'0')}`;
  const respHdr = `Responsable ${MESES[mes-1]} ${anio}`;
  const inv = [['Servicio','Familia','Nombre','Marca','Modelo','Serie','Inventario','Carpeta','Frecuencia', respHdr, 'Estado','En garantía','Proveedor garantía','Ubicación']];
  STATE.equipos.forEach(e => {
    inv.push([
      e.servicio||'', e.fam||'', e.nombre||'', e.marca||'', e.modelo||'',
      e.serie||'', e.inventario||'', e.carpeta||'', e.frecuencia||'',
      responsableDelPeriodo(e, periodoRep), ESTADO_LABEL[e.estado]||e.estado||'',
      e.enGarantia ? 'Sí' : '', e.garantiaProveedor||'', e.ubicacion||'',
    ]);
  });
  const wsI = XLSX.utils.aoa_to_sheet(inv);
  wsI['!cols'] = [{wch:22},{wch:18},{wch:32},{wch:16},{wch:18},{wch:16},{wch:14},{wch:10},{wch:12},{wch:22},{wch:18},{wch:12},{wch:22},{wch:24}];
  XLSX.utils.book_append_sheet(wb, wsI, 'Inventario');

  // === En ST / NoOperativos ===
  const st = [['Servicio','Equipo','Serie','Estado','Estado desde','Días','Folio SIGEM','Eslabón ciclo']];
  STATE.equipos.filter(e => e.estado === 'ServicioTecnico' || e.estado === 'NoOperativo').forEach(e => {
    const ciclo = (e.correctivos||[]).find(c => c.abierto);
    const folio = ciclo?.apertura?.folioSigem || ciclo?.solicitud?.folioSigem || '';
    const eslabon = ciclo ? ESLABONES_LABEL[ciclo.eslabonActual] || ciclo.eslabonActual : '';
    st.push([e.servicio||'', e.nombre||'', e.serie||'', ESTADO_LABEL[e.estado], fmt.date(e.estadoDesde), fmt.daysSince(e.estadoDesde) ?? '', folio, eslabon]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(st), 'En ST y NoOp');

  // === MP Pendientes del mes ===
  const pend = [['Servicio','Equipo','Serie','Frecuencia','Programado','Estado equipo', respHdr, 'Días en estado']];
  STATE.equipos.forEach(e => {
    const prog = e.grilla?.[mes];
    if (prog !== 'X' && prog !== 'R') return;
    const hayEjec = (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI');
    if (hayEjec) return;
    pend.push([e.servicio||'', e.nombre||'', e.serie||'', e.frecuencia||'', prog, ESTADO_LABEL[e.estado]||e.estado, responsableDelPeriodo(e, periodoRep), fmt.daysSince(e.estadoDesde) ?? '']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pend), `MP pendientes ${MESES[mes-1]}`);

  // === Historial del año ===
  const histRows = [['Fecha','Mes','Servicio','Equipo','Serie','Resultado','Estado final','Ejecutor','Observación']];
  STATE.equipos.forEach(e => {
    (e.historial||[]).filter(h => {
      const d = new Date(h.fechaEvento || h.fecha || 0);
      return !isNaN(d) && d.getFullYear() === anio;
    }).forEach(h => {
      histRows.push([
        fmt.date(h.fechaEvento || h.fecha),
        MESES[(h.mes||1)-1],
        e.servicio || '', e.nombre || '', e.serie || '',
        h.resultado || '',
        h.estadoFinal ? (ESTADO_LABEL[h.estadoFinal] || h.estadoFinal) : '',
        h.ejecutor || '', h.obs || '',
      ]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(histRows), `Historial ${anio}`);

  // === Por servicio ===
  const servicios = EQ.servicios();
  const porServ = [['Servicio','Equipos','Operativos','No operativos','En ST','Fuera de servicio','De baja','En garantía',`Programadas ${MESES[mes-1]}`,`Ejecutadas ${MESES[mes-1]}`,'% cumplimiento']];
  servicios.forEach(s => {
    const eq = STATE.equipos.filter(e => e.servicio === s);
    const c = (estado) => eq.filter(e => e.estado === estado).length;
    const prog = eq.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R').length;
    const ejec = eq.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI')).length;
    porServ.push([
      s, eq.length, c('Operativo'), c('NoOperativo'), c('ServicioTecnico'),
      c('FueraDeServicio'), c('DeBaja'), eq.filter(e => e.enGarantia).length,
      prog, ejec, prog ? Math.round(ejec/prog*100) + '%' : '—',
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(porServ), 'Por servicio');

  const ts = now.toISOString().replace(/[:.]/g,'-');
  XLSX.writeFile(wb, `PMP_reporte_${ts}.xlsx`);
}

function printDoc(content, title='Documento PMP') {
  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden','true');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title><style>${PRINT_CSS}</style></head><body>${content}</body></html>`);
  doc.close();
  setTimeout(() => {
    try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch(e) {}

  }, 350);

/* ============================================================
   INFORME mensual por servicio
   ============================================================ */
function calcularInformeServicio(servicio, mes, anio) {
  const eq = STATE.equipos.filter(e => e.servicio === servicio && !e.esSlot && e.estado !== 'DeBaja');
  const items = eq.map(e => {
    const prog = e.grilla?.[mes];
    const hist = (e.historial||[]).filter(h => h.mes === mes && new Date(h.fechaEvento||h.fecha||0).getFullYear() === anio)
      .sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
    const ultimo = hist[0] || null;
    return { equipo: e, prog, ultimo };
  });

  return {
    servicio, mes, anio,
    items,
    totales: {
      equipos:       eq.length,
      programadas:   items.filter(i => i.prog === 'X' || i.prog === 'R').length,
      ejecutadas:    items.filter(i => i.ultimo?.resultado === 'SI').length,
      causalizadas:  items.filter(i => i.ultimo && CAUSALES[i.ultimo.resultado]).length,
      pendientes:    items.filter(i => (i.prog === 'X' || i.prog === 'R') && !i.ultimo).length,
    },
  };
}

/* ============================================================
   QUERY · período activo y agrupación por técnico
   ============================================================ */
function listaPeriodos() {
  return Object.keys(STATE.asignaciones || {})
    .filter(k => k !== '__meta' && /^\d{4}-\d{2}$/.test(k))
    .sort()
    .reverse();
}

function periodoActual() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

/** Responsable del equipo en un período según el archivo de asignación mensual. '' si no hay archivo o el equipo no aparece. */
function responsableDelPeriodo(equipo, periodo) {
  periodo = periodo || periodoActual();
  const asign = STATE.asignaciones[periodo];
  if (!asign || !asign.__meta) return '';
  return asign[equipo.uuid] || '';
}

function periodoLabel(p) {
  if (!p) return '—';
  const [y, m] = p.split('-');
  return `${MESES[Number(m)-1]} ${y}`;
}

/**
 * Agrupa equipos activos por responsable del período.
 * - Si hay archivo de asignación para el período: usa `asign[e.uuid]`.
 * - Si NO hay archivo: TODOS los equipos van a "(sin asignar)".
 *
 * `responsableMaster` del Excel es referencial y NO se usa como fuente de verdad.
 * (sin asignar) sólo contiene equipos activos que no aparecen como key en el archivo.
 */
function agruparPorTecnico(periodo) {
  const asign = STATE.asignaciones[periodo] || {};
  const tieneArchivo = !!asign.__meta;
  const groups = new Map();
  const equiposActivos = STATE.equipos.filter(e => !e.esSlot && e.estado !== 'DeBaja');
  equiposActivos.forEach(e => {
    const resp = tieneArchivo
      ? (asign[e.uuid] || '(sin asignar)')
      : '(sin asignar)';
    if (!groups.has(resp)) groups.set(resp, []);
    groups.get(resp).push(e);
  });
  return groups;
}

/* ============================================================
   IMPORT MAESTRO · modal de diferencias + pendiente
   ============================================================ */
function diffTieneCambios(diff) {
  return (diff.nuevos.length + diff.ausentes.length + diff.cambios.length) > 0;
}

function abrirModalDiferenciasMaestro(diff, opts={}) {
  const review = !!opts.review;
  const pendienteId = opts.pendienteId || null;

  // Recalcular totales sobre la posible modificación in-place
  function recomputarTotales() {
    diff.totales = {
      nuevos:   diff.nuevos.length,
      ausentes: diff.ausentes.length,
      cambios:  diff.cambios.length,
      camposCambiados: diff.cambios.reduce((s,c) => s + c.fields.length, 0),
      grillaCambios:   diff.cambios.reduce((s,c) => s + c.grilla.length, 0),
      ignoradosPrevios: diff.totales?.ignoradosPrevios || 0,
    };
  }

  function ignorarTodo() {
    diff.nuevos.forEach(n   => marcarDiffIgnorado(diffKeyNuevo(n.uuid), { nombre: n.nombre, serie: n.serie }));
    diff.ausentes.forEach(a => marcarDiffIgnorado(diffKeyAusente(a.uuid), { nombre: a.nombre }));
    diff.cambios.forEach(c => {
      c.fields.forEach(f => marcarDiffIgnorado(diffKeyCampo(c.uuid, f.campo, f.despues), { nombre: c.nombre }));
      c.grilla.forEach(g => marcarDiffIgnorado(diffKeyGrilla(c.uuid, g.mes, g.despues), { nombre: c.nombre }));
    });
    diff.nuevos = []; diff.ausentes = []; diff.cambios = [];
    recomputarTotales();
  }

  function pendienteTodo() {
    let n = 0;
    diff.nuevos.forEach(it   => { crearPendienteItemDiff(diff, it, 'nuevo');   n++; });
    diff.ausentes.forEach(it => { crearPendienteItemDiff(diff, it, 'ausente'); n++; });
    diff.cambios.forEach(c => {
      c.fields.forEach(f => { crearPendienteItemDiff(diff, { ...f, parent:c, uuid:c.uuid }, 'cambio'); n++; });
      c.grilla.forEach(g => { crearPendienteItemDiff(diff, { ...g, parent:c, uuid:c.uuid }, 'grilla'); n++; });
    });
    diff.nuevos = []; diff.ausentes = []; diff.cambios = [];
    recomputarTotales();
    return n;
  }

  UI.modal({
    title: review ? 'Diferencias por revisar' : 'Diferencias detectadas en el maestro',
    sub: `${diff.archivo} · ${fmt.datetime(diff.fecha)}`,
    size: 'lg',
    content: (body, { close }) => {
      function render() {
        body.innerHTML = '';
        const t = diff.totales;
        const noHayCambios = !diffTieneCambios(diff);

        // Resumen
        body.appendChild(h('div.kpi-grid', { style:{marginBottom:'14px'} }, [
          kpiCard({ label: 'Equipos nuevos',    value: fmt.number(t.nuevos),   kind: t.nuevos ? 'info' : 'muted' }),
          kpiCard({ label: 'Ausentes',          value: fmt.number(t.ausentes), kind: t.ausentes ? 'warning' : 'muted' }),
          kpiCard({ label: 'Con cambios',       value: fmt.number(t.cambios),  kind: t.cambios ? 'warning' : 'muted' }),
          kpiCard({ label: 'Cambios en grilla', value: fmt.number(t.grillaCambios || 0) }),
        ]));

        if (noHayCambios) {
          const previos = t.ignoradosPrevios || 0;
          body.appendChild(h('div.banner.info', [
            h('i.ti.ti-circle-check'),
            h('div.grow', previos
              ? `Sin diferencias relevantes · ${previos} cambios previamente ignorados (podés revisarlos en Configuración).`
              : 'No se detectaron diferencias respecto del estado actual.'),
          ]));
          return;
        }

        // Banner con ignorados previos si aplica
        if (t.ignoradosPrevios) {
          body.appendChild(h('div.banner.info', { style:{marginBottom:'10px'} }, [
            h('i.ti.ti-info-circle'),
            h('div.grow', `${t.ignoradosPrevios} diferencias previamente ignoradas no se muestran. Gestioná la lista desde Configuración → Diferencias ignoradas.`),
          ]));
        }

        // Acciones globales
        if (!review) {
          body.appendChild(h('div', { style:{display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'12px'} }, [
            h('button.btn.sm.ghost', { onclick: async () => {
              const ok = await UI.dialog({ title:'Ignorar todo', message:`¿Marcar como ignoradas ${t.nuevos + t.ausentes + t.camposCambiados + t.grillaCambios} diferencias? No vuelven a aparecer en próximos imports.`, confirmText:'Ignorar todo', variant:'danger' });
              if (!ok) return;
              ignorarTodo();
              UI.toast('Diferencias marcadas como ignoradas.', 'warning');
              render();
            } }, [ h('i.ti.ti-eye-off'), 'Marcar todo como ignorado' ]),
            h('button.btn.sm.ghost', { onclick: async () => {
              const ok = await UI.dialog({ title:'Crear pendientes', message:`¿Crear un pendiente individual por cada diferencia (${t.nuevos + t.ausentes + t.camposCambiados + t.grillaCambios})?`, confirmText:'Crear todos' });
              if (!ok) return;
              const n = pendienteTodo();
              UI.toast(`${n} pendientes creados.`, 'success');
              render();
            } }, [ h('i.ti.ti-clipboard-plus'), 'Marcar todo como pendiente' ]),
          ]));
        }

        // Tabs
        const tabs = h('div.tabs', { style:{padding:0, marginBottom:'12px'} });
        const panel = h('div');
        const sections = [
          { id:'nuevos',   label:'Nuevos',   count: t.nuevos,                                     render: () => panelNuevos(diff, render, review) },
          { id:'ausentes', label:'Ausentes', count: t.ausentes,                                   render: () => panelAusentes(diff, render, review) },
          { id:'cambios',  label:'Datos',    count: diff.cambios.filter(c => c.fields.length).length, render: () => panelCambios(diff, render, review) },
          { id:'grilla',   label:'Grilla',   count: diff.cambios.filter(c => c.grilla.length).length, render: () => panelGrilla(diff, render, review) },
        ];
        const first = sections.find(s => s.count > 0) || sections[0];
        sections.forEach(s => {
          const tab = h('div.tab', [ s.label, h('span.count', s.count) ]);
          if (s.id === first.id) tab.classList.add('active');
          tab.addEventListener('click', () => {
            $$('.tab', tabs).forEach(x => x.classList.remove('active'));
            tab.classList.add('active');
            panel.innerHTML = '';
            panel.appendChild(s.render());
          });
          tabs.appendChild(tab);
        });
        body.appendChild(tabs);
        body.appendChild(panel);
        panel.appendChild(first.render());
      }
      render();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, review ? 'Cerrar' : 'Cerrar'));
      if (review && pendienteId) {
        f.appendChild(h('button.btn.primary', { onclick: async () => {
          const ok = await UI.dialog({ title:'Cerrar pendiente', message: '¿Marcar este pendiente como revisado y cerrarlo?', confirmText:'Cerrar pendiente' });
          if (!ok) return;
          PENDIENTE.cerrar(pendienteId, 'Diferencias revisadas');
          UI.toast('Pendiente cerrado.', 'success');
          close();
          if (STATE.view === 'tareas') Router.go('tareas');
        }}, [ h('i.ti.ti-check'), 'Marcar revisado' ]));
      } else if (!review && diffTieneCambios(diff)) {
        f.appendChild(h('button.btn.primary', { onclick: () => {
          const p = crearPendienteDiferencias(diff);
          UI.toast(`Pendiente creado · vence ${fmt.date(p.vence)}.`, 'success', { duration: 5000 });
          close();
        }}, [ h('i.ti.ti-clipboard-plus'), 'Crear pendiente consolidado' ]));
      }
    },
  });
}

function crearPendienteDiferencias(diff) {
  const t = diff.totales;
  const partes = [];
  if (t.nuevos)   partes.push(`${t.nuevos} nuevos`);
  if (t.ausentes) partes.push(`${t.ausentes} ausentes`);
  if (t.cambios)  partes.push(`${t.cambios} con cambios`);
  const desc = `Revisar diferencias del maestro ${diff.archivo} (${partes.join(' · ') || 'sin cambios significativos'})`;
  const vence = addBusinessDays(new Date(), 2).toISOString();
  return PENDIENTE.crear({
    tipo: 'diferencias-maestro',
    descripcion: desc,
    asignado: '',
    vence,
    meta: { diff },
  });
}

function crearPendienteItemDiff(diff, item, kind) {
  let descripcion = '';
  let equipoUuid = item.uuid || item.parent?.uuid || null;
  const nombreEq = item.nombre || item.parent?.nombre || '';
  const serieEq  = item.serie  || item.parent?.serie  || '';
  switch (kind) {
    case 'nuevo':
      descripcion = `Maestro: equipo nuevo "${nombreEq}" (S/N ${serieEq || '—'}, Inv ${item.inventario || '—'}) — confirmar incorporación al PMP.`;
      break;
    case 'ausente':
      descripcion = `Maestro: equipo "${nombreEq}" (S/N ${serieEq || '—'}) ausente en el archivo nuevo — confirmar si corresponde dar de baja o reingresar.`;
      break;
    case 'cambio':
      descripcion = `Maestro: cambio en "${nombreEq}" — ${item.label || item.campo}: "${item.antes || '∅'}" → "${item.despues || '∅'}".`;
      break;
    case 'grilla':
      descripcion = `Maestro: cambio de grilla en "${nombreEq}" — ${MESES[item.mes-1]}: ${item.antes || '∅'} → ${item.despues || '∅'}.`;
      break;
  }
  const vence = addBusinessDays(new Date(), 3).toISOString();
  return PENDIENTE.crear({
    tipo: 'diferencia-item',
    descripcion,
    equipoUuid,
    asignado: '',
    vence,
    meta: { kind, item, diffArchivo: diff.archivo, diffFecha: diff.fecha },
  });
}

/** Merge updates from master file without destroying historial / correctivos / eventos / R-marks. */
function mergeEquipoInPlace(prev, draft) {
  // Static fields refreshed from master.
  ['fam','famOriginal','id','carpeta','inventario','nombre','servicio','unidad','ubicacion',
   'procedencia','marca','modelo','anio','vidaUtil','clasificacion','enu','observacion',
   'frecuencia','responsableMaster']
    .forEach(k => { if (draft[k]) prev[k] = draft[k]; });
  // Grilla: nuevo X no pisa R/RA/PM existentes.
  for (let m = 1; m <= 12; m++) {
    const incoming = draft.grilla[m];
    const current  = prev.grilla?.[m] ?? null;
    if (!incoming) continue;
    if (incoming === 'X' && (current === 'R' || current === 'RA' || current === 'PM')) continue;
    prev.grilla[m] = incoming;
  }
}

   BACKUP · JSON
   ============================================================ */
function exportBackup() {
  const payload = {
    appVersion: APP_VERSION,
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    equipos: STATE.equipos,
    pendientes: STATE.pendientes,
    asignaciones: STATE.asignaciones,
    contactos: STATE.contactos,
    session: STATE.session,
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const ts = new Date().toISOString().replace(/[:.]/g,'-');
  const a = h('a', { href: URL.createObjectURL(blob), download: `pmp_backup_${ts}.json` });
  document.body.appendChild(a); a.click(); a.remove();
  UI.toast('Backup descargado.', 'success');
}

async function importBackup() {
  const file = await pickFile('.json');
  if (!file) return;
  const ok = await UI.dialog({
    title: 'Restaurar backup',
    message: `Esto reemplaza todos los datos actuales con el contenido de "${file.name}". ¿Continuamos?`,
    confirmText: 'Restaurar',
    variant: 'danger',
  });
  if (!ok) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.equipos)) throw new Error('El archivo no contiene un campo "equipos" válido.');
    STATE.equipos      = data.equipos.map(normalizeEquipoFromLegacy);
    STATE.pendientes   = Array.isArray(data.pendientes) ? data.pendientes : [];
    STATE.asignaciones = data.asignaciones && typeof data.asignaciones === 'object' ? data.asignaciones : {};
    STATE.contactos    = data.contactos    && typeof data.contactos    === 'object' ? data.contactos    : {};
    STATE.session      = data.session      && typeof data.session      === 'object' ? data.session      : {};
    persist();
    UI.toast(`Restaurados ${STATE.equipos.length} equipos.`, 'success');
    Router.go(STATE.view);
  } catch (e) {
    bus.emit('error', e);
  }
}

function field(label, control, hint=null, err=null) {
  return h('div.field', [
    h('label', label),
    control,
    hint ? h('div.hint', hint) : null,
    err  ? h('div.err', err)  : null,
  ]);
}
function inputCtl(attrs={}) { return h('input.input', Object.assign({ type:'text' }, attrs)); }
function dateCtl(value, attrs={}) { return h('input.input', Object.assign({ type:'date', value: value || todayISO() }, attrs)); }
function selectCtl(opts, value='', attrs={}) {
  const s = h('select.select', attrs);
  opts.forEach(o => {
    if (typeof o === 'string') s.appendChild(h('option', { value: o }, o));
    else s.appendChild(h('option', { value: o.value }, o.label));
  });
  if (value != null) s.value = value;
  return s;
}
function textareaCtl(attrs={}) { return h('textarea.textarea', attrs); }
function row(cols, children) {
  return h('div', { style:{ display:'grid', gridTemplateColumns: cols, gap:'12px', marginBottom:'10px' } }, children);
}

/* ============================================================
   UI · MODALES: registrar MP, vinculación causal, SIGEM, reprogramar, PM
   ============================================================ */
function abrirModalRegistrarMP(equipo, opts={}) {
  const ejecutoresPrev = EQ.ejecutores();
  const initialMes = opts.mes || (new Date().getMonth() + 1);
  const initialFecha = opts.fecha || todayISO();

  let editing = opts.edit || null;     // MP record being edited
  let snap = {
    fechaEvento: editing?.fechaEvento ? dateInputValue(editing.fechaEvento) : initialFecha,
    mes: editing?.mes ?? initialMes,
    resultado: editing?.resultado ?? 'SI',
    estadoFinal: editing?.estadoFinal ?? 'Operativo',
    tipoBaja: editing?.tipoBaja ?? '',
    ejecutor: editing?.ejecutor ?? '',
    obs: editing?.obs ?? '',
    motivoCambioEjecutor: editing?.motivoCambioEjecutor ?? '',
  };
  const ejecutorOriginal = editing?.ejecutor || '';

  let condRow; // re-rendered based on resultado

  UI.modal({
    title: editing ? 'Editar registro MP' : 'Registrar MP',
    sub: equipo.nombre,
    size: 'md',
    content: (body, { close }) => {
      // Panel de contexto (programación, último registro del mes, frecuencia, meses desde última SI).
      const contextoWrap = h('div', { style:{ marginBottom:'14px' } });
      body.appendChild(contextoWrap);

      function renderContexto() {
        const mes = Number(snap.mes) || (new Date().getMonth()+1);
        const programado = equipo.grilla?.[mes] || null;
        const histMes = (equipo.historial || []).filter(h => h.mes === mes)
          .sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
        const ultimoSI    = histMes.find(h => h.resultado === 'SI');
        const ultimaCausal = histMes.find(h => CAUSALES[h.resultado]);
        const ultimaSIGlobal = (equipo.historial || []).filter(h => h.resultado === 'SI')
          .sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0))[0];
        const mesesDesdeSI = ultimaSIGlobal
          ? Math.floor((Date.now() - new Date(ultimaSIGlobal.fechaEvento||ultimaSIGlobal.fecha||0).getTime()) / (1000*60*60*24*30))
          : null;

        // Anclas semánticas para color
        const editingThisRecord = editing && ultimoSI && editing.id === ultimoSI.id;
        const tipo =
          ultimoSI && !editingThisRecord ? 'warning' :
          programado === 'X' || programado === 'R' || programado === 'PM' ? 'info' :
          programado === 'RA' || !programado ? 'muted' : 'muted';

        const items = [];
        items.push(h('div', { style:{display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap'} }, [
          h('strong', { style:{fontSize:'13px'} }, `Contexto de ${MESES[mes-1]}`),
          programado
            ? h(`span.pill.${programado==='X'?'info':programado==='R'?'warning':programado==='PM'?'purple':'muted'}`, programado === 'X' ? 'X · programada' : programado === 'R' ? 'R · reprogramada' : programado === 'RA' ? 'RA · legado' : 'PM · puesta en marcha')
            : h('span.pill.muted', 'sin programar en grilla'),
          equipo.frecuencia ? h('span.pill', `frec. ${equipo.frecuencia.toLowerCase()}`) : null,
          mesesDesdeSI != null
            ? h(`span.pill${mesesDesdeSI > 12 ? '.warning' : ''}`, `${mesesDesdeSI === 0 ? 'última MP exitosa este mes' : 'última MP exitosa hace ' + mesesDesdeSI + ' mes' + (mesesDesdeSI === 1 ? '' : 'es')}`)
            : h('span.pill.muted', 'sin MP exitosa registrada'),
        ]));

        if (ultimoSI && !editingThisRecord) {
          items.push(h('div', { style:{ marginTop:'6px', fontSize:'12px', color:'var(--ink-2)' } }, [
            h('i.ti.ti-alert-triangle', { style:{color:'var(--warning)', marginRight:'4px'} }),
            `Ya hay un registro SI en ${MESES[mes-1]} (${fmt.date(ultimoSI.fechaEvento || ultimoSI.fecha)}${ultimoSI.ejecutor ? ' · '+ultimoSI.ejecutor : ''}). Si vas a corregirlo, abrí el registro desde la pestaña Historial.`,
          ]));
        }
        if (ultimaCausal) {
          items.push(h('div', { style:{ marginTop:'4px', fontSize:'12px', color:'var(--ink-2)' } }, [
            h('i.ti.ti-flag', { style:{color:'var(--info)', marginRight:'4px'} }),
            `Causal previa en ${MESES[mes-1]}: ${ultimaCausal.resultado} (${fmt.date(ultimaCausal.fechaEvento || ultimaCausal.fecha)})${ultimaCausal.ejecutor ? ' · '+ultimaCausal.ejecutor : ''}.`,
          ]));
        }
        if (!programado && !ultimoSI && !ultimaCausal) {
          items.push(h('div', { style:{ marginTop:'4px', fontSize:'12px', color:'var(--ink-3)' } }, [
            h('i.ti.ti-info-circle', { style:{marginRight:'4px'} }),
            `No había nada programado en ${MESES[mes-1]} para este equipo. Verificá el mes computable antes de guardar.`,
          ]));
        }

        contextoWrap.innerHTML = '';
        contextoWrap.appendChild(h(`div.banner.${tipo}`, { style:{ alignItems:'flex-start', flexDirection:'column', gap:'4px' } }, items));
      }

      const fFecha = field('Fecha real del evento', dateCtl(snap.fechaEvento, {
        onchange: (e) => {
          snap.fechaEvento = e.target.value;
          const m = monthOfISO(isoFromDateInput(snap.fechaEvento));
          if (m) { snap.mes = m; selMes.value = String(m); renderContexto(); }
        },
      }), 'La fecha en terreno. Admite registro retroactivo.');
      const selMes = selectCtl(MESES.map((n,i)=>({value:String(i+1),label:n})), String(snap.mes), {
        onchange:(e)=> { snap.mes = Number(e.target.value); renderContexto(); },
      });
      const fMes = field('Mes computable', selMes, 'Se autodetecta de la fecha; podés sobrescribirlo si el registro corresponde a otro mes.');

      const selResultado = selectCtl(RESULTADOS_MP.map(r => ({ value: r, label: RESULTADO_LABEL[r] })), snap.resultado, {
        onchange: (e) => { snap.resultado = e.target.value; renderCond(); },
      });
      const fRes = field('Resultado', selResultado);

      condRow = h('div');
      function renderCond() {
        condRow.innerHTML = '';
        if (snap.resultado === 'SI') {
          condRow.appendChild(field('Estado final', selectCtl([
            { value:'Operativo',       label:'Operativo' },
            { value:'NoOperativo',     label:'No operativo' },
            { value:'FueraDeServicio', label:'Fuera de servicio' },
          ], snap.estadoFinal, { onchange:(e)=> snap.estadoFinal = e.target.value })));
        } else if (snap.resultado === 'BAJA') {
          condRow.appendChild(field('Tipo de baja', selectCtl(TIPOS_BAJA, snap.tipoBaja, { onchange:(e)=> snap.tipoBaja = e.target.value })));
        } else if (CAUSALES[snap.resultado]) {
          const g = CAUSALES[snap.resultado].grupo;
          condRow.appendChild(h('div.banner.' + (g==='A'?'warning':'info'), [
            h('i.ti', { class: 'ti ' + (g==='A'?'ti-alert-triangle':'ti-info-circle') }),
            h('div.grow', [
              h('div', { style:{ fontWeight:500 } }, `Grupo ${g} · ${CAUSALES[snap.resultado].label}`),
              h('div', { style:{ fontSize:'11.5px', marginTop:'4px' } },
                snap.resultado === 'C2' ? 'Al guardar te voy a pedir vincular a un envío (existente o nuevo). El equipo pasa a En Servicio Técnico.' :
                snap.resultado === 'C3' ? 'Al guardar te voy a pedir vincular a un ciclo correctivo. El equipo pasa a No Operativo.' :
                g === 'A' ? `Si la causal persiste más de ${CAUSAL_GRUPO_A_DIAS} días, corresponde Anexo 4 (retiro por seguridad).` :
                'Causal de grupo B: el equipo no está disponible, no hay plazo límite.'),
            ]),
          ]));
        }
      }
      renderCond();

      const ejInput = inputCtl({
        placeholder: 'Nombre del ingeniero / técnico ejecutor',
        value: snap.ejecutor,
        list: 'ejecutores-list',
        oninput: (e) => snap.ejecutor = e.target.value,
      });
      const datalist = h('datalist', { id:'ejecutores-list' });
      ejecutoresPrev.forEach(n => datalist.appendChild(h('option', { value: n })));
      const fEj = field('Ejecutor responsable', h('div', [ejInput, datalist]));

      const fObs = field('Observación', textareaCtl({ rows: 3, value: snap.obs, oninput:(e)=> snap.obs = e.target.value }));

      const motivoWrap = h('div');
      function renderMotivo() {
        motivoWrap.innerHTML = '';
        if (editing && snap.ejecutor && snap.ejecutor !== ejecutorOriginal) {
          motivoWrap.appendChild(field('Motivo del cambio de ejecutor *', inputCtl({
            value: snap.motivoCambioEjecutor,
            oninput: (e) => snap.motivoCambioEjecutor = e.target.value,
          }), 'Obligatorio cuando se cambia el ejecutor de un registro existente.'));
        }
      }
      ejInput.addEventListener('input', renderMotivo);
      renderMotivo();

      body.appendChild(row('1fr 200px', [fFecha, fMes]));
      body.appendChild(row('1fr', [fRes]));
      body.appendChild(condRow);
      body.appendChild(row('1fr', [fEj]));
      body.appendChild(row('1fr', [fObs]));
      body.appendChild(motivoWrap);
      renderContexto();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      f.appendChild(h('button.btn.primary', { onclick: async () => {
        try {
          const fechaISO = isoFromDateInput(snap.fechaEvento);
          if (!fechaISO) throw new Error('Fecha inválida.');
          if (editing && snap.ejecutor && snap.ejecutor !== ejecutorOriginal && !snap.motivoCambioEjecutor.trim()) {
            throw new Error('Indicá el motivo del cambio de ejecutor.');
          }
          const payload = {
            fechaEvento: fechaISO,
            mes: Number(snap.mes),
            resultado: snap.resultado,
            estadoFinal: snap.resultado === 'SI' ? snap.estadoFinal : null,
            tipoBaja:    snap.resultado === 'BAJA' ? snap.tipoBaja : null,
            ejecutor: snap.ejecutor.trim(),
            obs: snap.obs.trim(),
            motivoCambioEjecutor: snap.motivoCambioEjecutor.trim() || null,
          };
          let res;
          if (editing) res = MP.update(equipo.uuid, editing.id, payload);
          else         res = MP.register(equipo.uuid, payload);
          close('save');
          if (res.needsVinculacion === 'C2') abrirModalVinculacionC2(res.equipo, res.mp);
          else if (res.needsVinculacion === 'C3') abrirModalVinculacionC3(res.equipo, res.mp);
          else UI.toast('MP registrada.', 'success');
          if (STATE.view === 'pmp' || STATE.view === 'dash' || STATE.view === 'inv') Router.go(STATE.view, STATE.viewParams);
          opts.onSaved?.(res);
        } catch (e) { bus.emit('error', e); }
      }}, editing ? 'Guardar cambios' : 'Registrar MP'));
    },
  });
}

  if (mp.resultado === 'C3') return abrirModalVinculacionC3(equipo, mp);

function abrirModalVinculacionC3(equipo, mp) {

  };

    sub: 'El equipo pasa a No Operativo al confirmar.',

    content: (body, { close }) => {
      body.appendChild(h('p', { style:{margin:'0 0 14px 0', color:'var(--ink-2)', fontSize:'12.5px'} },

            if (!fechaISO) throw new Error('Fecha inválida.');
            if (!snap.folioSigem.trim()) throw new Error('Indicá el folio SIGEM o cambiá a "Crear pendiente".');
            const { ciclo } = CICLO.crear(equipo.uuid, {
              fechaEvento: fechaISO,
              deteccion: snap.deteccion,
              descripcion: snap.descripcion || `Causal ${mp.resultado}: ${mp.obs || 'sin descripción'}`,
              responsable: snap.responsable,
              sigemEstado: 'existe',
              folioSigem: snap.folioSigem.trim(),
              startEslabon: 'diagnostico',
              causalLink: { mpId: mp.id, causal: mp.resultado },
            });
            mp.correctivoUuid = ciclo.uuid;
            persist('equipos');
            UI.toast(`Ciclo creado y causal C3 vinculada (folio ${snap.folioSigem}).`, 'success');
          } else if (modo === 'pendiente') {
            const fechaISO = isoFromDateInput(snap.fechaEvento);
            if (!fechaISO) throw new Error('Fecha inválida.');
            const vence = addBusinessDays(new Date(), snap.diasVencimientoPendiente || 3).toISOString();
            const p = PENDIENTE.crear({
              tipo: 'solicitud-clinico',
              descripcion: `Solicitar al servicio clínico generar SIGEM para ${equipo.nombre}: ${snap.descripcion || mp.obs || 'falla equipo'}`,
              equipoUuid: equipo.uuid,
              asignado: snap.responsable,
              vence,
              meta: { mpId: mp.id, causal: mp.resultado, fechaProblema: fechaISO, deteccion: snap.deteccion },
            });
            mp.pendienteVinculadoId = p.id;
            equipo.estado = 'NoOperativo';
            equipo.estadoDesde = fechaISO;
            pushEvento(equipo, { tipo:'CAUSAL-PENDIENTE-CLINICO', ts: fechaISO, payload: { mpId: mp.id, causal: mp.resultado, pendienteId: p.id } });
            persist('equipos');
            UI.toast(`Pendiente creado, vence ${fmt.date(vence)}. Equipo marcado No Operativo.`, 'success');
          }
          close('save');
          if (STATE.view) Router.go(STATE.view, STATE.viewParams);
        } catch (e) { bus.emit('error', e); }
      }}, 'Confirmar vinculación'));
    },
  });
}

/* ============================================================
   UI · CICLO VIEWER (stepper + forms por eslabón)
   ============================================================ */
function abrirCicloViewer(equipo, ciclo, opts = {}) {
  let active = opts.eslabon || ciclo.eslabonActual || 'diagnostico';
  let dirty = {}; // { eslabon: { field: val } } — current form values
  let modal;

  function renderAll(body) {
    body.innerHTML = '';
    body.appendChild(renderStepper(equipo, ciclo, active, (es) => {
      // Click en step: cambiar a ese eslabón
      if (es === active) return;
      active = es;
      dirty = {};
      renderAll(body);
    }));
    body.appendChild(renderEslabonHeader(equipo, ciclo, active, {
      cerrarModal: () => modal.close(),
      refresh: () => { active = ciclo.eslabonActual; renderAll(body); },
    }));
    if (!ciclo.abierto) {
      body.appendChild(h('div.banner.info', { style:{marginBottom:'12px'} }, [
        h('i.ti.ti-circle-check'),
        h('div.grow', [
          h('div', { style:{fontWeight:500} }, ciclo.cancelado ? 'Ciclo cancelado' : 'Ciclo cerrado'),
          h('div', { style:{fontSize:'11.5px', marginTop:'2px'} }, `${ciclo.cerradoMotivo || ''}${ciclo.cerradoEn ? ' · ' + fmt.datetime(ciclo.cerradoEn) : ''}`),
        ]),
        h('button.btn.sm', { onclick: async () => {
          const ok = await UI.dialog({ title:'Reabrir ciclo', message:'Esto vuelve a abrir el ciclo. ¿Continuar?', confirmText:'Reabrir' });
          if (!ok) return;
          CICLO.reabrir(equipo.uuid, ciclo.uuid);
          UI.toast('Ciclo reabierto.', 'success');
          renderAll(body);
        }}, [ h('i.ti.ti-refresh'), 'Reabrir' ]),
      ]));
    }
    body.appendChild(renderEslabonForm(equipo, ciclo, active, {
      dirty,
      cerrarModal: () => modal.close(),
      onChange: (() => {
        const persistBorrador = debounce((es, data) => CICLO.saveBorrador(equipo.uuid, ciclo.uuid, es, data), 800);
        return (data) => { dirty[active] = data; persistBorrador(active, data); };
      })(),
      onSaved: (res) => {
        // Después de guardar: recargar viewer
        if (res.closed) {
          UI.toast('Ciclo cerrado · equipo ' + (res.equipo.estado === 'Operativo' ? 'operativo' : res.equipo.estado), 'success');
          renderAll(body);
          return;
        }
        if (res.nextEslabon) {
          active = res.nextEslabon;
          dirty = {};
          UI.toast(`Eslabón guardado · siguiente: ${ESLABONES_LABEL[res.nextEslabon] || res.nextEslabon}`, 'success');
        } else {
          UI.toast('Eslabón actualizado.', 'success');
        }
        renderAll(body);
      },
    }));
  }

  modal = UI.modal({
    title: 'Ciclo correctivo',
    sub: `${equipo.nombre} · ${ciclo.apertura?.folioSigem || ciclo.solicitud?.folioSigem || 'sin folio SIGEM'}`,
    size: 'lg',
    content: (body) => renderAll(body),
    onClose: () => {
      // Al cerrar, refresca la vista actual
      if (STATE.view) Router.go(STATE.view, STATE.viewParams);
    },
  });
}

function renderStepper(equipo, ciclo, active, onClick) {
  const list = CICLO.eslabones(ciclo);
  const wrap = h('div.stepper');
  list.forEach((es, idx) => {
    const isQ = es === '?';
    const cls =
      isQ ? 'pending' :
      ESLABON_DONE(ciclo, es) && es !== active ? 'done' :
      es === active ? 'active' :
      es === ciclo.eslabonActual ? 'pending' :
      'pending';
    const step = h(`div.step.${cls}`, {
      onclick: () => { if (!isQ) onClick(es); },
      title: isQ ? 'Eslabón depende de la ruta elegida' : ESLABONES_LABEL[es],
    }, [
      h('span.num', { html: cls === 'done' ? '' : String(idx+1) }),
      h('span', isQ ? '· · ·' : ESLABONES_LABEL[es]),
    ]);
    if (isQ) step.classList.add('na');
    wrap.appendChild(step);
    if (idx < list.length - 1) wrap.appendChild(h('span.step-sep', '›'));
  });
  return wrap;
}

function renderEslabonHeader(equipo, ciclo, eslabon, ctx) {
  const isActive = eslabon === ciclo.eslabonActual;
  const isDone   = ESLABON_DONE(ciclo, eslabon);
  return h('div.eslabon-h', [
    h('div', [
      h('h4', ESLABONES_LABEL[eslabon] || eslabon),
      h('div.sub', isDone ? `Completado · ${fmt.date(ciclo[eslabon].fechaEvento)}` : isActive ? 'Eslabón activo' : 'Pendiente'),
    ]),
    h('div.grow'),
    ciclo.ruta ? h('span.pill', ciclo.ruta.replace('_',' ')) : null,
    ciclo.enGarantia ? h('span.pill.purple','garantía') : null,
    h('button.btn.icon.ghost', {
      title: 'Acciones del ciclo',
      onclick: (ev) => abrirMenuCiclo(equipo, ciclo, ctx, ev.currentTarget),
    }, [ h('i.ti.ti-dots') ]),
  ]);
}

function renderEslabonForm(equipo, ciclo, eslabon, ctx) {
  const wrap = h('div');
  const isActive   = eslabon === ciclo.eslabonActual;
  const isRetro    = ESLABON_DONE(ciclo, eslabon) && !isActive;     // retroactive edit
  const isFuture   = !ESLABON_DONE(ciclo, eslabon) && !isActive;    // sin alcanzar aún
  const borrador   = ciclo.borradores?.[eslabon] || null;
  const prev       = ciclo[eslabon] || null;
  const defaults   = Object.assign({}, prev || {}, borrador || {});
  const snap       = ctx.dirty[eslabon] || defaults;

  if (isFuture && !borrador) {
    wrap.appendChild(h('div.empty', { style:{padding:'30px 12px'} }, [
      h('i.ti.ti-arrow-left-bar'),
      h('h4', 'Eslabón aún no alcanzado'),
      h('p', 'Se habilita cuando avances los eslabones previos. Podés saltar a otro desde el stepper de arriba.'),
    ]));
    return wrap;
  }

  function pushField(node) { wrap.appendChild(node); }

  let getValues = () => ({});
  if (eslabon === 'apertura')      getValues = renderApertura(pushField, snap, ctx.onChange, equipo, ciclo);
  else if (eslabon === 'diagnostico') getValues = renderDiagnostico(pushField, snap, ctx.onChange, ciclo);
  else if (eslabon === 'compra')   getValues = renderCompra(pushField, snap, ctx.onChange);
  else if (eslabon === 'garantia') getValues = renderGarantia(pushField, snap, ctx.onChange);
  else if (eslabon === 'envio')    getValues = renderEnvio(pushField, snap, ctx.onChange);
  else if (eslabon === 'recepcion')getValues = renderRecepcion(pushField, snap, ctx.onChange);
  else if (eslabon === 'reparacion')getValues = renderReparacion(pushField, snap, ctx.onChange);

  // Acciones
  const acts = h('div.ciclo-actions');
  if (borrador && !prev) {
    acts.appendChild(h('span.pill.muted', { style:{marginRight:'auto'} }, `borrador guardado ${fmt.rel(borrador.ts)}`));
  } else if (isRetro) {
    acts.appendChild(h('span.pill.muted', { style:{marginRight:'auto'} }, 'edición retroactiva — no avanza el ciclo'));
  }
  if (isActive || isRetro) {
    acts.appendChild(h('button.btn.ghost', { onclick: ctx.cerrarModal || (() => {}) }, 'Cerrar sin guardar'));
    acts.appendChild(h('button.btn.primary', { onclick: () => {
      try {
        const data = getValues();
        const res = CICLO.saveEslabon(equipo.uuid, ciclo.uuid, eslabon, data, { advance: isActive });
        ctx.onSaved(res);
      } catch (e) { bus.emit('error', e); }
    }}, isActive ? 'Guardar y avanzar' : 'Guardar cambios'));
  }
  wrap.appendChild(acts);
  return wrap;
}

/* ============================================================
   REC · grabación de sesión
   ============================================================ */
const REC = (() => {
  let active = false;
  let startedAt = null;
  let events = [];
  let handlers = [];

  function on(target, evt, fn, opts) {
    target.addEventListener(evt, fn, opts);
    handlers.push(() => target.removeEventListener(evt, fn, opts));
  }

  function describeEl(el) {
    if (!el || !el.tagName) return '';
    let s = el.tagName.toLowerCase();
    if (el.id) s += '#' + el.id;
    if (el.className && typeof el.className === 'string') s += '.' + el.className.split(/\s+/).slice(0,2).join('.');
    return s;
  }

  function maybeRedact(field, value) {
    if (!field) return value;
    const f = (field + '').toLowerCase();
    if (f.includes('sigem') || f.includes('folio')) return '«REDACTED»';
    return value;
  }

  function truncate(v) {
    const s = String(v ?? '');
    return s.length > 120 ? s.slice(0,120) + '…' : s;
  }

  function pushEvent(ev) {
    events.push(ev);
    if (events.length > 50000) events.shift();
    const dot = document.getElementById('recDot');
    if (dot) dot.textContent = `REC · ${events.length}`;
  }

  function start() {
    if (active) return;
    active = true;
    startedAt = new Date().toISOString();
    events = [];

    on(document, 'click', (e) => {
      pushEvent({
        ts: new Date().toISOString(),
        tipo: 'click',
        elemento: describeEl(e.target),
        x: e.clientX, y: e.clientY,
      });
    }, { capture: true });

    on(document, 'change', (e) => {
      const t = e.target;
      if (!t) return;
      const field = t.id || t.name || describeEl(t);
      let val = '';
      if (t.type === 'file') val = '[file]';
      else if (t.type === 'password') val = '«REDACTED»';
      else val = truncate(maybeRedact(field, t.value));
      pushEvent({
        ts: new Date().toISOString(),
        tipo: 'change',
        elemento: describeEl(t),
        campo: field,
        valor: val,
      });
    }, { capture: true });

    on(document, 'submit', (e) => {
      pushEvent({ ts: new Date().toISOString(), tipo: 'submit', elemento: describeEl(e.target) });
    }, { capture: true });

    updateChip();
    UI.toast('Grabación iniciada. Aparece un indicador rojo en la sidebar.', 'info', { duration: 4000 });
  }

  function stop({ downloadBackup = true } = {}) {
    if (!active) return null;
    active = false;
    handlers.forEach(off => { try { off(); } catch {} });
    handlers = [];
    const payload = {
      sesion: { inicio: startedAt, fin: new Date().toISOString(), totalEventos: events.length, appVersion: APP_VERSION },
      eventos: events,
    };
    const ts = new Date().toISOString().replace(/[:.]/g,'-');
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pmp_rec_${ts}.json`;
    document.body.appendChild(a); a.click(); a.remove();

    if (downloadBackup) {
      try { exportBackup(); } catch {}
    }

    events = [];
    startedAt = null;
    updateChip();
    UI.toast(`Grabación detenida (${payload.sesion.totalEventos} eventos). Archivo descargado.`, 'success', { duration: 5000 });
    return payload;
  }

  function toggle() { active ? stop() : start(); }
  function isActive() { return active; }

  function updateChip() {
    const wrap = document.getElementById('recChip');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (active) {
      wrap.appendChild(h('button.btn.sm.danger', { onclick: () => stop(), title:'Detener grabación' }, [
        h('span', { id:'recDot', style:{ display:'inline-flex', alignItems:'center', gap:'6px' } }, [
          h('span', { style:{width:'8px', height:'8px', borderRadius:'50%', background:'#dc2626', display:'inline-block', animation:'pulseDot 1.4s ease-in-out infinite'} }),
          `REC · ${events.length}`,
        ]),
        h('i.ti.ti-player-stop', { style:{marginLeft:'6px'} }),
      ]));
    } else {
      wrap.appendChild(h('button.btn.ghost.sm', { onclick: () => start(), title:'Iniciar grabación de sesión' }, [
        h('i.ti.ti-record-mail'), 'Grabar sesión',
      ]));
    }
  }

  return { start, stop, toggle, isActive, updateChip };
})();
