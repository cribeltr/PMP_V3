function abrirModalVinculacionC2(equipo, mp) {
  // Buscar envíos pre-existentes en ciclos abiertos del equipo (ya hubo envío sin recibir).
  const ciclosConEnvio = (equipo.correctivos || []).filter(c => c.abierto && c.envio);
  let modo = ciclosConEnvio.length ? 'existente' : 'nuevo';
  let snap = {
    cicloUuidExistente: ciclosConEnvio[0]?.uuid || null,
    folioEnvio: '',
    empresa: '',
    fecha: dateInputValue(mp.fechaEvento || mp.fecha),
    responsable: '',
    deteccion: 'Servicio clínico avisó',
    descripcion: mp.obs || '',
  };

  UI.modal({
    title: 'Vincular causal C2',
    sub: 'El equipo pasa a En Servicio Técnico al confirmar.',
    size: 'md',
    content: (body, { close }) => {
      body.appendChild(h('p', { style:{margin:'0 0 14px 0', color:'var(--ink-2)', fontSize:'12.5px'} },
        'C2 = el equipo ya está en servicio técnico. Hay que ligarlo al envío.'));

      const opts = h('div', { style:{ display:'flex', flexDirection:'column', gap:'6px', marginBottom:'14px' } });
      function radio(value, label, desc) {
        return h('label', { style:{ display:'flex', gap:'10px', alignItems:'flex-start', padding:'10px 12px', border:'.5px solid var(--line-2)', borderRadius:'8px', cursor:'pointer', background: modo===value?'var(--paper-2)':'transparent' } }, [
          h('input', { type:'radio', name:'modo', value, checked: modo===value, onchange:(e)=>{ modo = e.target.value; render(); } }),
          h('div', { style:{flex:1} }, [
            h('div', { style:{fontWeight:500, fontSize:'13px'} }, label),
            h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px', marginTop:'2px'} }, desc),
          ]),
        ]);
      }
      body.appendChild(opts);
      const formArea = h('div');
      body.appendChild(formArea);

      function render() {
        opts.innerHTML = '';
        if (ciclosConEnvio.length) opts.appendChild(radio('existente', 'Vincular a envío existente de un ciclo abierto', `${ciclosConEnvio.length} envío${ciclosConEnvio.length>1?'s':''} sin recepcionar.`));
        opts.appendChild(radio('nuevo', 'Crear ciclo con envío ya hecho', 'El envío ya ocurrió. El ciclo arranca directamente en Recepción.'));

        formArea.innerHTML = '';
        if (modo === 'existente') {
          const sel = selectCtl(
            ciclosConEnvio.map(c => ({
              value: c.uuid,
              label: `${c.envio.folioEnvio || 'sin folio'} · ${c.envio.empresa || 'sin empresa'} · ${fmt.date(c.envio.fechaEvento || c.envio.fecha)}`,
            })),
            snap.cicloUuidExistente,
            { onchange:(e)=> snap.cicloUuidExistente = e.target.value },
          );
          formArea.appendChild(field('Envío a vincular', sel));
        } else {
          formArea.appendChild(row('1fr 1fr', [
            field('Fecha del envío', dateCtl(snap.fecha, { onchange:(e)=> snap.fecha = e.target.value })),
            field('Empresa', inputCtl({ value: snap.empresa, placeholder:'p. ej. Importadora ACME', oninput:(e)=> snap.empresa = e.target.value })),
          ]));
          formArea.appendChild(row('1fr 1fr', [
            field('Folio de envío', inputCtl({ value: snap.folioEnvio, oninput:(e)=> snap.folioEnvio = e.target.value })),
            field('Responsable', inputCtl({ value: snap.responsable, oninput:(e)=> snap.responsable = e.target.value })),
          ]));
          formArea.appendChild(field('Descripción / contexto', textareaCtl({ rows:2, value: snap.descripcion, oninput:(e)=> snap.descripcion = e.target.value })));
        }
      }
      render();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: () => {
        UI.toast('Causal C2 sin vincular — el equipo no cambia de estado. Aparecerá aviso en la ficha.', 'warning', { duration: 7000 });
        close('cancel');
      } }, 'Vincular después'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        try {
          if (modo === 'existente') {
            if (!snap.cicloUuidExistente) throw new Error('Elegí un ciclo.');
            const c = (equipo.correctivos||[]).find(x => x.uuid === snap.cicloUuidExistente);
            if (!c) throw new Error('Ciclo no encontrado.');
            mp.correctivoUuid = c.uuid;
            equipo.estado = 'ServicioTecnico';
            equipo.estadoDesde = c.envio.fechaEvento || c.envio.fecha;
            pushEvento(equipo, { tipo:'CAUSAL-VINCULADA', ts: equipo.estadoDesde, payload: { mpId: mp.id, causal: mp.resultado, cicloUuid: c.uuid, envio: true } });
            persist('equipos');
            UI.toast('Causal C2 vinculada al envío existente.', 'success');
          } else {
            const fechaISO = isoFromDateInput(snap.fecha);
            if (!fechaISO) throw new Error('Fecha del envío inválida.');
            if (!snap.empresa.trim()) throw new Error('Indicá la empresa.');
            const { ciclo } = CICLO.crear(equipo.uuid, {
              fechaEvento: fechaISO,
              deteccion: snap.deteccion,
              descripcion: snap.descripcion || `Causal ${mp.resultado}: equipo ya en servicio técnico`,
              responsable: snap.responsable,
              sigemEstado: 'noAplica',
              folioSigem: '',
              startEslabon: 'recepcion',
              envio: { folioEnvio: snap.folioEnvio, empresa: snap.empresa, fecha: fechaISO, responsable: snap.responsable },
              causalLink: { mpId: mp.id, causal: mp.resultado },
            });
            mp.correctivoUuid = ciclo.uuid;
            persist('equipos');
            UI.toast(`Ciclo creado en Recepción y causal C2 vinculada.`, 'success');
          }
          close('save');
          if (STATE.view) Router.go(STATE.view, STATE.viewParams);
        } catch (e) { bus.emit('error', e); }
      }}, 'Confirmar vinculación'));
    },
  });
}

function renderSessionChip() {
  const s = STATE.session;
  const meta = STATE.meta;
  const lines = [];
  if (s.archivoCargado) lines.push(`Maestro: ${s.archivoCargado.replace(/\.[^.]+$/,'')}`);

function resultadoPill(r) {
  if (!r) return h('span.pill.muted','—');
  if (r === 'SI') return h('span.pill.success','SI');
  if (r === 'NO') return h('span.pill.warning','NO');
  if (r === 'FS') return h('span.pill.muted','FS');
  if (r === 'BAJA') return h('span.pill.danger','BAJA');
  if (CAUSALES[r]) return h(`span.pill.${CAUSALES[r].grupo==='A'?'warning':'info'}`, r);
  return h('span.pill', r);
}

function kpiCard({ label, value, kind='', onclick }) {
  return h(`div.kpi ${kind}`.trim(), { onclick }, [
    h('span.label', label),
    h('span.value', value ?? '—'),
  ]);
}

function viewHeader({ title, desc, actions=[] }) {

}

        h(`button.btn ${a.primary?'primary':''}`.trim(), { onclick: a.onclick }, [

        desc: 'Importá el Excel maestro o restaurá un backup JSON.',
        actions: [
          { label: 'Importar maestro', icon: 'ti-file-spreadsheet', primary: true, onclick: handleImportMaestro },
          { label: 'Restaurar backup', icon: 'ti-database-import', onclick: importBackup },
        ],
      }));

    }

    const tableWrap = h('div.table-wrap');

    // toolbar
    const search = h('div.search', [
      h('i.ti.ti-search'),
      h('input', { type:'text', placeholder:'Buscar por nombre, serie, inventario, marca…', value: filters.q }),
    ]);
    const selServicio = selectField('Servicio', '', EQ.servicios(), filters.servicio);
    const selFamilia  = selectField('Familia',  '', EQ.familias(),  filters.familia);
    const selEstado   = selectField('Estado',   '', ESTADOS.map(s => ({ value: s, label: ESTADO_LABEL[s] })), filters.estado);
    const selResp     = selectField('Responsable', '', EQ.responsables(), filters.responsable);
    const selGar      = selectField('Garantía', '', [{value:'si',label:'En garantía'},{value:'no',label:'Sin garantía'}], filters.garantia);
    const selSlot     = selectField('Slots', '', [{value:'no',label:'Ocultar slots'},{value:'si',label:'Sólo slots'}], filters.slot);

    const toolbar = h('div.table-toolbar', [
      search,
      h('div.right', [ selServicio, selFamilia, selEstado, selResp, selGar, selSlot,
        h('button.btn.ghost.sm', { onclick: () => Router.go('inv', {}) }, [ h('i.ti.ti-x'), 'Limpiar' ]),
      ]),
    ]);

    const meta = h('div.table-meta', '');
    const tbl = h('table.dt');
    tbl.innerHTML = `<thead><tr>
      <th>Servicio</th>
      <th>Equipo</th>
      <th>Inventario</th>
      <th>Serie</th>
      <th>Marca / Modelo</th>
      <th>Frec.</th>
      <th>Estado</th>
    </tr></thead>`;
    const tb = h('tbody');
    tbl.appendChild(tb);

    tableWrap.appendChild(toolbar);
    tableWrap.appendChild(meta);
    tableWrap.appendChild(tbl);

    root.appendChild(tableWrap);

    // dynamic list state
    let rendered = 0;
    const PAGE = 80;
    let current = [];

    function applyFilters() {
      const f = {
        servicio: selServicio.querySelector('select').value,
        familia:  selFamilia.querySelector('select').value,
        estado:   selEstado.querySelector('select').value,
        responsable: selResp.querySelector('select').value,
        garantia: selGar.querySelector('select').value,
        slot:     selSlot.querySelector('select').value,
      };
      const q = search.querySelector('input').value;
      current = EQ.search(q, f);
      current.sort((a,b) => (a.servicio||'').localeCompare(b.servicio||'','es') || (a.nombre||'').localeCompare(b.nombre||'','es'));
      tb.innerHTML = '';
      rendered = 0;
      meta.textContent = `${fmt.number(current.length)} equipos coinciden con los filtros`;
      renderMore();
    }
    function renderMore() {
      const slice = current.slice(rendered, rendered + PAGE);
      slice.forEach(e => tb.appendChild(rowForEquipo(e)));
      rendered += slice.length;
      if (rendered >= current.length) sentinel.style.display = 'none';
      else sentinel.style.display = '';
    }
    const sentinel = h('tr', { style:{} }, [ h('td', { colspan: 7, style:{textAlign:'center', color:'var(--ink-3)', padding:'10px', fontSize:'11.5px'} }, 'Cargando más…') ]);
    tb.parentNode.appendChild(sentinel); // outside tbody (browser tolerates)
    const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting && rendered < current.length) renderMore(); }), { rootMargin: '120px' });

    search.querySelector('input').addEventListener('input', applyFilters);
    [selServicio, selFamilia, selEstado, selResp, selGar, selSlot].forEach(s => s.querySelector('select').addEventListener('change', applyFilters));

    applyFilters();
    io.observe(sentinel);
  },
};

function selectField(label, placeholder, items, value='') {
  const wrap = h('div');
  const sel = h('select.select');
  sel.appendChild(h('option', { value: '' }, label));
  items.forEach(it => {
    if (typeof it === 'string') sel.appendChild(h('option', { value: it }, it));
    else sel.appendChild(h('option', { value: it.value }, it.label));
  });
  if (value) sel.value = value;
  wrap.appendChild(sel);
  return wrap;
}

function rowForEquipo(e) {
  const tr = h('tr', { onclick: () => openFicha(e.uuid) });
  if (e.esSlot) tr.classList.add('is-slot');
  const pill = e.esSlot
    ? h('span.pill.muted', 'Slot')
    : h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), [ h('span.dot'), ESTADO_LABEL[e.estado] || e.estado ]);
  tr.appendChild(h('td.truncate', { title: e.servicio }, e.servicio || '—'));
  tr.appendChild(h('td', [
    h('div', e.nombre || '—'),
    h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, e.fam || ''),
  ]));
  tr.appendChild(h('td.col-mono', e.inventario || '—'));
  tr.appendChild(h('td.col-mono', e.serie || '—'));
  tr.appendChild(h('td.truncate', { title:`${e.marca} ${e.modelo}` }, `${e.marca || ''} ${e.modelo ? '· ' + e.modelo : ''}`.trim() || '—'));
  tr.appendChild(h('td', e.frecuencia ? h('span.pill', e.frecuencia) : '—'));
  tr.appendChild(h('td', pill));
  return tr;
}

function openFicha(uuid) {
  const e = EQ.byUuid(uuid);
  if (!e) { bus.emit('error', new Error('Equipo no encontrado.')); return; }

  const TABS = [
    { id: 'datos',     label: 'Datos',     icon: 'ti-id-badge-2' },
    { id: 'garantia',  label: 'Garantía',  icon: 'ti-shield-check' },
    { id: 'grilla',    label: 'Grilla anual', icon: 'ti-calendar-month' },
    { id: 'historial', label: 'Historial MP', icon: 'ti-history', count: (e.historial||[]).length },
    { id: 'eventos',   label: 'Eventos',   icon: 'ti-timeline', count: (e.eventos||[]).length },
    { id: 'ciclos',    label: 'Ciclos',    icon: 'ti-tools',    count: (e.correctivos||[]).length },
    { id: 'pendientes',label: 'Pendientes',icon: 'ti-checklist',count: (e.pendientesIds||[]).length },
  ];

  UI.modal({
    title: e.nombre || '(sin nombre)',
    sub: [
      e.fam, e.servicio, e.serie ? `S/N ${e.serie}` : null, e.inventario ? `Inv ${e.inventario}` : null,
    ].filter(Boolean).join(' · '),
    size: 'lg',
    content: (body) => {
      // Banners de alerta (Grupo A > 30d, sigem pendiente, causales sin vincular)
      const alertas = alertasDeEquipo(e);
      if (alertas.length) {
        alertas.forEach(a => {
          const banner = h(`div.banner.${a.kind}`, { style:{ marginBottom:'8px' } }, [
            h('i.ti', { class: 'ti ' + (a.icon || 'ti-alert-circle') }),
            h('div.grow', a.text),
            a.action ? h('button.btn.sm', { onclick: a.action.handler }, a.action.label) : null,
          ]);
          body.appendChild(banner);
        });
      }

      // Header strip with status & warranty
      const strip = h('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'10px' } });
      const pill = e.esSlot
        ? h('span.pill.muted', 'Slot disponible')
        : h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), [ h('span.dot'), ESTADO_LABEL[e.estado] || e.estado ]);
      strip.appendChild(pill);
      if (e.enGarantia) strip.appendChild(h('span.pill.purple', [ h('i.ti.ti-shield-check', {style:{fontSize:'12px'}}), 'En garantía' ]));
      if (e.frecuencia) strip.appendChild(h('span.pill', `MP ${e.frecuencia.toLowerCase()}`));
      if (e.estadoDesde) strip.appendChild(h('span.pill.muted', `Desde ${fmt.rel(e.estadoDesde)}`));
      const ciclosAb = (e.correctivos||[]).filter(c => c.abierto);
      if (ciclosAb.length) strip.appendChild(h('span.pill.warning', [h('i.ti.ti-tools',{style:{fontSize:'12px'}}), `${ciclosAb.length} ciclo${ciclosAb.length>1?'s':''} abierto${ciclosAb.length>1?'s':''}`]));
      body.appendChild(strip);

      // Tabs
      const tabs = h('div.tabs', { style:{padding:0, marginBottom:'14px'} });
      const panel = h('div');
      TABS.forEach((t,i) => {
        const tab = h('div.tab', { dataset:{ tab: t.id } }, [ t.label, t.count != null ? h('span.count', t.count) : null ]);
        if (i === 0) tab.classList.add('active');
        tab.addEventListener('click', () => {
          $$('.tab', tabs).forEach(x => x.classList.remove('active'));
          tab.classList.add('active');
          panel.innerHTML = '';
          panel.appendChild(renderFichaTab(t.id, e));
        });
        tabs.appendChild(tab);
      });
      body.appendChild(tabs);
      body.appendChild(panel);
      panel.appendChild(renderFichaTab('datos', e));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cerrar'));
      f.appendChild(h('button.btn', { onclick: () => { close(); abrirModalRegistrarMP(e); } }, [ h('i.ti.ti-calendar-plus'), 'Registrar MP' ]));
      const hayCicloAbierto = (e.correctivos||[]).some(c => c.abierto);
      f.appendChild(h(`button.btn.primary ${hayCicloAbierto?'ghost':''}`.trim(), {
        onclick: () => { close(); abrirModalAperturaCiclo(e); },
        title: hayCicloAbierto ? 'Ya hay un ciclo abierto — ver en pestaña Ciclos' : '',
      }, [ h('i.ti.ti-tools'), hayCicloAbierto ? 'Ver ciclo en curso' : 'Abrir ciclo correctivo' ]));
    },
  });
}

function abrirModalAperturaCiclo(equipo) {
  // Versión mínima It.2: redirige a flujo simple "crear ciclo en diagnóstico" sin causal previa.
  // La UI completa por eslabón llega en It.3.
  let snap = {
    fechaEvento: todayISO(),
    deteccion: 'Servicio clínico avisó',
    descripcion: '',
    responsable: '',
    sigemEstado: 'falta',
    folioSigem: '',
  };
  UI.modal({
    title: 'Apertura de ciclo correctivo',
    sub: equipo.nombre,
    size: 'md',
    content: (body) => {
      body.appendChild(h('p', { style:{margin:'0 0 12px 0', color:'var(--ink-2)', fontSize:'12.5px'} },
        'El equipo pasa a No Operativo con la fecha real del problema. Si todavía no hay folio SIGEM, se crea un pendiente para gestionarlo.'));
      body.appendChild(row('1fr 1fr', [
        field('Fecha real del problema *', dateCtl(snap.fechaEvento, { onchange:(e)=> snap.fechaEvento = e.target.value }), 'Admite fechas pasadas.'),
        field('Cómo se detectó', selectCtl(DETECCIONES_APERTURA, snap.deteccion, { onchange:(e)=> snap.deteccion = e.target.value })),
      ]));
      body.appendChild(field('Descripción del problema *', textareaCtl({ rows:3, oninput:(e)=> snap.descripcion = e.target.value })));
      body.appendChild(row('1fr 1fr', [
        field('Responsable que recibe el caso *', inputCtl({ oninput:(e)=> snap.responsable = e.target.value })),
        field('Estado de la solicitud SIGEM', selectCtl([
          { value:'falta',    label:'Falta gestionar con servicio clínico (por defecto)' },
          { value:'existe',   label:'Ya existe — tengo el folio' },
          { value:'noAplica', label:'No aplica' },
        ], snap.sigemEstado, { onchange:(e)=> { snap.sigemEstado = e.target.value; renderSigem(); } })),
      ]));
      const sigemRow = h('div');
      body.appendChild(sigemRow);
      function renderSigem() {
        sigemRow.innerHTML = '';
        if (snap.sigemEstado === 'existe') {
          sigemRow.appendChild(field('Folio SIGEM *', inputCtl({ placeholder:'2026-12345', oninput:(e)=> snap.folioSigem = e.target.value })));
        } else if (snap.sigemEstado === 'falta') {
          sigemRow.appendChild(h('div.banner.warning', [ h('i.ti.ti-info-circle'), h('div.grow','Se creará un pendiente "Solicitar folio SIGEM al servicio clínico" con vencimiento 3 días hábiles. El ciclo arrancará igual con banner amarillo en la ficha.') ]));
        }
      }
      renderSigem();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        try {
          const fechaISO = isoFromDateInput(snap.fechaEvento);
          if (!fechaISO) throw new Error('Fecha inválida.');
          if (!snap.descripcion.trim()) throw new Error('Falta descripción.');
          if (!snap.responsable.trim()) throw new Error('Indicá un responsable.');
          if (snap.sigemEstado === 'existe' && !snap.folioSigem.trim()) throw new Error('Indicá el folio SIGEM o cambiá a "Falta gestionar".');
          const { ciclo } = CICLO.crear(equipo.uuid, {
            fechaEvento: fechaISO,
            deteccion: snap.deteccion,
            descripcion: snap.descripcion.trim(),
            responsable: snap.responsable.trim(),
            sigemEstado: snap.sigemEstado,
            folioSigem: snap.folioSigem.trim(),
            startEslabon: 'diagnostico',
          });
          UI.toast('Ciclo abierto. Equipo marcado No Operativo.', 'success');
          close('save');
          openFicha(equipo.uuid);
        } catch (e) { bus.emit('error', e); }
      }}, 'Abrir ciclo'));
    },
  });
}

function renderFichaTab(id, e) {
  const wrap = h('div');
  switch (id) {
    case 'datos': {
      const dl = h('dl.dl');
      [
        ['Nombre', e.nombre || '—'],
        ['Familia', e.fam || '—'],
        ['Servicio', e.servicio || '—'],
        ['Unidad', e.unidad || '—'],
        ['Ubicación', e.ubicacion || '—'],
        ['Procedencia', e.procedencia || '—'],
        ['Marca', e.marca || '—'],
        ['Modelo', e.modelo || '—'],
        ['Serie', e.serie || '—'],
        ['Inventario', e.inventario || '—'],
        ['Carpeta', e.carpeta ?? '—'],
        ['Año instalación', e.anio || '—'],
        ['Vida útil residual', e.vidaUtil || '—'],
        ['Clasificación', e.clasificacion || '—'],
        ['Frecuencia MP', e.frecuencia || '—'],
        ['Responsable (maestro)', e.responsableMaster || '—'],
        ['ENU / baja', e.enu || '—'],
        ['Estado actual', ESTADO_LABEL[e.estado] || e.estado || '—'],
        ['Estado desde', e.estadoDesde ? `${fmt.date(e.estadoDesde)} (${fmt.rel(e.estadoDesde)})` : '—'],
        ['Observación', e.observacion || '—'],
      ].forEach(([k,v]) => { dl.appendChild(h('dt', k)); dl.appendChild(h('dd', v)); });
      wrap.appendChild(dl);
      break;
    }
    case 'garantia': {
      if (!e.enGarantia) {
        wrap.appendChild(h('div.empty', [
          h('i.ti.ti-shield-off'),
          h('h4', 'Sin garantía activa'),
          h('p', 'Podrás declarar garantía y proveedor desde la edición del equipo (It.3).'),
        ]));
      } else {
        const dl = h('dl.dl', [
          h('dt', 'Estado'), h('dd', h('span.pill.purple','En garantía')),
          h('dt', 'Proveedor'), h('dd', e.garantiaProveedor || '—'),
          h('dt', 'Vigente hasta'), h('dd', e.garantiaHasta ? fmt.date(e.garantiaHasta) : '—'),
        ]);
        wrap.appendChild(dl);
      }
      break;
    }
    case 'grilla': {
      const grilla = h('div.grilla');
      for (let m = 1; m <= 12; m++) {
        const v = e.grilla?.[m] || null;
        const ejecutada = (e.historial||[]).some(h => h.mes === m && h.resultado === 'SI');
        const cell = h(`div.cell ${v?'v-'+v:''}`.trim(), {
          style:{ cursor:'pointer' },
          title: 'Click para editar marcador o registrar MP',
          onclick: () => abrirModalGrillaCelda(e, m),
        }, [
          h('span.m', MESES[m-1]),
          h('span.v', ejecutada ? '✓' : (v || '')),
        ]);
        grilla.appendChild(cell);
      }
      wrap.appendChild(grilla);
      wrap.appendChild(h('p', { style:{ color:'var(--ink-3)', fontSize:'11.5px', marginTop:'10px' } }, 'X = programada · R = reprogramada · RA = legado · PM = puesta en marcha · ✓ = MP ejecutada.'));
      break;
    }
    case 'historial': {
      const hs = (e.historial || []).slice().sort((a,b) => new Date(b.fecha||0) - new Date(a.fecha||0));
      if (!hs.length) { wrap.appendChild(emptyTabHint('Sin registros de MP todavía.')); break; }
      const tbl = h('table.dt');
      tbl.innerHTML = `<thead><tr><th>Fecha</th><th>Mes</th><th>Resultado</th><th>Estado final</th><th>Ejecutor</th><th>Observación</th></tr></thead>`;
      const tb = h('tbody');
      hs.forEach(row => {
        const tr = h('tr', { style:{cursor: row.id ? 'pointer' : 'default'}, onclick: () => { if (row.id) abrirModalRegistrarMP(e, { edit: row }); } }, [
          h('td.col-mono', fmt.date(row.fechaEvento || row.fecha)),
          h('td', MESES[(row.mes||1)-1]),
          h('td', resultadoPill(row.resultado)),
          h('td', row.estadoFinal ? ESTADO_LABEL[row.estadoFinal] || row.estadoFinal : '—'),
          h('td', row.ejecutor || '—'),
          h('td.truncate', { title: row.obs||'' }, row.obs || ''),
        ]);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      wrap.appendChild(h('div.table-wrap', [ tbl ]));
      break;
    }
    case 'eventos': {
      const evs = (e.eventos || []).slice().sort((a,b) => new Date(b.ts||0) - new Date(a.ts||0));
      if (!evs.length) { wrap.appendChild(emptyTabHint('Aún no hay eventos en el timeline.')); break; }
      const tl = h('div.timeline');
      evs.forEach(ev => {
        tl.appendChild(h('div.tl-item', [
          h('div.tl-date', [ fmt.date(ev.ts), h('div',{style:{color:'var(--ink-4)',fontSize:'10.5px'}}, fmt.rel(ev.ts)) ]),
          h('div.tl-body', [
            h('div.title', ev.tipo || '—'),
            ev.payload ? h('div.desc', typeof ev.payload === 'string' ? ev.payload : JSON.stringify(ev.payload)) : null,
          ]),
        ]));
      });
      wrap.appendChild(tl);
      break;
    }
    case 'ciclos': {
      const cs = (e.correctivos || []).slice().reverse();
      if (!cs.length) { wrap.appendChild(emptyTabHint('No hay ciclos correctivos para este equipo.')); break; }
      cs.forEach(c => {
        const card = h('div.card', { style:{ marginBottom: '10px' } }, [
          h('div.card-h', [
            h('h3', c.abierto ? 'Ciclo en curso' : 'Ciclo cerrado'),
            h('span.sub', `Eslabón actual: ${c.eslabonActual || '—'}`),
            c.enGarantia ? h('span.pill.purple', 'Garantía') : null,
            c.abierto ? h('span.pill.warning', 'Abierto') : h('span.pill.muted', 'Cerrado'),
          ]),
          h('div', { style:{ fontSize:'12.5px', color:'var(--ink-2)' } }, [
            c.apertura?.fechaEvento ? `Aperturado el ${fmt.date(c.apertura.fechaEvento)}. ` :
            c.apertura?.fecha       ? `Aperturado el ${fmt.date(c.apertura.fecha)}. ` :
            c.solicitud?.fecha      ? `Solicitud del ${fmt.date(c.solicitud.fecha)}. ` : '',
            c.apertura?.folioSigem ? `Folio SIGEM ${c.apertura.folioSigem}. ` :
            c.solicitud?.folioSigem ? `Folio SIGEM ${c.solicitud.folioSigem}. ` : '',
            c.ruta ? `Ruta: ${c.ruta}.` : '',
          ]),
        ]);
        wrap.appendChild(card);
      });
      break;
    }
    case 'pendientes': {
      const ps = (e.pendientesIds||[])
        .map(id => STATE.pendientes.find(p => p.id === id))
        .filter(Boolean);
      if (!ps.length) { wrap.appendChild(emptyTabHint('Sin pendientes administrativos vinculados.')); break; }
      ps.forEach(p => {
        wrap.appendChild(h('div.card', { style:{ marginBottom:'8px' } }, [
          h('div.card-h', [ h('h3', p.descripcion || '(sin descripción)'), p.estado === 'Cerrado' ? h('span.pill.success','Cerrado') : h('span.pill.warning','Abierto') ]),
          h('div', { style:{ fontSize:'12.5px', color:'var(--ink-2)' } }, [
            p.asignado ? `Asignado a ${p.asignado}. ` : '',
            p.vence ? `Vence ${fmt.date(p.vence)}. ` : (p.fechaCompromiso ? `Vence ${fmt.date(p.fechaCompromiso)}. ` : ''),
            p.creado ? `Creado ${fmt.rel(p.creado)}.` : '',
          ]),
        ]));
      });
      break;
    }
  }
  return wrap;
}

function emptyTabHint(msg) {
  return h('div', { style:{ color:'var(--ink-3)', fontSize:'12.5px', padding:'18px 4px' } }, msg);

function renderCumplimientoSidecar() {
  const now = new Date();
  const mes = now.getMonth()+1;
  const programadas = STATE.equipos.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R');
  const ejecutadas  = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI'));
  const causalizadas = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && CAUSALES[h.resultado]));
  const pendientes   = programadas.length - ejecutadas.length - causalizadas.length;
  const pct = programadas.length ? Math.round(ejecutadas.length / programadas.length * 100) : 0;

  return h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'10px', marginTop:'14px' } }, [
    kpiCard({ label: `${MESES[mes-1]} · programadas`, value: fmt.number(programadas.length) }),
    kpiCard({ label: 'Ejecutadas (SI)', value: `${fmt.number(ejecutadas.length)} (${pct}%)`, kind: pct >= 80 ? 'success' : pct >= 50 ? 'warning' : 'danger' }),
    kpiCard({ label: 'Causalizadas', value: fmt.number(causalizadas.length), kind: 'warning' }),
    kpiCard({ label: 'Pendientes', value: fmt.number(Math.max(pendientes,0)), kind: pendientes > 0 ? 'danger' : 'success' }),
  ]);
}

function filterEquiposForPMP(f) {
  const list = STATE.equipos.filter(e => !e.esSlot && e.estado !== 'DeBaja');
  const n = normalize(f.q);
  return list.filter(e => {
    if (f.servicio && e.servicio !== f.servicio) return false;
    if (f.familia  && e.fam !== f.familia) return false;
    if (f.frecuencia && e.frecuencia !== f.frecuencia) return false;
    if (!n) return true;
    return normalize(`${e.nombre} ${e.serie} ${e.inventario} ${e.marca} ${e.modelo}`).includes(n);
  });
}

function renderMes(container, meta, f) {
  const m = f.mes;
  const equipos = filterEquiposForPMP(f);
  const filas = equipos
    .map(e => {
      const programado = e.grilla?.[m] || null;
      const hist = (e.historial || []).filter(h => h.mes === m).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
      const ultimo = hist[0] || null;
      return { e, programado, ultimo };
    })
    .filter(r => r.programado || r.ultimo);

  filas.sort((a,b) => {
    const orden = (r) => {
      if (r.ultimo?.resultado === 'SI') return 4;
      if (r.ultimo && CAUSALES[r.ultimo.resultado]) return 2;
      if (r.programado) return 1;
      return 5;
    };
    return orden(a) - orden(b) || (a.e.servicio||'').localeCompare(b.e.servicio||'','es');
  });

  meta.textContent = `${MESES[m-1]} · ${filas.length} equipos con actividad`;

  if (!filas.length) {
    container.appendChild(h('div.empty', { style:{padding:'40px 12px'} }, [
      h('i.ti.ti-calendar-off'), h('h4','Sin actividad programada para este mes'),
    ]));
    return;
  }

  const tbl = h('table.dt');
  tbl.innerHTML = `<thead><tr>
    <th>Servicio</th><th>Equipo</th><th>Frec.</th><th>Programado</th><th>Resultado</th><th>Fecha</th><th>Ejecutor</th><th></th>
  </tr></thead>`;
  const tb = h('tbody');
  filas.forEach(({ e, programado, ultimo }) => {
    const tr = h('tr');
    tr.appendChild(h('td.truncate', { title: e.servicio }, e.servicio || '—'));
    tr.appendChild(h('td', [
      h('div', e.nombre),

function renderAnio(container, meta, f) {
  const equipos = filterEquiposForPMP(f);
  meta.textContent = `${equipos.length} equipos · grilla 12 meses (click en celda para editar)`;
  if (!equipos.length) {
    container.appendChild(h('div.empty', { style:{padding:'40px 12px'} }, [
      h('i.ti.ti-calendar-off'), h('h4','Sin equipos con los filtros actuales'),
    ]));
    return;
  }
  const tbl = h('table.dt');
  tbl.innerHTML = `<thead><tr>
    <th>Servicio</th><th>Equipo</th>${MESES.map(m => `<th style="text-align:center;width:42px;">${m}</th>`).join('')}
  </tr></thead>`;
  const tb = h('tbody');
  equipos.slice(0, 300).forEach(e => {
    const tr = h('tr');
    tr.appendChild(h('td.truncate', { title: e.servicio, style:{maxWidth:'140px'} }, e.servicio || '—'));
    tr.appendChild(h('td.truncate', { title: e.nombre, style:{maxWidth:'200px'} }, e.nombre || '—'));
    for (let m = 1; m <= 12; m++) {
      const v = e.grilla?.[m] || null;
      const ejec = (e.historial||[]).find(h => h.mes === m && h.resultado === 'SI');
      const cls =
        ejec ? 'v-PM' :  // green-ish reuse purple
        v === 'X'  ? 'v-X' :
        v === 'R'  ? 'v-R' :
        v === 'RA' ? 'v-RA':
        v === 'PM' ? 'v-PM': '';
      const label = ejec ? '✓' : (v || '');
      const td = h(`td`, {
        style:{ textAlign:'center', padding:'2px', cursor:'pointer' },
        title: ejec ? `Ejecutada ${fmt.date(ejec.fechaEvento || ejec.fecha)}` : (v ? `Marcador ${v}` : 'Sin programar'),
        onclick: (ev) => { ev.stopPropagation(); abrirModalGrillaCelda(e, m); },
      }, [
        h(`div.cell ${cls}`.trim(), { style:{padding:'4px 2px', minWidth:'30px', borderRadius:'4px'} }, [
          h('span.v', { style:{fontSize:'12px'} }, label || ' '),
        ]),
      ]);
      tr.appendChild(td);
    }
    tr.addEventListener('click', () => openFicha(e.uuid));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  container.appendChild(tbl);
  if (equipos.length > 300) {
    container.appendChild(h('div', { style:{padding:'10px', color:'var(--ink-3)', fontSize:'11.5px', textAlign:'center'} }, `Mostrando 300 de ${equipos.length} — afina los filtros.`));
  }
}

async function handleImportMaestro() {
  try {
    const file = await pickFile('.xlsx,.xlsm');
    if (!file) return;
    UI.toast(`Procesando ${file.name}…`, 'info', { duration: 2500 });
    const result = await importMaestroFile(file);
    UI.toast(`Hoja "${result.sheet}": ${result.nuevos} nuevos · ${result.actualizados} actualizados · ${result.mantenidos} preservados.`, 'success', { duration: 6000 });
    Router.go(STATE.view);
    renderSessionChip();
  } catch (e) { bus.emit('error', e); }
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
const CMDK = (() => {
  let openEl = null;

  function open() {
    if (openEl) return;
    const root = $('#cmdkRoot');
    const bd = h('div.cmdk-backdrop');
    const box = h('div.cmdk');
    const inp = h('input', { type:'text', placeholder:'Buscar equipo, ir a vista, ejecutar acción…' });
    const list = h('div.cmdk-list');
    box.appendChild(h('div.cmdk-input', [ h('i.ti.ti-search'), inp, h('span.pill.muted','Esc') ]));
    box.appendChild(list);
    bd.appendChild(box);
    root.appendChild(bd);
    openEl = bd;

    function close() {
      if (!openEl) return;
      openEl.remove();
      openEl = null;
      document.removeEventListener('keydown', keyHandler);
    }

    const actions = [
      { group:'Acciones', label:'Importar maestro', icon:'ti-file-spreadsheet', run: handleImportMaestro },
      { group:'Acciones', label:'Descargar backup', icon:'ti-database-export', run: exportBackup },
      { group:'Acciones', label:'Restaurar backup', icon:'ti-database-import', run: importBackup },
      { group:'Acciones', label:'Alternar tema claro/oscuro', icon:'ti-contrast-2', run: () => Theme.toggle() },
    ];
    const navs = NAV_ITEMS.map(it => ({
      group:'Ir a', label: it.label, icon: it.icon, run: () => Router.go(it.id), meta: it.soon ? 'pronto' : '',
    }));

    let cursor = 0;

    function render() {
      const q = inp.value.trim();
      const results = [];
      // Navs + actions
      [...navs, ...actions].forEach(item => {
        const sc = fuzzyScore(q, item.label);
        if (q && sc < 0) return;
        results.push({ ...item, score: sc });
      });
      // Equipos
      const eqMatches = !q ? [] : EQ.search(q).slice(0, 30).map(e => ({
        group:'Equipos',
        label: e.nombre || '(sin nombre)',
        meta: `${e.servicio || ''}${e.serie ? ' · S/N '+e.serie : ''}`,
        icon: e.estado === 'NoOperativo' ? 'ti-alert-triangle' : e.estado === 'ServicioTecnico' ? 'ti-tool' : 'ti-stethoscope',
        run: () => { close(); openFicha(e.uuid); },
      }));
      results.push(...eqMatches);

      list.innerHTML = '';
      if (!results.length) {
        list.appendChild(h('div', { style:{ padding:'24px', color:'var(--ink-3)', fontSize:'12.5px', textAlign:'center' } }, q ? 'Sin coincidencias' : 'Escribí para buscar…'));
        return;
      }
      cursor = Math.min(cursor, results.length-1);
      const groups = {};
      results.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
      let i = 0;
      for (const g of Object.keys(groups)) {
        list.appendChild(h('div.cmdk-group-label', g));
        groups[g].forEach(r => {
          const myIndex = i;
          const item = h('div.cmdk-item', { dataset:{ idx: i } }, [
            h('i.ti', { class: 'ti ' + (r.icon||'ti-circle') }),
            h('span', r.label),
            r.meta ? h('span.meta', r.meta) : null,
          ]);
          if (i === cursor) item.classList.add('is-active');
          item.addEventListener('click', () => { close(); try { r.run(); } catch(e){ bus.emit('error', e);} });
          item.addEventListener('mouseenter', () => { cursor = myIndex; renderHighlight(); });
          list.appendChild(item);
          i++;
        });
      }
      renderHighlight();
    }
    function renderHighlight() {
      $$('.cmdk-item', list).forEach((el, idx) => el.classList.toggle('is-active', idx === cursor));
      const active = $('.cmdk-item.is-active', list);
      active?.scrollIntoView({ block:'nearest' });
    }
    function runActive() {
      const active = $('.cmdk-item.is-active', list);
      if (active) active.click();
    }

    function keyHandler(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); cursor = Math.min(cursor+1, $$('.cmdk-item', list).length-1); renderHighlight(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); cursor = Math.max(cursor-1, 0); renderHighlight(); return; }
      if (e.key === 'Enter')     { e.preventDefault(); runActive(); return; }
    }

    inp.addEventListener('input', () => { cursor = 0; render(); });
    bd.addEventListener('mousedown', (e) => { if (e.target === bd) close(); });
    document.addEventListener('keydown', keyHandler);
    setTimeout(() => inp.focus(), 10);
    render();
  }

  return { open };
})();

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); CMDK.open();
  }
});

/* ============================================================
   THEME
   ============================================================ */
const Theme = {
  current() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  },
  set(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('pmp.v3.ui.theme', t); } catch {}
    this.syncToggle();
  },
  toggle() { this.set(this.current() === 'dark' ? 'light' : 'dark'); },
  syncToggle() {
    const btn = $('#themeToggle');
    if (!btn) return;
    const isDark = this.current() === 'dark';
    const icon = btn.querySelector('i');
    const label = $('#themeToggleLabel');
    if (icon)  icon.className = 'ti ' + (isDark ? 'ti-moon-stars' : 'ti-sun');
    if (label) label.textContent = isDark ? 'Tema oscuro' : 'Tema claro';
  },
};

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  try {
    const mig = migrateFromLegacy();
    loadState();
    renderNav();
    renderSessionChip();
    Theme.syncToggle();
    $('#themeToggle').addEventListener('click', () => Theme.toggle());
    $('#openCmdk').addEventListener('click', () => CMDK.open());
    bus.on('state:change', () => renderSessionChip());

    $('#bootScreen').remove();
    $('#app').hidden = false;

    Router.go(STATE.equipos.length ? 'inv' : 'dash');

    if (mig.migrated && mig.counts && (mig.counts.equipos || mig.counts.pendientes)) {
      UI.toast(`Migrados ${mig.counts.equipos} equipos · ${mig.counts.pendientes} tareas desde el sistema anterior.`, 'success', { duration: 6500 });
    }
  } catch (e) {
    console.error(e);
    document.body.innerHTML = `<pre style="padding:24px;color:#b91c1c;font-family:monospace">Error de arranque:\n${(e&&e.stack)||e}</pre>`;
  }
}

document.addEventListener('DOMContentLoaded', boot);
