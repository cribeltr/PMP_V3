  return {
    title: ev.tipo || 'Evento',
    desc: typeof p === 'string' ? p : (p && Object.keys(p).length ? Object.entries(p).slice(0,4).map(([k,v]) => `${k}: ${typeof v === 'object' ? '…' : v}`).join(' · ') : ''),
    icon: 'ti-circle-dot', color: 'ink-3',
  };
}

/* ============================================================
   DOMAIN · alertas (Grupo A > 30d, sigem pendiente, etc.)
   ============================================================ */
function alertasDeEquipo(equipo) {
  const out = [];
  const hs = (equipo.historial || []);

  // Group A causal > 30d sin cierre con SI posterior
  const lastCausalGrupoA = hs
    .filter(h => CAUSALES[h.resultado] && CAUSALES[h.resultado].grupo === 'A')
    .sort((a,b) => new Date(b.fechaEvento || b.fecha || 0) - new Date(a.fechaEvento || a.fecha || 0))[0];
  if (lastCausalGrupoA) {
    const ts = lastCausalGrupoA.fechaEvento || lastCausalGrupoA.fecha;
    // ¿hubo un SI posterior?
    const cierre = hs.find(h => h.resultado === 'SI' && new Date(h.fechaEvento || h.fecha || 0) > new Date(ts));
    const dias = fmt.daysSince(ts);
    if (!cierre && dias != null && dias > CAUSAL_GRUPO_A_DIAS) {
      out.push({
        kind: 'warning',
        icon: 'ti-alert-triangle',
        text: `Causal ${lastCausalGrupoA.resultado} sin resolver hace ${dias} días — corresponde Anexo 4 (retiro por seguridad).`,
      });
    }
  }

  // MP sin vincular: C2 / C3 / SI con estadoFinal=NoOperativo (caso bug A — R5).
  // Se considera "sin vincular" si la MP no tiene correctivoUuid y, para el caso
  // SI_NO_OP, además fue marcada explícitamente con `sinVincular: true`.
  hs.forEach(h => {
    const dias = fmt.daysSince(h.fechaEvento || h.fecha);
    if (dias == null || dias > 60) return;
    let necesita = null;
    if ((h.resultado === 'C2' || h.resultado === 'C3') && !h.correctivoUuid) {
      necesita = h.resultado;
    } else if (h.resultado === 'SI' && h.estadoFinal === 'NoOperativo' && h.sinVincular && !h.correctivoUuid) {
      necesita = 'SI_NO_OP';
    }
    if (!necesita) return;
    const estadoEsperado = (necesita === 'C2') ? 'en Servicio Técnico' : 'No Operativo';
    const titulo = necesita === 'SI_NO_OP'
      ? `MP del ${fmt.date(h.fechaEvento || h.fecha)} con estado No Operativo sin vincular a ciclo — corresponde abrir o asociar uno.`
      : `Causal ${h.resultado} de ${fmt.date(h.fechaEvento || h.fecha)} sin vincular — el equipo debería estar ${estadoEsperado}.`;
    out.push({
      kind: 'warning',
      icon: 'ti-link-off',
      text: titulo,
      action: { label: 'Vincular ahora', handler: () => abrirModalVinculacion(equipo, h) },
    });
  });

  // Ciclo con SIGEM pendiente
  // Alerta R6: equipo lleva >30 días en un estado no-operativo (NoOp / ST / Recepcionado).
  if (ESTADOS_NO_OPERATIVOS.includes(equipo.estado) && equipo.estadoDesde) {
    const dias = fmt.daysSince(equipo.estadoDesde);
    if (dias != null && dias > 30) {
      out.push({
        kind: 'danger',
        icon: 'ti-alert-octagon',
        text: `Equipo lleva ${dias} días en estado ${ESTADO_LABEL[equipo.estado]}. Revisar avance del ciclo.`,
      });
    }
  }

  return out;
}

/* ============================================================
   UI · primitives (modal, drawer, dialog, toast, popover)
   ============================================================ */
const UI = (() => {
  const modalsRoot = () => $('#modals');
  const stack = [];

  function lockBody(lock) {
    document.body.style.overflow = lock ? 'hidden' : '';
  }

  function focusFirstInteractive(root) {
    const el = root.querySelector('[autofocus], input:not([type=hidden]), select, textarea, button');
    if (el) { try { el.focus(); } catch {} }
  }

  function trapFocus(e, root) {
    if (e.key !== 'Tab') return;
    const focusables = root.querySelectorAll('a, button, input:not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function modal({ title, sub, size='', content, footer, critical=false, onClose, classes='' }) {
    const backdrop = h('div.backdrop', { dataset: { kind: 'modal' } });
    if (stack.length) backdrop.classList.add('is-stacked');
    const m = h(`div.modal.${size} ${classes}`.trim().replace(/\s+/g,' '));
    const head = h('div.modal-h', [
      h('div', [
        h('h3', title || ''),
        sub ? h('div.sub', sub) : null,
      ]),
      h('button.btn.icon.ghost.close', { title: 'Cerrar' }, [ h('i.ti.ti-x') ]),
    ]);
    const body = h('div.modal-body');
    if (typeof content === 'function') content(body, { close });
    else if (content instanceof Node) body.appendChild(content);
    else if (content != null) body.textContent = String(content);
    m.appendChild(head);
    m.appendChild(body);
    if (footer) {
      const f = h('div.modal-f');
      if (typeof footer === 'function') footer(f, { close });
      else if (footer instanceof Node) f.appendChild(footer);
      m.appendChild(f);
    }
    backdrop.appendChild(m);
    modalsRoot().appendChild(backdrop);
    lockBody(true);
    focusFirstInteractive(m);

    function close(reason) {
      if (!backdrop.isConnected) return;
      backdrop.style.animation = 'fade-in 100ms ease-out reverse';
      m.style.animation = 'slide-up 120ms ease-in reverse';
      setTimeout(() => {
        backdrop.remove();
        const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1);
        if (!stack.length) lockBody(false);
        try { onClose?.(reason); } catch (e) { console.error(e); }
      }, 100);
    }

    head.querySelector('.close').addEventListener('click', () => close('close-btn'));
    if (!critical) {
      backdrop.addEventListener('mousedown', (e) => {
        if (e.target === backdrop) close('backdrop');
      });
    }
    function keyHandler(e) {
      if (e.key === 'Escape' && stack[stack.length-1] === api) { close('escape'); }
      else trapFocus(e, m);
    }
    document.addEventListener('keydown', keyHandler);
    const _close = close;
    close = (r) => { document.removeEventListener('keydown', keyHandler); _close(r); };

    const api = { close, root: m, body };
    stack.push(api);
    return api;
  }

  function dialog({ title, message, confirmText='Confirmar', cancelText='Cancelar', variant='', onConfirm }) {
    return new Promise((resolve) => {
      const m = modal({
        title,
        size: 'sm',
        critical: true,
        content: (b) => {
          b.appendChild(h('p', { style:{ margin: 0, color: 'var(--ink-2)', fontSize: '13px' } }, message));
        },
        footer: (f, { close }) => {
          f.appendChild(h('button.btn.ghost', { onclick: () => { close('cancel'); resolve(false); } }, cancelText));
          f.appendChild(h(`button.btn.primary ${variant==='danger'?'danger':''}`.trim(), {
            onclick: async () => { try { await onConfirm?.(); } catch (e) { console.error(e); } close('confirm'); resolve(true); }
          }, confirmText));
        },
      });
    });
  }

  function toast(msg, kind='', opts={}) {
    const t = h(`div.toast ${kind}`.trim(), [
      h('i.ti', { class: 'ti ' + (kind==='success'?'ti-check': kind==='warning'?'ti-alert-triangle': kind==='danger'?'ti-alert-octagon': 'ti-info-circle') }),
      h('span', msg),
    ]);
    $('#toasts').appendChild(t);
    const timeout = setTimeout(() => {
      t.style.animation = 'slide-up 140ms ease-in reverse';
      setTimeout(() => t.remove(), 140);
    }, opts.duration ?? 4000);
    t.addEventListener('click', () => { clearTimeout(timeout); t.remove(); });
    return t;
  }

  function drawer({ title, content, footer, onClose }) {
    const backdrop = h('div.backdrop', { dataset:{kind:'drawer'}, style:{ alignItems: 'stretch', justifyContent: 'flex-end' } });
    const d = h('div.drawer');
    const head = h('div.modal-h', [
      h('div', [ h('h3', title || '') ]),
      h('button.btn.icon.ghost.close', { onclick: () => close() }, [ h('i.ti.ti-x') ]),
    ]);
    const body = h('div.modal-body');
    if (typeof content === 'function') content(body, { close });
    else if (content instanceof Node) body.appendChild(content);
    d.appendChild(head); d.appendChild(body);
    if (footer) {
      const f = h('div.modal-f');
      if (typeof footer === 'function') footer(f, { close }); else f.appendChild(footer);
      d.appendChild(f);
    }
    backdrop.appendChild(d);
    modalsRoot().appendChild(backdrop);
    lockBody(true);

    function close(reason) {
      if (!backdrop.isConnected) return;
      backdrop.remove();
      const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1);
      if (!stack.length) lockBody(false);
      try { onClose?.(reason); } catch(e) { console.error(e); }
    }
    backdrop.addEventListener('mousedown', (e) => { if (e.target === backdrop) close('backdrop'); });
    function keyHandler(e) { if (e.key === 'Escape' && stack[stack.length-1] === api) close('escape'); }
    document.addEventListener('keydown', keyHandler);
    const _close = close;
    close = (r) => { document.removeEventListener('keydown', keyHandler); _close(r); };
    const api = { close, root: d, body };
    stack.push(api);
    return api;
  }

  /**
   * Popover anclado a un elemento. Cierra al click fuera o Esc.
   * @param anchor HTMLElement
   * @param opts { width?, render(body, { close }), align?: 'left'|'right' }
   */
  function popover(anchor, opts={}) {
    const rect = anchor.getBoundingClientRect();
    const pop = h('div.popover', { style:{
      position:'fixed', zIndex:'var(--z-popover)',
      top: (rect.bottom + 6) + 'px',
      [opts.align === 'right' ? 'right' : 'left']: (opts.align === 'right' ? (window.innerWidth - rect.right) : rect.left) + 'px',
      background:'var(--paper)', border:'.5px solid var(--line-2)', borderRadius:'var(--r-md)',
      boxShadow: 'var(--shadow-3)', minWidth:'220px', maxWidth: (opts.width || 340) + 'px',
      maxHeight: '70vh', overflowY: 'auto', padding: '8px',
    } });
    document.body.appendChild(pop);
    function close() {
      if (!pop.isConnected) return;
      pop.remove();
      document.removeEventListener('mousedown', outside, true);
      document.removeEventListener('keydown', keyHandler, true);
    }
    function outside(e) { if (!pop.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) close(); }
    function keyHandler(e) { if (e.key === 'Escape') close(); }
    setTimeout(() => {
      document.addEventListener('mousedown', outside, true);
      document.addEventListener('keydown', keyHandler, true);
    }, 0);
    if (typeof opts.render === 'function') opts.render(pop, { close });
    return { close, root: pop };
  }

  return { modal, dialog, drawer, toast, popover };
})();

/* ============================================================
   IMPORT · maestro Excel (.xlsx/.xlsm)
   ============================================================ */
async function ensureXLSX() {
  let tries = 0;
  while (typeof XLSX === 'undefined' && tries < 30) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (typeof XLSX === 'undefined') throw new Error('No se pudo cargar SheetJS (XLSX). Verificá la conexión.');
}
async function ensureJSZip() {
  let tries = 0;
  while (typeof JSZip === 'undefined' && tries < 30) { await new Promise(r => setTimeout(r, 100)); tries++; }
  if (typeof JSZip === 'undefined') throw new Error('No se pudo cargar JSZip. Verificá la conexión.');
}

function pickFile(accept='.xlsx,.xlsm,.json') {
  return new Promise((resolve, reject) => {
    const inp = $('#hiddenFile');
    inp.value = '';
    inp.accept = accept;
    const onChange = () => { inp.removeEventListener('change', onChange); resolve(inp.files[0] || null); };
    inp.addEventListener('change', onChange, { once: true });
    inp.click();
  });
}

function detectHeaderRow(aoa) {
  for (let i = 0; i < Math.min(aoa.length, 20); i++) {
    const row = aoa[i].map(c => normalize(c));
    const hasFam     = row.some(c => c.includes('fam'));
    const hasEquipo  = row.some(c => c.includes('equipo') || c.includes('nombre'));
    const hasSerie   = row.some(c => c.includes('serie'));
    if (hasFam && hasEquipo && hasSerie) return i;
  }
  return -1;
}

function indexHeaders(headerRow) {
  const idx = {};
  headerRow.forEach((raw, i) => {
    const c = normalize(raw);
    if (!c) return;
    if (c === 'fam' || c.startsWith('familia')) idx.fam = i;
    else if (c === 'id') idx.id = i;
    else if (c.includes('carpeta')) idx.carpeta = i;
    else if (c.includes('inventario') && !idx.inventario) idx.inventario = i;
    else if (c === 'equipo' || c === 'nombre' || c === 'nombre equipo') idx.nombre = i;
    else if (c === 'servicio') idx.servicio = i;
    else if (c === 'unidad') idx.unidad = i;
    else if (c.includes('ubicacion')) idx.ubicacion = i;
    else if (c.includes('procedencia')) idx.procedencia = i;
    else if (c === 'marca') idx.marca = i;
    else if (c === 'modelo') idx.modelo = i;
    else if (c.includes('serie')) idx.serie = i;
    else if (c.includes('ano') || c.includes('año') || c.includes('instalacion')) idx.anio = i;
    else if (c.includes('vida')) idx.vidaUtil = i;
    else if (c.includes('clasificacion')) idx.clasificacion = i;
    else if (c === 'enu' || c.includes('enu / baja') || c.includes('baja')) idx.enu = i;
    else if (c.includes('observacion')) idx.observacion = i;
    else if (c.includes('frecuencia')) idx.frecuencia = i;
    else if (c.includes('responsable')) idx.responsableMaster = i;
    else {
      const mes = MESES.findIndex((m, k) => {
        const long = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][k];
        return c === normalize(m) || c === long || c.startsWith(long);
      });
      if (mes >= 0) { idx[`mes_${mes+1}`] = i; }
    }
  });
  return idx;
}

function normalizeFreq(raw) {
  const s = normalize(raw);
  if (!s) return '';
  if (s.startsWith('men')) return 'Mensual';
  if (s.startsWith('tri') || s.includes('trimest')) return 'Trimestral';
  if (s.startsWith('sem') || s.includes('semest')) return 'Semestral';
  if (s.startsWith('an')  || s.includes('anu')) return 'Anual';
  return raw;
}

function normalizeGrillaCell(raw) {
  const s = normalize(raw);
  if (!s) return null;
  if (s === 'x') return 'X';
  if (s === 'r') return 'R';
  if (s === 'ra') return 'RA';
  if (s === 'pm') return 'PM';
  return null;
}

async function importMaestroFile(file) {
  await ensureXLSX();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  let sheetName = wb.SheetNames.find(n => /^pmp_?20\d{2}$/i.test(n)) || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });

  const hr = detectHeaderRow(aoa);
  if (hr < 0) throw new Error('No se encontró fila de encabezados (Fam / Equipo / Serie).');
  const idx = indexHeaders(aoa[hr]);
  const rows = aoa.slice(hr + 1).filter(r => r.some(c => String(c).trim()));

  const previas = new Map(STATE.equipos.map(e => [matchKey(e), e]));
  const result = { nuevos: 0, actualizados: 0, mantenidos: 0, sheet: sheetName, total: rows.length };
  const merged = [];
  const seen = new Set();

  // Diff acumulado
  const diff = {
    archivo: file.name,
    sheet: sheetName,
    fecha: new Date().toISOString(),
    nuevos:   [],   // equipos en archivo que no existían
    ausentes: [],   // equipos en estado que no aparecen en el archivo
    cambios:  [],   // equipos cuyos datos cambiaron
  };

  for (const r of rows) {
    const draft = rowToEquipo(r, idx);
    if (!draft.nombre && !draft.inventario && !draft.serie) continue;
    const key = matchKey(draft);
    const prev = key ? previas.get(key) : null;
    if (prev) {
      seen.add(prev.uuid);
      const antes = snapshotEquipoCampos(prev);
      mergeEquipoInPlace(prev, draft);
      const despues = snapshotEquipoCampos(prev);
      const cambios = computeEquipoChanges(antes, despues);
      if (cambios.fields.length || cambios.grilla.length) {
        diff.cambios.push({
          uuid: prev.uuid,
          nombre: prev.nombre, serie: prev.serie, inventario: prev.inventario, servicio: prev.servicio, fam: prev.fam,
          ...cambios,
        });
      }
      merged.push(prev);
      result.actualizados++;
    } else {
      const nuevo = normalizeEquipoFromLegacy(draft);
      merged.push(nuevo);
      result.nuevos++;
      diff.nuevos.push({
        uuid: nuevo.uuid,
        nombre: nuevo.nombre, serie: nuevo.serie, inventario: nuevo.inventario, servicio: nuevo.servicio, fam: nuevo.fam,
      });
    }
  }
  // Equipos que no estaban en el archivo: se mantienen, pero se reportan como ausentes
  // (excepto los que ya están De Baja — esos son esperados).
  STATE.equipos.forEach(e => {
    if (!seen.has(e.uuid) && !merged.includes(e)) {
      merged.push(e);
      result.mantenidos++;
      if (e.estado !== 'DeBaja') {
        diff.ausentes.push({
          uuid: e.uuid,
          nombre: e.nombre, serie: e.serie, inventario: e.inventario, servicio: e.servicio, fam: e.fam,
          estado: e.estado, esSlot: !!e.esSlot,
        });
      }
    }
  });
  STATE.equipos = merged;
  STATE.session = Object.assign({}, STATE.session, {
    archivoCargado: file.name,
    fechaCarga: new Date().toISOString(),
    sheet: sheetName,
  });
  persist('equipos');
  persist('session');

  // Filtrar diferencias previamente ignoradas (decisiones persistidas)
  aplicarIgnoradosAlDiff(diff);

  // Totales del diff
  diff.totales = {
    nuevos:   diff.nuevos.length,
    ausentes: diff.ausentes.length,
    cambios:  diff.cambios.length,
    camposCambiados: diff.cambios.reduce((s,c) => s + c.fields.length, 0),
    grillaCambios:   diff.cambios.reduce((s,c) => s + c.grilla.length, 0),
    ignoradosPrevios: diff.ignoradosPrevios || 0,
  };
  result.diff = diff;
  return result;
}

// Campos seguidos en el diff. NO incluye responsableMaster: la fuente de
// verdad del responsable es la asignación mensual, no el maestro.
const DIFF_CAMPOS = ['servicio','unidad','ubicacion','procedencia','marca','modelo','anio','vidaUtil',
                     'clasificacion','enu','observacion','frecuencia','fam','famOriginal','carpeta','nombre','id'];
const DIFF_CAMPOS_LABEL = {
  servicio:'Servicio', unidad:'Unidad', ubicacion:'Ubicación', procedencia:'Procedencia',
  marca:'Marca', modelo:'Modelo', anio:'Año', vidaUtil:'Vida útil', clasificacion:'Clasificación',
  enu:'ENU / baja', observacion:'Observación', frecuencia:'Frecuencia MP',
  fam:'Familia', famOriginal:'Familia (original)',
  carpeta:'Carpeta', nombre:'Nombre', id:'ID',
};

/* ============================================================
   DIFF · ignorados persistentes (item-por-item)
   ============================================================ */
function diffKeyNuevo(uuidEquipo)              { return `${uuidEquipo}::nuevo`; }
function diffKeyAusente(uuidEquipo)            { return `${uuidEquipo}::ausente`; }
function diffKeyCampo(uuidEquipo, campo, val)  { return `${uuidEquipo}::campo::${campo}::${val ?? ''}`; }
function diffKeyGrilla(uuidEquipo, mes, val)   { return `${uuidEquipo}::grilla::${mes}::${val ?? '∅'}`; }

function esDiffIgnorado(key) { return !!STATE.diffIgnorados[key]; }

function marcarDiffIgnorado(key, contexto) {
  STATE.diffIgnorados[key] = { ts: new Date().toISOString(), contexto: contexto || null };
  persist('diffIgnorados');
}

function aplicarIgnoradosAlDiff(diff) {
  let ignoradosCount = 0;
  diff.nuevos = diff.nuevos.filter(n => {
    const ig = esDiffIgnorado(diffKeyNuevo(n.uuid));
    if (ig) ignoradosCount++;
    return !ig;
  });
  diff.ausentes = diff.ausentes.filter(a => {
    const ig = esDiffIgnorado(diffKeyAusente(a.uuid));
    if (ig) ignoradosCount++;
    return !ig;
  });
  diff.cambios = diff.cambios.map(c => {
    const fields = c.fields.filter(f => {
      const ig = esDiffIgnorado(diffKeyCampo(c.uuid, f.campo, f.despues));
      if (ig) ignoradosCount++;
      return !ig;
    });
    const grilla = c.grilla.filter(g => {
      const ig = esDiffIgnorado(diffKeyGrilla(c.uuid, g.mes, g.despues));
      if (ig) ignoradosCount++;
      return !ig;
    });
    return { ...c, fields, grilla };
  }).filter(c => c.fields.length || c.grilla.length);
  diff.ignoradosPrevios = ignoradosCount;
  return diff;
}

function snapshotEquipoCampos(e) {
  const snap = {};
  DIFF_CAMPOS.forEach(k => { snap[k] = e[k] ?? ''; });
  snap.grilla = Object.assign({}, e.grilla || {});
  return snap;
}

function computeEquipoChanges(antes, despues) {
  const fields = [];
  DIFF_CAMPOS.forEach(k => {
    const a = String(antes[k] ?? '').trim();
    const b = String(despues[k] ?? '').trim();
    if (a !== b) fields.push({ campo: k, label: DIFF_CAMPOS_LABEL[k] || k, antes: a, despues: b });
  });
  const grilla = [];
  for (let m = 1; m <= 12; m++) {
    const a = antes.grilla?.[m] || null;
    const b = despues.grilla?.[m] || null;
    if (a !== b) grilla.push({ mes: m, antes: a, despues: b });
  }
  return { fields, grilla };
}

function matchKey(e) {
  const s = normalize(e.serie);
  const i = normalize(e.inventario);
  if (s && s !== 'n/a') return `s:${s}`;
  if (i && i !== 'n/a') return `i:${i}`;
  return null;
}

function rowToEquipo(r, idx) {
  const cell = (k) => idx[k] != null ? String(r[idx[k]] ?? '').trim() : '';
  const grilla = {};
  for (let m = 1; m <= 12; m++) grilla[m] = normalizeGrillaCell(r[idx[`mes_${m}`]]);
  return {
    fam: cell('fam'),
    famOriginal: cell('fam'),
    id: cell('id'),
    carpeta: cell('carpeta') ? Number(cell('carpeta')) || cell('carpeta') : null,
    inventario: cell('inventario'),
    nombre: cell('nombre'),
    servicio: cell('servicio'),
    unidad: cell('unidad'),
    ubicacion: cell('ubicacion'),
    procedencia: cell('procedencia'),
    marca: cell('marca'),
    modelo: cell('modelo'),
    serie: cell('serie'),
    anio: cell('anio'),
    vidaUtil: cell('vidaUtil'),
    clasificacion: cell('clasificacion'),
    enu: cell('enu'),
    observacion: cell('observacion'),
    frecuencia: normalizeFreq(cell('frecuencia')),
    responsableMaster: cell('responsableMaster'),
    estado: 'Operativo',
    grilla,
    historial: [],
    eventos: [],
    correctivos: [],
    pendientesIds: [],
  };
}

/* ============================================================
   IMPORT · asignación mensual (.xlsx)
   ============================================================ */
async function importAsignacionMensual(file, opts={}) {
  await ensureXLSX();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });

  // Detect header row
  let hr = -1;
  for (let i = 0; i < Math.min(aoa.length, 20); i++) {
    const row = aoa[i].map(c => normalize(c));
    const hasResp = row.some(c => c.includes('responsable'));
    const hasSerieOrInv = row.some(c => c.includes('serie') || c.includes('inventario'));
    if (hasResp && hasSerieOrInv) { hr = i; break; }
  }
  if (hr < 0) throw new Error('No se detectó fila de encabezados (Responsable + Serie/Inventario).');

  // Index columns
  const idx = {};
  aoa[hr].forEach((raw, i) => {
    const c = normalize(raw);
    if (c.includes('responsable')) idx.responsable = i;
    else if (c.includes('serie')) idx.serie = i;
    else if (c.includes('inventario')) idx.inventario = i;
    else if (c.includes('carpeta')) idx.carpeta = i;
  });

  // Detect period from filename or use opts
  const periodo = opts.mes && opts.anio
    ? `${opts.anio}-${String(opts.mes).padStart(2,'0')}`
    : detectarPeriodoArchivo(file.name) || `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;

  const [anio, mesStr] = periodo.split('-');
  const mes = Number(mesStr);

  // Build lookups
  const bySerie = new Map();
  const byInv   = new Map();
  STATE.equipos.forEach(e => {
    const s = normalize(e.serie);
    const i = normalize(e.inventario);
    if (s && s !== 'n/a') bySerie.set(s, e);
    if (i && i !== 'n/a') byInv.set(i, e);
  });

  const rows = aoa.slice(hr + 1).filter(r => r.some(c => String(c).trim()));
  const asign = { __meta: {
    archivo: file.name,
    fechaCarga: new Date().toISOString(),
    mes, anio: Number(anio),
    total: rows.length,
    matcheados: 0,
    sinMatch: [],
    tecnicos: {},
  }};

  for (const r of rows) {
    const resp = idx.responsable != null ? String(r[idx.responsable] || '').trim() : '';
    if (!resp) continue;
    const serie = idx.serie != null ? normalize(r[idx.serie]) : '';
    const inv   = idx.inventario != null ? normalize(r[idx.inventario]) : '';
    let eq = (serie && bySerie.get(serie)) || (inv && byInv.get(inv)) || null;
    if (!eq) {
      asign.__meta.sinMatch.push({ serie: r[idx.serie] || '', inventario: r[idx.inventario] || '', responsable: resp });
      continue;
    }
    asign[eq.uuid] = resp;
    asign.__meta.matcheados++;
    asign.__meta.tecnicos[resp] = (asign.__meta.tecnicos[resp] || 0) + 1;
  }

  STATE.asignaciones[periodo] = asign;
  persist('asignaciones');
  return { periodo, ...asign.__meta };
}

function detectarPeriodoArchivo(name) {
  const meses = {
    enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12,
    ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12,
  };
  const norm = normalize(name);
  const yearM = norm.match(/20\d{2}/);
  const year = yearM ? Number(yearM[0]) : new Date().getFullYear();
  for (const [w, m] of Object.entries(meses)) {
    if (norm.includes(w)) return `${year}-${String(m).padStart(2,'0')}`;
  }
  return null;
}

/* ============================================================
   EXPORT · plantilla mensual (XLSX con validación de lista)
   ============================================================ */
/**
 * Genera la Plantilla de Asignación Mensual con el formato institucional exacto:
 * - Hoja "Asignación" (con tilde) con 13 columnas en orden: Carpeta · Inventario ·
 *   Equipo · Servicio · Unidad · Ubicación · Marca · Modelo · Serie · Año ·
 *   Frecuencia MP · Programado en mes · Responsable.
 * - Hoja "Responsables_oficiales" VISIBLE (NO oculta) con TECNICOS_OFICIALES.
 * - autoFilter sobre A1:M{N} y definedName _xlnm._FilterDatabase.
 * - dataValidation tipo list en M2:M{N} con promptTitle + prompt + tildes UTF-8.
 *
 * IMPORTANTE — corrección R3 de un bug R2: la versión anterior marcaba la hoja
 * Responsables como Hidden:1. Excel resuelve referencias inter-hoja en
 * dataValidation de forma menos fiable cuando la hoja destino está oculta, y la
 * plantilla institucional de referencia la deja visible. openpyxl no detectaba
 * el problema porque acepta ambas formas; Excel real no. Solución: hoja visible.
 */
async function exportPlantillaAsignacion(periodo) {
  await ensureXLSX();
  await ensureJSZip();

  const mesNum = Number((periodo || periodoActual()).split('-')[1]);
  const anio   = Number((periodo || periodoActual()).split('-')[0]);
  const equipos = STATE.equipos.filter(e => {
    if (e.esSlot || e.estado === 'DeBaja') return false;
    const g = e.grilla?.[mesNum];
    return g === 'X' || g === 'R' || g === 'PM' || g === 'RA';
  });
  if (!equipos.length) {
    throw new Error(`No hay equipos con MP programada (X/R/PM/RA) en ${periodoLabel(periodo)}. Revisá la grilla anual antes de exportar.`);
  }

  // Pre-llenado del Responsable: período actual primero; si no hay, asignación previa más reciente.
  const periodos = listaPeriodos();
  function ultimoResponsable(equipoUuid) {
    if ((STATE.asignaciones[periodo] || {})[equipoUuid]) return STATE.asignaciones[periodo][equipoUuid];
    for (const p of periodos) {
      const v = (STATE.asignaciones[p] || {})[equipoUuid];
      if (v) return v;
    }
    return '';
  }

  // === Hoja 1: Asignación (con tilde) ===
  const headers = ['N° Carpeta','N° Inventario','Equipo','Servicio','Unidad','Ubicación','Marca','Modelo','Serie','Año','Frecuencia MP','Programado en mes','Responsable'];
  const data = [headers];
  equipos.forEach(e => {
    data.push([
      e.carpeta ?? '',
      e.inventario || '',
      e.nombre || '',
      e.servicio || '',
      e.unidad || '',
      e.ubicacion || '',
      e.marca || '',
      e.modelo || '',
      e.serie || '',
      e.anio || '',
      e.frecuencia || '',
      e.grilla?.[mesNum] || '',
      ultimoResponsable(e.uuid),
    ]);
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [
    {wch:10},  // N° Carpeta
    {wch:14},  // N° Inventario
    {wch:32},  // Equipo
    {wch:22},  // Servicio
    {wch:22},  // Unidad
    {wch:22},  // Ubicación
    {wch:16},  // Marca
    {wch:18},  // Modelo
    {wch:18},  // Serie
    {wch:8},   // Año
    {wch:16},  // Frecuencia MP
    {wch:18},  // Programado en mes
    {wch:30},  // Responsable
  ];
  XLSX.utils.book_append_sheet(wb, ws, 'Asignación');

  // === Hoja 2: Responsables_oficiales (VISIBLE) ===
  const tecData = [['Responsable oficial'], ...TECNICOS_OFICIALES.map(t => [t])];
  const wsT = XLSX.utils.aoa_to_sheet(tecData);
  wsT['!cols'] = [{wch:36}];
  XLSX.utils.book_append_sheet(wb, wsT, 'Responsables_oficiales');
  // Ambas hojas visibles. Sin Hidden.
  wb.Workbook = wb.Workbook || {};
  wb.Workbook.Sheets = wb.Workbook.Sheets || [];
  wb.Workbook.Sheets[0] = Object.assign(wb.Workbook.Sheets[0] || {}, { Hidden: 0 });
  wb.Workbook.Sheets[1] = Object.assign(wb.Workbook.Sheets[1] || {}, { Hidden: 0 });

  const ab = XLSX.write(wb, { bookType:'xlsx', type:'array' });

  // ===== Patches del XML =====
  const zip = await JSZip.loadAsync(ab);
  const sheetPath = 'xl/worksheets/sheet1.xml';
  let xml = await zip.file(sheetPath).async('string');
  const lastRow = equipos.length + 1;            // header + filas
  const tecLast = TECNICOS_OFICIALES.length + 1;  // 11 + header = 12
  const sqrefAll = `A1:M${lastRow}`;
  const sqrefResp = `M2:M${lastRow}`;

  // 1) <autoFilter> tras </sheetData>
  const autoFilter = `<autoFilter ref="${sqrefAll}"/>`;
  // 2) <dataValidations> después de <autoFilter> y antes de <ignoredErrors>
  //    (per ECMA-376 el orden válido es: sheetData (6) → autoFilter (11) →
  //     dataValidations (18) → ignoredErrors (28))
  const validation =
    `<dataValidations count="1">` +
    `<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" ` +
    `errorTitle="Responsable no válido" error="Elegí un técnico de la lista oficial." ` +
    `promptTitle="Asignar responsable" prompt="Elegí un técnico de la lista desplegable." ` +
    `sqref="${sqrefResp}">` +
    `<formula1>Responsables_oficiales!$A$2:$A$${tecLast}</formula1>` +
    `</dataValidation></dataValidations>`;
  xml = xml.replace('</sheetData>', '</sheetData>' + autoFilter + validation);
  zip.file(sheetPath, xml);

  // 3) <definedNames> en workbook.xml para que Excel active el autofiltro al abrir.
  let wbXml = await zip.file('xl/workbook.xml').async('string');
  const dn = `<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0">&apos;Asignación&apos;!$A$1:$M$${lastRow}</definedName></definedNames>`;
  if (!wbXml.includes('<definedNames>')) {
    wbXml = wbXml.replace('</sheets>', '</sheets>' + dn);
  } else {
    wbXml = wbXml.replace('</definedNames>', dn.replace('<definedNames>','').replace('</definedNames>','') + '</definedNames>');
  }
  zip.file('xl/workbook.xml', wbXml);

  const out = await zip.generateAsync({ type: 'blob' });
  const mesAbr = MESES[mesNum-1];   // 'Ene', 'Feb', ...
  const filename = `Plantilla_Asignacion_${mesAbr}_${anio}.xlsx`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

/**
 * Universo de técnicos para sugerir en plantillas y formularios.
 * Fuentes (en este orden): técnicos oficiales SEC + asignaciones mensuales
 * + responsables de aperturas de ciclo + ejecutores históricos.
 * IGNORA `responsableMaster` del Excel (es referencial, no fuente de verdad).
 */
function sugerirTecnicos() {
  const set = new Set();
  (STATE.tecnicosOficiales || []).forEach(n => { if (n) set.add(n); });
  Object.values(STATE.asignaciones || {}).forEach(per => {
    if (!per || typeof per !== 'object') return;
    Object.entries(per).forEach(([k,v]) => { if (k !== '__meta' && v && typeof v === 'string') set.add(v); });
  });
  STATE.equipos.forEach(e => (e.correctivos||[]).forEach(c => {
    if (c.apertura?.responsable) set.add(c.apertura.responsable);
  }));
  EQ.ejecutores().forEach(n => set.add(n));
  return Array.from(set).sort((a,b) => a.localeCompare(b,'es'));
}

/* ============================================================
   EXPORT · reporte multi-hoja

async function exportReporteGeneral() {
  await ensureXLSX();
  const wb = XLSX.utils.book_new();
  const now = new Date();
  const anio = now.getFullYear();
  const mes  = now.getMonth() + 1;

  // === Resumen ===
  const byEst = EQ.countByEstado();
  const garan = EQ.garantiasActivas().length;
  const programadas = STATE.equipos.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R').length;
  const ejecutadas  = STATE.equipos.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI')).length;
  const ciclosAb    = EQ.ciclosAbiertos().length;
  const pendientes  = STATE.pendientes.filter(p => p.estado !== 'Cerrado').length;

  const resumen = [
    ['PMP — Reporte general'],
    ['Fecha de emisión', fmt.datetime(now)],
    ['Equipos totales', STATE.equipos.length],
    [''],
    ['Por estado'],
    ['Operativos',         byEst.Operativo],
    ['No operativos',      byEst.NoOperativo],
    ['En servicio técnico',byEst.ServicioTecnico],
    ['Fuera de servicio',  byEst.FueraDeServicio],
    ['De baja',            byEst.DeBaja],
    ['Slots',              byEst.Slot],
    [''],
    ['Garantías activas',  garan],
    ['Ciclos correctivos abiertos', ciclosAb],
    ['Pendientes abiertos', pendientes],
    [''],
    [`MP ${MESES[mes-1]} ${anio} programadas`, programadas],
    [`MP ${MESES[mes-1]} ${anio} ejecutadas`,  ejecutadas],
    [`% cumplimiento ${MESES[mes-1]}`, programadas ? Math.round(ejecutadas/programadas*100) + '%' : '—'],
  ];
  const wsR = XLSX.utils.aoa_to_sheet(resumen);
  wsR['!cols'] = [{wch:36},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumen');

  // === Inventario ===
  const periodoRep = `${anio}-${String(mes).padStart(2,'0')}`;
  const respHdr = `Responsable ${MESES[mes-1]} ${anio}`;
  const inv = [['Servicio','Familia','Nombre','Marca','Modelo','Serie','Inventario','Carpeta','Frecuencia', respHdr, 'Estado','En garantía','Proveedor garantía','Ubicación']];
  STATE.equipos.forEach(e => {
    inv.push([
      e.servicio||'', e.fam||'', e.nombre||'', e.marca||'', e.modelo||'',
      e.serie||'', e.inventario||'', e.carpeta||'', e.frecuencia||'',
      responsableDelPeriodo(e, periodoRep), ESTADO_LABEL[e.estado]||e.estado||'',
      e.enGarantia ? 'Sí' : '', e.garantiaProveedor||'', e.ubicacion||'',
    ]);
  });
  const wsI = XLSX.utils.aoa_to_sheet(inv);
  wsI['!cols'] = [{wch:22},{wch:18},{wch:32},{wch:16},{wch:18},{wch:16},{wch:14},{wch:10},{wch:12},{wch:22},{wch:18},{wch:12},{wch:22},{wch:24}];
  XLSX.utils.book_append_sheet(wb, wsI, 'Inventario');

  // === En ST / NoOperativos / Recepcionados ===
  const st = [['Servicio','Equipo','Serie','Estado','Estado desde','Días','Folio SIGEM','Última actividad del ciclo']];
  STATE.equipos.filter(e => ESTADOS_NO_OPERATIVOS.includes(e.estado)).forEach(e => {
    const ciclo = (e.correctivos||[]).find(c => c.abierto);
    const folio = ciclo?.solicitud?.folioSigem || '';
    let ult = '—';
    if (ciclo) {
      const ultRec = (ciclo.recepciones||[]).slice(-1)[0];
      const ultEnv = (ciclo.envios||[]).slice(-1)[0];
      if (ciclo.reparacion) ult = 'reparación ' + fmt.date(ciclo.reparacion.fechaEvento);
      else if (ultRec) ult = 'recepción ' + fmt.date(ultRec.fechaEvento);
      else if (ultEnv) ult = 'envío ' + fmt.date(ultEnv.fechaEvento);
      else if (ciclo.solicitud) ult = 'solicitud ' + fmt.date(ciclo.solicitud.fechaEvento);
    }
    st.push([e.servicio||'', e.nombre||'', e.serie||'', ESTADO_LABEL[e.estado], fmt.date(e.estadoDesde), fmt.daysSince(e.estadoDesde) ?? '', folio, ult]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(st), 'En ST · NoOp · Recep');

  // === MP Pendientes del mes ===
  const pend = [['Servicio','Equipo','Serie','Frecuencia','Programado','Estado equipo', respHdr, 'Días en estado']];
  STATE.equipos.forEach(e => {
    const prog = e.grilla?.[mes];
    if (prog !== 'X' && prog !== 'R') return;
    const hayEjec = (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI');
    if (hayEjec) return;
    pend.push([e.servicio||'', e.nombre||'', e.serie||'', e.frecuencia||'', prog, ESTADO_LABEL[e.estado]||e.estado, responsableDelPeriodo(e, periodoRep), fmt.daysSince(e.estadoDesde) ?? '']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pend), `MP pendientes ${MESES[mes-1]}`);

  // === Historial del año ===
  const histRows = [['Fecha','Mes','Servicio','Equipo','Serie','Resultado','Estado final','Ejecutor','Observación']];
  STATE.equipos.forEach(e => {
    (e.historial||[]).filter(h => {
      const d = new Date(h.fechaEvento || h.fecha || 0);
      return !isNaN(d) && d.getFullYear() === anio;
    }).forEach(h => {
      histRows.push([
        fmt.date(h.fechaEvento || h.fecha),
        MESES[(h.mes||1)-1],
        e.servicio || '', e.nombre || '', e.serie || '',
        h.resultado || '',
        h.estadoFinal ? (ESTADO_LABEL[h.estadoFinal] || h.estadoFinal) : '',
        h.ejecutor || '', h.obs || '',
      ]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(histRows), `Historial ${anio}`);

  // === Por servicio ===
  const servicios = EQ.servicios();
  const porServ = [['Servicio','Equipos','Operativos','No operativos','En ST','Fuera de servicio','De baja','En garantía',`Programadas ${MESES[mes-1]}`,`Ejecutadas ${MESES[mes-1]}`,'% cumplimiento']];
  servicios.forEach(s => {
    const eq = STATE.equipos.filter(e => e.servicio === s);
    const c = (estado) => eq.filter(e => e.estado === estado).length;
    const prog = eq.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R').length;
    const ejec = eq.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI')).length;
    porServ.push([
      s, eq.length, c('Operativo'), c('NoOperativo'), c('ServicioTecnico'),
      c('FueraDeServicio'), c('DeBaja'), eq.filter(e => e.enGarantia).length,
      prog, ejec, prog ? Math.round(ejec/prog*100) + '%' : '—',
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(porServ), 'Por servicio');

  const ts = now.toISOString().replace(/[:.]/g,'-');
  XLSX.writeFile(wb, `PMP_reporte_${ts}.xlsx`);
}

function printDoc(content, title='Documento PMP') {
  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden','true');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(iframe);
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title><style>${PRINT_CSS}</style></head><body>${content}</body></html>`);
  doc.close();
  setTimeout(() => {
    try { iframe.contentWindow.focus(); iframe.contentWindow.print(); } catch(e) {}
    setTimeout(() => iframe.remove(), 1200);
  }, 350);
}

/* ============================================================

   ============================================================ */
function calcularInformeServicio(servicio, mes, anio) {
  const eq = STATE.equipos.filter(e => e.servicio === servicio && !e.esSlot && e.estado !== 'DeBaja');
  const items = eq.map(e => {
    const prog = e.grilla?.[mes];
    const hist = (e.historial||[]).filter(h => h.mes === mes && new Date(h.fechaEvento||h.fecha||0).getFullYear() === anio)
      .sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
    const ultimo = hist[0] || null;
    return { equipo: e, prog, ultimo };
  });

  return {
    servicio, mes, anio,
    items,
    totales: {
      equipos:       eq.length,
      programadas:   items.filter(i => i.prog === 'X' || i.prog === 'R').length,
      ejecutadas:    items.filter(i => i.ultimo?.resultado === 'SI').length,
      causalizadas:  items.filter(i => i.ultimo && CAUSALES[i.ultimo.resultado]).length,
      pendientes:    items.filter(i => (i.prog === 'X' || i.prog === 'R') && !i.ultimo).length,
    },
  };
}

/* ============================================================
   QUERY · período activo y agrupación por técnico
   ============================================================ */
function listaPeriodos() {
  return Object.keys(STATE.asignaciones || {})
    .filter(k => k !== '__meta' && /^\d{4}-\d{2}$/.test(k))
    .sort()
    .reverse();
}

function periodoActual() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

/** Responsable del equipo en un período según el archivo de asignación mensual. '' si no hay archivo o el equipo no aparece. */
function responsableDelPeriodo(equipo, periodo) {
  periodo = periodo || periodoActual();
  const asign = STATE.asignaciones[periodo];
  if (!asign || !asign.__meta) return '';
  return asign[equipo.uuid] || '';
}

function periodoLabel(p) {
  if (!p) return '—';
  const [y, m] = p.split('-');
  return `${MESES[Number(m)-1]} ${y}`;
}

/**
 * Agrupa equipos activos por responsable del período.
 * - Si hay archivo de asignación para el período: usa `asign[e.uuid]`.
 * - Si NO hay archivo: TODOS los equipos van a "(sin asignar)".
 *
 * `responsableMaster` del Excel es referencial y NO se usa como fuente de verdad.
 * (sin asignar) sólo contiene equipos activos que no aparecen como key en el archivo.
 */
function agruparPorTecnico(periodo) {
  const asign = STATE.asignaciones[periodo] || {};
  const tieneArchivo = !!asign.__meta;
  const groups = new Map();
  const equiposActivos = STATE.equipos.filter(e => !e.esSlot && e.estado !== 'DeBaja');
  equiposActivos.forEach(e => {
    const resp = tieneArchivo
      ? (asign[e.uuid] || '(sin asignar)')
      : '(sin asignar)';
    if (!groups.has(resp)) groups.set(resp, []);
    groups.get(resp).push(e);
  });
  return groups;
}

/* ============================================================
   IMPORT MAESTRO · modal de diferencias + pendiente
   ============================================================ */
function diffTieneCambios(diff) {
  return (diff.nuevos.length + diff.ausentes.length + diff.cambios.length) > 0;
}

function abrirModalDiferenciasMaestro(diff, opts={}) {
  const review = !!opts.review;
  const pendienteId = opts.pendienteId || null;

  // Recalcular totales sobre la posible modificación in-place
  function recomputarTotales() {
    diff.totales = {
      nuevos:   diff.nuevos.length,
      ausentes: diff.ausentes.length,
      cambios:  diff.cambios.length,
      camposCambiados: diff.cambios.reduce((s,c) => s + c.fields.length, 0),
      grillaCambios:   diff.cambios.reduce((s,c) => s + c.grilla.length, 0),
      ignoradosPrevios: diff.totales?.ignoradosPrevios || 0,
    };
  }

  function ignorarTodo() {
    diff.nuevos.forEach(n   => marcarDiffIgnorado(diffKeyNuevo(n.uuid), { nombre: n.nombre, serie: n.serie }));
    diff.ausentes.forEach(a => marcarDiffIgnorado(diffKeyAusente(a.uuid), { nombre: a.nombre }));
    diff.cambios.forEach(c => {
      c.fields.forEach(f => marcarDiffIgnorado(diffKeyCampo(c.uuid, f.campo, f.despues), { nombre: c.nombre }));
      c.grilla.forEach(g => marcarDiffIgnorado(diffKeyGrilla(c.uuid, g.mes, g.despues), { nombre: c.nombre }));
    });
    diff.nuevos = []; diff.ausentes = []; diff.cambios = [];
    recomputarTotales();
  }

  function pendienteTodo() {
    let n = 0;
    diff.nuevos.forEach(it   => { crearPendienteItemDiff(diff, it, 'nuevo');   n++; });
    diff.ausentes.forEach(it => { crearPendienteItemDiff(diff, it, 'ausente'); n++; });
    diff.cambios.forEach(c => {
      c.fields.forEach(f => { crearPendienteItemDiff(diff, { ...f, parent:c, uuid:c.uuid }, 'cambio'); n++; });
      c.grilla.forEach(g => { crearPendienteItemDiff(diff, { ...g, parent:c, uuid:c.uuid }, 'grilla'); n++; });
    });
    diff.nuevos = []; diff.ausentes = []; diff.cambios = [];
    recomputarTotales();
    return n;
  }

  UI.modal({
    title: review ? 'Diferencias por revisar' : 'Diferencias detectadas en el maestro',
    sub: `${diff.archivo} · ${fmt.datetime(diff.fecha)}`,
    size: 'lg',
    content: (body, { close }) => {
      function render() {
        body.innerHTML = '';
        const t = diff.totales;
        const noHayCambios = !diffTieneCambios(diff);

        // Resumen
        body.appendChild(h('div.kpi-grid', { style:{marginBottom:'14px'} }, [
          kpiCard({ label: 'Equipos nuevos',    value: fmt.number(t.nuevos),   kind: t.nuevos ? 'info' : 'muted' }),
          kpiCard({ label: 'Ausentes',          value: fmt.number(t.ausentes), kind: t.ausentes ? 'warning' : 'muted' }),
          kpiCard({ label: 'Con cambios',       value: fmt.number(t.cambios),  kind: t.cambios ? 'warning' : 'muted' }),
          kpiCard({ label: 'Cambios en grilla', value: fmt.number(t.grillaCambios || 0) }),
        ]));

        if (noHayCambios) {
          const previos = t.ignoradosPrevios || 0;
          body.appendChild(h('div.banner.info', [
            h('i.ti.ti-circle-check'),
            h('div.grow', previos
              ? `Sin diferencias relevantes · ${previos} cambios previamente ignorados (podés revisarlos en Configuración).`
              : 'No se detectaron diferencias respecto del estado actual.'),
          ]));
          return;
        }

        // Banner con ignorados previos si aplica
        if (t.ignoradosPrevios) {
          body.appendChild(h('div.banner.info', { style:{marginBottom:'10px'} }, [
            h('i.ti.ti-info-circle'),
            h('div.grow', `${t.ignoradosPrevios} diferencias previamente ignoradas no se muestran. Gestioná la lista desde Configuración → Diferencias ignoradas.`),
          ]));
        }

        // Acciones globales
        if (!review) {
          body.appendChild(h('div', { style:{display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'12px'} }, [
            h('button.btn.sm.ghost', { onclick: async () => {
              const ok = await UI.dialog({ title:'Ignorar todo', message:`¿Marcar como ignoradas ${t.nuevos + t.ausentes + t.camposCambiados + t.grillaCambios} diferencias? No vuelven a aparecer en próximos imports.`, confirmText:'Ignorar todo', variant:'danger' });
              if (!ok) return;
              ignorarTodo();
              UI.toast('Diferencias marcadas como ignoradas.', 'warning');
              render();
            } }, [ h('i.ti.ti-eye-off'), 'Marcar todo como ignorado' ]),
            h('button.btn.sm.ghost', { onclick: async () => {
              const ok = await UI.dialog({ title:'Crear pendientes', message:`¿Crear un pendiente individual por cada diferencia (${t.nuevos + t.ausentes + t.camposCambiados + t.grillaCambios})?`, confirmText:'Crear todos' });
              if (!ok) return;
              const n = pendienteTodo();
              UI.toast(`${n} pendientes creados.`, 'success');
              render();
            } }, [ h('i.ti.ti-clipboard-plus'), 'Marcar todo como pendiente' ]),
          ]));
        }

        // Tabs
        const tabs = h('div.tabs', { style:{padding:0, marginBottom:'12px'} });
        const panel = h('div');
        const sections = [
          { id:'nuevos',   label:'Nuevos',   count: t.nuevos,                                     render: () => panelNuevos(diff, render, review) },
          { id:'ausentes', label:'Ausentes', count: t.ausentes,                                   render: () => panelAusentes(diff, render, review) },
          { id:'cambios',  label:'Datos',    count: diff.cambios.filter(c => c.fields.length).length, render: () => panelCambios(diff, render, review) },
          { id:'grilla',   label:'Grilla',   count: diff.cambios.filter(c => c.grilla.length).length, render: () => panelGrilla(diff, render, review) },
        ];
        const first = sections.find(s => s.count > 0) || sections[0];
        sections.forEach(s => {
          const tab = h('div.tab', [ s.label, h('span.count', s.count) ]);
          if (s.id === first.id) tab.classList.add('active');
          tab.addEventListener('click', () => {
            $$('.tab', tabs).forEach(x => x.classList.remove('active'));
            tab.classList.add('active');
            panel.innerHTML = '';
            panel.appendChild(s.render());
          });
          tabs.appendChild(tab);
        });
        body.appendChild(tabs);
        body.appendChild(panel);
        panel.appendChild(first.render());
      }
      render();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, review ? 'Cerrar' : 'Cerrar'));
      if (review && pendienteId) {
        f.appendChild(h('button.btn.primary', { onclick: async () => {
          const ok = await UI.dialog({ title:'Cerrar pendiente', message: '¿Marcar este pendiente como revisado y cerrarlo?', confirmText:'Cerrar pendiente' });
          if (!ok) return;
          PENDIENTE.cerrar(pendienteId, 'Diferencias revisadas');
          UI.toast('Pendiente cerrado.', 'success');
          close();
          if (STATE.view === 'tareas') Router.go('tareas');
        }}, [ h('i.ti.ti-check'), 'Marcar revisado' ]));
      } else if (!review && diffTieneCambios(diff)) {
        f.appendChild(h('button.btn.primary', { onclick: () => {
          const p = crearPendienteDiferencias(diff);
          UI.toast(`Pendiente creado · vence ${fmt.date(p.vence)}.`, 'success', { duration: 5000 });
          close();
        }}, [ h('i.ti.ti-clipboard-plus'), 'Crear pendiente consolidado' ]));
      }
    },
  });
}

function crearPendienteDiferencias(diff) {
  const t = diff.totales;
  const partes = [];
  if (t.nuevos)   partes.push(`${t.nuevos} nuevos`);
  if (t.ausentes) partes.push(`${t.ausentes} ausentes`);
  if (t.cambios)  partes.push(`${t.cambios} con cambios`);
  const desc = `Revisar diferencias del maestro ${diff.archivo} (${partes.join(' · ') || 'sin cambios significativos'})`;
  const vence = addBusinessDays(new Date(), 2).toISOString();
  return PENDIENTE.crear({
    tipo: 'diferencias-maestro',
    descripcion: desc,
    asignado: '',
    vence,
    meta: { diff },
  });
}

function crearPendienteItemDiff(diff, item, kind) {
  let descripcion = '';
  let equipoUuid = item.uuid || item.parent?.uuid || null;
  const nombreEq = item.nombre || item.parent?.nombre || '';
  const serieEq  = item.serie  || item.parent?.serie  || '';
  switch (kind) {
    case 'nuevo':
      descripcion = `Maestro: equipo nuevo "${nombreEq}" (S/N ${serieEq || '—'}, Inv ${item.inventario || '—'}) — confirmar incorporación al PMP.`;
      break;
    case 'ausente':
      descripcion = `Maestro: equipo "${nombreEq}" (S/N ${serieEq || '—'}) ausente en el archivo nuevo — confirmar si corresponde dar de baja o reingresar.`;
      break;
    case 'cambio':
      descripcion = `Maestro: cambio en "${nombreEq}" — ${item.label || item.campo}: "${item.antes || '∅'}" → "${item.despues || '∅'}".`;
      break;
    case 'grilla':
      descripcion = `Maestro: cambio de grilla en "${nombreEq}" — ${MESES[item.mes-1]}: ${item.antes || '∅'} → ${item.despues || '∅'}.`;
      break;
  }
  const vence = addBusinessDays(new Date(), 3).toISOString();
  return PENDIENTE.crear({
    tipo: 'diferencia-item',
    descripcion,
    equipoUuid,
    asignado: '',
    vence,
    meta: { kind, item, diffArchivo: diff.archivo, diffFecha: diff.fecha },
  });
}

/** Merge updates from master file without destroying historial / correctivos / eventos / R-marks. */
function mergeEquipoInPlace(prev, draft) {
  // Static fields refreshed from master.
  ['fam','famOriginal','id','carpeta','inventario','nombre','servicio','unidad','ubicacion',
   'procedencia','marca','modelo','anio','vidaUtil','clasificacion','enu','observacion',
   'frecuencia','responsableMaster']
    .forEach(k => { if (draft[k]) prev[k] = draft[k]; });
  // Grilla: nuevo X no pisa R/RA/PM existentes.
  for (let m = 1; m <= 12; m++) {
    const incoming = draft.grilla[m];
    const current  = prev.grilla?.[m] ?? null;
    if (!incoming) continue;
    if (incoming === 'X' && (current === 'R' || current === 'RA' || current === 'PM')) continue;
    prev.grilla[m] = incoming;
  }
}

function exportBackup() {
  const payload = {
    appVersion: APP_VERSION,
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    equipos: STATE.equipos,
    pendientes: STATE.pendientes,
    asignaciones: STATE.asignaciones,
    contactos: STATE.contactos,
    session: STATE.session,
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const ts = new Date().toISOString().replace(/[:.]/g,'-');
  const a = h('a', { href: URL.createObjectURL(blob), download: `pmp_backup_${ts}.json` });
  document.body.appendChild(a); a.click(); a.remove();
  UI.toast('Backup descargado.', 'success');
}

async function importBackup() {
  const file = await pickFile('.json');
  if (!file) return;
  const ok = await UI.dialog({
    title: 'Restaurar backup',
    message: `Esto reemplaza todos los datos actuales con el contenido de "${file.name}". ¿Continuamos?`,
    confirmText: 'Restaurar',
    variant: 'danger',
  });
  if (!ok) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data.equipos)) throw new Error('El archivo no contiene un campo "equipos" válido.');
    STATE.equipos      = data.equipos.map(normalizeEquipoFromLegacy);
    STATE.pendientes   = Array.isArray(data.pendientes) ? data.pendientes : [];
    STATE.asignaciones = data.asignaciones && typeof data.asignaciones === 'object' ? data.asignaciones : {};
    STATE.contactos    = data.contactos    && typeof data.contactos    === 'object' ? data.contactos    : {};
    STATE.session      = data.session      && typeof data.session      === 'object' ? data.session      : {};
    persist();
    UI.toast(`Restaurados ${STATE.equipos.length} equipos.`, 'success');
    Router.go(STATE.view);
  } catch (e) {
    bus.emit('error', e);
  }
}

/**
 * Dropdown bloqueado de técnicos oficiales del SEC. Reemplaza el patrón
 * `<input list="ejecutores-list">` que no obligaba a elegir y dependía
 * del historial (que arranca vacío). Opciones en orden institucional.
 * @param value valor actual; si no está en la lista igual se preserva.
 * @param attrs atributos del <select> (onchange, name, etc.)
 * @param opts.placeholder texto del primer item disabled (default "— Elegí técnico —")
 * @param opts.includeOtros si true, agrega también ejecutores/responsables
 *   históricos al final de la lista oficial (para edición de registros viejos).
 */
function selectTecnico(value='', attrs={}, opts={}) {
  const placeholder = opts.placeholder || '— Elegí técnico —';
  const s = h('select.select', attrs);
  const phOpt = h('option', { value: '', disabled: true }, placeholder);
  if (!value) phOpt.selected = true;
  s.appendChild(phOpt);
  TECNICOS_OFICIALES.forEach(n => s.appendChild(h('option', { value: n }, n)));
  // Si el valor actual no está en la lista oficial, lo preservamos como opción extra.
  if (value && !TECNICOS_OFICIALES.includes(value)) {
    s.appendChild(h('option', { value, selected: true }, value + ' (histórico)'));
  }
  if (opts.includeOtros) {
    const extra = EQ.ejecutores().filter(n => !TECNICOS_OFICIALES.includes(n) && n !== value);
    if (extra.length) {
      const grp = h('optgroup', { label: 'Históricos' });
      extra.forEach(n => grp.appendChild(h('option', { value: n }, n)));
      s.appendChild(grp);
    }
  }
  if (value && TECNICOS_OFICIALES.includes(value)) s.value = value;
  return s;
}
function row(cols, children) {
  return h('div', { style:{ display:'grid', gridTemplateColumns: cols, gap:'12px', marginBottom:'10px' } }, children);
}

  const initialMes = opts.mes || (new Date().getMonth() + 1);

    fechaEvento: editing?.fechaEvento ? dateInputValue(editing.fechaEvento) : initialFecha,
    mes: editing?.mes ?? initialMes,
    resultado: editing?.resultado ?? 'SI',
    estadoFinal: editing?.estadoFinal ?? 'Operativo',
