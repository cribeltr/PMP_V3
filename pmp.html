    kpis.appendChild(kpiCard({ label: 'En servicio técn.', value: fmt.number(byEst.ServicioTecnico), kind: 'warning', onclick: () => Router.go('inv', { estado: 'ServicioTecnico' }) }));
    kpis.appendChild(kpiCard({ label: 'En garantía',     value: fmt.number(garan),  kind: 'purple',  onclick: () => Router.go('inv', { garantia: 'si' }) }));
    kpis.appendChild(kpiCard({ label: 'Ciclos abiertos', value: fmt.number(ciclos), kind: ciclos ? 'info' : 'muted', onclick: () => Router.go('ciclos') }));
    kpis.appendChild(kpiCard({ label: `MP ${MESES[mes-1]} cumplimiento`, value: `${pctCumpl}%`, kind: pctCumpl >= 80 ? 'success' : pctCumpl >= 50 ? 'warning' : 'danger', onclick: () => Router.go('pmp') }));
    kpis.appendChild(kpiCard({ label: `MP ${MESES[mes-1]} pendientes`,   value: `${fmt.number(mpPendientes)} / ${fmt.number(mpProgramadas)}`, kind: mpPendientes ? 'warning' : 'success', onclick: () => Router.go('pmp') }));
    kpis.appendChild(kpiCard({ label: 'Tareas abiertas',     value: fmt.number(pendAb),       kind: pendVencidos ? 'danger' : (pendAb ? 'warning' : 'muted'), onclick: () => Router.go('tareas') }));
    root.appendChild(kpis);

    // Alertas globales destacadas
    if (alertasA.length) {
      const sec = h('div.section');
      sec.appendChild(h('h3', `Atenciones (${alertasA.length})`));
      alertasA.forEach(a => {
        sec.appendChild(h(`div.banner.${a.kind}`, { style:{ marginBottom:'6px' } }, [
          h('i.ti', { class:'ti ' + (a.icon || 'ti-alert-circle') }),
          h('div.grow', [
            h('span', { style:{cursor:'pointer', fontWeight:500}, onclick: () => openFicha(a.equipo.uuid) }, a.equipo.nombre || '(sin nombre)'),
            ' · ', a.text,
          ]),
        ]));
      });
      root.appendChild(sec);
    }

    // Reciente
    const recientes = STATE.equipos
      .flatMap(e => (e.historial||[]).map(h => ({ e, h })))
      .filter(x => x.h.fecha)
      .sort((a,b) => new Date(b.h.fecha) - new Date(a.h.fecha))
      .slice(0, 8);

    const sec = h('div.section');
    sec.appendChild(h('h3', 'Últimos registros MP'));
    if (!recientes.length) {
      sec.appendChild(h('div.card', { style: { color: 'var(--ink-3)', fontSize:'12.5px' } }, 'Aún no hay registros de mantenciones.'));
    } else {
      const wrap = h('div.table-wrap');
      const tbl = h('table.dt');
      tbl.innerHTML = `<thead><tr>
        <th>Fecha</th><th>Equipo</th><th>Mes</th><th>Resultado</th><th>Ejecutor</th>
      </tr></thead>`;
      const tb = h('tbody');
      recientes.forEach(({ e, h: row }) => {
        const tr = h('tr', { onclick: () => openFicha(e.uuid) }, [
          h('td.col-mono', fmt.date(row.fecha)),
          h('td', [ h('div', e.nombre), h('div', { style:{color:'var(--ink-3)',fontSize:'11.5px'} }, `${e.marca||''} · ${e.modelo||''}`) ]),
          h('td', MESES[(row.mes||1)-1]),
          h('td', resultadoPill(row.resultado)),
          h('td', row.ejecutor || '—'),
        ]);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      wrap.appendChild(tbl);
      sec.appendChild(wrap);
    }
    root.appendChild(sec);
  },
};

function resultadoPill(r) {
  if (!r) return h('span.pill.muted','—');
  if (r === 'SI') return h('span.pill.success','SI');
  if (r === 'NO') return h('span.pill.warning','NO');
  if (r === 'FS') return h('span.pill.muted','FS');
  if (r === 'BAJA') return h('span.pill.danger','BAJA');
  if (CAUSALES[r]) return h(`span.pill.${CAUSALES[r].grupo==='A'?'warning':'info'}`, r);
  return h('span.pill', r);
}

function kpiCard({ label, value, kind='', onclick }) {
  return h(`div.kpi ${kind}`.trim(), { onclick }, [
    h('span.label', label),
    h('span.value', value ?? '—'),
  ]);
}

function viewHeader({ title, desc, actions=[] }) {
  return h('div.view-header', [
    h('div', [ h('h2', title), desc ? h('p', desc) : null ]),
    h('div.actions', actions.map(a => h(`button.btn ${a.primary?'primary':''}`.trim(), { onclick: a.onclick }, [
      a.icon ? h('i.ti', { class: 'ti ' + a.icon }) : null,
      a.label,
    ]))),
  ]);
}

function emptyState({ icon, title, desc, actions=[] }) {
  return h('div.card', { style: { padding: 0 } }, [
    h('div.empty', [
      h('i.ti', { class: 'ti ' + (icon||'ti-info-circle') }),
      h('h4', title),
      h('p', desc || ''),
      h('div.actions', actions.map(a =>
        h(`button.btn ${a.primary?'primary':''}`.trim(), { onclick: a.onclick }, [
          a.icon ? h('i.ti', { class: 'ti ' + a.icon }) : null, a.label,
        ]))),
    ]),
  ]);
}

/* ============================================================
   VIEW · inventario
   ============================================================ */
VIEWS.inv = {
  title: 'Inventario',
  render(root, params) {
    // Preferencia persistente para mostrar slots; viewParams.showSlots la sobreescribe (click en KPI del dashboard).
    const showSlotsPref = (() => {
      try { return localStorage.getItem('pmp.v3.ui.inventario.showSlots') === '1'; } catch { return false; }
    })();
    const showSlots = (params && typeof params.showSlots === 'boolean') ? params.showSlots : showSlotsPref;

    const periodoFiltro = params?.periodo || periodoActual();

    const filters = Object.assign({
      q: '', servicio: '', familia: '', estado: '', responsable: '', garantia: '',
    }, params || {});

    const headerEl = viewHeader({
      title: 'Inventario',
      desc: `${fmt.number(STATE.equipos.length)} equipos cargados${showSlots ? '' : ' · slots disponibles ocultos'}`,
      actions: [
        { label: 'Importar maestro', icon: 'ti-refresh', onclick: handleImportMaestro },
        { label: 'Backup', icon: 'ti-database-export', onclick: exportBackup },
      ],
    });
    root.appendChild(headerEl);

    if (STATE.equipos.length === 0) {
      root.appendChild(emptyState({
        icon: 'ti-stethoscope',
        title: 'Sin inventario',
        desc: 'Importá el Excel maestro o restaurá un backup JSON.',
        actions: [
          { label: 'Importar maestro', icon: 'ti-file-spreadsheet', primary: true, onclick: handleImportMaestro },
          { label: 'Restaurar backup', icon: 'ti-database-import', onclick: importBackup },
        ],
      }));
      return;
    }

    const tableWrap = h('div.table-wrap');

    // toolbar
    const search = h('div.search', [
      h('i.ti.ti-search'),
      h('input', { type:'text', placeholder:'Buscar por nombre, serie, inventario, marca…', value: filters.q }),
    ]);

    // Responsable: opciones del período activo (asignaciones cargadas) + "(sin asignar)"
    const respPeriodo = EQ.responsablesPeriodo(periodoFiltro);
    const respOpts = [
      ...respPeriodo,
      '(sin asignar)',
    ];

    const selServicio = selectField('Servicio', '', EQ.servicios(), filters.servicio);
    const selFamilia  = selectField('Familia',  '', EQ.familias(),  filters.familia);
    const selEstado   = selectField('Estado',   '', ESTADOS.map(s => ({ value: s, label: ESTADO_LABEL[s] })), filters.estado);
    const selResp     = selectField(`Resp. ${periodoLabel(periodoFiltro)}`, '', respOpts, filters.responsable);
    const selGar      = selectField('Garantía', '', [{value:'si',label:'En garantía'},{value:'no',label:'Sin garantía'}], filters.garantia);

    // Toggle slots: visible siempre, default OFF, persistido
    const slotToggle = h('label', {
      style:{ display:'flex', alignItems:'center', gap:'6px', padding:'6px 10px', border:'.5px solid var(--line-2)', borderRadius:'var(--r-md)', cursor:'pointer', fontSize:'12px', whiteSpace:'nowrap' },
      title: 'Slots disponibles son posiciones sin equipo asignado',
    }, [
      h('input', { type:'checkbox', checked: showSlots, style:{margin:0}, onchange: (e) => {
        const v = e.target.checked;
        try { localStorage.setItem('pmp.v3.ui.inventario.showSlots', v ? '1' : '0'); } catch {}
        // Pasamos el override por params para que persista en este viewParams stack
        Router.go('inv', Object.assign({}, currentParams(), { showSlots: v }));
      }}),
      h('span', 'Mostrar slots'),
    ]);

    function currentParams() {
      return {
        q: search.querySelector('input').value,
        servicio: selServicio.querySelector('select').value,
        familia:  selFamilia.querySelector('select').value,
        estado:   selEstado.querySelector('select').value,
        responsable: selResp.querySelector('select').value,
        garantia: selGar.querySelector('select').value,
        periodo: periodoFiltro,
      };
    }

    const toolbar = h('div.table-toolbar', [
      search,
      h('div.right', { style:{gap:'6px'} }, [ selServicio, selFamilia, selEstado, selResp, selGar, slotToggle,
        h('button.btn.ghost.sm', { onclick: () => Router.go('inv', {}) }, [ h('i.ti.ti-x'), 'Limpiar' ]),
      ]),
    ]);

    const meta = h('div.table-meta', '');
    const tbl = h('table.dt');
    tbl.innerHTML = `<thead><tr>
      <th>Servicio</th>
      <th>Equipo</th>
      <th>Carpeta</th>
      <th>Inventario</th>
      <th>Serie</th>
      <th>Marca / Modelo</th>
      <th>Frec.</th>
      <th>Estado</th>
    </tr></thead>`;
    const tb = h('tbody');
    tbl.appendChild(tb);

    tableWrap.appendChild(toolbar);
    tableWrap.appendChild(meta);
    tableWrap.appendChild(tbl);

    root.appendChild(tableWrap);

    // dynamic list state
    let rendered = 0;
    const PAGE = 80;
    let current = [];

    function applyFilters() {
      const f = Object.assign({}, currentParams(), { slot: showSlots ? '' : 'no' });
      const q = f.q;
      current = EQ.search(q, f);
      current.sort((a,b) => (a.servicio||'').localeCompare(b.servicio||'','es') || (a.nombre||'').localeCompare(b.nombre||'','es'));
      tb.innerHTML = '';
      rendered = 0;
      const extra = showSlots ? '' : ` · ${fmt.number(STATE.equipos.filter(e => e.esSlot).length)} slots ocultos`;
      meta.textContent = `${fmt.number(current.length)} equipos coinciden con los filtros${extra}`;
      renderMore();
    }
    function renderMore() {
      const slice = current.slice(rendered, rendered + PAGE);
      slice.forEach(e => tb.appendChild(rowForEquipo(e)));
      rendered += slice.length;
      if (rendered >= current.length) sentinel.style.display = 'none';
      else sentinel.style.display = '';
    }
    const sentinel = h('tr', { style:{} }, [ h('td', { colspan: 8, style:{textAlign:'center', color:'var(--ink-3)', padding:'10px', fontSize:'11.5px'} }, 'Cargando más…') ]);
    tb.parentNode.appendChild(sentinel); // outside tbody (browser tolerates)
    const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting && rendered < current.length) renderMore(); }), { rootMargin: '120px' });

    search.querySelector('input').addEventListener('input', applyFilters);
    [selServicio, selFamilia, selEstado, selResp, selGar].forEach(s => s.querySelector('select').addEventListener('change', applyFilters));

    applyFilters();
    io.observe(sentinel);
  },
};

function selectField(label, placeholder, items, value='') {
  const wrap = h('div');
  const sel = h('select.select');
  sel.appendChild(h('option', { value: '' }, label));
  items.forEach(it => {
    if (typeof it === 'string') sel.appendChild(h('option', { value: it }, it));
    else sel.appendChild(h('option', { value: it.value }, it.label));
  });
  if (value) sel.value = value;
  wrap.appendChild(sel);
  return wrap;
}

function rowForEquipo(e) {
  const tr = h('tr', { onclick: () => openFicha(e.uuid) });
  if (e.esSlot) tr.classList.add('is-slot');
  const pill = e.esSlot
    ? h('span.pill.muted', 'Slot')
    : h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), [ h('span.dot'), ESTADO_LABEL[e.estado] || e.estado ]);
  tr.appendChild(h('td.truncate', { title: e.servicio }, e.servicio || '—'));
  tr.appendChild(h('td', [
    h('div', e.nombre || '—'),
    h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, e.fam || ''),
  ]));
  tr.appendChild(h('td.col-mono', e.carpeta != null && e.carpeta !== '' ? String(e.carpeta) : '—'));
  tr.appendChild(h('td.col-mono', e.inventario || '—'));
  tr.appendChild(h('td.col-mono', e.serie || '—'));
  tr.appendChild(h('td.truncate', { title:`${e.marca} ${e.modelo}` }, `${e.marca || ''} ${e.modelo ? '· ' + e.modelo : ''}`.trim() || '—'));
  tr.appendChild(h('td', e.frecuencia ? h('span.pill', e.frecuencia) : '—'));
  tr.appendChild(h('td', pill));
  return tr;
}

/* ============================================================
   UI · ficha 360 (modal)
   ============================================================ */
function openFicha(uuid) {
  const e = EQ.byUuid(uuid);
  if (!e) { bus.emit('error', new Error('Equipo no encontrado.')); return; }

  const TABS = [
    { id: 'datos',     label: 'Datos',     icon: 'ti-id-badge-2' },
    { id: 'garantia',  label: 'Garantía',  icon: 'ti-shield-check' },
    { id: 'grilla',    label: 'Grilla anual', icon: 'ti-calendar-month' },
    { id: 'historial', label: 'Historial MP', icon: 'ti-history', count: (e.historial||[]).length },
    { id: 'eventos',   label: 'Eventos',   icon: 'ti-timeline', count: (e.eventos||[]).length },
    { id: 'ciclos',    label: 'Ciclos',    icon: 'ti-tools',    count: (e.correctivos||[]).length },
    { id: 'pendientes',label: 'Pendientes',icon: 'ti-checklist',count: (e.pendientesIds||[]).length },
  ];

  UI.modal({
    title: e.nombre || '(sin nombre)',
    sub: [
      e.fam, e.servicio, e.serie ? `S/N ${e.serie}` : null, e.inventario ? `Inv ${e.inventario}` : null,
    ].filter(Boolean).join(' · '),
    size: 'lg',
    content: (body) => {
      // Banners de alerta (Grupo A > 30d, sigem pendiente, causales sin vincular)
      const alertas = alertasDeEquipo(e);
      if (alertas.length) {
        alertas.forEach(a => {
          const banner = h(`div.banner.${a.kind}`, { style:{ marginBottom:'8px' } }, [
            h('i.ti', { class: 'ti ' + (a.icon || 'ti-alert-circle') }),
            h('div.grow', a.text),
            a.action ? h('button.btn.sm', { onclick: a.action.handler }, a.action.label) : null,
          ]);
          body.appendChild(banner);
        });
      }

      // Header strip with status & warranty
      const strip = h('div', { style:{ display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'10px' } });
      const pill = e.esSlot
        ? h('span.pill.muted', 'Slot disponible')
        : h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), [ h('span.dot'), ESTADO_LABEL[e.estado] || e.estado ]);
      strip.appendChild(pill);
      if (e.enGarantia) strip.appendChild(h('span.pill.purple', [ h('i.ti.ti-shield-check', {style:{fontSize:'12px'}}), 'En garantía' ]));
      if (e.frecuencia) strip.appendChild(h('span.pill', `MP ${e.frecuencia.toLowerCase()}`));
      if (e.estadoDesde) strip.appendChild(h('span.pill.muted', `Desde ${fmt.rel(e.estadoDesde)}`));
      const ciclosAb = (e.correctivos||[]).filter(c => c.abierto);
      if (ciclosAb.length) strip.appendChild(h('span.pill.warning', [h('i.ti.ti-tools',{style:{fontSize:'12px'}}), `${ciclosAb.length} ciclo${ciclosAb.length>1?'s':''} abierto${ciclosAb.length>1?'s':''}`]));
      body.appendChild(strip);

      // Tabs
      const tabs = h('div.tabs', { style:{padding:0, marginBottom:'14px'} });
      const panel = h('div');
      TABS.forEach((t,i) => {
        const tab = h('div.tab', { dataset:{ tab: t.id } }, [ t.label, t.count != null ? h('span.count', t.count) : null ]);
        if (i === 0) tab.classList.add('active');
        tab.addEventListener('click', () => {
          $$('.tab', tabs).forEach(x => x.classList.remove('active'));
          tab.classList.add('active');
          panel.innerHTML = '';
          panel.appendChild(renderFichaTab(t.id, e));
        });
        tabs.appendChild(tab);
      });
      body.appendChild(tabs);
      body.appendChild(panel);
      panel.appendChild(renderFichaTab('datos', e));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cerrar'));
      f.appendChild(h('button.btn', { onclick: () => { close(); abrirModalRegistrarMP(e); } }, [ h('i.ti.ti-calendar-plus'), 'Registrar MP' ]));
      const cicloAbierto = (e.correctivos||[]).find(c => c.abierto);
      f.appendChild(h(`button.btn.primary ${cicloAbierto?'ghost':''}`.trim(), {
        onclick: () => {
          close();
          if (cicloAbierto) abrirCicloViewer(e, cicloAbierto);
          else              abrirModalAperturaCiclo(e);
        },
      }, [ h('i.ti.ti-tools'), cicloAbierto ? 'Ver ciclo en curso' : 'Abrir ciclo correctivo' ]));
    },
  });
}

function abrirModalAperturaCiclo(equipo) {
  // Versión mínima It.2: redirige a flujo simple "crear ciclo en diagnóstico" sin causal previa.
  // La UI completa por eslabón llega en It.3.
  let snap = {
    fechaEvento: todayISO(),
    deteccion: 'Servicio clínico avisó',
    descripcion: '',
    responsable: '',
    sigemEstado: 'falta',
    folioSigem: '',
  };
  UI.modal({
    title: 'Apertura de ciclo correctivo',
    sub: equipo.nombre,
    size: 'md',
    content: (body) => {
      body.appendChild(h('p', { style:{margin:'0 0 12px 0', color:'var(--ink-2)', fontSize:'12.5px'} },
        'El equipo pasa a No Operativo con la fecha real del problema. Si todavía no hay folio SIGEM, se crea un pendiente para gestionarlo.'));
      body.appendChild(row('1fr 1fr', [
        field('Fecha real del problema *', dateCtl(snap.fechaEvento, { onchange:(e)=> snap.fechaEvento = e.target.value }), 'Admite fechas pasadas.'),
        field('Cómo se detectó', selectCtl(DETECCIONES_APERTURA, snap.deteccion, { onchange:(e)=> snap.deteccion = e.target.value })),
      ]));
      body.appendChild(field('Descripción del problema *', textareaCtl({ rows:3, oninput:(e)=> snap.descripcion = e.target.value })));
      body.appendChild(row('1fr 1fr', [
        field('Responsable que recibe el caso *', inputCtl({ oninput:(e)=> snap.responsable = e.target.value })),
        field('Estado de la solicitud SIGEM', selectCtl([
          { value:'falta',    label:'Falta gestionar con servicio clínico (por defecto)' },
          { value:'existe',   label:'Ya existe — tengo el folio' },
          { value:'noAplica', label:'No aplica' },
        ], snap.sigemEstado, { onchange:(e)=> { snap.sigemEstado = e.target.value; renderSigem(); } })),
      ]));
      const sigemRow = h('div');
      body.appendChild(sigemRow);
      function renderSigem() {
        sigemRow.innerHTML = '';
        if (snap.sigemEstado === 'existe') {
          sigemRow.appendChild(field('Folio SIGEM *', inputCtl({ placeholder:'2026-12345', oninput:(e)=> snap.folioSigem = e.target.value })));
        } else if (snap.sigemEstado === 'falta') {
          sigemRow.appendChild(h('div.banner.warning', [ h('i.ti.ti-info-circle'), h('div.grow','Se creará un pendiente "Solicitar folio SIGEM al servicio clínico" con vencimiento 3 días hábiles. El ciclo arrancará igual con banner amarillo en la ficha.') ]));
        }
      }
      renderSigem();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        try {
          const fechaISO = isoFromDateInput(snap.fechaEvento);
          if (!fechaISO) throw new Error('Fecha inválida.');
          if (!snap.descripcion.trim()) throw new Error('Falta descripción.');
          if (!snap.responsable.trim()) throw new Error('Indicá un responsable.');
          if (snap.sigemEstado === 'existe' && !snap.folioSigem.trim()) throw new Error('Indicá el folio SIGEM o cambiá a "Falta gestionar".');
          const { ciclo } = CICLO.crear(equipo.uuid, {
            fechaEvento: fechaISO,
            deteccion: snap.deteccion,
            descripcion: snap.descripcion.trim(),
            responsable: snap.responsable.trim(),
            sigemEstado: snap.sigemEstado,
            folioSigem: snap.folioSigem.trim(),
            startEslabon: 'diagnostico',
          });
          UI.toast('Ciclo abierto. Equipo marcado No Operativo.', 'success');
          close('save');
          abrirCicloViewer(equipo, ciclo);
        } catch (e) { bus.emit('error', e); }
      }}, 'Abrir ciclo'));
    },
  });
}

function renderFichaTab(id, e) {
  const wrap = h('div');
  switch (id) {
    case 'datos': {
      const dl = h('dl.dl');
      [
        ['Nombre', e.nombre || '—'],
        ['Familia', e.fam || '—'],
        ['Servicio', e.servicio || '—'],
        ['Unidad', e.unidad || '—'],
        ['Ubicación', e.ubicacion || '—'],
        ['Procedencia', e.procedencia || '—'],
        ['Marca', e.marca || '—'],
        ['Modelo', e.modelo || '—'],
        ['Serie', e.serie || '—'],
        ['Inventario', e.inventario || '—'],
        ['Carpeta', e.carpeta ?? '—'],
        ['Año instalación', e.anio || '—'],
        ['Vida útil residual', e.vidaUtil || '—'],
        ['Clasificación', e.clasificacion || '—'],
        ['Frecuencia MP', e.frecuencia || '—'],
        ['Responsable del período', responsableDelPeriodo(e) || '—'],
        ['Responsable (maestro, referencial)', e.responsableMaster || '—'],
        ['ENU / baja', e.enu || '—'],
        ['Estado actual', ESTADO_LABEL[e.estado] || e.estado || '—'],
        ['Estado desde', e.estadoDesde ? `${fmt.date(e.estadoDesde)} (${fmt.rel(e.estadoDesde)})` : '—'],
        ['Observación', e.observacion || '—'],
      ].forEach(([k,v]) => { dl.appendChild(h('dt', k)); dl.appendChild(h('dd', v)); });
      wrap.appendChild(dl);
      break;
    }
    case 'garantia': {
      if (!e.enGarantia) {
        wrap.appendChild(h('div.empty', [
          h('i.ti.ti-shield-off'),
          h('h4', 'Sin garantía activa'),
          h('p', 'Podrás declarar garantía y proveedor desde la edición del equipo (It.3).'),
        ]));
      } else {
        const dl = h('dl.dl', [
          h('dt', 'Estado'), h('dd', h('span.pill.purple','En garantía')),
          h('dt', 'Proveedor'), h('dd', e.garantiaProveedor || '—'),
          h('dt', 'Vigente hasta'), h('dd', e.garantiaHasta ? fmt.date(e.garantiaHasta) : '—'),
        ]);
        wrap.appendChild(dl);
      }
      break;
    }
    case 'grilla': {
      const grilla = h('div.grilla');
      for (let m = 1; m <= 12; m++) {
        const v = e.grilla?.[m] || null;
        const ejecutada = (e.historial||[]).some(h => h.mes === m && h.resultado === 'SI');
        const cell = h(`div.cell ${v?'v-'+v:''}`.trim(), {
          style:{ cursor:'pointer' },
          title: 'Click para editar marcador o registrar MP',
          onclick: () => abrirModalGrillaCelda(e, m),
        }, [
          h('span.m', MESES[m-1]),
          h('span.v', ejecutada ? '✓' : (v || '')),
        ]);
        grilla.appendChild(cell);
      }
      wrap.appendChild(grilla);
      wrap.appendChild(h('p', { style:{ color:'var(--ink-3)', fontSize:'11.5px', marginTop:'10px' } }, 'X = programada · R = reprogramada · RA = legado · PM = puesta en marcha · ✓ = MP ejecutada.'));
      break;
    }
    case 'historial': {
      const hs = (e.historial || []).slice().sort((a,b) => new Date(b.fecha||0) - new Date(a.fecha||0));
      if (!hs.length) { wrap.appendChild(emptyTabHint('Sin registros de MP todavía.')); break; }
      const tbl = h('table.dt');
      tbl.innerHTML = `<thead><tr><th>Fecha</th><th>Mes</th><th>Resultado</th><th>Estado final</th><th>Ejecutor</th><th>Observación</th></tr></thead>`;
      const tb = h('tbody');
      hs.forEach(row => {
        const tr = h('tr', { style:{cursor: row.id ? 'pointer' : 'default'}, onclick: () => { if (row.id) abrirModalRegistrarMP(e, { edit: row }); } }, [
          h('td.col-mono', fmt.date(row.fechaEvento || row.fecha)),
          h('td', MESES[(row.mes||1)-1]),
          h('td', resultadoPill(row.resultado)),
          h('td', row.estadoFinal ? ESTADO_LABEL[row.estadoFinal] || row.estadoFinal : '—'),
          h('td', row.ejecutor || '—'),
          h('td.truncate', { title: row.obs||'' }, row.obs || ''),
        ]);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      wrap.appendChild(h('div.table-wrap', [ tbl ]));
      break;
    }
    case 'eventos': {
      const evs = (e.eventos || []).slice().sort((a,b) => new Date(b.ts||0) - new Date(a.ts||0));
      if (!evs.length) { wrap.appendChild(emptyTabHint('Aún no hay eventos en el timeline.')); break; }
      const tl = h('div.timeline');
      evs.forEach(ev => {
        tl.appendChild(h('div.tl-item', [
          h('div.tl-date', [ fmt.date(ev.ts), h('div',{style:{color:'var(--ink-4)',fontSize:'10.5px'}}, fmt.rel(ev.ts)) ]),
          h('div.tl-body', [
            h('div.title', ev.tipo || '—'),
            ev.payload ? h('div.desc', typeof ev.payload === 'string' ? ev.payload : JSON.stringify(ev.payload)) : null,
          ]),
        ]));
      });
      wrap.appendChild(tl);
      break;
    }
    case 'ciclos': {
      const cs = (e.correctivos || []).slice().reverse();
      if (!cs.length) { wrap.appendChild(emptyTabHint('No hay ciclos correctivos para este equipo.')); break; }
      cs.forEach(c => {
        const card = h('div.card', { style:{ marginBottom: '10px', cursor:'pointer' }, onclick: () => { abrirCicloViewer(e, c); } }, [
          h('div.card-h', [
            h('h3', c.abierto ? 'Ciclo en curso' : (c.cancelado ? 'Ciclo cancelado' : 'Ciclo cerrado')),
            h('span.sub', `Eslabón: ${ESLABONES_LABEL[c.eslabonActual] || c.eslabonActual || '—'}`),
            c.enGarantia ? h('span.pill.purple', 'Garantía') : null,
            c.abierto ? h('span.pill.warning', 'Abierto') : (c.cancelado ? h('span.pill.danger','Cancelado') : h('span.pill.success', 'Cerrado')),
            h('button.btn.sm.ghost', { style:{marginLeft:'auto'}, onclick: (ev) => { ev.stopPropagation(); abrirCicloViewer(e, c); } }, [ h('i.ti.ti-chevron-right'), 'Abrir' ]),
          ]),
          h('div', { style:{ fontSize:'12.5px', color:'var(--ink-2)' } }, [
            c.apertura?.fechaEvento ? `Aperturado el ${fmt.date(c.apertura.fechaEvento)}. ` :
            c.apertura?.fecha       ? `Aperturado el ${fmt.date(c.apertura.fecha)}. ` :
            c.solicitud?.fecha      ? `Solicitud del ${fmt.date(c.solicitud.fecha)}. ` : '',
            c.apertura?.folioSigem ? `Folio SIGEM ${c.apertura.folioSigem}. ` :
            c.solicitud?.folioSigem ? `Folio SIGEM ${c.solicitud.folioSigem}. ` : '',
            c.ruta ? `Ruta: ${c.ruta.replace('_',' ')}. ` : '',
            c.cerradoEn ? `Cierre: ${fmt.date(c.cerradoEn)}.` : '',
          ]),
        ]);
        wrap.appendChild(card);
      });
      break;
    }
    case 'pendientes': {
      const ps = (e.pendientesIds||[])
        .map(id => STATE.pendientes.find(p => p.id === id))
        .filter(Boolean);
      if (!ps.length) { wrap.appendChild(emptyTabHint('Sin pendientes administrativos vinculados.')); break; }
      ps.forEach(p => {
        wrap.appendChild(h('div.card', { style:{ marginBottom:'8px' } }, [
          h('div.card-h', [ h('h3', p.descripcion || '(sin descripción)'), p.estado === 'Cerrado' ? h('span.pill.success','Cerrado') : h('span.pill.warning','Abierto') ]),
          h('div', { style:{ fontSize:'12.5px', color:'var(--ink-2)' } }, [
            p.asignado ? `Asignado a ${p.asignado}. ` : '',
            p.vence ? `Vence ${fmt.date(p.vence)}. ` : (p.fechaCompromiso ? `Vence ${fmt.date(p.fechaCompromiso)}. ` : ''),
            p.creado ? `Creado ${fmt.rel(p.creado)}.` : '',
          ]),
        ]));
      });
      break;
    }
  }
  return wrap;
}

function renderCumplimientoSidecar() {
  const now = new Date();
  const mes = now.getMonth()+1;
  const programadas = STATE.equipos.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R');
  const ejecutadas  = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI'));
  const causalizadas = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && CAUSALES[h.resultado]));
  const pendientes   = programadas.length - ejecutadas.length - causalizadas.length;
  const pct = programadas.length ? Math.round(ejecutadas.length / programadas.length * 100) : 0;

  return h('div', { style:{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'10px', marginTop:'14px' } }, [
    kpiCard({ label: `${MESES[mes-1]} · programadas`, value: fmt.number(programadas.length) }),
    kpiCard({ label: 'Ejecutadas (SI)', value: `${fmt.number(ejecutadas.length)} (${pct}%)`, kind: pct >= 80 ? 'success' : pct >= 50 ? 'warning' : 'danger' }),
    kpiCard({ label: 'Causalizadas', value: fmt.number(causalizadas.length), kind: 'warning' }),
    kpiCard({ label: 'Pendientes', value: fmt.number(Math.max(pendientes,0)), kind: pendientes > 0 ? 'danger' : 'success' }),
  ]);
}

function filterEquiposForPMP(f) {
  const list = STATE.equipos.filter(e => !e.esSlot && e.estado !== 'DeBaja');
  const n = normalize(f.q);
  return list.filter(e => {
    if (f.servicio && e.servicio !== f.servicio) return false;
    if (f.familia  && e.fam !== f.familia) return false;
    if (f.frecuencia && e.frecuencia !== f.frecuencia) return false;
    if (!n) return true;
    return normalize(`${e.nombre} ${e.serie} ${e.inventario} ${e.marca} ${e.modelo}`).includes(n);
  });
}

function renderMes(container, meta, f) {
  const m = f.mes;
  const equipos = filterEquiposForPMP(f);
  const filas = equipos
    .map(e => {
      const programado = e.grilla?.[m] || null;
      const hist = (e.historial || []).filter(h => h.mes === m).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
      const ultimo = hist[0] || null;
      return { e, programado, ultimo };
    })
    .filter(r => r.programado || r.ultimo);

  filas.sort((a,b) => {
    const orden = (r) => {
      if (r.ultimo?.resultado === 'SI') return 4;
      if (r.ultimo && CAUSALES[r.ultimo.resultado]) return 2;
      if (r.programado) return 1;
      return 5;
    };
    return orden(a) - orden(b) || (a.e.servicio||'').localeCompare(b.e.servicio||'','es');
  });

  meta.textContent = `${MESES[m-1]} · ${filas.length} equipos con actividad`;

  if (!filas.length) {
    container.appendChild(h('div.empty', { style:{padding:'40px 12px'} }, [
      h('i.ti.ti-calendar-off'), h('h4','Sin actividad programada para este mes'),
    ]));
    return;
  }

  const tbl = h('table.dt');
  tbl.innerHTML = `<thead><tr>
    <th>Servicio</th><th>Equipo</th><th>Frec.</th><th>Programado</th><th>Resultado</th><th>Fecha</th><th>Ejecutor</th><th></th>
  </tr></thead>`;
  const tb = h('tbody');
  filas.forEach(({ e, programado, ultimo }) => {
    const tr = h('tr');
    tr.appendChild(h('td.truncate', { title: e.servicio }, e.servicio || '—'));
    tr.appendChild(h('td', [
      h('div', e.nombre),
      h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, `${e.serie || ''} · ${e.inventario || ''}`),
    ]));
    tr.appendChild(h('td', e.frecuencia ? h('span.pill', e.frecuencia) : '—'));
    tr.appendChild(h('td', programado ? h(`span.pill.${programado==='X'?'info':programado==='R'?'warning':programado==='PM'?'purple':'muted'}`, programado) : '—'));
    tr.appendChild(h('td', ultimo ? resultadoPill(ultimo.resultado) : '—'));
    tr.appendChild(h('td.col-mono', ultimo ? fmt.date(ultimo.fechaEvento || ultimo.fecha) : '—'));
    tr.appendChild(h('td', ultimo ? ultimo.ejecutor || '—' : '—'));
    const acciones = h('td', [
      h('button.btn.sm', { onclick: (ev) => { ev.stopPropagation(); abrirModalRegistrarMP(e, { mes: m }); } }, [ h('i.ti.ti-edit'), 'Registrar' ]),
    ]);
    tr.appendChild(acciones);
    tr.addEventListener('click', () => openFicha(e.uuid));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  container.appendChild(tbl);
}

  </tr></thead>`;
  const tb = h('tbody');
  equipos.slice(0, 300).forEach(e => {

      const ejec = (e.historial||[]).find(h => h.mes === m && h.resultado === 'SI');

        v === 'X'  ? 'v-X' :
        v === 'R'  ? 'v-R' :
        v === 'RA' ? 'v-RA':
        v === 'PM' ? 'v-PM': '';
      const label = ejec ? '✓' : (v || '');
      const td = h(`td`, {
        style:{ textAlign:'center', padding:'2px', cursor:'pointer' },
        title: ejec ? `Ejecutada ${fmt.date(ejec.fechaEvento || ejec.fecha)}` : (v ? `Marcador ${v}` : 'Sin programar'),
        onclick: (ev) => { ev.stopPropagation(); abrirModalGrillaCelda(e, m); },
      }, [
        h(`div.cell ${cls}`.trim(), { style:{padding:'4px 2px', minWidth:'30px', borderRadius:'4px'} }, [

  if (equipos.length > 300) {
    container.appendChild(h('div', { style:{padding:'10px', color:'var(--ink-3)', fontSize:'11.5px', textAlign:'center'} }, `Mostrando 300 de ${equipos.length} — afina los filtros.`));
  }
}

VIEWS.entregas = {

    const periodos = listaPeriodos();

    const meta = STATE.asignaciones[periodo]?.__meta;

    // Header
    const periodoSel = selectCtl(
      periodos.length
        ? periodos.map(p => ({ value: p, label: periodoLabel(p) }))
        : [{ value: periodo, label: periodoLabel(periodo) }],
      periodo,
      { onchange: (e) => Router.go('entregas', { periodo: e.target.value }) },
    );

    root.appendChild(viewHeader({
      title: 'Entregas',
      desc: meta
        ? `${periodoLabel(periodo)} · archivo ${meta.archivo} cargado ${fmt.rel(meta.fechaCarga)} · ${meta.matcheados} de ${meta.total} equipos${meta.sinMatch?.length ? ' · '+meta.sinMatch.length+' sin match' : ''}`
        : `${periodoLabel(periodo)} · sin archivo mensual — usando "Responsable MP" del maestro`,
      actions: [
        { label:'Importar asignación', icon:'ti-file-spreadsheet', onclick: () => handleImportAsignacion(periodo) },

          catch(e) { bus.emit('error', e); }
        } },
      ],
    }));

    // Period switch
    const periodBar = h('div', { style:{display:'flex', gap:'8px', alignItems:'center', marginBottom:'14px'} }, [
      h('span', { style:{ fontSize:'12px', color:'var(--ink-3)' } }, 'Período:'),
      periodoSel,

    ]);

    if (!STATE.equipos.length) {
      root.appendChild(emptyState({ icon:'ti-stethoscope', title:'Sin inventario', desc:'Cargá el maestro primero.' }));
      return;
    }

    const groups = agruparPorTecnico(periodo);
    const mesNum = Number(periodo.split('-')[1]);
    const tecnicos = Array.from(groups.entries()).sort((a,b) => {
      // (sin asignar) al final
      if (a[0] === '(sin asignar)') return 1;
      if (b[0] === '(sin asignar)') return -1;
      return b[1].length - a[1].length;
    });

    // KPIs globales
    const totalAsignados = Array.from(groups.entries()).filter(([k]) => k !== '(sin asignar)').reduce((s,[,v]) => s + v.length, 0);
    const sinAsignar     = groups.get('(sin asignar)')?.length || 0;

    root.appendChild(h('div.kpi-grid', { style:{marginBottom:'16px'} }, [

      kpiCard({ label: 'Equipos asignados', value: fmt.number(totalAsignados), kind: 'success' }),
      kpiCard({ label: 'Sin asignar', value: fmt.number(sinAsignar), kind: sinAsignar ? 'danger' : 'muted', onclick: () => Router.go('entregas', { periodo, focus: '(sin asignar)' }) }),
    ]));

    // Cards por técnico
    const wrap = h('div', { style:{display:'flex', flexDirection:'column', gap:'10px'} });
    tecnicos.forEach(([resp, equipos]) => {
      wrap.appendChild(renderCardTecnico(resp, equipos, mesNum, periodo, params.focus === resp));
    });
    root.appendChild(wrap);
  },
};

function renderCardTecnico(responsable, equipos, mes, periodo, expandedDefault=false) {
  const programadas = equipos.filter(e => e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R');
  const ejecutadas  = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI'));
  const causalizadas = programadas.filter(e => (e.historial||[]).some(h => h.mes === mes && CAUSALES[h.resultado]));
  const pendientes  = programadas.length - ejecutadas.length - causalizadas.length;
  const pct = programadas.length ? Math.round(ejecutadas.length / programadas.length * 100) : null;

  const card = h('div.card');
  const head = h('div', { style:{display:'flex', alignItems:'center', gap:'10px', cursor:'pointer'} });
  let expanded = expandedDefault;
  const chev = h('i.ti', { class:'ti ti-chevron-' + (expanded?'down':'right'), style:{color:'var(--ink-3)'} });
  head.appendChild(chev);
  head.appendChild(h('div', { style:{flex:1} }, [
    h('div', { style:{fontWeight:500, fontSize:'14px'} }, responsable),
    h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px', marginTop:'2px'} }, [
      `${equipos.length} equipos`,
      programadas.length ? ` · ${programadas.length} programados ${MESES[mes-1]}` : '',
      pct != null ? ` · cumplimiento ${pct}%` : '',
    ].join('')),
  ]));
  // KPI pills
  const pills = h('div', { style:{display:'flex', gap:'4px', flexWrap:'wrap'} });
  if (programadas.length) pills.appendChild(h('span.pill', `${programadas.length} programadas`));
  if (ejecutadas.length)  pills.appendChild(h('span.pill.success', `${ejecutadas.length} ejecutadas`));
  if (causalizadas.length) pills.appendChild(h('span.pill.warning', `${causalizadas.length} causalizadas`));
  if (pendientes > 0)     pills.appendChild(h('span.pill.danger', `${pendientes} pendientes`));
  head.appendChild(pills);
  card.appendChild(head);

  const list = h('div', { style:{display: expanded?'block':'none', marginTop:'12px', borderTop:'.5px solid var(--line)', paddingTop:'12px'} });
  card.appendChild(list);

  function renderEquipos() {
    list.innerHTML = '';
    const tbl = h('table.dt');
    tbl.innerHTML = `<thead><tr>
      <th>Equipo</th><th>Servicio</th><th>Grilla ${MESES[mes-1]}</th><th>Estado MP ${MESES[mes-1]}</th><th>Estado equipo</th><th></th>
    </tr></thead>`;
    const tb = h('tbody');
    equipos.slice().sort((a,b) => {
      // Pendientes primero
      const score = (e) => {
        const prog = e.grilla?.[mes] === 'X' || e.grilla?.[mes] === 'R';
        const ejec = (e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI');
        const causal = (e.historial||[]).some(h => h.mes === mes && CAUSALES[h.resultado]);
        if (prog && !ejec && !causal) return 0; // pendientes
        if (prog && causal) return 1;
        if (prog && ejec) return 2;
        return 3;
      };
      return score(a) - score(b);
    }).forEach(e => {
      const prog = e.grilla?.[mes];
      const lastMP = (e.historial||[]).filter(h => h.mes === mes).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0))[0];
      const tr = h('tr', { onclick: () => openFicha(e.uuid) }, [
        h('td', [ h('div', e.nombre), h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, `${e.serie||''} · ${e.inventario||''}`) ]),
        h('td.truncate', e.servicio || '—'),
        h('td', prog ? h(`span.pill.${prog==='X'?'info':prog==='R'?'warning':'muted'}`, prog) : '—'),
        h('td', lastMP ? resultadoPill(lastMP.resultado) : (prog ? h('span.pill.danger','pendiente') : '—')),
        h('td', h(`span.pill.${ESTADO_PILL[e.estado]||''}`.trim(), ESTADO_LABEL[e.estado] || e.estado)),
        h('td', h('button.btn.sm', { onclick: (ev)=> { ev.stopPropagation(); abrirModalRegistrarMP(e, { mes }); } }, [ h('i.ti.ti-edit'), 'MP' ])),
      ]);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    list.appendChild(tbl);
  }
  if (expanded) renderEquipos();

  head.addEventListener('click', () => {
    expanded = !expanded;
    list.style.display = expanded ? 'block' : 'none';
    chev.className = 'ti ti-chevron-' + (expanded ? 'down' : 'right');
    if (expanded && list.children.length === 0) renderEquipos();
  });

  return card;
}

async function handleImportAsignacion(periodoSugerido) {
  try {
    const file = await pickFile('.xlsx');
    if (!file) return;
    // If filename has month, use it; else ask
    const detected = detectarPeriodoArchivo(file.name);
    let mes, anio;
    if (detected) {
      [anio, mes] = detected.split('-').map(Number);
    } else {
      const askResult = await askPeriodoModal(periodoSugerido);
      if (!askResult) return;
      mes = askResult.mes; anio = askResult.anio;
    }
    UI.toast(`Procesando ${file.name}…`, 'info', { duration: 2500 });
    const result = await importAsignacionMensual(file, { mes, anio });
    UI.toast(`Período ${periodoLabel(result.periodo)}: ${result.matcheados}/${result.total} matcheados${result.sinMatch?.length ? ' · '+result.sinMatch.length+' sin match' : ''}.`, 'success', { duration: 6500 });
    Router.go('entregas', { periodo: result.periodo });
  } catch (e) { bus.emit('error', e); }
}

function askPeriodoModal(periodoSugerido) {
  return new Promise((resolve) => {
    const [yDef, mDef] = (periodoSugerido || periodoActual()).split('-');
    let mes = Number(mDef), anio = Number(yDef);
    UI.modal({
      title: 'Confirmar período',
      sub: 'No detecté mes/año en el nombre del archivo.',
      size: 'sm',
      content: (body) => {
        body.appendChild(row('1fr 1fr', [
          field('Mes', selectCtl(MESES.map((n,i)=>({value:String(i+1),label:n})), String(mes), { onchange:(e)=> mes = Number(e.target.value) })),
          field('Año', inputCtl({ type:'number', min:2020, max:2100, value: anio, oninput:(e)=> anio = Number(e.target.value)||anio })),
        ]));
      },
      footer: (f, { close }) => {
        f.appendChild(h('button.btn.ghost', { onclick: () => { close(); resolve(null); } }, 'Cancelar'));
        f.appendChild(h('button.btn.primary', { onclick: () => { close(); resolve({ mes, anio }); } }, 'Confirmar'));
      },
    });
  });
}

function renderInformeServicioBlock(params) {
  const card = h('div.card');
  const servicios = EQ.servicios();
  if (!servicios.length) {
    card.appendChild(h('div', { style:{color:'var(--ink-3)', fontSize:'12.5px'} }, 'No hay servicios cargados.'));
    return card;
  }
  let snap = {
    servicio: params.servicio || servicios[0],
    mes:      params.mes      || new Date().getMonth()+1,
    anio:     params.anio     || new Date().getFullYear(),
  };
  const previewArea = h('div');

  function refresh() {
    const info = calcularInformeServicio(snap.servicio, snap.mes, snap.anio);
    previewArea.innerHTML = '';
    const totales = info.totales;
    previewArea.appendChild(h('div.kpi-grid', { style:{marginBottom:'10px'} }, [
      kpiCard({ label:'Equipos',      value: fmt.number(totales.equipos) }),
      kpiCard({ label:'Programadas',  value: fmt.number(totales.programadas) }),
      kpiCard({ label:'Ejecutadas',   value: fmt.number(totales.ejecutadas), kind:'success' }),
      kpiCard({ label:'Causalizadas', value: fmt.number(totales.causalizadas), kind:'warning' }),
      kpiCard({ label:'Pendientes',   value: fmt.number(totales.pendientes), kind: totales.pendientes ? 'danger' : 'muted' }),
    ]));
    const acts = h('div', { style:{display:'flex', gap:'8px', marginTop:'4px'} }, [
      h('button.btn', { onclick: () => exportInformeServicio(info).then(()=>UI.toast('Excel descargado.','success')).catch(e=>bus.emit('error',e)) }, [ h('i.ti.ti-file-spreadsheet'), 'Excel' ]),
      h('button.btn', { onclick: () => imprimirInformeServicio(info) }, [ h('i.ti.ti-printer'), 'Imprimir' ]),
    ]);
    previewArea.appendChild(acts);
  }

  const ctrl = h('div', { style:{display:'grid', gridTemplateColumns:'2fr 1fr 1fr', gap:'10px', marginBottom:'12px'} }, [
    field('Servicio', selectCtl(servicios, snap.servicio, { onchange:(e)=> { snap.servicio = e.target.value; refresh(); } })),
    field('Mes',      selectCtl(MESES.map((n,i)=>({value:String(i+1),label:n})), String(snap.mes), { onchange:(e)=> { snap.mes = Number(e.target.value); refresh(); } })),
    field('Año',      inputCtl({ type:'number', min:2020, max:2100, value: snap.anio, oninput:(e)=> { snap.anio = Number(e.target.value)||snap.anio; refresh(); } })),

function renderAnexosBlock() {
  const card = h('div.card');
  let eqUuid = '';
  const search = h('div.search', { style:{marginBottom:'12px'} }, [
    h('i.ti.ti-search'),
    h('input', { type:'text', placeholder:'Buscar equipo por nombre, serie o inventario…' }),
  ]);
  const results = h('div', { style:{maxHeight:'140px', overflowY:'auto', marginBottom:'12px', border:'.5px solid var(--line)', borderRadius:'6px'} });
  const actions = h('div', { style:{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'10px'} });

  function renderResults() {
    const q = search.querySelector('input').value;
    results.innerHTML = '';
    if (!q.trim()) {
      results.appendChild(h('div', { style:{padding:'12px', color:'var(--ink-3)', fontSize:'12px'} }, 'Escribí para buscar un equipo…'));
      return;
    }
    EQ.search(q).slice(0, 12).forEach(e => {
      const item = h('div', {
        style:{padding:'8px 12px', borderBottom:'.5px solid var(--line)', cursor:'pointer', background: eqUuid===e.uuid?'var(--paper-2)':'transparent'},
        onclick: () => { eqUuid = e.uuid; renderResults(); renderActions(); }
      }, [
        h('div', { style:{fontWeight:500, fontSize:'12.5px'} }, e.nombre || '—'),
        h('div', { style:{color:'var(--ink-3)', fontSize:'11px'} }, `${e.servicio || ''} · ${e.serie || ''} · ${e.inventario || ''}`),
      ]);
      results.appendChild(item);
    });
  }
  function renderActions() {
    actions.innerHTML = '';
    const e = eqUuid ? EQ.byUuid(eqUuid) : null;
    if (!e) {
      actions.appendChild(h('div', { style:{color:'var(--ink-3)', fontSize:'12.5px'} }, 'Elegí un equipo para habilitar los anexos.'));
      return;
    }
    // Anexo 1 always
    actions.appendChild(anexoCard('Anexo 1', 'Ficha técnica del equipo', 'ti-file-text', () => imprimirAnexo1(e)));
    // Anexo 3, 4 — requieren causal
    const causales = (e.historial||[]).filter(h => CAUSALES[h.resultado]).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
    actions.appendChild(anexoCard('Anexo 3', 'Reprogramación de MP (elige causal)', 'ti-calendar-x',
      causales.length ? () => elegirCausalParaAnexo(e, causales, imprimirAnexo3) : null,
      causales.length ? null : 'Sin causales registradas',
    ));
    const grupoA30 = causales.find(h => CAUSALES[h.resultado].grupo === 'A' && (fmt.daysSince(h.fechaEvento||h.fecha)||0) > CAUSAL_GRUPO_A_DIAS);
    actions.appendChild(anexoCard('Anexo 4', 'Retiro por seguridad (Grupo A >30d)', 'ti-shield-x',
      grupoA30 ? () => imprimirAnexo4(e, grupoA30) : null,
      grupoA30 ? null : 'No corresponde — sin causal Grupo A >30d',
    ));
    const pms = (e.historial||[]).filter(h => h.resultado === 'SI' && (h.estadoFinal === 'Operativo')).sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
    actions.appendChild(anexoCard('Anexo 5', 'Puesta en marcha del equipo', 'ti-rocket',
      pms.length ? () => elegirCausalParaAnexo(e, pms, imprimirAnexo5, 'Elegí la puesta en marcha:') : null,
      pms.length ? null : 'Sin registros SI · Operativo',
    ));
  }

  search.querySelector('input').addEventListener('input', renderResults);
  renderResults();
  renderActions();
  card.appendChild(search);
  card.appendChild(results);
  card.appendChild(actions);
  return card;
}

async function exportMPPendientes() {
  await ensureXLSX();
  const now = new Date();
  const mes = now.getMonth()+1;
  const anio = now.getFullYear();
  const periodo = `${anio}-${String(mes).padStart(2,'0')}`;
  const respHdr = `Responsable ${MESES[mes-1]} ${anio}`;
  const data = [['Servicio','Equipo','Serie','Frecuencia','Programado','Estado equipo', respHdr, 'Días en estado']];
  STATE.equipos.forEach(e => {
    const prog = e.grilla?.[mes];
    if (prog !== 'X' && prog !== 'R') return;
    if ((e.historial||[]).some(h => h.mes === mes && h.resultado === 'SI')) return;
    data.push([e.servicio||'', e.nombre||'', e.serie||'', e.frecuencia||'', prog, ESTADO_LABEL[e.estado]||e.estado, responsableDelPeriodo(e, periodo), fmt.daysSince(e.estadoDesde) ?? '']);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), `Pendientes ${MESES[mes-1]}`);
  XLSX.writeFile(wb, `MP_pendientes_${anio}_${String(mes).padStart(2,'0')}.xlsx`);
}

async function exportHistorialCompleto() {
  await ensureXLSX();
  const rows = [['Fecha','Mes','Año','Servicio','Equipo','Serie','Inventario','Resultado','Estado final','Ejecutor','Observación','Motivo cambio ejecutor']];
  STATE.equipos.forEach(e => (e.historial||[]).forEach(h => {
    const d = new Date(h.fechaEvento || h.fecha || 0);
    rows.push([
      fmt.date(h.fechaEvento || h.fecha),
      MESES[(h.mes||1)-1],
      isNaN(d) ? '' : d.getFullYear(),
      e.servicio||'', e.nombre||'', e.serie||'', e.inventario||'',
      h.resultado||'', h.estadoFinal ? (ESTADO_LABEL[h.estadoFinal]||h.estadoFinal) : '',
      h.ejecutor||'', h.obs||'', h.motivoCambioEjecutor||'',
    ]);
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Historial');
  XLSX.writeFile(wb, `historial_completo_${new Date().toISOString().slice(0,10)}.xlsx`);
}
VIEWS.agenda = {
  title: 'Agenda',
  render(root, params={}) {
    const servicios = EQ.servicios();
    if (!servicios.length) {
      root.appendChild(viewHeader({ title: 'Agenda · contactos por servicio', desc: 'Sin servicios cargados.' }));
      root.appendChild(emptyState({ icon:'ti-address-book', title:'Sin servicios', desc:'Cargá el inventario maestro primero.' }));
      return;
    }

    // Estadísticas
    function filledCount(sv) {
      const c = getContacto(sv);
      return CONTACTO_TIPOS.filter(t => {
        const p = c[t.key] || {};
        return p.nombre || p.apellido || p.correo || p.celular || p.anexo;
      }).length;
    }
    const conCompletos = servicios.filter(sv => filledCount(sv) === CONTACTO_TIPOS.length).length;
    const conAlgo      = servicios.filter(sv => filledCount(sv) > 0).length;
    const sinContactos = servicios.length - conAlgo;
    const totalPersonas = servicios.reduce((s, sv) => s + filledCount(sv), 0);

    root.appendChild(viewHeader({
      title: 'Agenda · contactos por servicio',
      desc: `${servicios.length} servicios · ${conCompletos} con contactos completos · ${sinContactos} sin contactos · ${totalPersonas} personas registradas`,
    }));

    // Controles
    const search = h('div.search', { style:{flex:1} }, [
      h('i.ti.ti-search'),
      h('input', { type:'text', placeholder:'Buscar servicio o persona (nombre, apellido, correo)…', value: params.q || '' }),
    ]);
    let filtro = params.filtro || 'todos';   // 'todos' | 'con' | 'sin'
    let orden  = params.orden  || 'sin-primero';

    function chip(label, value, state) {
      return h(`button.btn.sm ${filtro===value ? 'primary' : 'ghost'}`.trim(), {
        onclick: () => { filtro = value; render(); },
      }, label);
    }
    const filtros = h('div', { style:{display:'flex', gap:'4px'} }, [
      chip('Todos','todos'),
      chip('Sin contactos','sin'),
      chip('Con contactos','con'),
    ]);
    const ordenSel = selectCtl([
      { value:'sin-primero', label:'Sin contactos primero' },
      { value:'az',          label:'A–Z' },
      { value:'equipos',     label:'Más equipos primero' },
    ], orden, { onchange: (e) => { orden = e.target.value; render(); } });

    const controls = h('div', { style:{display:'flex', gap:'10px', alignItems:'center', marginBottom:'14px', flexWrap:'wrap'} }, [
      search, filtros, ordenSel,
    ]);
    root.appendChild(controls);

    const meta = h('div.table-meta', { style:{borderRadius:'6px', border:'.5px solid var(--line)', marginBottom:'10px'} });
    root.appendChild(meta);
    const grid = h('div', { style:{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(340px,1fr))', gap:'10px'} });
    root.appendChild(grid);

    function evaluaServicio(sv) {
      const c = getContacto(sv);
      const filled = CONTACTO_TIPOS.filter(t => {
        const p = c[t.key] || {};
        return p.nombre || p.apellido || p.correo || p.celular || p.anexo;
      }).length;
      return { c, filled };
    }

    function matchSearch(sv, q) {
      if (!q) return true;
      const n = normalize(q);
      if (normalize(sv).includes(n)) return true;
      const c = getContacto(sv);
      return CONTACTO_TIPOS.some(t => {
        const p = c[t.key] || {};
        return [p.nombre, p.apellido, p.correo].some(v => v && normalize(v).includes(n));
      });
    }

    function render() {
      const q = search.querySelector('input').value;
      let list = servicios.filter(sv => matchSearch(sv, q));
      list = list.filter(sv => {
        const { filled } = evaluaServicio(sv);
        if (filtro === 'con') return filled > 0;
        if (filtro === 'sin') return filled === 0;
        return true;
      });
      const eqCount = sv => STATE.equipos.filter(e => e.servicio === sv).length;
      list.sort((a,b) => {
        if (orden === 'az')      return a.localeCompare(b,'es');
        if (orden === 'equipos') return eqCount(b) - eqCount(a);
        const fa = evaluaServicio(a).filled, fb = evaluaServicio(b).filled;
        if (fa !== fb) return fa - fb;          // sin contactos primero
        return a.localeCompare(b,'es');
      });

      meta.textContent = `${list.length} servicios coinciden con los filtros`;
      grid.innerHTML = '';
      if (!list.length) {
        grid.appendChild(h('div', { style:{padding:'20px', color:'var(--ink-3)', fontSize:'12.5px', textAlign:'center'} }, 'Sin coincidencias.'));
        return;
      }
      list.forEach(sv => grid.appendChild(renderContactoCard(sv)));
    }

    // Actualiza al tipear / cambiar orden / re-renders por estado
    search.querySelector('input').addEventListener('input', render);
    ordenSel.addEventListener('change', () => { orden = ordenSel.value; render(); });

    render();
  },
};

function renderContactoCard(servicio) {

  const card = h('div.card');

  // Header
  card.appendChild(h('div', { style:{display:'flex', alignItems:'center', gap:'8px', marginBottom:'10px'} }, [
    h('div', { style:{flex:1, fontWeight:500, fontSize:'13px'} }, servicio),
    h('span.pill.muted', `${equiposCount}`),
    h('button.btn.icon.ghost', {
      title:'Editar todos los contactos',
      onclick: () => abrirDrawerContacto(servicio),
    }, [ h('i.ti.ti-pencil') ]),
  ]));

  // Mini-fila por cada tipo de contacto
  CONTACTO_TIPOS.forEach(t => {
    const p = c[t.key] || {};

      const nombre = [p.nombre, p.apellido].filter(Boolean).join(' ') || '(sin nombre)';
      card.appendChild(h('div', {
        style:{display:'flex', alignItems:'baseline', gap:'8px', padding:'6px 0', borderTop:'.5px solid var(--line)', fontSize:'12px'},
      }, [
        h('span', { style:{color:'var(--ink-3)', width:'80px', flexShrink:0} }, t.label),
        h('div', { style:{flex:1, minWidth:0} }, [
          h('div', { style:{color:'var(--ink)', fontWeight:500} }, nombre),
          h('div', { style:{color:'var(--ink-3)', fontSize:'11px', display:'flex', gap:'10px', flexWrap:'wrap', marginTop:'2px'} }, [
            p.correo  ? h('a', { href:`mailto:${p.correo}`, style:{color:'var(--info)', textDecoration:'none'} }, [ h('i.ti.ti-mail', { style:{fontSize:'12px', marginRight:'3px'} }), p.correo ]) : null,
            p.celular ? h('a', { href:`tel:${p.celular}`,    style:{color:'var(--info)', textDecoration:'none'} }, [ h('i.ti.ti-phone',{ style:{fontSize:'12px', marginRight:'3px'} }), p.celular ]) : null,
            p.anexo   ? h('span', [ h('i.ti.ti-router', { style:{fontSize:'12px', marginRight:'3px'} }), 'Anexo ', p.anexo ]) : null,
          ].filter(Boolean)),
        ]),
        h('button.btn.icon.ghost', {
          title:'Editar', style:{padding:'2px'},
          onclick: () => abrirQuickContacto(servicio, t.key),
        }, [ h('i.ti.ti-edit', { style:{fontSize:'13px'} }) ]),
      ]));
    } else {
      card.appendChild(h('div', {
        style:{display:'flex', alignItems:'center', gap:'8px', padding:'6px 0', borderTop:'.5px solid var(--line)', fontSize:'12px'},
      }, [
        h('span', { style:{color:'var(--ink-3)', width:'80px', flexShrink:0} }, t.label),
        h('button.btn.sm.ghost', {
          style:{flex:1, justifyContent:'flex-start'},
          onclick: () => abrirQuickContacto(servicio, t.key),
        }, [ h('i.ti.ti-plus'), `Agregar ${t.label.toLowerCase()}` ]),
      ]));
    }
  });

  return card;
}

function abrirQuickContacto(servicio, tipoKey) {
  const c = getContacto(servicio);
  const tipo = CONTACTO_TIPOS.find(t => t.key === tipoKey);
  const draft = Object.assign({ nombre:'', apellido:'', correo:'', anexo:'', celular:'' }, c[tipoKey] || {});
  const yaCargado = !!(draft.nombre || draft.apellido || draft.correo || draft.celular || draft.anexo);

  UI.modal({
    title: `${yaCargado?'Editar':'Agregar'} ${tipo.label.toLowerCase()}`,
    sub: servicio,
    size: 'sm',
    content: (body) => {
      body.appendChild(row('1fr 1fr', [
        field('Nombre',   inputCtl({ value: draft.nombre,   autofocus:true, oninput:(e)=> draft.nombre = e.target.value })),
        field('Apellido', inputCtl({ value: draft.apellido, oninput:(e)=> draft.apellido = e.target.value })),
      ]));
      body.appendChild(field('Correo', inputCtl({ type:'email', value: draft.correo, oninput:(e)=> draft.correo = e.target.value })));
      body.appendChild(row('1fr 1fr', [
        field('Celular', inputCtl({ value: draft.celular, oninput:(e)=> draft.celular = e.target.value })),
        field('Anexo',   inputCtl({ value: draft.anexo,   oninput:(e)=> draft.anexo = e.target.value })),
      ]));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      if (yaCargado) {
        f.appendChild(h('button.btn.danger', { onclick: async () => {
          const ok = await UI.dialog({ title:`Borrar ${tipo.label.toLowerCase()}`, message: `¿Borrar este contacto de ${servicio}?`, confirmText:'Borrar', variant:'danger' });
          if (!ok) return;
          const updated = Object.assign({}, c);
          updated[tipoKey] = { nombre:'', apellido:'', correo:'', anexo:'', celular:'' };
          setContacto(servicio, updated);
          UI.toast('Contacto borrado.', 'warning');
          close(); Router.go('agenda');
        } }, [ h('i.ti.ti-trash'), 'Borrar' ]));
      }
      f.appendChild(h('button.btn.primary', { onclick: () => {
        const updated = Object.assign({}, c);
        updated[tipoKey] = draft;
        setContacto(servicio, updated);
        UI.toast(`${tipo.label} guardado.`, 'success');
        close(); Router.go('agenda');
      }}, [ h('i.ti.ti-device-floppy'), 'Guardar' ]));
    },
  });
}

            message: 'Esto elimina equipos, pendientes, asignaciones y contactos del navegador. Descargá un backup primero.',
            confirmText: 'Borrar todo', variant:'danger',
          });
          if (!ok) return;
          STORAGE.clearAll();
          STATE.equipos = []; STATE.pendientes = []; STATE.asignaciones = {}; STATE.contactos = {}; STATE.session = {}; STATE.tecnicosOficiales = []; STATE.diffIgnorados = {};
          persist();
          UI.toast('Datos eliminados.', 'warning');
          Router.go('dash');
        } }, [ h('i.ti.ti-trash'), 'Borrar todos los datos' ]),
      ]),
    ]);
    root.appendChild(card2);
  },
};

/* ============================================================
   HANDLERS
   ============================================================ */
async function handleImportMaestro() {
  try {
    const file = await pickFile('.xlsx,.xlsm');
    if (!file) return;
    UI.toast(`Procesando ${file.name}…`, 'info', { duration: 2500 });
    const result = await importMaestroFile(file);
    UI.toast(`Hoja "${result.sheet}": ${result.nuevos} nuevos · ${result.actualizados} actualizados · ${result.mantenidos} preservados.`, 'success', { duration: 6000 });
    Router.go(STATE.view);
    renderSessionChip();
    // Si hay diferencias, ofrecer crear pendiente para revisar
    if (result.diff && diffTieneCambios(result.diff)) {
      abrirModalDiferenciasMaestro(result.diff);
    }
  } catch (e) { bus.emit('error', e); }
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
const CMDK = (() => {
  let openEl = null;

  function open() {
    if (openEl) return;
    const root = $('#cmdkRoot');
    const bd = h('div.cmdk-backdrop');
    const box = h('div.cmdk');
    const inp = h('input', { type:'text', placeholder:'Buscar equipo, ir a vista, ejecutar acción…' });
    const list = h('div.cmdk-list');
    box.appendChild(h('div.cmdk-input', [ h('i.ti.ti-search'), inp, h('span.pill.muted','Esc') ]));
    box.appendChild(list);
    bd.appendChild(box);
    root.appendChild(bd);
    openEl = bd;

    function close() {
      if (!openEl) return;
      openEl.remove();
      openEl = null;
      document.removeEventListener('keydown', keyHandler);
    }

    const actions = [
      { group:'Acciones', label:'Importar maestro',         icon:'ti-file-spreadsheet', run: handleImportMaestro },
      { group:'Acciones', label:'Importar asignación mensual', icon:'ti-clipboard-text', run: () => handleImportAsignacion() },
      { group:'Acciones', label:'Descargar backup',         icon:'ti-database-export', run: exportBackup },
      { group:'Acciones', label:'Restaurar backup',         icon:'ti-database-import', run: importBackup },
      { group:'Acciones', label:'Alternar tema claro/oscuro', icon:'ti-contrast-2', run: () => Theme.toggle() },
      { group:'Acciones', label: REC.isActive() ? 'Detener grabación de sesión' : 'Iniciar grabación de sesión', icon:'ti-record-mail', run: () => REC.toggle() },
    ];
    const navs = NAV_ITEMS.map(it => ({
      group:'Ir a', label: it.label, icon: it.icon, run: () => Router.go(it.id), meta: it.soon ? 'pronto' : '',
    }));

    let cursor = 0;

    function render() {
      const q = inp.value.trim();
      const results = [];
      // Navs + actions
      [...navs, ...actions].forEach(item => {
        const sc = fuzzyScore(q, item.label);
        if (q && sc < 0) return;
        results.push({ ...item, score: sc });
      });
      // Equipos
      const eqMatches = !q ? [] : EQ.search(q).slice(0, 30).map(e => ({
        group:'Equipos',
        label: e.nombre || '(sin nombre)',
        meta: `${e.servicio || ''}${e.serie ? ' · S/N '+e.serie : ''}`,
        icon: e.estado === 'NoOperativo' ? 'ti-alert-triangle' : e.estado === 'ServicioTecnico' ? 'ti-tool' : 'ti-stethoscope',
        run: () => { close(); openFicha(e.uuid); },
      }));
      results.push(...eqMatches);

      list.innerHTML = '';
      if (!results.length) {
        list.appendChild(h('div', { style:{ padding:'24px', color:'var(--ink-3)', fontSize:'12.5px', textAlign:'center' } }, q ? 'Sin coincidencias' : 'Escribí para buscar…'));
        return;
      }
      cursor = Math.min(cursor, results.length-1);
      const groups = {};
      results.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
      let i = 0;
      for (const g of Object.keys(groups)) {
        list.appendChild(h('div.cmdk-group-label', g));
        groups[g].forEach(r => {
          const myIndex = i;
          const item = h('div.cmdk-item', { dataset:{ idx: i } }, [
            h('i.ti', { class: 'ti ' + (r.icon||'ti-circle') }),
            h('span', r.label),
            r.meta ? h('span.meta', r.meta) : null,
          ]);
          if (i === cursor) item.classList.add('is-active');
          item.addEventListener('click', () => { close(); try { r.run(); } catch(e){ bus.emit('error', e);} });
          item.addEventListener('mouseenter', () => { cursor = myIndex; renderHighlight(); });
          list.appendChild(item);
          i++;
        });
      }
      renderHighlight();
    }
    function renderHighlight() {
      $$('.cmdk-item', list).forEach((el, idx) => el.classList.toggle('is-active', idx === cursor));
      const active = $('.cmdk-item.is-active', list);
      try { active?.scrollIntoView?.({ block:'nearest' }); } catch {}
    }
    function runActive() {
      const active = $('.cmdk-item.is-active', list);
      if (active) active.click();
    }

    function keyHandler(e) {
      if (e.key === 'Escape') { e.preventDefault(); close(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); cursor = Math.min(cursor+1, $$('.cmdk-item', list).length-1); renderHighlight(); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); cursor = Math.max(cursor-1, 0); renderHighlight(); return; }
      if (e.key === 'Enter')     { e.preventDefault(); runActive(); return; }
    }

    inp.addEventListener('input', () => { cursor = 0; render(); });
    bd.addEventListener('mousedown', (e) => { if (e.target === bd) close(); });
    document.addEventListener('keydown', keyHandler);
    setTimeout(() => inp.focus(), 10);
    render();
  }

  return { open };
})();

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); CMDK.open();
  }
});

/* ============================================================
   THEME
   ============================================================ */
const Theme = {
  current() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  },
  set(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('pmp.v3.ui.theme', t); } catch {}
    this.syncToggle();
  },
  toggle() { this.set(this.current() === 'dark' ? 'light' : 'dark'); },
  syncToggle() {
    const btn = $('#themeToggle');
    if (!btn) return;
    const isDark = this.current() === 'dark';
    const icon = btn.querySelector('i');
    const label = $('#themeToggleLabel');
    if (icon)  icon.className = 'ti ' + (isDark ? 'ti-moon-stars' : 'ti-sun');
    if (label) label.textContent = isDark ? 'Tema oscuro' : 'Tema claro';
  },
};

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  try {
    const mig = migrateFromLegacy();
    loadState();
    renderNav();
    renderSessionChip();
    Theme.syncToggle();
    REC.updateChip();
    $('#themeToggle').addEventListener('click', () => Theme.toggle());
    $('#openCmdk').addEventListener('click', () => CMDK.open());
    bus.on('state:change', () => renderSessionChip());

    // Periodic chip update for REC events counter
    setInterval(() => { if (REC.isActive()) REC.updateChip(); }, 1500);

    $('#bootScreen').remove();
    $('#app').hidden = false;

    Router.go(STATE.equipos.length ? 'inv' : 'dash');

    if (mig.migrated && mig.counts && (mig.counts.equipos || mig.counts.pendientes)) {
      UI.toast(`Migrados ${mig.counts.equipos} equipos · ${mig.counts.pendientes} tareas desde el sistema anterior.`, 'success', { duration: 6500 });
    }
  } catch (e) {
    console.error(e);
    document.body.innerHTML = `<pre style="padding:24px;color:#b91c1c;font-family:monospace">Error de arranque:\n${(e&&e.stack)||e}</pre>`;
  }
}

document.addEventListener('DOMContentLoaded', boot);

// Hooks de inspección para harness de pruebas (jsdom). En producción son ignorados.
try {
  window.__pmp = {
    STATE, EQ, MP, CICLO, PENDIENTE, UI, Theme, Router, VIEWS, bus,
    importMaestroFile, importAsignacionMensual, exportPlantillaAsignacion,
    abrirModalRegistrarMP, abrirModalVinculacionC2, abrirModalVinculacionC3,
    alertasDeEquipo,
    abrirModalDiferenciasMaestro, crearPendienteItemDiff,
    diffKeyNuevo, diffKeyAusente, diffKeyCampo, diffKeyGrilla,
    esDiffIgnorado, marcarDiffIgnorado, aplicarIgnoradosAlDiff,
    agruparPorTecnico, periodoActual, periodoLabel, responsableDelPeriodo,
    persist, loadState, normalize, fmt, h,
  };
} catch {}
</script>
