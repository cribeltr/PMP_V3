    ejecutor: editing?.ejecutor ?? '',
    obs: editing?.obs ?? '',
    motivoCambioEjecutor: editing?.motivoCambioEjecutor ?? '',
  };
  const ejecutorOriginal = editing?.ejecutor || '';

  let condRow; // re-rendered based on resultado

  UI.modal({
    title: editing ? 'Editar registro MP' : 'Registrar MP',
    sub: equipo.nombre,
    size: 'md',
    content: (body, { close }) => {
      // Panel de contexto (programación, último registro del mes, frecuencia, meses desde última SI).
      const contextoWrap = h('div', { style:{ marginBottom:'14px' } });
      body.appendChild(contextoWrap);

      function renderContexto() {
        const mes = Number(snap.mes) || (new Date().getMonth()+1);
        const programado = equipo.grilla?.[mes] || null;
        const histMes = (equipo.historial || []).filter(h => h.mes === mes)
          .sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0));
        const ultimoSI    = histMes.find(h => h.resultado === 'SI');
        const ultimaCausal = histMes.find(h => CAUSALES[h.resultado]);
        const ultimaSIGlobal = (equipo.historial || []).filter(h => h.resultado === 'SI')
          .sort((a,b) => new Date(b.fechaEvento||b.fecha||0) - new Date(a.fechaEvento||a.fecha||0))[0];
        const mesesDesdeSI = ultimaSIGlobal
          ? Math.floor((Date.now() - new Date(ultimaSIGlobal.fechaEvento||ultimaSIGlobal.fecha||0).getTime()) / (1000*60*60*24*30))
          : null;

        // Anclas semánticas para color
        const editingThisRecord = editing && ultimoSI && editing.id === ultimoSI.id;
        const tipo =
          ultimoSI && !editingThisRecord ? 'warning' :
          programado === 'X' || programado === 'R' || programado === 'PM' ? 'info' :
          programado === 'RA' || !programado ? 'muted' : 'muted';

        const items = [];
        items.push(h('div', { style:{display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap'} }, [
          h('strong', { style:{fontSize:'13px'} }, `Contexto de ${MESES[mes-1]}`),
          programado
            ? h(`span.pill.${programado==='X'?'info':programado==='R'?'warning':programado==='PM'?'purple':'muted'}`, programado === 'X' ? 'X · programada' : programado === 'R' ? 'R · reprogramada' : programado === 'RA' ? 'RA · legado' : 'PM · puesta en marcha')
            : h('span.pill.muted', 'sin programar en grilla'),
          equipo.frecuencia ? h('span.pill', `frec. ${equipo.frecuencia.toLowerCase()}`) : null,
          mesesDesdeSI != null
            ? h(`span.pill${mesesDesdeSI > 12 ? '.warning' : ''}`, `${mesesDesdeSI === 0 ? 'última MP exitosa este mes' : 'última MP exitosa hace ' + mesesDesdeSI + ' mes' + (mesesDesdeSI === 1 ? '' : 'es')}`)
            : h('span.pill.muted', 'sin MP exitosa registrada'),
        ]));

        if (ultimoSI && !editingThisRecord) {
          items.push(h('div', { style:{ marginTop:'6px', fontSize:'12px', color:'var(--ink-2)' } }, [
            h('i.ti.ti-alert-triangle', { style:{color:'var(--warning)', marginRight:'4px'} }),
            `Ya hay un registro SI en ${MESES[mes-1]} (${fmt.date(ultimoSI.fechaEvento || ultimoSI.fecha)}${ultimoSI.ejecutor ? ' · '+ultimoSI.ejecutor : ''}). Si vas a corregirlo, abrí el registro desde la pestaña Historial.`,
          ]));
        }
        if (ultimaCausal) {
          items.push(h('div', { style:{ marginTop:'4px', fontSize:'12px', color:'var(--ink-2)' } }, [
            h('i.ti.ti-flag', { style:{color:'var(--info)', marginRight:'4px'} }),
            `Causal previa en ${MESES[mes-1]}: ${ultimaCausal.resultado} (${fmt.date(ultimaCausal.fechaEvento || ultimaCausal.fecha)})${ultimaCausal.ejecutor ? ' · '+ultimaCausal.ejecutor : ''}.`,
          ]));
        }
        if (!programado && !ultimoSI && !ultimaCausal) {
          items.push(h('div', { style:{ marginTop:'4px', fontSize:'12px', color:'var(--ink-3)' } }, [
            h('i.ti.ti-info-circle', { style:{marginRight:'4px'} }),
            `No había nada programado en ${MESES[mes-1]} para este equipo. Verificá el mes computable antes de guardar.`,
          ]));
        }

        contextoWrap.innerHTML = '';
        contextoWrap.appendChild(h(`div.banner.${tipo}`, { style:{ alignItems:'flex-start', flexDirection:'column', gap:'4px' } }, items));
      }

      const fFecha = field('Fecha real del evento', dateCtl(snap.fechaEvento, {
        onchange: (e) => {
          snap.fechaEvento = e.target.value;
          const m = monthOfISO(isoFromDateInput(snap.fechaEvento));
          if (m) { snap.mes = m; selMes.value = String(m); renderContexto(); }
        },
      }), 'La fecha en terreno. Admite registro retroactivo.');
      const selMes = selectCtl(MESES.map((n,i)=>({value:String(i+1),label:n})), String(snap.mes), {
        onchange:(e)=> { snap.mes = Number(e.target.value); renderContexto(); },
      });
      const fMes = field('Mes computable', selMes, 'Se autodetecta de la fecha; podés sobrescribirlo si el registro corresponde a otro mes.');

      const selResultado = selectCtl(RESULTADOS_MP.map(r => ({ value: r, label: RESULTADO_LABEL[r] })), snap.resultado, {
        onchange: (e) => { snap.resultado = e.target.value; renderCond(); },
      });
      const fRes = field('Resultado', selResultado);

      condRow = h('div');
      function renderCond() {
        condRow.innerHTML = '';
        if (snap.resultado === 'SI') {
          condRow.appendChild(field('Estado final', selectCtl([
            { value:'Operativo',       label:'Operativo' },
            { value:'NoOperativo',     label:'No operativo' },
            { value:'FueraDeServicio', label:'Fuera de servicio' },
          ], snap.estadoFinal, { onchange:(e)=> snap.estadoFinal = e.target.value })));
        } else if (snap.resultado === 'BAJA') {
          condRow.appendChild(field('Tipo de baja', selectCtl(TIPOS_BAJA, snap.tipoBaja, { onchange:(e)=> snap.tipoBaja = e.target.value })));
        } else if (CAUSALES[snap.resultado]) {
          const g = CAUSALES[snap.resultado].grupo;
          condRow.appendChild(h('div.banner.' + (g==='A'?'warning':'info'), [
            h('i.ti', { class: 'ti ' + (g==='A'?'ti-alert-triangle':'ti-info-circle') }),
            h('div.grow', [
              h('div', { style:{ fontWeight:500 } }, `Grupo ${g} · ${CAUSALES[snap.resultado].label}`),
              h('div', { style:{ fontSize:'11.5px', marginTop:'4px' } },
                snap.resultado === 'C2' ? 'Al guardar te voy a pedir vincular a un envío (existente o nuevo). El equipo pasa a En Servicio Técnico.' :
                snap.resultado === 'C3' ? 'Al guardar te voy a pedir vincular a un ciclo correctivo. El equipo pasa a No Operativo.' :
                g === 'A' ? `Si la causal persiste más de ${CAUSAL_GRUPO_A_DIAS} días, corresponde Anexo 4 (retiro por seguridad).` :
                'Causal de grupo B: el equipo no está disponible, no hay plazo límite.'),
            ]),
          ]));
        }
      }
      renderCond();

      const ejSelect = selectTecnico(snap.ejecutor, {
        onchange: (e) => { snap.ejecutor = e.target.value; renderMotivo(); },
      }, { includeOtros: !!editing });
      const fEj = field('Ejecutor responsable *', ejSelect, 'Elegí un técnico de la lista oficial del SEC.');

      const fObs = field('Observación', textareaCtl({ rows: 3, value: snap.obs, oninput:(e)=> snap.obs = e.target.value }));

      const motivoWrap = h('div');
      function renderMotivo() {
        motivoWrap.innerHTML = '';
        if (editing && snap.ejecutor && snap.ejecutor !== ejecutorOriginal) {
          motivoWrap.appendChild(field('Motivo del cambio de ejecutor *', inputCtl({
            value: snap.motivoCambioEjecutor,
            oninput: (e) => snap.motivoCambioEjecutor = e.target.value,
          }), 'Obligatorio cuando se cambia el ejecutor de un registro existente.'));
        }
      }
      renderMotivo();

      body.appendChild(row('1fr 200px', [fFecha, fMes]));
      body.appendChild(row('1fr', [fRes]));
      body.appendChild(condRow);
      body.appendChild(row('1fr', [fEj]));
      body.appendChild(row('1fr', [fObs]));
      body.appendChild(motivoWrap);
      renderContexto();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      f.appendChild(h('button.btn.primary', { onclick: async () => {
        try {
          const fechaISO = isoFromDateInput(snap.fechaEvento);
          if (!fechaISO) throw new Error('Fecha inválida.');
          if (!snap.ejecutor || !snap.ejecutor.trim()) throw new Error('Elegí un ejecutor de la lista oficial del SEC.');
          if (editing && snap.ejecutor && snap.ejecutor !== ejecutorOriginal && !snap.motivoCambioEjecutor.trim()) {
            throw new Error('Indicá el motivo del cambio de ejecutor.');
          }
          const payload = {
            fechaEvento: fechaISO,
            mes: Number(snap.mes),
            resultado: snap.resultado,
            estadoFinal: snap.resultado === 'SI' ? snap.estadoFinal : null,
            tipoBaja:    snap.resultado === 'BAJA' ? snap.tipoBaja : null,
            ejecutor: snap.ejecutor.trim(),
            obs: snap.obs.trim(),
            motivoCambioEjecutor: snap.motivoCambioEjecutor.trim() || null,
          };
          let res;
          if (editing) res = MP.update(equipo.uuid, editing.id, payload);
          else         res = MP.register(equipo.uuid, payload);
          close('save');
          if (res.needsVinculacion === 'C2') abrirModalVinculacionC2(res.equipo, res.mp);
          else if (res.needsVinculacion === 'C3') abrirModalVinculacionC3(res.equipo, res.mp, { motivo:'C3' });
          else if (res.needsVinculacion === 'SI_NO_OP') abrirModalVinculacionC3(res.equipo, res.mp, { motivo:'SI_NO_OP' });
          else UI.toast(editing ? 'MP actualizada.' : 'MP registrada.', 'success');
          if (STATE.view === 'pmp' || STATE.view === 'dash' || STATE.view === 'inv') Router.go(STATE.view, STATE.viewParams);
          opts.onSaved?.(res);
        } catch (e) { bus.emit('error', e); }
      }}, editing ? 'Guardar cambios' : 'Registrar MP'));
    },
  });
}

function abrirModalVinculacion(equipo, mp) {
  if (mp.resultado === 'C2') return abrirModalVinculacionC2(equipo, mp);
  if (mp.resultado === 'C3') return abrirModalVinculacionC3(equipo, mp, { motivo:'C3' });
  if (mp.resultado === 'SI' && mp.estadoFinal === 'NoOperativo') return abrirModalVinculacionC3(equipo, mp, { motivo:'SI_NO_OP' });
}

/**
 * Modal de vinculación a ciclo correctivo. Cubre dos motivos:
 *  - motivo:'C3'        → causal C3 estándar
 *  - motivo:'SI_NO_OP'  → MP ejecutada (SI) pero estadoFinal=NoOperativo
 * La lógica de negocio y las 3 opciones (existente / nuevo con folio / pendiente clínico)
 * son las mismas; solo cambian textos y el tipo de evento al vincular.
 */
function abrirModalVinculacionC3(equipo, mp, opts={}) {
  const motivo = opts.motivo || 'C3';
  const ciclosAbiertos = (equipo.correctivos || []).filter(c => c.abierto);
  let modo = ciclosAbiertos.length ? 'existente' : 'nuevo';
  let snap = {
    cicloUuidExistente: ciclosAbiertos[0]?.uuid || null,
    folioSigem: '',
    sigemEstado: 'falta',
    fechaEvento: dateInputValue(mp.fechaEvento || mp.fecha),
    deteccion: 'Servicio clínico avisó',
    descripcion: mp.obs || '',
    responsable: '',
    diasVencimientoPendiente: 3,
  };

  const tituloModal = motivo === 'SI_NO_OP' ? 'Vincular MP con estado No Operativo' : 'Vincular causal C3';
  const subModal    = motivo === 'SI_NO_OP'
    ? 'La MP se ejecutó pero el equipo quedó No Operativo. Vincularlo a un ciclo correctivo mantiene la trazabilidad.'
    : 'El equipo pasa a No Operativo al confirmar.';
  const introTexto  = motivo === 'SI_NO_OP'
    ? 'Registraste una MP que se ejecutó (SI) pero dejaste el equipo No Operativo. Esto suele pasar cuando durante la MP se detecta una falla que requiere reparación. Vinculalo a un ciclo correctivo para no perder la trazabilidad.'
    : 'C3 = equipo a la espera de repuestos. Hay que ligarlo a un ciclo correctivo para no perder trazabilidad.';
  const cancelToast = motivo === 'SI_NO_OP'
    ? 'MP registrada — equipo No Operativo sin vincular a ciclo. Aparecerá un aviso en la ficha hasta que vincules.'
    : 'Causal C3 registrada — equipo No Operativo sin vincular a ciclo. Aparecerá un aviso en la ficha hasta que vincules.';
  const tipoEvento  = motivo === 'SI_NO_OP' ? 'MP-SI-NOOP-VINCULADA' : 'CAUSAL-VINCULADA';
  const labelOk     = motivo === 'SI_NO_OP' ? 'MP vinculada al ciclo en curso.' : 'Causal C3 vinculada al ciclo en curso.';

  UI.modal({
    title: tituloModal,
    sub: subModal,
    size: 'md',
    critical: false,
    content: (body, { close }) => {
      body.appendChild(h('p', { style:{margin:'0 0 14px 0', color:'var(--ink-2)', fontSize:'12.5px'} }, introTexto));

      const opts = h('div', { style:{ display:'flex', flexDirection:'column', gap:'6px', marginBottom:'14px' } });
      function radio(value, label, desc) {
        return h('label', { style:{ display:'flex', gap:'10px', alignItems:'flex-start', padding:'10px 12px', border:'.5px solid var(--line-2)', borderRadius:'8px', cursor:'pointer', background: modo===value?'var(--paper-2)':'transparent' } }, [
          h('input', { type:'radio', name:'modo', value, checked: modo===value, onchange:(e)=>{ modo = e.target.value; render(); } }),
          h('div', { style:{flex:1} }, [
            h('div', { style:{fontWeight:500, fontSize:'13px'} }, label),
            h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px', marginTop:'2px'} }, desc),
          ]),
        ]);
      }
      body.appendChild(opts);

      const formArea = h('div');
      body.appendChild(formArea);

      function render() {
        opts.innerHTML = '';
        if (ciclosAbiertos.length) opts.appendChild(radio('existente', 'Vincular a ciclo correctivo existente', `${ciclosAbiertos.length} ciclo${ciclosAbiertos.length>1?'s':''} abierto${ciclosAbiertos.length>1?'s':''} en este equipo.`));
        opts.appendChild(radio('nuevo', 'Crear ciclo con solicitud ya generada por el servicio clínico', 'Tenés el folio SIGEM a mano. El ciclo arranca en Diagnóstico.'));
        opts.appendChild(radio('pendiente', 'Crear pendiente "Solicitar a servicio clínico"', 'Aún no hay solicitud. Se genera una tarea con vencimiento.'));

        formArea.innerHTML = '';
        if (modo === 'existente') {
          if (!ciclosAbiertos.length) {
            formArea.appendChild(h('div.banner.warning', [ h('i.ti.ti-info-circle'), h('div.grow','No hay ciclos abiertos. Cambiá a "Crear ciclo".') ]));
          } else {
            const sel = selectCtl(
              ciclosAbiertos.map(c => ({
                value: c.uuid,
                label: `${(c.apertura?.folioSigem||c.solicitud?.folioSigem||'sin folio')} · ${c.eslabonActual} · ${fmt.date(c.apertura?.fechaEvento||c.apertura?.fecha||c.solicitud?.fecha)}`,
              })),
              snap.cicloUuidExistente,
              { onchange: (e) => snap.cicloUuidExistente = e.target.value },
            );
            formArea.appendChild(field('Ciclo a vincular', sel));
          }
        } else if (modo === 'nuevo') {
          formArea.appendChild(row('1fr 1fr', [
            field('Fecha real del problema', dateCtl(snap.fechaEvento, { onchange:(e)=> snap.fechaEvento = e.target.value })),
            field('Detección', selectCtl(DETECCIONES_APERTURA, snap.deteccion, { onchange:(e)=> snap.deteccion = e.target.value })),
          ]));
          formArea.appendChild(row('1fr 1fr', [
            field('Folio SIGEM', inputCtl({ value: snap.folioSigem, placeholder:'p. ej. 2026-12345', oninput:(e)=> snap.folioSigem = e.target.value })),
            field('Responsable', selectTecnico(snap.responsable, { onchange:(e)=> snap.responsable = e.target.value })),
          ]));
          formArea.appendChild(field('Descripción del problema', textareaCtl({ rows:3, value: snap.descripcion, oninput:(e)=> snap.descripcion = e.target.value })));
        } else if (modo === 'pendiente') {
          formArea.appendChild(row('1fr 1fr', [
            field('Fecha real del problema', dateCtl(snap.fechaEvento, { onchange:(e)=> snap.fechaEvento = e.target.value })),
            field('Detección', selectCtl(DETECCIONES_APERTURA, snap.deteccion, { onchange:(e)=> snap.deteccion = e.target.value })),
          ]));
          formArea.appendChild(row('1fr 1fr', [
            field('Responsable', selectTecnico(snap.responsable, { onchange:(e)=> snap.responsable = e.target.value })),
            field('Vencimiento (días hábiles)', inputCtl({ type:'number', min:1, max:30, value: snap.diasVencimientoPendiente, oninput:(e)=> snap.diasVencimientoPendiente = Number(e.target.value)||3 })),
          ]));
          formArea.appendChild(field('Descripción para el pendiente', textareaCtl({ rows:3, value: snap.descripcion, oninput:(e)=> snap.descripcion = e.target.value })));
          formArea.appendChild(h('div.banner.info', { style:{marginTop:'8px'} }, [
            h('i.ti.ti-info-circle'),
            h('div.grow', 'Al cerrar el pendiente con el folio SIGEM, el ciclo arrancará automáticamente.'),
          ]));
        }
      }
      render();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: () => {
        // Marcar la MP como "sin vincular" para que el banner amarillo de la ficha lo muestre.
        mp.sinVincular = true;
        persist('equipos');
        UI.toast(cancelToast, 'warning', { duration: 7000 });
        close('cancel');
      } }, 'Vincular después'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        try {
          if (modo === 'existente') {
            if (!snap.cicloUuidExistente) throw new Error('Elegí un ciclo existente.');
            const c = (equipo.correctivos||[]).find(x => x.uuid === snap.cicloUuidExistente);
            if (!c) throw new Error('Ciclo no encontrado.');
            mp.correctivoUuid = c.uuid;
            mp.sinVincular = false;
            equipo.estado = 'NoOperativo';
            equipo.estadoDesde = mp.fechaEvento || mp.fecha;
            pushEvento(equipo, { tipo: tipoEvento, ts: mp.fechaEvento || mp.fecha, payload: { mpId: mp.id, causal: mp.resultado, estadoFinal: mp.estadoFinal, cicloUuid: c.uuid, motivo } });
            persist('equipos');
            UI.toast(labelOk, 'success');
          } else if (modo === 'nuevo') {
            const fechaISO = isoFromDateInput(snap.fechaEvento);
            if (!fechaISO) throw new Error('Fecha inválida.');
            if (!snap.folioSigem.trim()) throw new Error('Indicá el folio SIGEM o cambiá a "Crear pendiente".');
            const { ciclo } = CICLO.crear(equipo.uuid, {
              fechaEvento: fechaISO,
              deteccion: snap.deteccion,
              descripcion: snap.descripcion || `Causal ${mp.resultado}: ${mp.obs || 'sin descripción'}`,
              responsable: snap.responsable,
              sigemEstado: 'existe',
              folioSigem: snap.folioSigem.trim(),
              startEslabon: 'diagnostico',
              causalLink: { mpId: mp.id, causal: mp.resultado },
            });
            mp.correctivoUuid = ciclo.uuid;
            mp.sinVincular = false;
            pushEvento(equipo, { tipo: tipoEvento, ts: fechaISO, payload: { mpId: mp.id, causal: mp.resultado, estadoFinal: mp.estadoFinal, cicloUuid: ciclo.uuid, folioSigem: snap.folioSigem.trim(), motivo } });
            persist('equipos');
            UI.toast(motivo === 'SI_NO_OP'
              ? `Ciclo creado y MP vinculada (folio ${snap.folioSigem}).`
              : `Ciclo creado y causal C3 vinculada (folio ${snap.folioSigem}).`, 'success');
          } else if (modo === 'pendiente') {
            const fechaISO = isoFromDateInput(snap.fechaEvento);
            if (!fechaISO) throw new Error('Fecha inválida.');
            const vence = addBusinessDays(new Date(), snap.diasVencimientoPendiente || 3).toISOString();
            const descCorta = (motivo === 'SI_NO_OP' ? 'MP ejecutada con equipo No Operativo' : `Causal ${mp.resultado}`);
            const p = PENDIENTE.crear({
              tipo: 'solicitud-clinico',
              descripcion: `Solicitar al servicio clínico generar SIGEM para ${equipo.nombre}: ${snap.descripcion || mp.obs || descCorta}`,
              equipoUuid: equipo.uuid,
              asignado: snap.responsable,
              vence,
              meta: { mpId: mp.id, causal: mp.resultado, estadoFinal: mp.estadoFinal, fechaProblema: fechaISO, deteccion: snap.deteccion, motivo },
            });
            mp.pendienteVinculadoId = p.id;
            mp.sinVincular = false;
            equipo.estado = 'NoOperativo';
            equipo.estadoDesde = fechaISO;
            pushEvento(equipo, { tipo:'CAUSAL-PENDIENTE-CLINICO', ts: fechaISO, payload: { mpId: mp.id, causal: mp.resultado, pendienteId: p.id } });
            persist('equipos');
            UI.toast(`Pendiente creado, vence ${fmt.date(vence)}. Equipo marcado No Operativo.`, 'success');
          }
          close('save');
          if (STATE.view) Router.go(STATE.view, STATE.viewParams);
        } catch (e) { bus.emit('error', e); }
      }}, 'Confirmar vinculación'));
    },
  });
}

function abrirModalVinculacionC2(equipo, mp) {
  // Buscar envíos pre-existentes en ciclos abiertos del equipo (ya hubo envío sin recibir).
  const ciclosConEnvio = (equipo.correctivos || []).filter(c => c.abierto && c.envio);
  let modo = ciclosConEnvio.length ? 'existente' : 'nuevo';
  let snap = {
    cicloUuidExistente: ciclosConEnvio[0]?.uuid || null,
    folioEnvio: '',
    empresa: '',
    fecha: dateInputValue(mp.fechaEvento || mp.fecha),
    responsable: '',
    deteccion: 'Servicio clínico avisó',
    descripcion: mp.obs || '',
  };

  UI.modal({
    title: 'Vincular causal C2',
    sub: 'El equipo pasa a En Servicio Técnico al confirmar.',
    size: 'md',
    content: (body, { close }) => {
      body.appendChild(h('p', { style:{margin:'0 0 14px 0', color:'var(--ink-2)', fontSize:'12.5px'} },
        'C2 = el equipo ya está en servicio técnico. Hay que ligarlo al envío.'));

      const opts = h('div', { style:{ display:'flex', flexDirection:'column', gap:'6px', marginBottom:'14px' } });
      function radio(value, label, desc) {
        return h('label', { style:{ display:'flex', gap:'10px', alignItems:'flex-start', padding:'10px 12px', border:'.5px solid var(--line-2)', borderRadius:'8px', cursor:'pointer', background: modo===value?'var(--paper-2)':'transparent' } }, [
          h('input', { type:'radio', name:'modo', value, checked: modo===value, onchange:(e)=>{ modo = e.target.value; render(); } }),
          h('div', { style:{flex:1} }, [
            h('div', { style:{fontWeight:500, fontSize:'13px'} }, label),
            h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px', marginTop:'2px'} }, desc),
          ]),
        ]);
      }
      body.appendChild(opts);
      const formArea = h('div');
      body.appendChild(formArea);

      function render() {
        opts.innerHTML = '';
        if (ciclosConEnvio.length) opts.appendChild(radio('existente', 'Vincular a envío existente de un ciclo abierto', `${ciclosConEnvio.length} envío${ciclosConEnvio.length>1?'s':''} sin recepcionar.`));
        opts.appendChild(radio('nuevo', 'Crear ciclo con envío ya hecho', 'El envío ya ocurrió. El ciclo arranca directamente en Recepción.'));

        formArea.innerHTML = '';
        if (modo === 'existente') {
          const sel = selectCtl(
            ciclosConEnvio.map(c => ({
              value: c.uuid,
              label: `${c.envio.folioEnvio || 'sin folio'} · ${c.envio.empresa || 'sin empresa'} · ${fmt.date(c.envio.fechaEvento || c.envio.fecha)}`,
            })),
            snap.cicloUuidExistente,
            { onchange:(e)=> snap.cicloUuidExistente = e.target.value },
          );
          formArea.appendChild(field('Envío a vincular', sel));
        } else {
          formArea.appendChild(row('1fr 1fr', [
            field('Fecha del envío', dateCtl(snap.fecha, { onchange:(e)=> snap.fecha = e.target.value })),
            field('Empresa', inputCtl({ value: snap.empresa, placeholder:'p. ej. Importadora ACME', oninput:(e)=> snap.empresa = e.target.value })),
          ]));
          formArea.appendChild(row('1fr 1fr', [
            field('Folio de envío', inputCtl({ value: snap.folioEnvio, oninput:(e)=> snap.folioEnvio = e.target.value })),
            field('Responsable', selectTecnico(snap.responsable, { onchange:(e)=> snap.responsable = e.target.value })),
          ]));
          formArea.appendChild(field('Descripción / contexto', textareaCtl({ rows:2, value: snap.descripcion, oninput:(e)=> snap.descripcion = e.target.value })));
        }
      }
      render();
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: () => {
        UI.toast('Causal C2 sin vincular — el equipo no cambia de estado. Aparecerá aviso en la ficha.', 'warning', { duration: 7000 });
        close('cancel');
      } }, 'Vincular después'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        try {
          if (modo === 'existente') {
            if (!snap.cicloUuidExistente) throw new Error('Elegí un ciclo.');
            const c = (equipo.correctivos||[]).find(x => x.uuid === snap.cicloUuidExistente);
            if (!c) throw new Error('Ciclo no encontrado.');
            mp.correctivoUuid = c.uuid;
            equipo.estado = 'ServicioTecnico';
            equipo.estadoDesde = c.envio.fechaEvento || c.envio.fecha;
            pushEvento(equipo, { tipo:'CAUSAL-VINCULADA', ts: equipo.estadoDesde, payload: { mpId: mp.id, causal: mp.resultado, cicloUuid: c.uuid, envio: true } });
            persist('equipos');
            UI.toast('Causal C2 vinculada al envío existente.', 'success');
          } else {
            const fechaISO = isoFromDateInput(snap.fecha);
            if (!fechaISO) throw new Error('Fecha del envío inválida.');
            if (!snap.empresa.trim()) throw new Error('Indicá la empresa.');
            const { ciclo } = CICLO.crear(equipo.uuid, {
              fechaEvento: fechaISO,
              deteccion: snap.deteccion,
              descripcion: snap.descripcion || `Causal ${mp.resultado}: equipo ya en servicio técnico`,
              responsable: snap.responsable,
              sigemEstado: 'noAplica',
              folioSigem: '',
              startEslabon: 'recepcion',
              envio: { folioEnvio: snap.folioEnvio, empresa: snap.empresa, fecha: fechaISO, responsable: snap.responsable },
              causalLink: { mpId: mp.id, causal: mp.resultado },
            });
            mp.correctivoUuid = ciclo.uuid;
            persist('equipos');
            UI.toast(`Ciclo creado en Recepción y causal C2 vinculada.`, 'success');
          }
          close('save');
          if (STATE.view) Router.go(STATE.view, STATE.viewParams);
        } catch (e) { bus.emit('error', e); }
      }}, 'Confirmar vinculación'));
    },
  });
}

/**
 * + Reparación. Pide elegir ciclo abierto o "in-situ" (crear ciclo cerrado).
 * Cierra pendientes vinculados al ciclo.
 */
function abrirModalReparacion(equipo) {
  // Ciclos abiertos ordenados por prioridad (recepcionados primero, luego envío sin recepción, luego solo solicitud)
  const ciclosAbiertos = (equipo.correctivos || []).filter(c => c.abierto);
  function prioridad(c) {
    const tieneRecepNoReparada = c.recepciones && c.recepciones.length > c.envios.filter(e => e.recepcionUuid).length + (c.envios.length - c.envios.filter(e => e.recepcionUuid).length === 0 ? 0 : 0);
    const ultRecep = (c.recepciones||[]).length > 0;
    const envSinRecep = (c.envios||[]).some(e => !e.recepcionUuid);
    if (ultRecep && c.envios.every(e => e.recepcionUuid)) return 0;  // recepcionado, falta reparación
    if (envSinRecep) return 1;
    if (c.solicitud) return 2;
    return 3;
  }
  ciclosAbiertos.sort((a,b) => prioridad(a) - prioridad(b));
  let modo = ciclosAbiertos.length ? 'existente' : 'nuevo';
  let cicloUuidElegido = ciclosAbiertos[0]?.uuid || null;
  let snap = {
    fechaEvento: todayISO(),
    responsable: usuarioActual() || '',
    observaciones: '',
  };

  UI.modal({
    title: '+ Reparación',
    sub: equipo.nombre,
    size: 'md',
    content: (body) => {
      body.appendChild(h('div', { style:{ marginBottom:'12px' } }, [
        h('div', { style:{fontSize:'12px', color:'var(--ink-3)', marginBottom:'6px'} }, 'Vincular a:'),
        h('div', { style:{display:'flex', flexDirection:'column', gap:'4px'} },
          [
            ...ciclosAbiertos.map(c => {
              const tieneRecep = (c.recepciones||[]).length > 0;
              const ultEvento = tieneRecep
                ? `recepción ${fmt.date(c.recepciones[c.recepciones.length-1].fechaEvento)}`
                : (c.envios||[]).length
                  ? `envío ${c.envios[c.envios.length-1].numeroEnvio} sin recepción`
                  : `solo solicitud`;
              const folio = c.solicitud?.folioSigem || '(sin folio)';
              return h('label', { style:{display:'flex', gap:'8px', alignItems:'center', padding:'8px 10px', border:'.5px solid var(--line-2)', borderRadius:'6px', cursor:'pointer'} }, [
                h('input', { type:'radio', name:'rep-modo', value:c.uuid, checked: modo==='existente' && cicloUuidElegido===c.uuid,
                  onchange:(e)=> { modo='existente'; cicloUuidElegido = e.target.value; } }),
                h('div', { style:{flex:1, fontSize:'12.5px'} }, [
                  h('div', { style:{fontWeight:500} }, `Ciclo · folio ${folio}`),
                  h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, `Último: ${ultEvento}`),
                ]),
              ]);
            }),
            h('label', { style:{display:'flex', gap:'8px', alignItems:'center', padding:'8px 10px', border:'.5px solid var(--line-2)', borderRadius:'6px', cursor:'pointer'} }, [
              h('input', { type:'radio', name:'rep-modo', value:'', checked: modo==='nuevo',
                onchange:()=> { modo='nuevo'; cicloUuidElegido = null; } }),
              h('div', { style:{fontSize:'12.5px'} }, 'Reparación in-situ sin envío previo (crear ciclo cerrado)'),
            ]),
          ]),
      ]));
      body.appendChild(row('1fr 1fr', [
        field('Fecha de reparación *', dateCtl(snap.fechaEvento, { max: todayISO(), onchange:(e)=> snap.fechaEvento = e.target.value })),
        field('Responsable *', selectTecnico(snap.responsable, { onchange:(e)=> snap.responsable = e.target.value })),
      ]));
      body.appendChild(field('Observaciones / resultado', textareaCtl({ rows:3, value: snap.observaciones, oninput:(e)=> snap.observaciones = e.target.value })));
      body.appendChild(h('div.banner.info', [ h('i.ti.ti-info-circle'), h('div.grow','Al guardar, el ciclo se cierra, el equipo vuelve a Operativo y se cierran automáticamente los pendientes vinculados al ciclo.') ]));
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: close }, 'Cancelar'));
      f.appendChild(h('button.btn.primary', { onclick: () => {
        try {
          const fechaISO = isoFromDateInput(snap.fechaEvento);
          if (!fechaISO) throw new Error('Fecha inválida.');
          const res = CICLO.registrarReparacion(equipo.uuid, modo === 'existente' ? cicloUuidElegido : null, {
            fechaEvento: fechaISO,
            responsable: snap.responsable,
            observaciones: snap.observaciones,
          });
          const n = res.pendientesCerrados || 0;
          UI.toast(`Reparación registrada · ciclo cerrado · equipo Operativo${n ? ` · ${n} pendiente${n>1?'s':''} cerrado${n>1?'s':''}` : ''}.`, 'success', { duration: 6000 });
          close('save');
          if (STATE.view) Router.go(STATE.view, STATE.viewParams);
        } catch (e) { bus.emit('error', e); }
      } }, [ h('i.ti.ti-device-floppy'), 'Registrar reparación' ]));
    },
  });
}

/**

function renderCicloEventos(equipo, ciclo) {
  const wrap = h('div');
  const folio = ciclo.solicitud?.folioSigem || null;

  // Header
  const cicloIdx = (equipo.correctivos || []).indexOf(ciclo) + 1;
  const header = h('div.card-h', [
    h('h3', `Ciclo correctivo #${cicloIdx} · ${ciclo.abierto ? 'abierto' : (ciclo.cancelado ? 'cancelado' : 'cerrado')}`),
    folio ? h('span.sub', `Folio ${folio}`) : null,
    ciclo.enGarantia ? h('span.pill.purple', 'En garantía') : null,
    ciclo.abierto ? h('span.pill.warning', 'Abierto') : (ciclo.cancelado ? h('span.pill.danger','Cancelado') : h('span.pill.success', 'Cerrado')),
  ]);
  wrap.appendChild(header);

  // Tarjetas de tiempos
  const tNoOp = tiempoEnEstado(equipo, 'NoOperativo');
  const tST   = tiempoEnEstado(equipo, 'ServicioTecnico');
  const tRec  = tiempoEnEstado(equipo, 'Recepcionado');
  const tTotal = ciclo.tiempoTotalDias != null ? ciclo.tiempoTotalDias :
    (() => {
      const stamps = [
        ciclo.solicitud?.fechaEvento,
        ...(ciclo.envios||[]).map(x => x.fechaEvento),
        ...(ciclo.recepciones||[]).map(x => x.fechaEvento),
        ciclo.reparacion?.fechaEvento,
      ].filter(Boolean).map(t => new Date(t).getTime()).sort((a,b) => a-b);
      if (!stamps.length) return null;
      const fin = ciclo.reparacion?.fechaEvento ? new Date(ciclo.reparacion.fechaEvento).getTime() : Date.now();
      return Math.round((fin - stamps[0]) / 86400000 * 10) / 10;
    })();
  wrap.appendChild(h('div.kpi-grid', { style:{marginBottom:'12px'} }, [
    kpiCard({ label:'Tiempo total ciclo', value: tTotal != null ? tTotal + 'd' : '—' }),
    kpiCard({ label:'Acum. NoOperativo', value: tNoOp + 'd' }),
    kpiCard({ label:'Acum. Servicio Téc.', value: tST + 'd', kind: tST > 30 ? 'warning' : '' }),
    kpiCard({ label:'Acum. Recepcionado', value: tRec + 'd', kind: tRec > 5 ? 'warning' : '' }),
  ]));

  // Árbol
  const tree = h('div', { style:{fontSize:'12.5px', lineHeight:'1.6', fontFamily:'inherit'} });
  function nodo(icono, color, titulo, sub, onClick) {
    return h('div', { style:{display:'flex', gap:'10px', alignItems:'flex-start', padding:'6px 0', cursor: onClick ? 'pointer' : 'default'}, onclick: onClick }, [
      h('i.ti', { class: 'ti ' + icono, style:{color:'var(--'+color+')', fontSize:'16px', marginTop:'2px', flexShrink:0} }),
      h('div', { style:{flex:1, minWidth:0} }, [
        h('div', { style:{fontWeight:500} }, titulo),
        sub ? h('div', { style:{color:'var(--ink-3)', fontSize:'11.5px'} }, sub) : null,
      ]),
    ]);
  }
  // Solicitud
  if (ciclo.solicitud) {
    const s = ciclo.solicitud;
    tree.appendChild(nodo('ti-file-text', 'info',
      `Solicitud de trabajo · folio ${s.folioSigem || '(sin folio)'}`,
      `${fmt.date(s.fechaEvento)} · ${s.responsable || '—'}${s.observaciones ? ' · ' + s.observaciones : ''}`,
    ));
  }
  // Envíos + recepciones (en pares)
  (ciclo.envios || []).forEach((env, idx) => {
    const recep = (ciclo.recepciones || []).find(r => r.envioUuid === env.uuid);
    const diasEnvio = recep
      ? Math.round((new Date(recep.fechaEvento).getTime() - new Date(env.fechaEvento).getTime()) / 86400000 * 10) / 10
      : Math.round((Date.now() - new Date(env.fechaEvento).getTime()) / 86400000 * 10) / 10;
    tree.appendChild(h('div', { style:{paddingLeft:'14px', borderLeft:'.5px solid var(--line-2)'} }, [
      nodo('ti-truck-delivery', 'warning',
        `Envío nº ${env.numeroEnvio} · ${env.empresaST}`,
        `${fmt.date(env.fechaEvento)} · ${env.responsable || '—'} · ${recep ? `${diasEnvio}d en ST` : `${diasEnvio}d pendiente de recepción`}${env.observaciones ? ' · ' + env.observaciones : ''}`,
      ),
      recep ? h('div', { style:{paddingLeft:'18px'} }, [
        nodo('ti-package', 'info',
          `Recepción${recep.guiaDespacho ? ' · guía ' + recep.guiaDespacho : ''}`,
          `${fmt.date(recep.fechaEvento)} · ${recep.responsable || '—'}${recep.observaciones ? ' · ' + recep.observaciones : ''}`,
        ),
      ]) : null,
    ]));
  });
  // Recepciones sin envío (caso edge)
  (ciclo.recepciones || []).filter(r => !r.envioUuid).forEach(recep => {
    tree.appendChild(nodo('ti-package', 'info',
      `Recepción sin envío previo${recep.guiaDespacho ? ' · guía ' + recep.guiaDespacho : ''}`,
      `${fmt.date(recep.fechaEvento)} · ${recep.responsable || '—'}`,
    ));
  });
  // Reparación
  if (ciclo.reparacion) {
    tree.appendChild(nodo('ti-tool', 'success',
      `Reparación · ciclo cerrado`,
      `${fmt.date(ciclo.reparacion.fechaEvento)} · ${ciclo.reparacion.responsable || '—'}${ciclo.reparacion.observaciones ? ' · ' + ciclo.reparacion.observaciones : ''}`,
    ));
  } else if (ciclo.abierto) {
    tree.appendChild(nodo('ti-circle-dashed', 'muted', '(sin reparación todavía)', 'El ciclo se cerrará al registrar la reparación.'));
  }

  wrap.appendChild(tree);
  return wrap;
}

/** Modal de bienvenida diaria — primera apertura del día. */
function abrirModalBienvenida() {
  const ahora = new Date();
  const hora = ahora.getHours();
  const saludo = hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches';
  const nombre = (usuarioActual() || '').split(' ')[0] || 'colega';
  const fechaTxt = ahora.toLocaleDateString('es-CL', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  // KPIs
  const yo = usuarioActual();
  const hoyMs = new Date(); hoyMs.setHours(23,59,59,999);
  const misHoy = STATE.pendientes.filter(p => p.estado !== 'Cerrado' && p.asignado === yo && p.vence && new Date(p.vence) <= hoyMs).length;
  const vencidos = STATE.pendientes.filter(p => p.estado !== 'Cerrado' && p.vence && new Date(p.vence) < new Date()).length;
  const eqVencidos30 = STATE.equipos.filter(e => ESTADOS_NO_OPERATIVOS.includes(e.estado) && e.estadoDesde && diasEnEstadoActual(e) > 30).length;
  const ciclosAb = CICLO.todosAbiertos().length;

  // Recordatorios
  const sinAsignar = STATE.pendientes.filter(p => p.estado !== 'Cerrado' && !p.asignado).length;
  const recepNoReparados = STATE.equipos.filter(e => e.estado === 'Recepcionado' && e.estadoDesde && diasEnEstadoActual(e) > 5);
  const solicSinAvance = (() => {
    let count = 0;
    STATE.equipos.forEach(e => (e.correctivos || []).forEach(c => {
      if (c.abierto && c.solicitud && (c.envios || []).length === 0) {
        const dias = Math.floor((Date.now() - new Date(c.solicitud.fechaEvento).getTime()) / 86400000);
        if (dias > 7) count++;
      }
    }));
    return count;
  })();

  // Maestro
  const sess = STATE.session || {};
  const cargaHoy = sess.fechaCarga && sess.fechaCarga.slice(0,10) === ahora.toISOString().slice(0,10);

  UI.modal({
    title: `${saludo}, ${nombre}.`,
    sub: `Hoy es ${fechaTxt}.`,
    size: 'md',
    critical: true,
    content: (body) => {
      // Card maestro
      const maestroCard = h('div.card', { style:{marginBottom:'14px'} });
      if (cargaHoy) {
        maestroCard.appendChild(h('div.banner.success', [
          h('i.ti.ti-circle-check'),
          h('div.grow', `Maestro ya revisado hoy (${fmt.datetime(sess.fechaCarga)}).`),
          h('button.btn.sm', { onclick: () => { document.querySelector('#modals .backdrop')?.querySelector('.close')?.click(); setTimeout(() => handleImportMaestro(), 100); } }, 'Volver a comparar'),
        ]));
      } else {
        maestroCard.appendChild(h('div', { style:{display:'flex', alignItems:'center', gap:'10px'} }, [
          h('i.ti.ti-file-spreadsheet', { style:{fontSize:'24px', color:'var(--info)'} }),
          h('div', { style:{flex:1} }, [
            h('div', { style:{fontWeight:500, fontSize:'13px'} }, 'Revisar maestro del día'),
            h('div', { style:{color:'var(--ink-3)', fontSize:'12px'} }, 'Cargá el Excel maestro para detectar cambios respecto al último import.'),
          ]),
          h('button.btn.primary.sm', { onclick: () => { document.querySelector('#modals .backdrop')?.querySelector('.close')?.click(); setTimeout(() => handleImportMaestro(), 100); } }, [ h('i.ti.ti-upload'), 'Cargar maestro' ]),
        ]));
      }
      body.appendChild(maestroCard);

      // KPIs
      body.appendChild(h('div', { style:{fontSize:'12px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.04em', marginBottom:'6px', fontWeight:500} }, 'Resumen del día'));
      body.appendChild(h('div.kpi-grid', { style:{marginBottom:'14px'} }, [
        kpiCard({ label:'Mis pendientes hoy', value: fmt.number(misHoy), kind: misHoy ? 'warning' : 'muted', onclick: () => { cerrarBienvenida(); UI_PEND.filtros = { estado:'', asignado: yo, desde:'', hasta: new Date().toISOString().slice(0,10) }; Router.go('tareas'); } }),
        kpiCard({ label:'Pendientes vencidos', value: fmt.number(vencidos), kind: vencidos ? 'danger' : 'muted', onclick: () => { cerrarBienvenida(); UI_PEND.filtros = { estado:'', asignado:'', desde:'', hasta: new Date().toISOString().slice(0,10) }; Router.go('tareas'); } }),
        kpiCard({ label:'Equipos >30d crítico', value: fmt.number(eqVencidos30), kind: eqVencidos30 ? 'danger' : 'muted', onclick: () => { cerrarBienvenida(); Router.go('inv', { tiempoEstado: '30' }); } }),
        kpiCard({ label:'Ciclos correctivos', value: fmt.number(ciclosAb), kind: ciclosAb ? 'info' : 'muted', onclick: () => { cerrarBienvenida(); Router.go('ciclos'); } }),
      ]));

      // Recordatorios
      if (sinAsignar || recepNoReparados.length || solicSinAvance) {
        body.appendChild(h('div', { style:{fontSize:'12px', color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.04em', marginBottom:'6px', fontWeight:500} }, 'Recordatorios'));
        const items = h('ul', { style:{margin:'0 0 12px 0', paddingLeft:'18px', fontSize:'12.5px'} });
        if (sinAsignar) items.appendChild(h('li', { style:{cursor:'pointer', color:'var(--warning)'}, onclick: () => { cerrarBienvenida(); UI_PEND.filtros = { estado:'', asignado:'__SIN_ASIGNAR__', desde:'', hasta:'' }; Router.go('tareas'); } }, `⚠ ${sinAsignar} pendiente${sinAsignar>1?'s':''} sin responsable asignado`));
        if (recepNoReparados.length) {
          const eq0 = recepNoReparados[0];
          items.appendChild(h('li', null, `📦 ${recepNoReparados.length} equipo${recepNoReparados.length>1?'s':''} recepcionado${recepNoReparados.length>1?'s':''} sin reparar hace >5 días (p. ej. ${eq0.nombre})`));
        }
        if (solicSinAvance) items.appendChild(h('li', null, `📝 ${solicSinAvance} solicitud${solicSinAvance>1?'es':''} abierta${solicSinAvance>1?'s':''} sin avance hace >7 días`));
        body.appendChild(items);
      }
    },
    footer: (f, { close }) => {
      f.appendChild(h('button.btn.ghost', { onclick: () => { cerrarBienvenida(true); } }, 'Saltar'));
      f.appendChild(h('button.btn.primary', { onclick: () => { cerrarBienvenida(true); } }, [ h('i.ti.ti-arrow-right-bar'), 'Empezar' ]));
    },
  });

  function cerrarBienvenida(persistir=true) {
    if (persistir) {
      try { localStorage.setItem('pmp.v3.ultimaApertura', ahora.toISOString().slice(0,10)); } catch {}
    }
    document.querySelectorAll('#modals .backdrop').forEach(b => {
      const closeBtn = b.querySelector('.modal-h .close');
      if (closeBtn) closeBtn.click();
    });
  }
}

/**
 * Pendiente automático cuando un equipo lleva >30 días en estado crítico
 * (NoOperativo / ServicioTecnico / Recepcionado). Idempotente: dedup por
 * `meta.estadoDesde` para no duplicar al recalcular.
 */
function revisarEquiposVencidos() {
  let creados = 0;
  STATE.equipos.forEach(e => {
    if (!ESTADOS_NO_OPERATIVOS.includes(e.estado) || !e.estadoDesde) return;
    const dias = diasEnEstadoActual(e);
    if (dias == null || dias <= 30) return;
    const tipoAlerta = '30d-' + e.estado;
    const yaExiste = STATE.pendientes.some(p =>
      p.estado !== 'Cerrado' && p.meta && p.meta.tipoAlerta === tipoAlerta &&
      p.meta.equipoUuid === e.uuid && p.meta.estadoDesde === e.estadoDesde
    );
    if (yaExiste) return;
    // Buscar el último ESTADO para sacar responsable
    const ultEv = (e.eventos || []).filter(ev => ev.tipo === 'ESTADO').sort((a,b) => new Date(b.ts) - new Date(a.ts))[0];
    const asignado = ultEv?.payload?.responsable || '';
    const vence = addBusinessDays(new Date(), 5).toISOString();
    PENDIENTE.crear({
      tipo: 'equipo-vencido-30d',
      descripcion: `Equipo ${e.nombre || ''} lleva ${Math.floor(dias)} días en estado ${ESTADO_LABEL[e.estado]}. Revisar avance.`,
      equipoUuid: e.uuid,
      asignado,
      vence,
      meta: { tipoAlerta, equipoUuid: e.uuid, estadoDesde: e.estadoDesde },
    });
    creados++;
  });
  if (creados) console.info('[revisarEquiposVencidos] pendientes creados:', creados);
  return creados;
}

/* ============================================================
   DOMAIN · contactos por servicio
   ============================================================ */
const CONTACTO_TIPOS = [
  { key: 'supervisor',        label: 'Supervisor' },
  { key: 'encargadoEquipos',  label: 'Encargado de equipos' },
  { key: 'jefeCR',            label: 'Jefe del CR' },
];
const PERSONA_CAMPOS = ['nombreCompleto','correo','anexo','celular'];

function emptyPersona() { return Object.fromEntries(PERSONA_CAMPOS.map(k => [k,''])); }
function emptyContacto() {
  return {
    supervisor:       emptyPersona(),
    encargadoEquipos: emptyPersona(),
    jefeCR:           emptyPersona(),
    notas: '',
  };
}

/** Migra una persona del esquema viejo {nombre, apellido} al nuevo {nombreCompleto}. */
function migrarPersona(p) {
  if (!p || typeof p !== 'object') return emptyPersona();
  const out = emptyPersona();
  // Si ya tiene nombreCompleto, lo respetamos.
  if (p.nombreCompleto) {
    out.nombreCompleto = p.nombreCompleto;
  } else if (p.nombre || p.apellido) {
    out.nombreCompleto = [p.nombre, p.apellido].filter(Boolean).join(' ').trim();
  }
  if (p.correo)  out.correo  = p.correo;
  if (p.anexo)   out.anexo   = p.anexo;
  if (p.celular) out.celular = p.celular;
  return out;
}

function getContacto(servicio) {
  const raw = STATE.contactos[servicio];
  if (!raw) return emptyContacto();
  // Migración silenciosa: si alguna persona tiene {nombre, apellido} se unifica.
  let needsSave = false;
  const migrated = { notas: raw.notas || '' };
  CONTACTO_TIPOS.forEach(t => {
    const p = raw[t.key] || {};
    if (p.nombre !== undefined || p.apellido !== undefined) needsSave = true;
    migrated[t.key] = migrarPersona(p);
  });
  if (needsSave) {
    STATE.contactos[servicio] = migrated;
    persist('contactos');
  }
  return migrated;
}
function setContacto(servicio, data) {
  STATE.contactos[servicio] = data;
  persist('contactos');
}

/* ============================================================
   REC · grabación de sesión
   ============================================================ */
const REC = (() => {
  let active = false;
  let startedAt = null;
  let events = [];
  let handlers = [];

  function on(target, evt, fn, opts) {
    target.addEventListener(evt, fn, opts);
    handlers.push(() => target.removeEventListener(evt, fn, opts));
  }

  function describeEl(el) {
    if (!el || !el.tagName) return '';
    let s = el.tagName.toLowerCase();
    if (el.id) s += '#' + el.id;
    if (el.className && typeof el.className === 'string') s += '.' + el.className.split(/\s+/).slice(0,2).join('.');
    return s;
  }

  function maybeRedact(field, value) {
    if (!field) return value;
    const f = (field + '').toLowerCase();
    if (f.includes('sigem') || f.includes('folio')) return '«REDACTED»';
    return value;
  }

  function truncate(v) {
    const s = String(v ?? '');
    return s.length > 120 ? s.slice(0,120) + '…' : s;
  }

  function pushEvent(ev) {
    events.push(ev);
    if (events.length > 50000) events.shift();
    const dot = document.getElementById('recDot');
    if (dot) dot.textContent = `REC · ${events.length}`;
  }

  function start() {
    if (active) return;
    active = true;
    startedAt = new Date().toISOString();
    events = [];

    on(document, 'click', (e) => {
      pushEvent({
        ts: new Date().toISOString(),
        tipo: 'click',
        elemento: describeEl(e.target),
        x: e.clientX, y: e.clientY,
      });
    }, { capture: true });

    on(document, 'change', (e) => {
      const t = e.target;
      if (!t) return;
      const field = t.id || t.name || describeEl(t);
      let val = '';
      if (t.type === 'file') val = '[file]';
      else if (t.type === 'password') val = '«REDACTED»';
      else val = truncate(maybeRedact(field, t.value));
      pushEvent({
        ts: new Date().toISOString(),
        tipo: 'change',
        elemento: describeEl(t),
        campo: field,
        valor: val,
      });
    }, { capture: true });

    on(document, 'submit', (e) => {
      pushEvent({ ts: new Date().toISOString(), tipo: 'submit', elemento: describeEl(e.target) });
    }, { capture: true });

    updateChip();
    UI.toast('Grabación iniciada. Aparece un indicador rojo en la sidebar.', 'info', { duration: 4000 });
  }

  function stop({ downloadBackup = true } = {}) {
    if (!active) return null;
    active = false;
    handlers.forEach(off => { try { off(); } catch {} });
    handlers = [];
    const payload = {
      sesion: { inicio: startedAt, fin: new Date().toISOString(), totalEventos: events.length, appVersion: APP_VERSION },
      eventos: events,
    };
    const ts = new Date().toISOString().replace(/[:.]/g,'-');
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pmp_rec_${ts}.json`;
    document.body.appendChild(a); a.click(); a.remove();

    if (downloadBackup) {
      try { exportBackup(); } catch {}
    }

    events = [];
    startedAt = null;
    updateChip();
    UI.toast(`Grabación detenida (${payload.sesion.totalEventos} eventos). Archivo descargado.`, 'success', { duration: 5000 });
    return payload;
  }

  function toggle() { active ? stop() : start(); }
  function isActive() { return active; }

  function updateChip() {
    const wrap = document.getElementById('recChip');
    if (!wrap) return;
    wrap.innerHTML = '';
    if (active) {
      wrap.appendChild(h('button.btn.sm.danger', { onclick: () => stop(), title:'Detener grabación' }, [
        h('span', { id:'recDot', style:{ display:'inline-flex', alignItems:'center', gap:'6px' } }, [
          h('span', { style:{width:'8px', height:'8px', borderRadius:'50%', background:'#dc2626', display:'inline-block', animation:'pulseDot 1.4s ease-in-out infinite'} }),
          `REC · ${events.length}`,
        ]),
        h('i.ti.ti-player-stop', { style:{marginLeft:'6px'} }),
      ]));
    } else {
      wrap.appendChild(h('button.btn.ghost.sm', { onclick: () => start(), title:'Iniciar grabación de sesión' }, [
        h('i.ti.ti-record-mail'), 'Grabar sesión',
      ]));
    }
  }

  return { start, stop, toggle, isActive, updateChip };
})();

      h('i.ti', { class: 'ti ' + it.icon }),
      h('span', it.label),
      it.soon ? h('span.badge', 'pronto') : null,
    ]);
    if (STATE.view === it.id) item.classList.add('active');
    item.addEventListener('click', () => Router.go(it.id));
    main.appendChild(item);
  });
  nav.appendChild(main);
  // Badges R6 en "Pendientes"
  try { actualizarBadgesPendientes(); } catch {}
}

function renderSessionChip() {
  const s = STATE.session;
  const meta = STATE.meta;
  const lines = [];
  if (s.archivoCargado) lines.push(`Maestro: ${s.archivoCargado.replace(/\.[^.]+$/,'')}`);
  if (s.fechaCarga) lines.push(`Cargado ${fmt.rel(s.fechaCarga)}`);
  if (meta.migratedFromLegacy) lines.push('Migrado desde legacy');
  lines.push(`v${APP_VERSION}`);
  $('#sessionChip').innerHTML = lines.map(l => `<div>${l}</div>`).join('');
}

function updateTopbar(title, sub) {
  $('#topbarTitle').textContent = title || '';
  $('#topbarSub').textContent = sub || '';
}

const Router = {
  go(viewId, params={}) {
    STATE.view = viewId;
    STATE.viewParams = params;
    renderNav();
    const view = VIEWS[viewId] || VIEWS.dash;
    const root = $('#view');
    root.innerHTML = '';
    updateTopbar(view.title, view.sub || '');
    try { view.render(root, params); }
    catch (e) { console.error(e); bus.emit('error', e); }
  },
};

const VIEWS = {};

VIEWS.dash = {

          ...(c.recepciones||[]).map(x => new Date(x.fechaEvento).getTime()),

        if (dias > 7) out.push({ equipo: e, ciclo: c, dias });

            h('div', { style:{flex:1, minWidth:0} }, [

              h('div', { style:{color:'var(--ink-3)', fontSize:'11px'} }, ESTADO_LABEL[e.estado]),

          ]));
        });
      }
      return card;
    })());
    // Card 2: ciclos sin avance
    atencionesGrid.appendChild((() => {

      card.appendChild(h('div', { style:{display:'flex', alignItems:'center', gap:'8px', marginBottom:'8px'} }, [

      const card = h('div.card');
      card.appendChild(h('div', { style:{fontWeight:500, fontSize:'13px', marginBottom:'10px'} }, 'Por estado'));

          h('div', { style:{flex:1, height:'8px', background:'var(--paper-3)', borderRadius:'4px', overflow:'hidden'} }, [

      const noOpEq = STATE.equipos.filter(e => ESTADOS_NO_OPERATIVOS.includes(e.estado));

      noOpEq.forEach(e => { byFam[e.fam || '(sin familia)'] = (byFam[e.fam || '(sin familia)'] || 0) + 1; });
      const tops = Object.entries(byFam).sort((a,b) => b[1] - a[1]).slice(0, 10);
      if (!tops.length) {
        card.appendChild(h('div', { style:{color:'var(--ink-3)', fontSize:'12px'} }, 'Sin equipos no operativos.'));

        tops.forEach(([fam, n]) => {

    const resumenTxt = (() => {
      const recepN = byEst.Recepcionado || 0;
      const stN = byEst.ServicioTecnico || 0;
      const noOpN = byEst.NoOperativo || 0;
      // Equipo más días en estado crítico
      const peor = equiposCritico30[0];
      // Empresa con más equipos en ST
      const empresaCounts = {};
      STATE.equipos.forEach(e => {
        if (e.estado !== 'ServicioTecnico') return;
        const c = (e.correctivos||[]).find(c => c.abierto);
        const ultEnv = c && (c.envios||[]).slice(-1)[0];
        if (ultEnv && ultEnv.empresaST) {
          empresaCounts[ultEnv.empresaST] = (empresaCounts[ultEnv.empresaST] || 0) + 1;
        }
      });
      const empresaTop = Object.entries(empresaCounts).sort((a,b) => b[1] - a[1])[0];
      let txt = `En este momento hay ${stN} equipo${stN===1?'':'s'} en servicio técnico, ${recepN} recepcionado${recepN===1?'':'s'} pendiente${recepN===1?'':'s'} de reparación y ${noOpN} no operativo${noOpN===1?'':'s'} en servicio clínico. `;
      if (peor) txt += `El equipo con más días en estado crítico es ${peor.nombre} (${Math.floor(diasEnEstadoActual(peor))} días en ${ESTADO_LABEL[peor.estado]}). `;
      if (empresaTop) txt += `La empresa con más equipos en ST es ${empresaTop[0]} con ${empresaTop[1]} equipo${empresaTop[1]===1?'':'s'}.`;

    const cardResumen = h('div.card', { style:{marginBottom:'18px'} }, [
      h('div', { style:{display:'flex', alignItems:'center', gap:'8px', marginBottom:'8px'} }, [
        h('i.ti.ti-clipboard-text', { style:{fontSize:'18px', color:'var(--info)'} }),
        h('div', { style:{fontWeight:500, fontSize:'13px'} }, 'Resumen ejecutivo (para jefatura)'),

          catch { UI.toast('No se pudo copiar al portapapeles.', 'danger'); }
        } }, [ h('i.ti.ti-copy'), 'Copiar texto' ]),

    const recientes = STATE.equipos
      .flatMap(e => (e.historial||[]).map(h => ({ e, h })))

      .sort((a,b) => new Date(b.h.fecha) - new Date(a.h.fecha))
      .slice(0, 8);

    const sec = h('div.section');
    sec.appendChild(h('h3', 'Últimos registros MP'));
    if (!recientes.length) {
      sec.appendChild(h('div.card', { style: { color: 'var(--ink-3)', fontSize:'12.5px' } }, 'Aún no hay registros de mantenciones.'));
    } else {
      const wrap = h('div.table-wrap');
      const tbl = h('table.dt');

        <th>Fecha</th><th>Equipo</th><th>Mes</th><th>Resultado</th><th>Ejecutor</th>
      </tr></thead>`;
      const tb = h('tbody');
      recientes.forEach(({ e, h: row }) => {
        const tr = h('tr', { onclick: () => openFicha(e.uuid) }, [
          h('td.col-mono', fmt.date(row.fecha)),
          h('td', [ h('div', e.nombre), h('div', { style:{color:'var(--ink-3)',fontSize:'11.5px'} }, `${e.marca||''} · ${e.modelo||''}`) ]),
          h('td', MESES[(row.mes||1)-1]),
          h('td', resultadoPill(row.resultado)),
          h('td', row.ejecutor || '—'),
        ]);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb);
      wrap.appendChild(tbl);
      sec.appendChild(wrap);
    }
    root.appendChild(sec);
  },
};

function resultadoPill(r) {
  if (!r) return h('span.pill.muted','—');
  if (r === 'SI') return h('span.pill.success','SI');
  if (r === 'NO') return h('span.pill.warning','NO');
  if (r === 'FS') return h('span.pill.muted','FS');
  if (r === 'BAJA') return h('span.pill.danger','BAJA');
  if (CAUSALES[r]) return h(`span.pill.${CAUSALES[r].grupo==='A'?'warning':'info'}`, r);
  return h('span.pill', r);
}

function kpiCard({ label, value, kind='', onclick }) {
  return h(`div.kpi ${kind}`.trim(), { onclick }, [
    h('span.label', label),
    h('span.value', value ?? '—'),
  ]);
}

function viewHeader({ title, desc, actions=[] }) {
  return h('div.view-header', [
    h('div', [ h('h2', title), desc ? h('p', desc) : null ]),
    h('div.actions', actions.map(a => h(`button.btn ${a.primary?'primary':''}`.trim(), { onclick: a.onclick }, [
      a.icon ? h('i.ti', { class: 'ti ' + a.icon }) : null,
      a.label,
    ]))),
  ]);
}

function emptyState({ icon, title, desc, actions=[] }) {
  return h('div.card', { style: { padding: 0 } }, [
    h('div.empty', [
      h('i.ti', { class: 'ti ' + (icon||'ti-info-circle') }),
      h('h4', title),
      h('p', desc || ''),
      h('div.actions', actions.map(a =>
        h(`button.btn ${a.primary?'primary':''}`.trim(), { onclick: a.onclick }, [
          a.icon ? h('i.ti', { class: 'ti ' + a.icon }) : null, a.label,
        ]))),
    ]),
  ]);
}
