<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMP · SEC · HHHA Temuco</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('pmp.v3.ui.theme');
      if (t !== 'dark' && t !== 'light') t = 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.34.1/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --paper:        #faf9f5;
  --paper-2:      #f6f5f1;
  --paper-3:      #efeee9;
  --ink:          #1f1d18;
  --ink-2:        #45413a;
  --ink-3:        #7a766c;
  --ink-4:        #aaa498;
  --line:         rgba(0,0,0,.08);
  --line-2:       rgba(0,0,0,.14);
  --line-strong:  rgba(0,0,0,.22);

  /* AJUSTE R8 B.1: paleta semántica calmada para uso prolongado. Contrastes ≥ 4.5 vs --paper. */
  --info:         #3b6ea8;
  --info-bg:      #eaf1f8;
  --success:      #3d7a52;
  --success-bg:   #e8f0ea;
  --warning:      #8a5a1c;
  --warning-bg:   #f6ecd9;
  --danger:       #a14a48;
  --danger-bg:    #f3e2e0;
  --purple:       #6c569c;
  --purple-bg:    #ebe4f1;

  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
  --r-xl: 14px;

  --shadow-1: 0 1px 0 rgba(0,0,0,.05);
  --shadow-2: 0 4px 16px rgba(0,0,0,.06);
  --shadow-3: 0 20px 60px rgba(0,0,0,.18);

  --backdrop: rgba(31,29,24,.28);
  --backdrop-stacked: rgba(31,29,24,.14);
  --select-arrow: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237a766c' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>";

  --sb-w: 232px;
  --sb-w-collapsed: 60px;   /* AJUSTE R8 H: ancho de sidebar colapsada */

  --z-popover: 100;
  --z-drawer:  200;
  --z-modal:   300;
  --z-toast:   400;
  --z-cmdk:    500;
}

:root[data-theme="dark"] {
  --paper:        #0e141b;
  --paper-2:      #161d26;
  --paper-3:      #1f2832;
  --ink:          #e6ecf2;
  --ink-2:        #b3bcc6;
  --ink-3:        #7c8590;
  --ink-4:        #525a64;
  --line:         rgba(255,255,255,.07);
  --line-2:       rgba(255,255,255,.13);
  --line-strong:  rgba(255,255,255,.22);

  /* AJUSTE R8 B.2: paleta semántica del tema oscuro suavizada. Los *-bg quedan igual. */
  --info:         #7ab1de;
  --info-bg:      rgba(37,99,235,.20);
  --success:      #7cb893;
  --success-bg:   rgba(34,197,94,.18);
  --warning:      #d7b378;
  --warning-bg:   rgba(217,119,6,.22);
  --danger:       #d68d87;
  --danger-bg:    rgba(220,38,38,.26);
  --purple:       #a99bd6;
  --purple-bg:    rgba(139,92,246,.22);

  --shadow-1: 0 1px 0 rgba(0,0,0,.45);
  --shadow-2: 0 4px 16px rgba(0,0,0,.5);
  --shadow-3: 0 24px 70px rgba(0,0,0,.65);

  --backdrop: rgba(0,0,0,.55);
  --backdrop-stacked: rgba(0,0,0,.3);
  --select-arrow: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237c8590' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>";

  color-scheme: dark;
}

:root[data-theme="dark"] .brand-mark { background: #0a6ec7; color: #ffffff; }
:root[data-theme="dark"] body {
  background:
    radial-gradient(1200px 600px at 0% 0%, rgba(10,110,199,.06), transparent 60%),
    var(--paper);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, h5, p { margin: 0; font-weight: 500; }
ul, ol { margin: 0; padding: 0; list-style: none; }
table { border-collapse: collapse; width: 100%; }
hr { border: 0; border-top: .5px solid var(--line); margin: 0; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   SHELL
   ============================================================ */
.app {
  display: grid;
  grid-template-columns: var(--sb-w) 1fr;
  min-height: 100vh;
  transition: grid-template-columns 180ms ease;
}
/* AJUSTE R8 H.2: modo colapsado de la sidebar — sólo iconos, ~60px. */
.app.sidebar-collapsed { grid-template-columns: var(--sb-w-collapsed) 1fr; }
.app.sidebar-collapsed .sidebar { padding: 18px 6px; }
.app.sidebar-collapsed .brand { justify-content: center; padding: 2px; }
.app.sidebar-collapsed .brand-text { display: none; }
.app.sidebar-collapsed .nav-item { justify-content: center; padding: 9px 6px; position: relative; }
.app.sidebar-collapsed .nav-item span:not(.badge):not(.badge-pend) { display: none; }
.app.sidebar-collapsed .nav-item .badge,
.app.sidebar-collapsed .nav-item .badge-pend {
  position: absolute; top: 2px; right: 2px; margin-left: 0;
  font-size: 9px; padding: 1px 4px; min-width: auto;
}
.app.sidebar-collapsed .sidebar-footer .session-chip,
.app.sidebar-collapsed .sidebar-footer #recChip { display: none; }
.app.sidebar-collapsed #themeToggle span,
.app.sidebar-collapsed #sidebarToggle span { display: none; }
.app.sidebar-collapsed #themeToggle,
.app.sidebar-collapsed #sidebarToggle { justify-content: center; padding: 6px; }
.sidebar {
  background: var(--paper-2);
  border-right: .5px solid var(--line);
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: var(--ink);
  color: var(--paper);
  display: grid; place-items: center;
  font-size: 14px;
  font-weight: 500;
}
.brand-text { line-height: 1.15; }
.brand-text strong { display: block; font-weight: 500; font-size: 13px; }
.brand-text span { font-size: 11px; color: var(--ink-3); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--ink-4);
  padding: 8px 8px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: var(--r-md);
  color: var(--ink-2);
  cursor: pointer;
  font-size: 13px;
  position: relative;
}
.nav-item i { font-size: 16px; color: var(--ink-3); }
.nav-item:hover { background: var(--paper-3); color: var(--ink); }
.nav-item.active { background: var(--ink); color: var(--paper); }
.nav-item.active i { color: var(--paper); }
.nav-item .badge {
  margin-left: auto;
  font-size: 10.5px;
  background: var(--paper-3);
  color: var(--ink-2);
  padding: 1px 6px;
  border-radius: 8px;
}
.nav-item.active .badge { background: rgba(255,255,255,.15); color: var(--paper); }

.sidebar-footer {
  margin-top: auto;
  display: flex; flex-direction: column; gap: 4px;
  padding-top: 12px;
  border-top: .5px solid var(--line);
}
.session-chip {
  font-size: 11px;
  color: var(--ink-3);
  padding: 4px 6px;
}

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.topbar {
  height: 52px;
  border-bottom: .5px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 14px;
  background: var(--paper);
  position: sticky; top: 0; z-index: 50;
}
.topbar h1 { font-size: 14px; font-weight: 500; }
.topbar .sep { color: var(--ink-4); }
.topbar .breadcrumb { color: var(--ink-3); font-size: 13px; }
.topbar .grow { flex: 1; }
.topbar .cmdk-hint {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-3);
  padding: 5px 10px;
  border: .5px solid var(--line);
  border-radius: var(--r-md);
  background: var(--paper-2);
  cursor: pointer;
}
.topbar .cmdk-hint kbd {
  font-family: inherit;
  font-size: 10.5px;
  background: var(--paper-3);
  border: .5px solid var(--line);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--ink-2);
}

.view {
  padding: 24px 28px 80px;
  max-width: 1400px;
  width: 100%;
}
.view-header {
  display: flex;
  align-items: end;
  gap: 14px;
  margin-bottom: 20px;
}
.view-header h2 {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -.01em;
}
.view-header p { color: var(--ink-3); font-size: 13px; }
.view-header .actions { margin-left: auto; display: flex; gap: 8px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: .5px solid var(--line-2);
  background: var(--paper);
  color: var(--ink);
  border-radius: var(--r-md);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 80ms ease, border-color 80ms ease;
  white-space: nowrap;
}
.btn:hover { background: var(--paper-2); }
.btn:active { background: var(--paper-3); }
.btn i { font-size: 15px; color: var(--ink-2); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary i { color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--paper-2); border-color: var(--line); }
.btn.danger { color: var(--danger); border-color: var(--line-2); }
.btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.icon { padding: 6px; }
.btn.icon i { font-size: 16px; }
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; border-right-width: 0; }
.btn-group .btn:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
.btn-group .btn:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; border-right-width: .5px; }

/* ============================================================
   FORMS
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 11.5px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: .01em;
}
.field .hint { font-size: 11px; color: var(--ink-3); }
.field .err  { font-size: 11px; color: var(--danger); }

.input, .select, .textarea {
  padding: 6px 10px;
  border: .5px solid var(--line-2);
  border-radius: var(--r-md);
  background: var(--paper);
  font-size: 13px;
  outline: none;
  transition: border-color 80ms ease, box-shadow 80ms ease;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--ink-3);
  box-shadow: 0 0 0 3px rgba(94,168,232,.18);
}
/* Foco visible para navegación por teclado en cualquier elemento focusable */
:focus-visible {
  outline: 2px solid var(--info);
  outline-offset: 2px;
  border-radius: 4px;
}
.btn:focus-visible, .nav-item:focus-visible, .cmdk-item:focus-visible, .tab:focus-visible,
.kpi:focus-visible, .step:focus-visible {
  outline: 2px solid var(--info);
  outline-offset: 2px;
}
.input:focus-visible, .select:focus-visible, .textarea:focus-visible { outline: none; }
.textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
.select { appearance: none; padding-right: 28px;
  background-image: url(var(--select-arrow));
  background-repeat: no-repeat;
  background-position: right 10px center;
}
:root .select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237a766c' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>"); }
:root[data-theme="dark"] .select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='none' stroke='%237c8590' stroke-width='1.4' d='M2 4l3 3 3-3'/></svg>"); }
.search {
  display: flex;
  align-items: center;
  border: .5px solid var(--line-2);
  border-radius: var(--r-md);
  background: var(--paper);
  padding: 0 10px;
  gap: 6px;
}
.search i { color: var(--ink-3); font-size: 16px; }
.search input {
  border: 0; outline: none; background: transparent;
  padding: 6px 0; flex: 1; min-width: 0;
}

/* ============================================================
   PILLS / BADGES
   ============================================================ */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--paper-3);
  color: var(--ink-2);
  border: .5px solid var(--line);
  font-weight: 500;
  white-space: nowrap;
}
.pill.info     { background: var(--info-bg);    color: var(--info);    border-color: transparent; }
.pill.success  { background: var(--success-bg); color: var(--success); border-color: transparent; }
.pill.warning  { background: var(--warning-bg); color: var(--warning); border-color: transparent; }
.pill.danger   { background: var(--danger-bg);  color: var(--danger);  border-color: transparent; }
.pill.purple   { background: var(--purple-bg);  color: var(--purple);  border-color: transparent; }
.pill.muted    { color: var(--ink-3); }
.pill .dot     {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor;
}

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--paper);
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
}
.card-h {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.card-h h3 { font-size: 13px; font-weight: 500; }
.card-h .sub { color: var(--ink-3); font-size: 11.5px; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.kpi {
  padding: 14px 16px;
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper);
  display: flex; flex-direction: column; gap: 4px;
  cursor: pointer;
  transition: background 80ms ease, border-color 80ms ease;
}
.kpi:hover { background: var(--paper-2); border-color: var(--line-2); }
.kpi .label { font-size: 11px; color: var(--ink-3); letter-spacing: .02em; text-transform: uppercase; }
.kpi .value { font-size: 24px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
.kpi .trend { font-size: 11px; color: var(--ink-3); }
.kpi.danger .value { color: var(--danger); }
.kpi.warning .value { color: var(--warning); }
.kpi.success .value { color: var(--success); }
.kpi.info .value    { color: var(--info); }
.kpi.purple .value  { color: var(--purple); }

/* ============================================================
   TABLE
   ============================================================ */
.table-wrap {
  /* AJUSTE R8 F.1: scroll horizontal cuando hay muchas columnas (p. ej. Inventario con
     las 18 columnas activas). Antes era overflow:hidden y bloqueaba el scroll. */
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--paper);
  overflow-x: auto;
  overflow-y: visible;
  /* AJUSTE R9 B.1: se eliminó el fade gradient compuesto de R8 F.2 (Opción 2 del prompt).
     Aparecía como mancha clara en el borde derecho cuando la tabla cabía completa en el
     wrap (pantallas anchas, presets de pocas columnas). El scroll horizontal nativo del
     navegador es suficiente indicador visual y el cambio es de cero líneas de JS. */
}
.table-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: .5px solid var(--line);
  flex-wrap: wrap;
}
.table-toolbar .search { flex: 1; min-width: 200px; }
.table-toolbar .right { display: flex; gap: 6px; align-items: center; }
.table-meta {
  font-size: 11.5px;
  color: var(--ink-3);
  padding: 8px 12px;
  border-bottom: .5px solid var(--line);
  background: var(--paper-2);
}
.dt {
  font-size: 12.5px;
  /* AJUSTE R9.1: width:max-content fuerza a la tabla a tomar su ancho natural
     (sin que el navegador la comprima al ancho del .view, que está capeado
     a 1400px). Combinado con min-width:100% sigue llenando el wrap cuando
     hay pocas columnas. Sin esto, el overflow-x:auto del .table-wrap nunca
     se disparaba porque la tabla siempre cabía (comprimida). */
  width: max-content;
  min-width: 100%;
}
.dt thead th {
  text-align: left;
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--ink-3);
  padding: 8px 12px;
  border-bottom: .5px solid var(--line);
  background: var(--paper-2);
  position: sticky; top: 0;
  white-space: nowrap;
}
.dt tbody td {
  padding: 8px 12px;
  border-bottom: .5px solid var(--line);
  vertical-align: middle;
  /* AJUSTE R8.1: nowrap por defecto en celdas. Sin esto, contenido largo
     (p. ej. "Monitor Multiparámetros") se rompía en 2 líneas comprimiendo
     la columna, y la tabla siempre cabía en el .table-wrap, anulando el
     overflow-x:auto agregado en R8 F.1. Para wrap explícito en celdas
     puntuales, usar la clase .wrap (definida abajo). */
  white-space: nowrap;
}
.dt tbody td.wrap { white-space: normal; }
.dt tbody td.wrap-2 { white-space: normal; max-width: 280px; }
.dt tbody tr { cursor: pointer; }
.dt tbody tr:hover { background: var(--paper-2); }
.dt tbody tr.is-slot td { color: var(--ink-4); font-style: italic; }
.dt .truncate {
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dt .col-narrow { width: 60px; }
.dt .col-mono { font-variant-numeric: tabular-nums; color: var(--ink-2); }

.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--ink-3);
}
.empty i { font-size: 36px; color: var(--ink-4); margin-bottom: 8px; }
.empty h4 { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-bottom: 4px; }
.empty p { font-size: 12.5px; }
.empty .actions { margin-top: 14px; display: inline-flex; gap: 8px; }

/* ============================================================
   MODAL / DRAWER / DIALOG / TOAST / POPOVER
   ============================================================ */
.backdrop {
  position: fixed; inset: 0;
  background: var(--backdrop);
  z-index: var(--z-modal);
  display: grid;
  place-items: center;
  padding: 24px;
  animation: fade-in 140ms ease-out;
  /* AJUSTE R8 G.4: blur sutil detrás del modal para separación visual.
     Degradación silenciosa en navegadores que no lo soportan. */
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.backdrop.is-stacked {
  background: var(--backdrop-stacked);
  /* AJUSTE R9 B.2: en modales apilados (sub-modal sobre modal), el blur del backdrop
     ya está aplicado por el backdrop de fondo. Evitar componerlo dos veces para no
     pesar en hardware viejo y evitar artefactos visuales. */
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-right { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes pendienteFlash {
  0%   { box-shadow: 0 0 0 0 var(--info); border-color: var(--info); }
  60%  { box-shadow: 0 0 0 6px rgba(94,168,232,0); border-color: var(--info); }
  100% { box-shadow: 0 0 0 0 transparent; border-color: var(--line); }
}

/** Hyperscript: h('div.cls#id', {attrs}, [children]) */
function h(tag, attrs={}, children=[]) {
  let id = null, cls = [];
  const m = tag.match(/^([a-zA-Z0-9-]+)([.#][^.#]+)*$/);
  if (m) {
    const parts = tag.match(/[.#][^.#]+/g) || [];
    tag = tag.replace(/[.#][^.#]+/g, '');
    parts.forEach(p => p[0]==='#' ? (id = p.slice(1)) : cls.push(p.slice(1)));
  }
  const el = document.createElement(tag);
  if (id) el.id = id;
  if (cls.length) el.className = cls.join(' ');
  if (attrs && typeof attrs === 'object' && !Array.isArray(attrs) && !(attrs instanceof Node)) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = (el.className + ' ' + v).trim();
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'html') el.innerHTML = v;
      else if (k in el && typeof el[k] !== 'function') { try { el[k] = v; } catch { el.setAttribute(k, v); } }
      else el.setAttribute(k, v);
    }
  } else if (attrs != null) {
    children = attrs;
  }
  const append = (c) => {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(append);
    else if (c instanceof Node) el.appendChild(c);
    else el.appendChild(document.createTextNode(String(c)));
  };
  append(children);
  return el;
}

function on(el, evt, sel, handler) {
  if (typeof sel === 'function') { handler = sel; el.addEventListener(evt, handler); return; }
  el.addEventListener(evt, (e) => {
    const t = e.target.closest(sel);
    if (t && el.contains(t)) handler(e, t);
  });
}

const fmt = {
  date(d) {
    if (!d) return '—';
    const dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('es-CL', { year:'numeric', month:'2-digit', day:'2-digit' });
  },
  dateLong(d) {
    if (!d) return '—';
    const dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString('es-CL', { year:'numeric', month:'long', day:'numeric' });
  },
  datetime(d) {
    if (!d) return '—';
    const dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleString('es-CL', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  },
  rel(d) {
    if (!d) return '—';
    const dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt)) return String(d);
    const days = Math.floor((Date.now() - dt) / 86400000);
    if (days < 1) return 'hoy';
    if (days < 2) return 'ayer';
    if (days < 30) return `hace ${days} días`;
    if (days < 365) return `hace ${Math.floor(days/30)} meses`;
    return `hace ${Math.floor(days/365)} años`;
  },
  daysSince(d) {
    if (!d) return null;
    const dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt)) return null;
    return Math.floor((Date.now() - dt) / 86400000);
  },
  number(n) {
    if (n == null || n === '') return '—';
    return Number(n).toLocaleString('es-CL');

  bytes(n) {
    if (!n) return '0 B';
    const u = ['B','KB','MB','GB'];
    let i = 0; while (n >= 1024 && i < u.length-1) { n /= 1024; i++; }
    return `${n.toFixed(i? 1:0)} ${u[i]}`;

function uuid() {
  if (crypto?.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {

function normalize(s) {

function debounce(fn, ms=400) {
  let t = null;
  return function (...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

function fuzzyMatch(needle, hay) {
  if (!needle) return true;
  const n = normalize(needle);
  return normalize(hay).includes(n);
}

function fuzzyScore(needle, hay) {
  if (!needle) return 0;
  const n = normalize(needle), h = normalize(hay);
  if (h.startsWith(n)) return 100;
  if (h.includes(n))   return 60;
  let i = 0, s = 0;
  for (const c of h) { if (c === n[i]) { i++; s += 1; if (i === n.length) return s; } }
  return -1;
}

/* ============================================================
   STORAGE · namespaced + legacy migration
   ============================================================ */
const STORAGE = {
  KEY_PREFIX: 'pmp.v3.',
  LEGACY: {
    equipos:        'pmp_equipos',
    pendientes:     'pmp_pendientes',
    asignaciones:   'pmp_asignaciones',
    contactos:      'pmp_contactos',
    sesion:         'pmp_sesion',
  },
  read(key, def=null) {
    try {
      const raw = localStorage.getItem(this.KEY_PREFIX + key);
      if (raw == null) return def;
      return JSON.parse(raw);
    } catch (e) {
      console.error('[storage.read]', key, e);
      return def;
    }
  },
  write(key, val) {
    try {
      localStorage.setItem(this.KEY_PREFIX + key, JSON.stringify(val));
      return true;
    } catch (e) {
      console.error('[storage.write]', key, e);
      bus.emit('error', new Error('No se pudo guardar: ' + (e.message || e)));
      return false;
    }
  },
  remove(key) { localStorage.removeItem(this.KEY_PREFIX + key); },
  clearAll() {
    Object.keys(localStorage)
      .filter(k => k.startsWith(this.KEY_PREFIX))
      .forEach(k => localStorage.removeItem(k));
  },
  readLegacyJSON(legacyKey) {
    try {
      const raw = localStorage.getItem(legacyKey);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch { return null; }
  },
};

function migrateFromLegacy() {
  // If schema already initialized, skip.
  const meta = STORAGE.read('meta', null);
  if (meta && meta.schemaVersion >= SCHEMA_VERSION) return { migrated: false };

  const equipos      = STORAGE.readLegacyJSON(STORAGE.LEGACY.equipos);
  const pendientes   = STORAGE.readLegacyJSON(STORAGE.LEGACY.pendientes);
  const asignaciones = STORAGE.readLegacyJSON(STORAGE.LEGACY.asignaciones);
  const contactos    = STORAGE.readLegacyJSON(STORAGE.LEGACY.contactos);
  const sesion       = STORAGE.readLegacyJSON(STORAGE.LEGACY.sesion);

  // Normalize equipo records onto V3 shape (additive — keep unknown fields).
  const normEquipos = Array.isArray(equipos) ? equipos.map(normalizeEquipoFromLegacy) : [];

  STORAGE.write('equipos',      normEquipos);
  STORAGE.write('pendientes',   Array.isArray(pendientes) ? pendientes : []);
  STORAGE.write('asignaciones', asignaciones && typeof asignaciones === 'object' ? asignaciones : {});
  STORAGE.write('contactos',    contactos && typeof contactos === 'object' ? contactos : {});
  STORAGE.write('session',      sesion && typeof sesion === 'object' ? sesion : {});
  STORAGE.write('meta', {
    schemaVersion: SCHEMA_VERSION,
    migratedFromLegacy: normEquipos.length > 0 || (pendientes?.length ?? 0) > 0,
    migratedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
  });

  return {
    migrated: true,
    counts: {
      equipos:    normEquipos.length,
      pendientes: pendientes?.length ?? 0,
    },
  };
}

function normalizeEquipoFromLegacy(e) {
  return {
    uuid: e.uuid || uuid(),
    id: e.id ?? null,
    fam: e.fam ?? '',
    famOriginal: e.famOriginal ?? e.fam ?? '',
    carpeta: e.carpeta ?? null,
    inventario: e.inventario ?? '',
    nombre: e.nombre ?? '',
    servicio: e.servicio ?? '',
    unidad: e.unidad ?? '',
    ubicacion: e.ubicacion ?? '',
    procedencia: e.procedencia ?? '',
    marca: e.marca ?? '',
    modelo: e.modelo ?? '',
    serie: e.serie ?? '',
    anio: e.anio ?? '',
    vidaUtil: e.vidaUtil ?? '',
    clasificacion: e.clasificacion ?? '',
    enu: e.enu ?? '',
    observacion: e.observacion ?? '',
    frecuencia: e.frecuencia ?? '',
    responsableMaster: e.responsableMaster ?? '',
    enGarantia: !!e.enGarantia,
    garantiaHasta: e.garantiaHasta ?? null,
    garantiaProveedor: e.garantiaProveedor ?? '',
    estado: e.estado ?? (e.esSlot ? 'Slot' : 'Operativo'),
    estadoDesde: e.estadoDesde ?? null,
    esSlot: !!e.esSlot,
    grilla: Object.assign({}, ...MESES_NUM.map(m => ({ [m]: e.grilla?.[m] ?? null }))),
    historial: Array.isArray(e.historial) ? e.historial : [],
    eventos: Array.isArray(e.eventos) ? e.eventos : [],
    correctivos: Array.isArray(e.correctivos) ? e.correctivos : [],
    pendientesIds: Array.isArray(e.pendientesIds) ? e.pendientesIds : [],
  };
}

/* ============================================================
   STATE · global + event bus
   ============================================================ */
const STATE = {
  equipos: [],
  pendientes: [],
  asignaciones: {},
  contactos: {},
  session: {},
  meta: {},
  tecnicosOficiales: [],   // lista gestionada por el usuario (no proviene del maestro)
  diffIgnorados: {},       // { 'uuid:tipo:valor': true } — diferencias dejadas pasar en imports previos
  view: 'dash',
  viewParams: {},
};

const bus = {
  _l: new Map(),
  on(evt, fn) {
    if (!this._l.has(evt)) this._l.set(evt, new Set());
    this._l.get(evt).add(fn);
    return () => this._l.get(evt)?.delete(fn);
  },
  emit(evt, payload) {
    this._l.get(evt)?.forEach(fn => { try { fn(payload); } catch (e) { console.error('[bus]', evt, e); } });
    if (evt !== '*') this._l.get('*')?.forEach(fn => { try { fn(evt, payload); } catch {} });
  },
};

function loadState() {
  STATE.equipos           = STORAGE.read('equipos', []) || [];
  STATE.pendientes        = STORAGE.read('pendientes', []) || [];
  STATE.asignaciones      = STORAGE.read('asignaciones', {}) || {};
  STATE.contactos         = STORAGE.read('contactos', {}) || {};
  STATE.session           = STORAGE.read('session', {}) || {};
  STATE.meta              = STORAGE.read('meta', { schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION }) || {};
  STATE.tecnicosOficiales = STORAGE.read('tecnicosOficiales', []) || [];
  STATE.diffIgnorados     = STORAGE.read('diffIgnorados', {}) || {};
}

function persist(slice) {
  if (!slice || slice === 'equipos')           STORAGE.write('equipos',           STATE.equipos);
  if (!slice || slice === 'pendientes')        STORAGE.write('pendientes',        STATE.pendientes);
  if (!slice || slice === 'asignaciones')      STORAGE.write('asignaciones',      STATE.asignaciones);
  if (!slice || slice === 'contactos')         STORAGE.write('contactos',         STATE.contactos);
  if (!slice || slice === 'session')           STORAGE.write('session',           STATE.session);
  if (!slice || slice === 'tecnicosOficiales') STORAGE.write('tecnicosOficiales', STATE.tecnicosOficiales);
  if (!slice || slice === 'diffIgnorados')     STORAGE.write('diffIgnorados',     STATE.diffIgnorados);
  bus.emit('state:change', slice);
}

/* ============================================================
   DOMAIN · equipos / queries
   ============================================================ */
const EQ = {
  byUuid(uuid) { return STATE.equipos.find(e => e.uuid === uuid); },
  all() { return STATE.equipos; },
  servicios() {
    return Array.from(new Set(STATE.equipos.map(e => e.servicio).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'es'));
  },
  familias() {
    return Array.from(new Set(STATE.equipos.map(e => e.fam).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'es'));
  },
  /** Universo de técnicos: oficiales del SEC + todas las asignaciones cargadas + ejecutores históricos. */
  responsables() {
    const set = new Set();
    (STATE.tecnicosOficiales || []).forEach(n => { if (n) set.add(n); });
    Object.values(STATE.asignaciones || {}).forEach(per => {
      if (!per || typeof per !== 'object') return;
      Object.entries(per).forEach(([k, v]) => { if (k !== '__meta' && v && typeof v === 'string') set.add(v); });
    });
    STATE.equipos.forEach(e => (e.historial || []).forEach(h => { if (h.ejecutor) set.add(h.ejecutor); }));
    return Array.from(set).sort((a,b) => a.localeCompare(b,'es'));
  },
  /** Técnicos presentes como responsable en el período (subset de responsables()). */
  responsablesPeriodo(periodo) {
    const asign = STATE.asignaciones?.[periodo];
    if (!asign || !asign.__meta) return [];
    const set = new Set();
    Object.entries(asign).forEach(([k, v]) => { if (k !== '__meta' && v) set.add(v); });
    return Array.from(set).sort((a,b) => a.localeCompare(b,'es'));
  },
  search(q, filters={}) {
    const n = normalize(q);
    const periodo = filters.periodo || null;
    const asign   = periodo ? (STATE.asignaciones?.[periodo] || null) : null;
    return STATE.equipos.filter(e => {
      if (filters.servicio && e.servicio !== filters.servicio) return false;
      if (filters.familia  && e.fam !== filters.familia) return false;
      if (filters.estado   && e.estado !== filters.estado) return false;
      if (filters.responsable) {
        // Match contra asignación mensual; "(sin asignar)" = equipos sin entrada en asign
        const r = asign ? (asign[e.uuid] || '(sin asignar)') : '(sin asignar)';
        if (r !== filters.responsable) return false;
      }
      if (filters.garantia === 'si' && !e.enGarantia) return false;
      if (filters.garantia === 'no' &&  e.enGarantia) return false;
      if (filters.slot === 'si' && !e.esSlot) return false;
      if (filters.slot === 'no' &&  e.esSlot) return false;
      if (!n) return true;
      const hay = `${e.nombre} ${e.marca} ${e.modelo} ${e.serie} ${e.inventario} ${e.servicio} ${e.ubicacion} ${e.fam}`;
      return normalize(hay).includes(n);
    });
  },
  countByEstado() {
    const c = {};
    ESTADOS.forEach(s => c[s] = 0);
    STATE.equipos.forEach(e => { c[e.estado] = (c[e.estado] || 0) + 1; });
    return c;
  },
  garantiasActivas() {
    return STATE.equipos.filter(e => e.enGarantia);
  },
  ciclosAbiertos() {
    const out = [];
    STATE.equipos.forEach(e => (e.correctivos || []).forEach(c => { if (c.abierto) out.push({ equipo: e, ciclo: c }); }));
    return out;
  },
  ejecutores() {
    const set = new Set();
    STATE.equipos.forEach(e => (e.historial || []).forEach(h => { if (h.ejecutor) set.add(h.ejecutor); }));
    return Array.from(set).sort((a,b) => a.localeCompare(b, 'es'));
  },
  /** Responsables activos en la operación: oficiales + asignaciones + ejecutores + responsables de ciclos abiertos. NO incluye responsableMaster del Excel (referencial). */
  responsablesActivos() {
    const set = new Set(this.responsables());
    STATE.equipos.forEach(e => (e.correctivos||[]).forEach(c => {
      if (c.apertura?.responsable) set.add(c.apertura.responsable);
    }));
    return Array.from(set).sort((a,b) => a.localeCompare(b, 'es'));
  },
};

/* ============================================================
   DATE HELPERS
   ============================================================ */
function todayISO() { return new Date().toISOString().slice(0,10); }

function isoFromDateInput(v) {
  // input[type=date] returns 'YYYY-MM-DD' — convert to local-noon ISO to avoid TZ slips
  if (!v) return null;
  return new Date(v + 'T12:00:00').toISOString();
}

function dateInputValue(d) {
  if (!d) return '';
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const day = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function monthOfISO(iso) {
  const d = new Date(iso);
  return isNaN(d) ? null : d.getMonth() + 1;
}

function addBusinessDays(dateLike, days) {
  const d = new Date(dateLike instanceof Date ? dateLike.getTime() : new Date(dateLike).getTime());
  let added = 0;
  while (added < days) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) added++;
  }
  return d;
}

/* ============================================================
   DOMAIN · MP, CICLO, PENDIENTE
   ============================================================ */
const MP = {
  /**
   * Registra una MP en el equipo.
   * @param data { fechaEvento (ISO), mes, resultado, ejecutor, obs, estadoFinal, tipoBaja, motivoCambioEjecutor }
   * @returns { equipo, mp, needsVinculacion: 'C2'|'C3'|'SI_NO_OP'|null }
   */
  register(equipoUuid, data) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) throw new Error('Equipo no encontrado.');
    if (!data.fechaEvento) throw new Error('Falta la fecha del evento.');
    if (!data.resultado) throw new Error('Falta el resultado.');
    if (!data.mes || data.mes < 1 || data.mes > 12) throw new Error('Mes inválido.');

    const mp = {
      id: uuid(),
      fecha: data.fechaEvento,             // alias legacy
      fechaEvento: data.fechaEvento,
      fechaRegistro: new Date().toISOString(),
      mes: Number(data.mes),
      resultado: data.resultado,
      ejecutor: data.ejecutor || '',
      obs: data.obs || '',
      estadoFinal: data.estadoFinal || null,
      tipoBaja: data.tipoBaja || null,
      correctivoUuid: null,
      importadoDelMaestro: false,
      motivoCambioEjecutor: data.motivoCambioEjecutor || null,
    };
    e.historial = e.historial || [];
    e.historial.push(mp);

    // Evento timeline
    pushEvento(e, {
      tipo: 'MP',
      ts: data.fechaEvento,
      payload: { resultado: mp.resultado, ejecutor: mp.ejecutor, mes: mp.mes, obs: mp.obs },
    });

    // Aplicar transición de estado SIN tocar el de causales C2/C3 (eso lo hace la vinculación)
    if (mp.resultado === 'SI') {
      const ef = mp.estadoFinal || 'Operativo';
      e.estado = ef;
      e.estadoDesde = mp.fechaEvento;
    } else if (mp.resultado === 'FS') {
      e.estado = 'FueraDeServicio';
      e.estadoDesde = mp.fechaEvento;
    } else if (mp.resultado === 'BAJA') {
      e.estado = 'DeBaja';
      e.estadoDesde = mp.fechaEvento;
    }

    persist('equipos');
    let needsVinculacion = null;
    if (mp.resultado === 'C2') needsVinculacion = 'C2';
    else if (mp.resultado === 'C3') needsVinculacion = 'C3';
    else if (mp.resultado === 'SI' && mp.estadoFinal === 'NoOperativo') needsVinculacion = 'SI_NO_OP';
    return { equipo: e, mp, needsVinculacion };
  },

  /** Edita una MP existente y reaplica el estado. Para edición retroactiva. */
  update(equipoUuid, mpId, data) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) throw new Error('Equipo no encontrado.');
    const idx = (e.historial || []).findIndex(h => h.id === mpId);
    if (idx < 0) throw new Error('Registro no encontrado.');
    const prev = e.historial[idx];
    Object.assign(prev, {
      fechaEvento: data.fechaEvento || prev.fechaEvento,
      fecha: data.fechaEvento || prev.fecha,
      mes: data.mes ?? prev.mes,
      resultado: data.resultado || prev.resultado,
      ejecutor: data.ejecutor ?? prev.ejecutor,
      obs: data.obs ?? prev.obs,
      estadoFinal: data.estadoFinal ?? prev.estadoFinal,
      tipoBaja: data.tipoBaja ?? prev.tipoBaja,
      motivoCambioEjecutor: data.motivoCambioEjecutor ?? prev.motivoCambioEjecutor,
    });
    pushEvento(e, { tipo: 'MP-edicion', ts: new Date().toISOString(), payload: { mpId, cambios: data } });
    persist('equipos');
    // Espejar la lógica de needsVinculacion de register, salvo que ya estuviera vinculada.
    let needsVinculacion = null;
    if (!prev.correctivoUuid) {
      if (prev.resultado === 'C2') needsVinculacion = 'C2';
      else if (prev.resultado === 'C3') needsVinculacion = 'C3';
      else if (prev.resultado === 'SI' && prev.estadoFinal === 'NoOperativo') needsVinculacion = 'SI_NO_OP';
    }
    return { equipo: e, mp: prev, needsVinculacion };
  },
};

/**
 * Modelo de Ciclo Correctivo (R6 v34).
 * Eventos independientes pero relacionados: una solicitud, N envíos, N
 * recepciones (cada una vinculada a un envío) y una reparación que cierra.
 * El flag `enGarantia` queda como información del equipo, no del ciclo.
 */
const CICLO = {
  /** Helper interno: crea estructura vacía de ciclo. */
  _nuevo(equipo) {
    return {
      uuid: uuid(),
      abierto: true,
      enGarantia: !!equipo.enGarantia,
      solicitud: null,
      envios: [],
      recepciones: [],
      reparacion: null,
      eventos: [],
      creado: new Date().toISOString(),
      cerrado: null,
      __migradoV34: true,
    };
  },

  /** Lista equipos con ciclos abiertos. Helper compatible con código existente. */
  todosAbiertos() {
    const out = [];
    STATE.equipos.forEach(e => (e.correctivos || []).forEach(c => { if (c.abierto) out.push({ equipo: e, ciclo: c }); }));
    return out;
  },

  /**
   * Registra una solicitud de trabajo nueva. Arranca ciclo correctivo.
   * Cambia estado del equipo a NoOperativo.
   * Genera pendiente automático "Avanzar ciclo correctivo".
   * @param spec { fechaEvento, folioSigem, responsable, observaciones }
   */
  crearSolicitud(equipoUuid, spec) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) throw new Error('Equipo no encontrado.');
    if (!spec.fechaEvento) throw new Error('Falta la fecha real de la solicitud.');
    if (!spec.folioSigem || !spec.folioSigem.trim()) throw new Error('El folio SIGEM es obligatorio.');
    if (!spec.responsable || !spec.responsable.trim()) throw new Error('Elegí un responsable de la lista oficial.');

    const c = this._nuevo(e);
    c.solicitud = {
      fechaEvento: spec.fechaEvento,
      fechaRegistro: new Date().toISOString(),
      folioSigem: spec.folioSigem.trim(),
      responsable: spec.responsable,
      observaciones: spec.observaciones || '',
    };
    e.correctivos = e.correctivos || [];
    e.correctivos.push(c);
    e.estado = 'NoOperativo';
    e.estadoDesde = spec.fechaEvento;

    pushEvento(e, {
      tipo: 'SOLICITUD_TRABAJO',
      ts: spec.fechaEvento,
      payload: {
        cicloUuid: c.uuid,
        folioSigem: c.solicitud.folioSigem,
        responsable: c.solicitud.responsable,
        descripcion: spec.observaciones || '',
        desc: `Solicitud de trabajo · Folio ${c.solicitud.folioSigem}: ${spec.observaciones || '(sin observaciones)'}`,
      },
    });
    pushEvento(e, {
      tipo: 'ESTADO',
      ts: spec.fechaEvento,
      payload: { de: e.estado === 'NoOperativo' ? '?' : e.estado, a: 'NoOperativo', origen: 'SOLICITUD_TRABAJO' },
    });

    // Pendiente automático: avanzar ciclo correctivo
    const vence = addBusinessDays(new Date(), 5).toISOString();
    const p = PENDIENTE.crear({
      tipo: 'ciclo-correctivo',
      descripcion: `Avanzar ciclo correctivo del equipo ${e.nombre || ''} (folio ${c.solicitud.folioSigem})`,
      equipoUuid: e.uuid,
      asignado: c.solicitud.responsable,
      vence,
      meta: { cicloUuid: c.uuid, tipoAlerta: 'solicitud-abierta' },
    });

    persist('equipos');
    return { equipo: e, ciclo: c, pendiente: p };
  },

  /**
   * Agrega un envío. Si `cicloUuid` es null, crea un ciclo nuevo (envío sin
   * solicitud previa). Si está dado, agrega a `c.envios[]`.
   * Cambia estado del equipo a ServicioTecnico.
   */
  agregarEnvio(equipoUuid, cicloUuid, spec) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) throw new Error('Equipo no encontrado.');
    if (!spec.fechaEvento) throw new Error('Falta la fecha del envío.');
    if (!spec.numeroEnvio || !String(spec.numeroEnvio).trim()) throw new Error('El número de envío es obligatorio.');
    if (!spec.empresaST || !spec.empresaST.trim()) throw new Error('La empresa de servicio técnico es obligatoria.');
    if (!spec.responsable || !spec.responsable.trim()) throw new Error('Elegí un responsable de la lista oficial.');

    let c;
    if (cicloUuid) {
      c = (e.correctivos || []).find(x => x.uuid === cicloUuid);
      if (!c) throw new Error('Ciclo no encontrado.');
      if (!c.abierto) throw new Error('No se puede agregar envío a un ciclo cerrado.');
    } else {
      c = this._nuevo(e);
      e.correctivos = e.correctivos || [];
      e.correctivos.push(c);
    }
    const env = {
      uuid: uuid(),
      fechaEvento: spec.fechaEvento,
      fechaRegistro: new Date().toISOString(),
      numeroEnvio: String(spec.numeroEnvio).trim(),
      empresaST: spec.empresaST.trim(),
      responsable: spec.responsable,
      observaciones: spec.observaciones || '',
      recepcionUuid: null,
      cerrado: false,
    };
    c.envios.push(env);
    e.estado = 'ServicioTecnico';
    e.estadoDesde = spec.fechaEvento;

    pushEvento(e, {
      tipo: 'ENVIO',
      ts: spec.fechaEvento,
      payload: { cicloUuid: c.uuid, envioUuid: env.uuid, numeroEnvio: env.numeroEnvio, empresa: env.empresaST, empresaST: env.empresaST, responsable: env.responsable },
    });
    pushEvento(e, {
      tipo: 'ESTADO', ts: spec.fechaEvento,
      payload: { a: 'ServicioTecnico', origen: 'ENVIO' },
    });

    persist('equipos');
    return { equipo: e, ciclo: c, envio: env };
  },

  /**
   * Agrega una recepción. Si `envioUuid` es null, crea ciclo nuevo (recepción
   * sin envío previo). Si está dado, vincula a ese envío y lo cierra.
   * Cambia estado del equipo a Recepcionado. Genera pendiente "reparación".
   */
  agregarRecepcion(equipoUuid, envioUuid, spec) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) throw new Error('Equipo no encontrado.');
    if (!spec.fechaEvento) throw new Error('Falta la fecha de recepción.');
    if (!spec.responsable || !spec.responsable.trim()) throw new Error('Elegí un responsable de la lista oficial.');

    let c, env = null;
    if (envioUuid) {
      // Buscar el envío en cualquier ciclo del equipo
      for (const ci of (e.correctivos || [])) {
        env = ci.envios.find(x => x.uuid === envioUuid);
        if (env) { c = ci; break; }
      }
      if (!env || !c) throw new Error('Envío no encontrado.');
      if (!c.abierto) throw new Error('Ciclo cerrado.');
      if (env.recepcionUuid) throw new Error('Este envío ya tiene recepción.');
    } else {
      c = this._nuevo(e);
      e.correctivos = e.correctivos || [];
      e.correctivos.push(c);
    }
    const rec = {
      uuid: uuid(),
      fechaEvento: spec.fechaEvento,
      fechaRegistro: new Date().toISOString(),
      guiaDespacho: spec.guiaDespacho || '',
      responsable: spec.responsable,
      observaciones: spec.observaciones || '',
      envioUuid: env ? env.uuid : null,
    };
    c.recepciones.push(rec);
    if (env) {
      env.recepcionUuid = rec.uuid;
      env.cerrado = true;
    }
    e.estado = 'Recepcionado';
    e.estadoDesde = spec.fechaEvento;

    pushEvento(e, {
      tipo: 'RECEPCION',
      ts: spec.fechaEvento,
      payload: { cicloUuid: c.uuid, recepcionUuid: rec.uuid, envioUuid: rec.envioUuid, guiaDespacho: rec.guiaDespacho, responsable: rec.responsable },
    });
    pushEvento(e, {
      tipo: 'ESTADO', ts: spec.fechaEvento,
      payload: { a: 'Recepcionado', origen: 'RECEPCION' },
    });

    // Pendiente automático: reparación pendiente
    const vence = addBusinessDays(new Date(), 5).toISOString();
    const p = PENDIENTE.crear({
      tipo: 'reparacion-pendiente',
      descripcion: `Reparación pendiente para equipo ${e.nombre || ''} recepcionado el ${fmt.date(spec.fechaEvento)}`,
      equipoUuid: e.uuid,
      asignado: spec.responsable,
      vence,
      meta: { cicloUuid: c.uuid, recepcionUuid: rec.uuid, tipoAlerta: 'recepcion-pendiente-reparacion' },
    });

    persist('equipos');
    return { equipo: e, ciclo: c, recepcion: rec, pendiente: p };
  },

  /**
   * Registra reparación. Cierra el ciclo. Equipo a Operativo.
   * Cierra pendientes vinculados al ciclo.
   * Si `cicloUuid` null: crea ciclo nuevo cerrado inmediatamente (in-situ).
   */
  registrarReparacion(equipoUuid, cicloUuid, spec) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) throw new Error('Equipo no encontrado.');
    if (!spec.fechaEvento) throw new Error('Falta la fecha de reparación.');
    if (!spec.responsable || !spec.responsable.trim()) throw new Error('Elegí un responsable de la lista oficial.');

    let c;
    if (cicloUuid) {
      c = (e.correctivos || []).find(x => x.uuid === cicloUuid);
      if (!c) throw new Error('Ciclo no encontrado.');
      if (!c.abierto) throw new Error('Ciclo ya cerrado.');
    } else {
      // In-situ: ciclo nuevo cerrado de inmediato
      c = this._nuevo(e);
      e.correctivos = e.correctivos || [];
      e.correctivos.push(c);
    }
    c.reparacion = {
      fechaEvento: spec.fechaEvento,
      fechaRegistro: new Date().toISOString(),
      responsable: spec.responsable,
      observaciones: spec.observaciones || '',
    };
    c.abierto = false;
    c.cerrado = new Date().toISOString();

    // Tiempo total del ciclo
    const primerEv = [
      c.solicitud?.fechaEvento,
      ...(c.envios || []).map(x => x.fechaEvento),
      ...(c.recepciones || []).map(x => x.fechaEvento),
      c.reparacion.fechaEvento,
    ].filter(Boolean).map(t => new Date(t).getTime()).sort((a,b) => a-b)[0];
    if (primerEv) {
      const dias = Math.round((new Date(c.reparacion.fechaEvento).getTime() - primerEv) / 86400000 * 10) / 10;
      c.tiempoTotalDias = Math.max(0, dias);
    }

    e.estado = 'Operativo';
    e.estadoDesde = spec.fechaEvento;

    pushEvento(e, {
      tipo: 'REPARACION',
      ts: spec.fechaEvento,
      payload: { cicloUuid: c.uuid, responsable: spec.responsable, observaciones: spec.observaciones || '', tiempoTotalDias: c.tiempoTotalDias || null },
    });
    pushEvento(e, {
      tipo: 'ESTADO', ts: spec.fechaEvento,
      payload: { a: 'Operativo', origen: 'REPARACION' },
    });

    // Cerrar pendientes vinculados al ciclo (excepto los ya cerrados).
    let pendientesCerrados = 0;
    STATE.pendientes.forEach(p => {
      if (p.estado !== 'Cerrado' && p.meta && p.meta.cicloUuid === c.uuid) {
        PENDIENTE.cambiarEstado(p.id, 'Cerrado', 'Cerrado automáticamente: ciclo correctivo finalizado.');
        pendientesCerrados++;
      }
    });

    persist('equipos');
    return { equipo: e, ciclo: c, pendientesCerrados };
  },

  cancelar(equipoUuid, cicloUuid, motivo) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) return;
    const c = (e.correctivos || []).find(x => x.uuid === cicloUuid);
    if (!c) return;
    c.abierto = false;
    c.cancelado = true;
    c.cerrado = new Date().toISOString();
    c.cerradoMotivo = motivo || 'Cancelado';
    pushEvento(e, { tipo: 'CICLO-CANCEL', ts: c.cerrado, payload: { cicloUuid: c.uuid, motivo } });
    persist('equipos');
  },

  reabrir(equipoUuid, cicloUuid) {
    const e = EQ.byUuid(equipoUuid);
    if (!e) return;
    const c = (e.correctivos || []).find(x => x.uuid === cicloUuid);
    if (!c) return;
    c.abierto = true;
    c.cancelado = false;
    c.cerrado = null;
    c.cerradoMotivo = null;
    if (c.reparacion) c.reparacion = null;
    pushEvento(e, { tipo: 'CICLO-REABRIR', ts: new Date().toISOString(), payload: { cicloUuid: c.uuid } });
    persist('equipos');
  },

  /** Stub temporal para evitar errores hasta limpiar call sites del modelo viejo. */
  crear(equipoUuid, spec) {
    // Backward-compat shim: las pocas llamadas que quedan al viejo crear() lo usan
    // para arrancar ciclo desde causal C3 / SI_NO_OP. Las redirigimos a crearSolicitud
    // si hay folioSigem, o lanzamos error si no.
    if (spec && spec.folioSigem && spec.responsable && spec.fechaEvento) {
      return this.crearSolicitud(equipoUuid, {
        fechaEvento: spec.fechaEvento,
        folioSigem: spec.folioSigem,
        responsable: spec.responsable,
        observaciones: spec.descripcion || spec.observaciones || '',
      });
    }
    throw new Error('CICLO.crear() del modelo viejo eliminado. Usá crearSolicitud / agregarEnvio / agregarRecepcion / registrarReparacion.');
  },
};

// Mapa preservado para retrocompatibilidad con eventos de tipo CICLO-* del
// modelo viejo (describeEvento los presenta con label legible).
const ESLABONES_LABEL = {
  apertura: 'Apertura',
  diagnostico: 'Diagnóstico',
  compra: 'Compra',
  garantia: 'Garantía',
  envio: 'Envío',
  recepcion: 'Recepción',
  reparacion: 'Reparación',
};


const ESTADOS_PENDIENTE = ['Abierto','EnCurso','Esperando','Cerrado'];
const ESTADO_PENDIENTE_LABEL = {
  Abierto:'Abierto', EnCurso:'En curso', Esperando:'Esperando', Cerrado:'Cerrado',
};
const ESTADO_PENDIENTE_PILL = {
  Abierto:'info', EnCurso:'warning', Esperando:'purple', Cerrado:'success',
};

const PENDIENTE = {
  crear({ tipo='general', descripcion, equipoUuid=null, asignado='', vence=null, meta=null }) {
    const p = {
      id: uuid(),
      tipo,
      descripcion: descripcion || '',
      equipoUuid,
      asignado,
      estado: 'Abierto',
      creado: new Date().toISOString(),
      vence,
      log: [{ ts: new Date().toISOString(), nota: 'Creado' }],
      subtareas: [],
      meta: meta || null,
    };
    STATE.pendientes.push(p);
    if (equipoUuid) {
      const e = EQ.byUuid(equipoUuid);
      if (e) { e.pendientesIds = e.pendientesIds || []; e.pendientesIds.push(p.id); }
    }
    persist('pendientes');
    persist('equipos');
    return p;
  },

  cerrar(id, nota='') {
    const p = STATE.pendientes.find(x => x.id === id);
    if (!p) return;
    const anterior = p.estado;
    p.estado = 'Cerrado';
    p.cerrado = new Date().toISOString();
    p.cerradoEn = p.cerrado;
    p.log = p.log || [];
    p.log.push({ ts: p.cerrado, nota: `Estado: ${anterior} → Cerrado` + (nota ? ` · ${nota}` : '') });
    persist('pendientes');
  },

  /** Cambia el estado a uno de ESTADOS_PENDIENTE. Si pasa de Cerrado a otro, lo re-abre. */
  cambiarEstado(id, nuevoEstado, nota='') {
    if (!ESTADOS_PENDIENTE.includes(nuevoEstado)) throw new Error('Estado inválido: ' + nuevoEstado);
    const p = STATE.pendientes.find(x => x.id === id);
    if (!p) return;
    const anterior = p.estado;
    if (anterior === nuevoEstado) return;
    p.estado = nuevoEstado;
    if (anterior === 'Cerrado' && nuevoEstado !== 'Cerrado') {
      // Re-abrir: limpiar timestamps de cierre
      p.cerrado = null;
      p.cerradoEn = null;
    }
    if (nuevoEstado === 'Cerrado') {
      p.cerrado = new Date().toISOString();
      p.cerradoEn = p.cerrado;
    }
    p.log = p.log || [];
    p.log.push({ ts: new Date().toISOString(), nota: `Estado: ${anterior} → ${nuevoEstado}` + (nota ? ` · ${nota}` : '') });
    persist('pendientes');
    return p;
  },

  /** Edita campos del pendiente, registra cambios en el log. */
  editar(id, cambios) {
    const p = STATE.pendientes.find(x => x.id === id);
    if (!p) return;
    const editables = ['descripcion','asignado','vence','equipoUuid','tipo'];
    const diffs = [];
    editables.forEach(k => {
      if (cambios[k] === undefined) return;
      const prev = p[k] ?? '';
      const next = cambios[k] ?? '';
      if (String(prev) !== String(next)) {
        diffs.push(`${k}: "${prev || '∅'}" → "${next || '∅'}"`);
        p[k] = cambios[k];
      }
    });
    if (!diffs.length) return p;
    p.log = p.log || [];
    p.log.push({ ts: new Date().toISOString(), nota: 'Editado · ' + diffs.join(' · ') });
    // Si cambió el equipoUuid, actualizar las referencias en STATE.equipos[].pendientesIds
    if (cambios.equipoUuid !== undefined) {
      STATE.equipos.forEach(eq => {
        if (eq.pendientesIds && eq.pendientesIds.includes(p.id) && eq.uuid !== cambios.equipoUuid) {
          eq.pendientesIds = eq.pendientesIds.filter(x => x !== p.id);
        }
      });
      if (cambios.equipoUuid) {
        const eqNew = EQ.byUuid(cambios.equipoUuid);
        if (eqNew) {
          eqNew.pendientesIds = eqNew.pendientesIds || [];
          if (!eqNew.pendientesIds.includes(p.id)) eqNew.pendientesIds.push(p.id);
        }
      }
      persist('equipos');
    }
    persist('pendientes');
    return p;
  },

  agregarNota(id, nota) {
    const p = STATE.pendientes.find(x => x.id === id);
    if (!p || !nota || !nota.trim()) return;
    p.log = p.log || [];
    p.log.push({ ts: new Date().toISOString(), nota: nota.trim() });
    persist('pendientes');
    return p;
  },

  agregarSubtarea(id, texto) {
    const p = STATE.pendientes.find(x => x.id === id);
    if (!p || !texto || !texto.trim()) return;
    p.subtareas = p.subtareas || [];
    const st = { id: uuid(), texto: texto.trim(), completada: false, ts: new Date().toISOString() };
    p.subtareas.push(st);
    p.log = p.log || [];
    p.log.push({ ts: new Date().toISOString(), nota: `Subtarea agregada: "${st.texto}"` });
    persist('pendientes');
    return st;
  },

  toggleSubtarea(id, subId) {
    const p = STATE.pendientes.find(x => x.id === id);
    if (!p) return;
    const st = (p.subtareas || []).find(s => s.id === subId);
    if (!st) return;
    st.completada = !st.completada;
    persist('pendientes');
    return st;
  },

  eliminarSubtarea(id, subId) {
    const p = STATE.pendientes.find(x => x.id === id);
    if (!p) return;
    const st = (p.subtareas || []).find(s => s.id === subId);
    if (!st) return;
    p.subtareas = p.subtareas.filter(s => s.id !== subId);
    p.log = p.log || [];
    p.log.push({ ts: new Date().toISOString(), nota: `Subtarea eliminada: "${st.texto}"` });
    persist('pendientes');
  },

  reabrir(id, nota='') {
    return this.cambiarEstado(id, 'Abierto', nota || 'Reabierto');
  },
};

/**
 * Migración idempotente de pendientes al esquema R4.
 * - Asegura subtareas[], log[], estado válido, alias vence/asignado/id.
 * Loguea en consola las normalizaciones aplicadas (sin bloquear el boot).
 */
function migrarPendientesV33(arr) {
  if (!Array.isArray(arr)) return 0;
  let touched = 0;
  arr.forEach(p => {
    if (!p || typeof p !== 'object') return;
    if (!p.id && p.uuid) { p.id = p.uuid; touched++; }
    if (!p.id) { p.id = uuid(); touched++; }
    if (!Array.isArray(p.subtareas)) { p.subtareas = []; touched++; }
    if (!Array.isArray(p.log)) {
      p.log = [{ ts: p.creado || new Date().toISOString(), nota: 'Creado' }];
      touched++;
    }
    if (!ESTADOS_PENDIENTE.includes(p.estado)) {
      if (p.estado) console.warn('[migrarPendientesV33] estado desconocido "' + p.estado + '" → Abierto', p.id);
      p.estado = 'Abierto';
      touched++;
    }
    if (p.fechaCompromiso && !p.vence) { p.vence = p.fechaCompromiso; touched++; }
    if (p.responsable && !p.asignado) { p.asignado = p.responsable; touched++; }
  });
  return touched;
}

/**
 * Migración v34 del ciclo correctivo. Decisión: el modelo viejo
 * (apertura / diagnostico / compra / garantia / envio (singular) /
 * recepcion / reparacion) se reemplaza por { solicitud, envios[],
 * recepciones[], reparacion }.
 *
 * - Ciclos ABIERTOS del modelo viejo: se descartan.
 * - Ciclos CERRADOS del modelo viejo: se convierten extrayendo lo que
 *   se puede (apertura→solicitud, envio singular→envios[], recepcion
 *   singular→recepciones[]). Datos de diagnostico/compra/garantia se
 *   pierden (quedan en `c.legacyExtra` para auditoría).
 * - Registros MP con correctivoUuid huérfano: se limpian.
 * - Idempotente vía `c.__migradoV34 = true`.
 *
 * @returns { descartadosAbiertos, convertidos, mpsLimpiados }
 */
function migrarCiclosV34(equipos) {
  if (!Array.isArray(equipos)) return { descartadosAbiertos:0, convertidos:0, mpsLimpiados:0 };
  let descartadosAbiertos = 0, convertidos = 0, mpsLimpiados = 0;
  const uuidsValidos = new Set();

  equipos.forEach(e => {
    if (!Array.isArray(e.correctivos)) { e.correctivos = []; return; }
    const nuevoCorrectivos = [];
    e.correctivos.forEach(c => {
      if (c && c.__migradoV34) {
        nuevoCorrectivos.push(c);
        uuidsValidos.add(c.uuid);
        return;
      }
      // Detectar si es esquema viejo: tiene apertura/diagnostico/compra/garantia/envio-singular
      const esViejo = c && (c.apertura || c.diagnostico || c.compra || c.garantia || c.solicitud ||
        (c.envio && !Array.isArray(c.envios)) ||
        (c.recepcion && !Array.isArray(c.recepciones)) ||
        c.eslabonActual || c.ruta);
      if (!esViejo && Array.isArray(c.envios) && Array.isArray(c.recepciones)) {
        c.__migradoV34 = true;
        nuevoCorrectivos.push(c);
        uuidsValidos.add(c.uuid);
        return;
      }
      // Esquema viejo:
      if (c.abierto) {
        console.warn('[migrarCiclosV34] descartando ciclo abierto viejo', c.uuid, 'del equipo', e.uuid);
        descartadosAbiertos++;
        return;
      }
      // Cerrado: convertir
      const conv = {
        uuid: c.uuid || uuid(),
        abierto: false,
        enGarantia: !!c.enGarantia,
        solicitud: null,
        envios: [],
        recepciones: [],
        reparacion: null,
        eventos: Array.isArray(c.eventos) ? c.eventos : [],
        creado: c.apertura?.fechaRegistro || c.apertura?.fecha || null,
        cerrado: c.cerradoEn || c.cerradoFecha || null,
        legacyExtra: { diagnostico: c.diagnostico, compra: c.compra, garantia: c.garantia, ruta: c.ruta },
        __migradoV34: true,
      };
      if (c.apertura) {
        conv.solicitud = {
          fechaEvento: c.apertura.fechaEvento || c.apertura.fecha || conv.creado,
          fechaRegistro: c.apertura.fechaRegistro || conv.creado,
          folioSigem: c.apertura.folioSigem || '',
          responsable: c.apertura.responsable || '',
          observaciones: c.apertura.descripcion || '',
        };
      } else if (c.solicitud && !Array.isArray(c.solicitud)) {
        conv.solicitud = {
          fechaEvento: c.solicitud.fecha || c.solicitud.fechaEvento || conv.creado,
          fechaRegistro: c.solicitud.fechaRegistro || conv.creado,
          folioSigem: c.solicitud.folioSigem || '',
          responsable: c.solicitud.responsable || '',
          observaciones: c.solicitud.descripcion || c.solicitud.observaciones || '',
        };
      }
      if (c.envio) {
        conv.envios.push({
          uuid: uuid(),
          fechaEvento: c.envio.fechaEvento || c.envio.fecha,
          fechaRegistro: c.envio.fechaRegistro || c.envio.fechaEvento,
          numeroEnvio: c.envio.folioEnvio || c.envio.numeroEnvio || '',
          empresaST: c.envio.empresa || '',
          responsable: c.envio.responsable || '',
          observaciones: c.envio.observaciones || '',
          recepcionUuid: null,
          cerrado: true,
        });
      }
      if (c.recepcion) {
        const recUuid = uuid();
        conv.recepciones.push({
          uuid: recUuid,
          fechaEvento: c.recepcion.fechaEvento || c.recepcion.fecha,
          fechaRegistro: c.recepcion.fechaRegistro || c.recepcion.fechaEvento,
          guiaDespacho: c.recepcion.guiaDespacho || '',
          responsable: c.recepcion.responsable || '',
          observaciones: c.recepcion.observaciones || '',
          envioUuid: conv.envios[0] ? conv.envios[0].uuid : null,
        });
        if (conv.envios[0]) conv.envios[0].recepcionUuid = recUuid;
      }
      if (c.reparacion) {
        conv.reparacion = {
          fechaEvento: c.reparacion.fechaEvento || c.reparacion.fecha,
          fechaRegistro: c.reparacion.fechaRegistro || c.reparacion.fechaEvento,
          responsable: c.reparacion.responsable || '',
          observaciones: c.reparacion.observaciones || c.reparacion.obs || '',
        };
      }
      nuevoCorrectivos.push(conv);
      uuidsValidos.add(conv.uuid);
      convertidos++;
    });
    e.correctivos = nuevoCorrectivos;
  });

  // Limpiar correctivoUuid huérfanos en historial
  equipos.forEach(e => {
    (e.historial || []).forEach(r => {
      if (r.correctivoUuid && !uuidsValidos.has(r.correctivoUuid)) {
        r.correctivoUuid = null;
        r.observacionMigracion = 'Ciclo asociado eliminado en migración v34';
        mpsLimpiados++;
      }
    });
  });

  return { descartadosAbiertos, convertidos, mpsLimpiados };
}

/**
 * Calcula los días totales que el equipo estuvo en un estado dado.
 * Recorre los eventos tipo ESTADO ordenados ascendentemente, sumando los
 * tramos en los que el equipo estuvo en `estadoTarget`. Si actualmente
 * está en ese estado, suma desde el último cambio hasta ahora.
 *
 * @returns número decimal de días (1 decimal).
 */
function tiempoEnEstado(equipo, estadoTarget) {
  if (!equipo || !estadoTarget) return 0;
  // Construir línea de tiempo de cambios de estado a partir de eventos.
  const cambios = (equipo.eventos || [])
    .filter(ev => ev.tipo === 'ESTADO' && ev.payload && ev.payload.a)
    .map(ev => ({ ts: new Date(ev.ts).getTime(), a: ev.payload.a }))
    .filter(x => !isNaN(x.ts))
    .sort((a,b) => a.ts - b.ts);
  if (!cambios.length) {
    // Sin historial de eventos ESTADO: usar estadoDesde para el estado actual.
    if (equipo.estado === estadoTarget && equipo.estadoDesde) {
      const ms = Date.now() - new Date(equipo.estadoDesde).getTime();
      return Math.round((ms / 86400000) * 10) / 10;
    }
    return 0;
  }
  let totalMs = 0;
  let actualEstado = null, actualDesde = null;
  cambios.forEach(c => {
    if (actualEstado === estadoTarget && actualDesde != null) {
      totalMs += c.ts - actualDesde;
    }
    actualEstado = c.a;
    actualDesde = c.ts;
  });
  if (actualEstado === estadoTarget && actualDesde != null) {
    totalMs += Date.now() - actualDesde;
  }
  return Math.round((totalMs / 86400000) * 10) / 10;
}

function diasEnEstadoActual(equipo) {
  if (!equipo.estadoDesde) return null;
  const ms = Date.now() - new Date(equipo.estadoDesde).getTime();
  return Math.round((ms / 86400000) * 10) / 10;
}

/** Fecha de la última MP del equipo (Date | null). */
function ultimaMP(equipo) {
  const hist = equipo.historial || [];
  if (!hist.length) return null;
  let best = null;
  hist.forEach(h => {
    const t = h.fechaEvento || h.fecha;
    if (!t) return;
    const d = new Date(t);
    if (isNaN(d)) return;
    if (!best || d > best) best = d;
  });
  return best;
}

/** Fecha de la última gestión del equipo (Date | null): max entre eventos, historial y eventos del ciclo. */
function ultimaGestion(equipo) {
  let best = null;
  const acc = (t) => {
    if (!t) return;
    const d = new Date(t);
    if (isNaN(d)) return;
    if (!best || d > best) best = d;
  };
  (equipo.eventos || []).forEach(ev => acc(ev.ts));
  (equipo.historial || []).forEach(h => acc(h.fechaEvento || h.fecha));
  (equipo.correctivos || []).forEach(c => {
    acc(c.solicitud?.fechaEvento);
    (c.envios || []).forEach(en => acc(en.fechaEvento));
    (c.recepciones || []).forEach(r => acc(r.fechaEvento));
    acc(c.reparacion?.fechaEvento);
  });
  return best;
}

/** Cantidad de pendientes abiertos vinculados al equipo. */
function cantidadPendientesAbiertos(equipo) {
  return STATE.pendientes.filter(p => p.equipoUuid === equipo.uuid && p.estado !== 'Cerrado').length;
}

/** Set de empresas ST usadas en cualquier ciclo de cualquier equipo. */
function empresasSTUsadas() {
  const s = new Set();
  STATE.equipos.forEach(e => (e.correctivos || []).forEach(c => (c.envios || []).forEach(en => { if (en.empresaST) s.add(en.empresaST); })));
  return Array.from(s).sort((a,b) => a.localeCompare(b,'es'));
}

function pushEvento(equipo, ev) {
  equipo.eventos = equipo.eventos || [];
  equipo.eventos.push({
    id: uuid(),
    ts: ev.ts || new Date().toISOString(),
    tsRegistro: new Date().toISOString(),
    tipo: ev.tipo || 'GENERICO',
    payload: ev.payload ?? null,
  });
}

/**
 * Devuelve { title, desc, icon, color } para presentar un evento en el timeline.
 * Tipos conocidos tienen ícono/título amigables; los desconocidos caen al genérico.
 */
function describeEvento(ev) {
  const p = ev.payload || {};
  const tipos = {
    MP: () => ({
      title: `MP — ${p.resultado || '—'}${p.mes ? ' (' + MESES[(p.mes||1)-1] + ')' : ''}`,
      desc: [p.ejecutor && 'Ejecutor: ' + p.ejecutor, p.obs].filter(Boolean).join(' · '),
      icon: 'ti-calendar-check', color: p.resultado === 'SI' ? 'success' : (CAUSALES[p.resultado] ? 'warning' : 'info'),
    }),
    'MP-edicion': () => ({
      title: 'Edición de registro MP',
      desc: p.cambios ? 'Campos modificados: ' + Object.keys(p.cambios).join(', ') : '',
      icon: 'ti-edit', color: 'ink-3',
    }),
    SOLICITUD_TRABAJO: () => ({
      title: 'Solicitud de trabajo',
      desc: p.desc || `Folio ${p.folioSigem || '(sin folio)'}: ${p.descripcion || ''}${p.responsable ? ' · Recibió: ' + p.responsable : ''}`,
      icon: 'ti-file-text', color: 'info',
    }),
    ESTADO: () => ({
      title: `Cambio de estado: ${p.de || '—'} → ${p.a || '—'}`,
      desc: p.origen ? 'Origen: ' + p.origen : '',
      icon: 'ti-arrow-right-circle', color: p.a === 'Operativo' ? 'success' : (p.a === 'NoOperativo' || p.a === 'FueraDeServicio' ? 'danger' : 'warning'),
    }),
    'APERTURA-CICLO': () => ({
      title: 'Apertura de ciclo correctivo',
      desc: [p.descripcion, p.folioSigem && 'Folio SIGEM ' + p.folioSigem, p.deteccion && 'Detección: ' + p.deteccion].filter(Boolean).join(' · '),
      icon: 'ti-tools', color: 'warning',
    }),
    'CICLO-CIERRE': () => ({
      title: 'Cierre de ciclo correctivo',
      desc: p.motivo || '',
      icon: 'ti-circle-check', color: 'success',
    }),
    'CICLO-CANCEL': () => ({
      title: 'Ciclo correctivo cancelado',
      desc: p.motivo || '',
      icon: 'ti-ban', color: 'danger',
    }),
    'CICLO-REABRIR': () => ({
      title: 'Ciclo correctivo reabierto', desc: '', icon: 'ti-refresh', color: 'warning',
    }),
    'CICLO-LOOP': () => ({
      title: 'Ciclo correctivo · loop a Envío',
      desc: p.motivo || 'Recepción no funcionó, se vuelve a enviar.',
      icon: 'ti-arrow-back', color: 'warning',
    }),
    EDICION_RETROACTIVA: () => ({
      title: `Edición retroactiva · ${ESLABONES_LABEL[p.eslabon] || p.eslabon || 'eslabón'}`,
      desc: p.fechaPrev && p.fechaNueva ? `Fecha: ${fmt.date(p.fechaPrev)} → ${fmt.date(p.fechaNueva)}` : '',
      icon: 'ti-history', color: 'ink-3',
    }),
    'CAUSAL-VINCULADA': () => ({
      title: `Causal ${p.causal || ''} vinculada al ciclo`,
      desc: p.envio ? 'Vinculada al envío.' : 'Vinculada al ciclo correctivo.',
      icon: 'ti-link', color: 'info',
    }),
    'CAUSAL-PENDIENTE-CLINICO': () => ({
      title: `Causal ${p.causal || ''} con pendiente al servicio clínico`,
      desc: 'Se creó pendiente para que el servicio clínico genere el folio SIGEM.',
      icon: 'ti-clipboard-text', color: 'warning',
    }),
    ENVIO: () => ({
      title: 'Envío a servicio técnico',
      desc: [p.folioEnvio && 'Folio ' + p.folioEnvio, p.empresa, p.responsable].filter(Boolean).join(' · '),
      icon: 'ti-truck-delivery', color: 'warning',
    }),
    GRILLA: () => ({
      title: `Grilla · ${MESES[(p.mes||1)-1]}`,
      desc: `${p.anterior || '∅'} → ${p.valor || '∅'}`,
      icon: 'ti-table', color: 'ink-3',
    }),
    'SIGEM-COMPLETADO': () => ({
      title: 'Folio SIGEM completado',
      desc: p.folio ? 'Folio: ' + p.folio : '',
      icon: 'ti-circle-check', color: 'success',
    }),
  };
  // Eslabones del ciclo: CICLO-DIAGNOSTICO, CICLO-COMPRA, CICLO-GARANTIA, CICLO-ENVIO, CICLO-RECEPCION, CICLO-REPARACION, CICLO-APERTURA
  const m = ev.tipo && ev.tipo.match(/^CICLO-(APERTURA|DIAGNOSTICO|COMPRA|GARANTIA|ENVIO|RECEPCION|REPARACION)$/);
  if (m) {
    const es = m[1].toLowerCase();
    return {
      title: `Ciclo · ${ESLABONES_LABEL[es] || es}`,
